# docker.service drop-in for the venue box.
# Install as /etc/systemd/system/docker.service.d/etabella-edge.conf, then `systemctl daemon-reload`.
#
# dockerd itself restarts containers (restart: unless-stopped) when it starts. It must never do that before the
# encrypted volume holding /var/lib/etabella-edge is mounted, or rt-edge could start recording into an empty
# directory on the wrong disk. With full-disk LUKS (the pilot default) this is a no-op; with a separate data
# volume it is the guard.
[Unit]
RequiresMountsFor=/var/lib/etabella-edge /var/lib/docker
