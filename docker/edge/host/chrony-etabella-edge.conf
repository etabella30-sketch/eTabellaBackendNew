# chrony for the venue box: pinned NTS servers only (spec §3.4 Time, §10 #8).
# Install as /etc/chrony/conf.d/etabella-edge.conf, comment out every `pool` / `server` line in
# /etc/chrony/chrony.conf, then `systemctl restart chrony` and check `chronyc -N authdata` shows NTS for each.
# Outbound: TCP 4460 (NTS-KE) and UDP 123 to these names only (ufw rules in docs/rt-edge/host-hardening.md).

server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts

# Step the clock on the first updates after boot if it is off by more than 1 s; slew afterwards.
makestep 1 3

# NTS validates the servers' TLS certificates, which needs a roughly right clock. A box whose RTC battery died
# boots in the past and could never sync; this skips the certificate time check for the first update only.
nocerttimecheck 1

# Keep the RTC in step, so the next cold boot starts near the right time.
rtcsync

# Only local queries (chronyc, etabella-edge-hoststatus): the box serves no time to anyone.
cmdallow 127.0.0.1
bindcmdaddress 127.0.0.1
