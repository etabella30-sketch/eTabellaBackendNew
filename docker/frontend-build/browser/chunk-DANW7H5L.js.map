<div class="min-w-[420px] h-full flex flex-col gap-6 ">
    <h6 class="text-lg font-semibold text-dark-blue ps-2.5">Frequently used viewer groups:</h6>
    <div class="flex flex-col overflow-auto ps-2.5">
        @for (x of presetationList; track $index) {
        <div
            class="bg-white rounded-base p-2.5 hover:shadow-[0px_4px_4px_#00000040] duration-300 mb-6 group transition-all">
            <h6 class="text-sm font-bold">{{x.cName}}</h6>
            <h6 class="text-xs font-bold">{{x.dCreateDt | date}} </h6>
            <h6 class="text-xs font-bold">Type : {{x.cType}}</h6>
            <div class="flex gap-2.5 mt-2.5">
                @if(!(x.isSelected)) {
                <btn mode="white" (click)="fillDetails(x, false)">Detail</btn>
                }
                <btn [class]="x.isSelected?'':'hidden group-hover:inline-block'" (click)="applyPresetation(x)"
                    [disabled]="x.bIsApplied && x.isSelected"> {{x.bIsApplied &&
                    x.isSelected ? 'Applied' : 'Apply'}}</btn>
                @if (x.bIsApplied && x.isSelected) {
                <btn (click)="fillDetails(x, true)">Deselect</btn>
                }

            </div>
        </div>
        }
    </div>
</div>
