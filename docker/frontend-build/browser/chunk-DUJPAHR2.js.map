<form [formGroup]="frm" class="flex py-5 overflow-hidden">

    <section class="bg-white rounded-xl min-w-[450px] max-w-[450px]  overflow-auto h-[85vh]">
        <div class="flex items-center w-full px-5">
            <h1 class="flex items-center  text-lg font-bold  mb-2 me-auto">
                Export
            </h1>
            <btn (click)="selectAll()" mode="text"> {{ isAllselected ? 'Deselect All' : 'Select All'}}</btn>
        </div>
        <!-- buttonClasses -->
        <div class="flex flex-col gap-3 min-h-24 max-h-52 py-4 overflow-auto px-5">
            @for (item of filelist; track $index) {
            <div (click)="selectFile(item)" [class.shadow-[0_3px_10px_#94949440]]="item.checked"
                class="p-5 w-full flex gap-6 bg-white  rounded-base cursor-pointer items-center">
                <img src="./assets/icons/doc-icons/pdf.svg" class="thumbnail size-8">
                <h6 class="text-xs font-semibold  brak-word truncate w-[calc(100%_-_100px)]">{{item.cFilename}}</h6>
            </div>
            }
        </div>


        <label for="notify" class="pt-5 flex flex-col gap-2.5 px-5">
            <h6 class="text-xs mb-2 font-semibold">Export as: </h6>
            <div class="flex items-center gap-3 pb-2.5">
                <mat-radio-group formControlName="cPdftype" [align]="'start'" class="flex gap-2.5 w-full">
                    <mat-radio-button [value]="'S'"
                        class="w-full whitespace-nowrap text-xs shadow-[0px_2px_7px_#00000024] px-2 py-3 rounded-base border border-transparent hover:border-orange hover:bg-[#ff3d002e] group !cursor-pointer">
                        <svg width="20" height="20" viewBox="0 0 26 27" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="s-ion-icon group-hover:!text-orange">
                            <path
                                d="M16.1 25.7266H22.7C23.1774 25.7266 23.6352 25.5035 23.9728 25.1063C24.3104 24.7092 24.5 24.1705 24.5 23.6089V7.01927C24.5001 6.90783 24.4815 6.79747 24.4452 6.69451C24.409 6.59155 24.3558 6.49802 24.2888 6.41927L20.5112 1.97504C20.4441 1.89602 20.3644 1.83339 20.2767 1.79075C20.189 1.7481 20.0949 1.72629 20 1.72657H8.3C7.82261 1.72657 7.36477 1.94967 7.02721 2.34681C6.68964 2.74394 6.5 3.28258 6.5 3.84421V14.272"
                                stroke="currentColor" stroke-width="1.78208" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                            <path
                                d="M19.5908 6.36279V2.20851C19.591 2.11314 19.6165 2.01996 19.6643 1.94072C19.712 1.86149 19.7798 1.79974 19.8591 1.76327C19.9383 1.72679 20.0256 1.71723 20.1097 1.73579C20.1939 1.75435 20.2712 1.8002 20.3319 1.86754L24.3713 6.35734C24.4325 6.4246 24.4743 6.51059 24.4913 6.60436C24.5084 6.69812 24.4999 6.7954 24.467 6.88379C24.4341 6.97218 24.3782 7.04766 24.3065 7.10062C24.2349 7.15357 24.1506 7.18159 24.0646 7.1811H20.327C20.1318 7.1811 19.9445 7.09489 19.8065 6.94143C19.6684 6.78796 19.5908 6.57982 19.5908 6.36279V6.36279Z"
                                fill="currentColor" stroke="currentColor" stroke-width="1.78208" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M6.73727 18.3594L13.2716 22.3157L6.73727 26.2721L6.73727 23.2068L1.39104 23.2068C0.898931 23.2068 0.5 22.8078 0.5 22.3157C0.5 21.8236 0.898931 21.4247 1.39104 21.4247L6.73727 21.4247L6.73727 18.3594Z"
                                fill="currentColor"></path>
                        </svg>
                        <span class="group-hover:!text-orange ms-2">Single PDF</span>
                    </mat-radio-button>
                    <mat-radio-button [value]="'M'" [disabled]="filelist.length<2"
                        class="w-full whitespace-nowrap text-xs shadow-[0px_2px_7px_#00000024] px-2 py-3 rounded-base border border-transparent hover:border-orange hover:bg-[#ff3d002e] group !cursor-pointer">
                        <svg width="20" height="20" viewBox="0 0 27 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="s-ion-icon group-hover:!text-orange">
                            <path d="M10.8716 1.79688H20.859L25.5899 6.52776V19.6691" stroke="currentColor"
                                stroke-width="1.57696" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path
                                d="M15.0765 22.8234H20.8587C21.2769 22.8234 21.678 22.6573 21.9738 22.3615C22.2695 22.0658 22.4356 21.6647 22.4356 21.2465V8.89253C22.4357 8.80954 22.4194 8.72736 22.3876 8.65069C22.3559 8.57402 22.3093 8.50437 22.2506 8.44572L18.9411 5.1362C18.8823 5.07736 18.8125 5.03072 18.7356 4.99897C18.6588 4.96721 18.5764 4.95097 18.4932 4.95117H8.24298C7.82474 4.95117 7.42364 5.11732 7.1279 5.41306C6.83216 5.70879 6.66602 6.1099 6.66602 6.52814V13.3616"
                                stroke="currentColor" stroke-width="1.57696" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                            <path
                                d="M18.2305 8.52496V5.32267C18.2306 5.24916 18.2525 5.17734 18.2934 5.11626C18.3343 5.05518 18.3924 5.00758 18.4603 4.97946C18.5282 4.95135 18.6029 4.94398 18.6751 4.95829C18.7472 4.97259 18.8134 5.00793 18.8655 5.05985L22.3264 8.52075C22.3788 8.5726 22.4146 8.63889 22.4292 8.71117C22.4438 8.78344 22.4365 8.85843 22.4083 8.92656C22.3801 8.9947 22.3323 9.05288 22.2709 9.0937C22.2095 9.13452 22.1373 9.15612 22.0635 9.15574H18.8613C18.694 9.15574 18.5335 9.08929 18.4152 8.97099C18.2969 8.85269 18.2305 8.69225 18.2305 8.52496V8.52496Z"
                                fill="currentColor" stroke="currentColor" stroke-width="1.57696" stroke-linecap="round"
                                stroke-linejoin="round"></path>
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M6.92025 16.5156L12.7024 20.0166L6.92025 23.5176L6.92025 20.8051L2.18936 20.8051C1.75389 20.8051 1.40088 20.4521 1.40088 20.0166C1.40088 19.5811 1.75389 19.2281 2.18936 19.2281L6.92025 19.2281L6.92025 16.5156Z"
                                fill="currentColor"></path>
                        </svg>
                        <span class="group-hover:!text-orange ms-2">Multiple PDF</span>
                    </mat-radio-button>
                </mat-radio-group>
                <mat-checkbox formControlName="bPagination" class="text-xs">Pagination</mat-checkbox>
            </div>

            <div>
                <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">
                    <mat-checkbox formControlName="bFact" class="text-xs ">
                        <span class="!text-white">Fact:</span>
                    </mat-checkbox>

                    <!-- <div [class.!hidden]="!frm.value.bFact"
                        class="flex h-12 items-center gap-x-2 [&>span]:cursor-pointer ms-auto">
                        @for(x of icons;track $index){
                        <span (click)="changeFont(x.type,'cQMsize')"
                            class="flex rounded-base p-1.5 hover:text-blue-on flex-col items-center !max-w-[55px] !min-w-[55px]"
                            [ngClass]="x.type==frm.value.cQMsize?'!text-blue-on !bg-blue-100 !border-blue-on border-2 hover:shadow-[inset_0px_0px_4px_0px_#9FCCFF] shadow-[inset_0px_0px_4px_0px_#9FCCFF]':'!bg-white' ">
                            <icon class="text-xl flex mx-auto" [name]="'textF'" type="indicn"></icon>
                            <span class="text-xs">{{x.name}}</span>
                        </span>
                        }
                    </div> -->

                </div>

                <div [class.!hidden]="!frm.value.bFact" class="mt-3">
                    <mat-select #hasselect [panelClass]="SelectedFact.length ? '-mt-7' : ''" formControlName="jFIssue"
                        id="nPriority" class="w-full !border !rounded-base" multiple placeholder="Select Issues..."
                        (selectionChange)="changeIssue('issueList','SelectedFact','jFIssue','nIid')">
                        <mat-select-trigger>
                            Select Issues...
                        </mat-select-trigger>
                        <!-- @for (x of issueList; track $index) {
                        <mat-option value="" class="nocheck">
                            All Issue
                        </mat-option>
                        <hr class="mx-3">
                        <mat-option [value]="x.nIid" class="nocheck">
                            <span class="text-xs">
                                <span class="rounded-base h-3.5 w-1 bg-red-400"
                                    [ngStyle]="{'background': '#' + x.cColor}"></span>
                                {{x.cIName}} ({{x.cCategory}})
                            </span>
                        </mat-option>
                        } -->

                        <mat-option [value]="0" class="nocheck" style="
                            --mat-option-focus-state-layer-color:#ffffff00;
                            --mat-option-hover-state-layer-color:#ffffff00;
                            ">
                            <div class="p-2 rounded-base hover:bg-reply"
                                (click)="checkAll('jFIssue','issueList','nIid');hasselect.close()">
                                All Issue
                            </div>
                        </mat-option>
                        <hr class="mx-3 my-2">
                        @for (x of gropuIssueList; track x) {
                        <mat-optgroup class="issdropgrup">
                            <div class="flex gap-2.5 text-xs font-semibold items-center cursor-pointer"
                                (click)="x.isopen=!x.isopen"> {{x.cCategory}}
                                <icon class="text-[8px]" name="chvy" class="-rotate-90" />
                            </div>
                            @for (y of x.sublist; track y) {
                            <mat-option [ngClass]="{'!hidden': !x?.isopen}" [value]="y.nIid" class="ps-3 nocheck group"
                                style="
          --mat-option-focus-state-layer-color:#ffffff00;
          --mat-option-hover-state-layer-color:#ffffff00;
          ">
                                <div
                                    class="flex gap-2.5 rounded-base py-1 items-center ps-6 group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate">
                                    <span class="relative size-4  flex items-center justify-center">
                                        <icon name="addcircle"
                                            class="opacity-0 group-hover:opacity-100 text-base abolute group-[&.mdc-list-item--selected]:hidden" />
                                        <icon name="removecircle"
                                            class="abolute hidden text-base group-[&.mdc-list-item--selected]:inline-block" />
                                    </span>
                                    <span class="h-3 w-1 rounded-2xl block"
                                        [ngStyle]="{'background': '#'+y.cColor}"></span>
                                    {{y.cIName}}
                                </div>
                            </mat-option>
                            }
                        </mat-optgroup>
                        }
                    </mat-select>
                    <div class="flex bg-grey rounded-xl gap-2.5 p-2.5 max-w-[810px] flex-wrap mt-3"
                        *ngIf="SelectedFact.length">
                        <div class="text-sm font-medium flex items-center p-2 px-3 bg-white rounded-xl gap-3 "
                            *ngFor="let x of SelectedFact;let fi = index">
                            <span class="flex items-center gap-2 text-xs">
                                <!-- <span class="rounded-base h-3.5 w-1 bg-red-400"
                                    [ngStyle]="{'background': 'red'}"></span> -->
                                <span class="rounded-base h-3.5 w-1 bg-red-400"
                                    [ngStyle]="{'background': '#' + x.cColor}"></span>
                                {{x.cIName}} ({{x.cCategory}})
                                <span class="flex">
                                    <icon class="text-lg" name="backspace" type="extra"
                                        (click)="removels(x,'SelectedFact','jFIssue','nIid')" />
                                </span>
                            </span>
                        </div>
                    </div>
                </div>

                <div [class.!hidden]="!frm.value.bFact" class="mt-3">
                    <mat-select #hascontactselect [panelClass]="SelectedContact.length ? '-mt-7' : ''"
                        formControlName="jFContact" id="nPriority" class="w-full !border !rounded-base" multiple
                        placeholder="Select Contact..."
                        (selectionChange)="changeIssue('contactList','SelectedContact','jFContact','nContactid')">
                        <mat-select-trigger>
                            Select Contact... {{SelectedContact.length}}
                        </mat-select-trigger>
                        <mat-option [value]="0" class="nocheck" style="
                                            --mat-option-focus-state-layer-color:#ffffff00;
                                            --mat-option-hover-state-layer-color:#ffffff00;
                                            ">
                            <div class="p-2 rounded-base hover:bg-reply"
                                (click)="checkAll('jFContact','contactList','nContactid');hascontactselect.close()">
                                All Contact
                            </div>
                        </mat-option>
                        <hr class="mx-3 my-2">
                        @for (x of contactList; track x) {
                        <mat-option [value]="x.nContactid" class="ps-3 nocheck group" style="
                          --mat-option-focus-state-layer-color:#ffffff00;
                          --mat-option-hover-state-layer-color:#ffffff00;
                          ">
                            <avtr size="sm" [matTooltip]="x.cFname + x.cLname"
                                [detail]="{cFname:x.cFname,cLname:x.cLname,cProfile:x.cProfile}">
                            </avtr>
                            <span>{{x.cFname + ' ' + x.cLname}}</span>
                        </mat-option>
                        }
                    </mat-select>
                    <div class="flex bg-grey rounded-xl gap-2.5 p-2.5 max-w-[810px] flex-wrap mt-3"
                        *ngIf="SelectedContact.length">
                        <div class="text-sm font-medium flex items-center p-2 px-3 bg-white rounded-xl gap-3 "
                            *ngFor="let x of SelectedContact;let fi = index">
                            <span class="flex items-center gap-2 text-xs">
                                <!-- <span class="rounded-base h-3.5 w-1 bg-red-400"
                                                    [ngStyle]="{'background': 'red'}"></span> -->
                                <avtr size="sm" [matTooltip]="x.cFname + x.cLname"
                                    [detail]="{cFname:x.cFname,cLname:x.cLname,cProfile:x.cProfile}">
                                </avtr><span class="flex">
                                    <span>{{x.cFname + ' ' + x.cLname}}</span>
                                    <icon class="text-lg ms-2" name="backspace" type="extra"
                                        (click)="removels(x,'SelectedContact','jFContact','nContactid')" />
                                </span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">
                    <mat-checkbox formControlName="bQfact" class="text-xs ">

                    </mat-checkbox>

                            class="flex rounded-base p-1.5 hover:text-blue-on flex-col items-center !max-w-[55px] !min-w-[55px]"
                            [ngClass]="x.type==frm.value.cQFsize?'!text-blue-on !bg-blue-100 !border-blue-on border-2 hover:shadow-[inset_0px_0px_4px_0px_#9FCCFF] shadow-[inset_0px_0px_4px_0px_#9FCCFF]':'!bg-white' ">
                            <icon class="text-xl flex mx-auto" [name]="'textF'" type="indicn"></icon>
                            <span class="text-xs">{{x.name}}</span>
                        </span>
                        }
                    </div>
                </div>
                <div [class.!hidden]="!frm.value.bQfact" class="mt-3">
                    <mat-select #hasissueselect [panelClass]="SelectedFact.length ? '-mt-7' : ''"
                        formControlName="jQFIssue" id="nPriority" class="w-full !border !rounded-base" multiple
                        placeholder="Select Issues..."
                        (selectionChange)="changeIssue('issueList','SelectedQFact','jQFIssue','nIid')">
                        <mat-select-trigger>
                            Select Issues...
                        </mat-select-trigger>
                        <!-- @for (x of issueList; track $index) {
                        <mat-option value="" class="nocheck">
                            All Issue
                        </mat-option>

                        </mat-option>

                        <mat-option [value]="0" class="nocheck" style="
                            --mat-option-focus-state-layer-color:#ffffff00;
                            --mat-option-hover-state-layer-color:#ffffff00;
                            ">
                            <div class="p-2 rounded-base hover:bg-reply"
                                (click)="checkAll('jQFIssue','issueList','nIid');hasissueselect.close()">
                                All Issue
                            </div>
                        </mat-option>
                        <hr class="mx-3 my-2">
                        @for (x of gropuIssueList; track x) {
                        <mat-optgroup class="issdropgrup">
                            <div class="flex gap-2.5 text-xs font-semibold items-center cursor-pointer"
                                (click)="x.isopen=!x.isopen">
                                {{x.cCategory}}
                                <icon class="text-[8px]" name="chvy" class="-rotate-90" />
                            </div>
                            @for (y of x.sublist; track y) {
                            <mat-option [ngClass]="{'!hidden': !x?.isopen}" [value]="y.nIid" class="ps-3 nocheck group"
                                style="
          --mat-option-focus-state-layer-color:#ffffff00;
          --mat-option-hover-state-layer-color:#ffffff00;
          ">
                                <div
                                    class="flex gap-2.5 rounded-base py-1 items-center ps-6 group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate">
                                    <span class="relative size-4  flex items-center justify-center">
                                        <icon name="addcircle"
                                            class="opacity-0 group-hover:opacity-100 text-base abolute group-[&.mdc-list-item--selected]:hidden" />
                                        <icon name="removecircle"
                                            class="abolute hidden text-base group-[&.mdc-list-item--selected]:inline-block" />
                                    </span>
                                    <span class="h-3 w-1 rounded-2xl block"
                                        [ngStyle]="{'background': '#'+y.cColor}"></span>
                                    {{y.cIName}}
                                </div>
                            </mat-option>
                            }
                        </mat-optgroup>
                        }
                    </mat-select>
                    <div class="flex bg-grey rounded-xl gap-2.5 p-2.5 max-w-[810px] flex-wrap mt-3"
                        *ngIf="SelectedQFact.length">
                        <div class="text-sm font-medium flex items-center p-2 px-3 bg-white rounded-xl gap-3 "
                            *ngFor="let x of SelectedQFact;let fi = index">
                            <span class="flex items-center gap-2 text-xs">
                                <!-- <span class="rounded-base h-3.5 w-1 bg-red-400"
                                    [ngStyle]="{'background': 'red'}"></span> -->
                                <span class="rounded-base h-3.5 w-1 bg-red-400"
                                    [ngStyle]="{'background': '#' + x.cColor}"></span>
                                {{x.cIName}} ({{x.cCategory}})
                                <span class="flex">
                                    <icon class="text-lg" name="backspace" type="extra"
                                        (click)="removels(x,'SelectedQFact','jQFIssue','nIid')" />
                                </span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- <div [class.!hidden]="!frm.value.bQfact" class="mt-3">

                        placeholder="Select Contact..."

                            </div>
                        </mat-option>

                        @for (x of contactList; track x) {

                            <avtr size="sm" [matTooltip]="x.cFname + x.cLname"

                            <span>{{x.cFname + ' ' + x.cLname}}</span>
                        </mat-option>
                        }
                    </mat-select>

                                </span>
                            </span>
                        </div>
                    </div>
                </div> -->
            </div>
            <div>
                <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">
                    <mat-checkbox formControlName="bDoc" class="text-xs ">
                        <span class="!text-white">Doc Link:</span>
                    </mat-checkbox>
                    <div [class.!hidden]="!frm.value.bDoc"
                        class="flex h-12 items-center gap-x-2 [&>span]:cursor-pointer ms-auto">
                        @for(x of icons;track $index){
                        <span (click)="changeFont(x.type,'cDsize')"
                            class="flex rounded-base p-1.5 hover:text-blue-on flex-col items-center !max-w-[55px] !min-w-[55px]"
                            [ngClass]="x.type==frm.value.cDsize?'!text-blue-on !bg-blue-100 !border-blue-on border-2 hover:shadow-[inset_0px_0px_4px_0px_#9FCCFF] shadow-[inset_0px_0px_4px_0px_#9FCCFF]':'!bg-white' ">
                            <icon class="text-xl flex mx-auto" [name]="'textF'" type="indicn"></icon>
                            <span class="text-xs">{{x.name}}</span>
                        </span>
                        }
                    </div>
                </div>
            </div>

            <!-- <div>
                <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">

                        @for(x of icons;track $index){
                        <span (click)="changeFont(x.type,'cDsize')"
                            class="flex rounded-base p-1.5 hover:text-blue-on flex-col items-center !max-w-[55px] !min-w-[55px]"
                            [ngClass]="x.type==frm.value.cDsize?'!text-blue-on !bg-blue-100 !border-blue-on border-2 hover:shadow-[inset_0px_0px_4px_0px_#9FCCFF] shadow-[inset_0px_0px_4px_0px_#9FCCFF]':'!bg-white' ">
                            <icon class="text-xl flex mx-auto" [name]="'textF'" type="indicn"></icon>
                            <span class="text-xs">{{x.name}}</span>
                        </span>
                        }
                    </div>
                </div>
            </div> -->
            @if (!isAdvanced) {
            <btn mode="text" (click)="isAdvanced = !isAdvanced" class="text-end">
                Advanced Setup
            </btn>
            }
        </label>

        @if (!isAdvanced) {
        <div class="flex items-center gap-3 mt-6 px-5" (click)="submit()">
            <btn mode="solid" class="w-full" [isloading]="isLoading">Export</btn>
            <!-- <btn mode="white">View Export Status</btn> -->
        </div>
        }

    </section>

    @if (isAdvanced) {
    <!-- <hr class="min-w-px bg-gray-400 h-full"> -->

    <section class="flex flex-col px-5 bg-white border-l min-w-[450px] max-w-[450px] pt-9">
        <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">
            <div class="flex items-center gap-2 ms-auto">
                <btn mode="outlined"
                    addcls="rounded-full !py-1 !pe-1 font-semibold   !ps-2 !bg-blue-deactivate hover:!bg-blue-deactivate !text-blue-on"
                    (click)="isAdvanced = !isAdvanced">
                    Advance Setup
                    <span class="bg-blue-on size-5 text-white rounded-full grid place-items-center rotate-180">
                        <icon class="text-xxs" name="chvx" type="comnicn"></icon>
                    </span>
                </btn>
            </div>
        </div>

        <label for="notify" class="py-2 flex items-center gap-3 !pt-3">
            <mat-checkbox class="text-xs" formControlName="bCoverpg">Cover Page</mat-checkbox>
        </label>


        <label for="notify" class="py-2 flex items-center gap-3 !pb-3">
            <h6 class="text-xs font-semibold">Pages: </h6>
            <mat-radio-group formControlName="cPages" class="flex items-center gap-3">
                <mat-radio-button value="A" class="text-xs">All</mat-radio-button>
                <mat-radio-button value="R" class="text-xs"><span class="whitespace-nowrap"> Page
                        Range</span></mat-radio-button>
            </mat-radio-group>
            @if (frm.value.cPages == 'R') {
            <input type="text" formControlName="cPagerange" class="w-20" [placeholder]="'1-10,12'">
            }
        </label>

        <div class="flex items-center gap-3 bg-grey py-1 h-[65px] px-4">
            <div class="flex items-center gap-2 o">
                <span class="text-xs text-white">Page Setup</span>
            </div>
        </div>

        <label for="notify" class="py-2 flex items-center gap-3 !pt-3">
            <h6 class="text-xs font-semibold">Orientation: </h6>
            <mat-radio-group class="flex items-center gap-3" formControlName="cOrientation">
                <mat-radio-button value="A" class="text-xs">Auto</mat-radio-button>
                <mat-radio-button value="P" class="text-xs">All Portrait</mat-radio-button>
            </mat-radio-group>
        </label>

        <label for="notify" class="py-2 flex items-center gap-3 !pb-3">
            <h6 class="text-xs font-semibold">Scale: </h6>
            <mat-checkbox formControlName="bFitpg" class="text-xs"><span class="whitespace-nowrap">Fit to
                    Page</span></mat-checkbox>
            <mat-select formControlName="cPgsize" class="w-full !border !rounded-base" placeholder="Select issue">
                <mat-option value="A4">A4</mat-option>
                <mat-option value="A3">A3</mat-option>
                <mat-option value="A2">A2</mat-option>
            </mat-select>
        </label>

        <div class="flex items-center gap-3 mt-auto">
            <btn mode="solid" [isloading]="isLoading" class="w-full" (click)="submit()" [disabled]="!jFiles.length">
                Export</btn>
        </div>
    </section>
    }
</form>
