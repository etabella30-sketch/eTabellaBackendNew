<div class="bg-dark-blue p-10 h-full overflow-hidden flex flex-col" cdkDropListGroup>
    <div class="top mb-6">
        <teamlist [teamlist]="teamlist" [nCaseid]="nCaseid" [isloading]="isloading" [nUTeamid]="nUTeamid" (teamChange)="teamChange($event)">
        </teamlist>
    </div>
    <!-- <ng-scrollbar [visibility]="'hover'" [appearance]="'compact'" (scroll)="onScroll('',$event)"
        (reachedBottom)="onScroll('S',$event)" [ngClass]="{'fadenow': reached}"> -->
    <!-- <div class="fadestart w-full absolute left-0 top-0 z-10 h-28 bg-gradient-to-b from-dark-blue to-transparent"
                        *ngIf="reached=='E'"></div> -->
    <div class="h-full overflow-hidden mt-2.5">
        <userlist [nCaseid]="nCaseid" [teamlist]="teamlist" [dragteam]="dragteam" [assignedusers]="assignedusers"
            (userChange)="userChange($event)">
        </userlist>
    </div>
    <!-- </ng-scrollbar> -->

    <div class="row mt-6">
        <div class="col-lg-3 flex gap-3">
            <btn type="submit" mode="gradient" addcls="rounded-full" (click)="submitTeam()" [isloading]="isLoading">
                Save and go to File
            </btn>
            <btn type="submit" mode="dark" addcls="rounded-full bg-white text-blue-on px-4" (click)="skip()">
                Skip
            </btn>
        </div>
    </div>
</div>
