<div class="p-5">
        <h6 class="text-base flex justify-between font-semibold mb-7">Create New Team
                <icon name="close" class="text-xs ms-auto cursor-pointer hover:text-blue-500" (click)="close()" />
        </h6>
        <div class="flex items-end gap-2 mb-6">
                <inpt [isrequired]="true" placeholder="Enter Team Name" [showlabel]="true" class="block  w-full"
                        [value]="cTeamname" (valueChange)="cTeamname = $event;"> Team Name </inpt>
                <div class="size-8 rounded-base bg-gray-400 cursor-pointer" (click)="pickcolor=!pickcolor"
                        [style]="'background:'+ cClr">
                </div>
        </div>
        <div class="profileslider w-100 bg-transaparent overflow-hidden rounded-3 " *ngIf="pickcolor">
                <div class="color-pickercss w-100 bg-transaparent ">
                        <div class="rounded-3">
                                <app-colorpicker class="mx-auto" [(myColor)]="cClr"
                                        [colorslist]="colorslist"></app-colorpicker>
                        </div>
                </div>
        </div>
        <btn [disabled]="cTeamname.trim() == ''" (click)="onSubmit()"> {{permission == 'N' ? 'Create' : 'Update'}}</btn>
</div>
