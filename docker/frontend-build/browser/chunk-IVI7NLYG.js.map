<h6 class="text-xs text-gray-400 mb-2">Drag and drop a team onto the name to assign</h6>

<div class="flex gap-2">
    @if(isloading){
    <div class="flex gap-2">
        @for (x of [12,3,4,5]; track $index) {
        <sklton height="32px" width="110px"></sklton>
        }
    </div>
    }

    <div class="flex items-center gap-2 w-full overflow-auto" id="teams" cdkDropList [cdkDropListData]="teamlist"
        [cdkDropListEnterPredicate]="dropListPredicate()">
        @for(x of teamlist;track x){
        <div class="cdk-drag team group whitespace-nowrap cursor-grab active:cursor-grabbing select-none c-pointer h-8 p-2.5 flex items-center gap-2.5 text-white text-xs rounded-lg w-fit"
            [ngStyle]="{'background' :x.cClr ? getColor(x.cClr) : '#CA7AD1'}" cdkDrag
            (cdkDragStarted)="dragStarted($event,x)" (cdkDragMoved)="onDraging($event)">
            <icon name="user" />
            {{x.cTeamname}}
            @if((!x.cFlag || x.cFlag =='')){
            <span class="group-hover:flex gap-2.5 text-mgray-700 cursor-pointer text-white"
                [ngClass]="!t.menuOpen ? 'hidden': 'flex'">
                <icon matTooltip="Edit" matTooltipClass="defaulttooltip" matTooltipPosition="below" name="edit"
                    class="ms-2 text-sm" (click)="createTeam(x)"></icon>
                <span class="h-4 w-px bg-mgray-600"></span>
                <icon matTooltip="Delete" matTooltipClass="defaulttooltip" matTooltipPosition="below" class="text-sm"
                    name="removefill" [matMenuTriggerFor]="delete" #t="matMenuTrigger"></icon>
            </span>
            <mat-menu #delete="matMenu" class="!bg-black p-5  rounded-base">
                <div>
                    <h6 class="mb-6 min-w-64 text-white text-xs">Confirm Delete ?</h6>
                    <div class="flex gap-2">
                        <btn (click)="deleteTeam(x)">Delete</btn>
                        <btn mode="dark">cancel</btn>
                    </div>
                </div>
            </mat-menu>
            }
            <div class="relative team group cursor-grabbing  h-8  p-2.5 flex items-center gap-2.5 text-white text-xs  rounded-lg w-fit"
                *cdkDragPreview [ngStyle]="{'background' :  x.cClr}">
                <icon name="user" class="text-xs"></icon>
                {{ x.cTeamname}}
            </div>
            <div class="relative team group c-pointer bg-gray-600 h-8  p-2.5 flex items-center gap-2.5 text-white text-xs  rounded-lg w-fit"
                *cdkDragPlaceholder [ngStyle]="{'background' :  x.cClr}">
                <icon name="user" class="text-xs"></icon>
                {{ x.cTeamname}}
            </div>
        </div>
        }
    </div>
    <btn mode="dark" class="ms-auto" (click)="createUser()">
        <icon name="userfill" class="text-base"></icon>
        <icon name="addfill" class="text-base"></icon>
    </btn>
    <btn mode="dark" (click)="createTeam()">
        New Team
    </btn>
</div>
