<span
    class="bg-white size-8.5 flex items-center justify-center border rounded-full absolute -right-4 -top-4 z-50 hover:text-blue-on">
    <icon name="close" class="text-xs" />
</span>

@for(g of factlist;track g.nFSid){
<div (click)="$event.stopPropagation()" class="relative" [class.mt-3]="$index">


    @if (!g.isedit ) {
    <span (click)="g.isedit=true"
        class="bg-white size-8.5 flex items-center justify-center border rounded-full absolute -right-4 top-7 z-50 hover:text-blue-on">
        <icon name="edit" class="text-xs" />
    </span>
    }

    <div class="p-2 rounded-base bg-white relative z-10 shadow-[0px_4px_4px_#00000040] max-h-32 overflow-auto">

        @if (g.isedit) {
        <div [ngClass]="{'shadow-[0px_0px_8px_#0063ffde]': isFocus}"
            class="border min-h-5 max-h-28  rounded-base text-xs px-2.5 overflow-auto bg-white">
            @for(x of g.jTexts;track x;){
            <div contenteditable="true" #editableDiv (focus)="isFocus = true" (blur)="isFocus = false"
                (input)="updateJText($event,g, $index)"
                class=" overflow-auto  text-xs py-3 border-t first:border-t-0 border-grey bg-white focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none"
                [innerHtml]="x">
            </div>
            }
        </div>
        }
        @if (!g.isedit) {
        @for(y of g.jTexts;track y;){
        <span class="text-xs" [innerHTML]="y"></span>
        }}

        @if (g.isedit) {
        <button mode="white" (click)="SaveNote(g)"
            class="!text-blue-on absolute bottom-3.5 right-3.5 hover:bg-white px-2.5 flex items-center gap-2 shadow-none active:bg-white w-fit text-xs bg-white h-8.5 rounded-base border border-blue-deactivate">
            Save
        </button>
        }



    </div>





</div>
}
