<div class="color-wrapper w-full">
  <div draggable="false" (mouseup)="onMouseUp($event)" (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)" class="flex items-center gradient box  w-[300px] h-[300px] flex-wrap relative"
    [ngStyle]="{'--hue': currentcolor + 'deg','--cursor':isDragging?'none':'default'}">
    @for (x of colors; track trackByColor($index, x)) {
    <span #colorItem class="size-[30px]  item opacity-0"
      [ngStyle]="{'background':'hsl('+ currentcolor +', 100%,' + x +'%)'}" [id]="$index" [attr.huecode]="x">
      {{$index}}
    </span>
    }
    <div class="size-4 border border-white rounded-full absolute " *ngIf="colorloded" [style.left.px]="movableItem.x"
      [style.top.px]="movableItem.y">
      <span
        class="bg-black text-xs text-white absolute custtooltip top-full mt-3 left-1/2 -translate-x-1/2">#{{myColor}}</span>
    </div>
  </div>
  <div class="relative w-fit h-fit flex me-auto">
    <div
      class="flex items-center flex-col huegrad shadow-[-1px_0px_7px_#0000002e]  saturate-150  relative ms-2 w-[16px] border-2 border-white overflow-hidden rounded-full">
      @for (x of hueArray; track x) {
      <span class="h-[15px] w-full opacity-0" [ngStyle]="{'background':'hsl(' + x + ', 100%, 50%)'}"></span>
      }
    </div>

    <mat-slider [max]="19" step="1"
      class="!absolute rotate-90 !w-[300px]  color-slider left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 !ms-3 !h-8"
      [ngStyle]="{
      '--mdc-slider-handle-color': 'hsl('+currentcolor+', 100%, 50%)',
      '--mdc-slider-focus-handle-color': 'hsl('+currentcolor+', 100%, 50%)',
      '--mdc-slider-hover-handle-color': 'hsl('+currentcolor+', 100%, 50%)',
    }">
      <input matSliderThumb #slider [(ngModel)]="currenthueVal" (ngModelChange)="colorchange()">
    </mat-slider>
  </div>
  <!-- *ngIf="colorslist&&colorslist.length" -->
  <div class="flex flex-col  rounded-lg ps-2.5">
    <div class="flex items-center text-xs text-black mb-2.5 gap-2.5 bg-white rounded-lg p-2.5">
      <span class="size-8  border-2 border-white" [ngStyle]="{'background':'#'+myColor}"></span>
      <span class="min-w-12">
        #{{myColor}}
      </span>
    </div>


    <div class="flex items-center flex-wrap gap-1 min-w-[116px] " *ngIf="colorslist&&colorslist.length">
      @for (x of colorslist; track x) {
      @if ($index <= 9) { <span class="size-5  border-2 border-white cursor-pointer"
        [ngStyle]="{'background':'#'+x.cClr}" (click)="selectColor(x.cClr)"></span>
        }
        }
    </div>

  </div>
