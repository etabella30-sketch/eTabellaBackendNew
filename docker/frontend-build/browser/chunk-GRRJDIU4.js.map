<div class="w-full h-full min-h-fit bg-[#E0E0E0] p-2.5 rounded-base overflow-hidden"
    [class]="Showannotaion ? 'p-5' : '!bg-dark-blue'">
    <div class="flex gap-2 items-center text-sm font-semibold" [class]="!Showannotaion ? 'text-white' : ''"
        (click)="Showannotaion= !Showannotaion">
        <h6> Advanced Search - Annotation</h6>
        <icon name="chvx" [class]="Showannotaion ? 'rotate-180' : ''" class="ms-auto"></icon>
    </div>
    <hr class="my-2.5" [class]="!Showannotaion ? '!hidden' : ''">
    <div class="flex gap-6 pt-2.5 h-fit" [class]="!Showannotaion ? '!hidden' : ''">
        <div class="w-1/4 h-full flex flex-col gap-2 overflow-hidden">
            <h6 class="text-xs font-semibold flex gap-2 items-center">Issue:
                <mat-checkbox [(ngModel)]="isAllIssue" (change)="CheckAllIssues(isAllIssue)">All</mat-checkbox>
            </h6>
            @defer (when nCaseid) {
            <choose-issue [isfilter]="true" class="block h-full overflow-auto" [intoolbar]="true" #issueListC
                [expandIssue]="true" [selectedIssues]="selectedIssues" [nCaseid]="nCaseid"
                (Onevent)="OnIssueEvent($event)" (OnDataRec)="OnIssueDataReceive($event)" />
            } @placeholder {
            <div class="w-full block h-10 bg-gray-200 animate-pulse rounded-base"></div>
            }
        </div>
        <div class="w-3/4 h-full">
            <div class="mb-6">
                <h6 class="text-xs font-semibold mb-2.5">Impact</h6>
                <div class="flex flex-wrap gap-2.5">
                    <mat-checkbox [(ngModel)]="isAllimpact" (change)="OnAllCheckImpact(isAllimpact)"
                        [disabled]="!selectedIssues.length">All</mat-checkbox>
                    <div class="divider w-px h-4 bg-grey/50 mx-2.5"></div>
                    @for (x of impacts; track $index) {
                    <mat-checkbox (change)="OnImpactChange()" [(ngModel)]="x.isSelected"
                        [disabled]="!selectedIssues.length">
                        <span class="flex items-center gap-2 whitespace-nowrap">
                            <img [src]="'assets/icons/impact/'+x.nValue+'.png'">
                            {{x.cKey}}
                        </span>
                    </mat-checkbox>
                    }
                </div>
            </div>
            <div class="mb-6">
                <h6 class="text-xs font-semibold mb-2.5">Relevance</h6>
                <div class="flex gap-2.5">
                    <mat-checkbox [(ngModel)]="isAllrelevance" (change)="OnAllCheckRelevance(isAllrelevance)"
                        [disabled]="!selectedIssues.length">All</mat-checkbox>
                    <div class="divider w-px h-4 bg-grey/50 mx-2.5"></div>
                    @for (x of relevences; track $index) {
                    <mat-checkbox (change)="OnRelevanceChange()" [(ngModel)]="x.isSelected"
                        [disabled]="!selectedIssues.length">
                        <span
                            class="flex items-center gap-2 whitespace-nowrap bg-reply px-2 py-1 rounded-base text-xxs font-semibold">
                            {{x.cKey}}
                        </span>
                    </mat-checkbox>
                    }
                </div>
            </div>
            <div>
                <h6 class="text-xs font-semibold mb-2.5">Markup</h6>
                <div class="flex gap-2">
                    <mat-checkbox [(ngModel)]="isAllmarkup" (change)="OnAllCheckMarkup(isAllmarkup)">All</mat-checkbox>
                    <div class="divider w-px h-4 bg-grey/50 mx-2.5"></div>
                    @for (x of markup; track $index) {
                    <mat-checkbox (change)="OnMarkUpCHange()" [(ngModel)]="x.isSelected">{{x.cKey}}</mat-checkbox>
                    }
                </div>
            </div>
        </div>
    </div>

</div>
