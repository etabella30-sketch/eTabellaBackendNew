<div class="h-full w-full flex flex-col">
    <header class="px-8 min-h-15 flex bg-dark-blue relative z-20">
        <div class="flex items-center gap-6 text-blue-deactivate/70">
            <img width="30px" src="assets/colorlogo.svg">
            <div>
                <span class="text-sm  text-blue-deactivate/70 cursor-pointer" (click)="goToHome()">Dashboard
                </span>/ <span class="text-sm font-semibold ">
                    Help Center
                </span>
                / <span class="text-sm font-semibold text-white underline ">{{cTitle}}
                </span>

            </div>
        </div>
        <!-- <div class="flex items-center gap-2 ms-auto">
        <profile [userguidebtn]="false" [icon]="false" [detail]="userdetail" size="lg" [icon]="true" [iconwhite]="true">
        </profile>
    </div> -->
    </header>
    <div class="h-full bg-[#f8fafc] ">
        @if(!isLoaded){
        <div class="flex items-center justify-center h-full ">
            <div class="h-[90vh] w-[720px] bg-[#ecedef] animate-pulse rounded-base ">
            </div>
        </div>
        }
        <iframe (load)="onLoad()" [src]="link" width="100%" height="100%" allowfullscreen frameborder="0"></iframe>
    </div>
</div>
