<ng-container *ngIf="modeltype=='QF'">
  <ng-container *ngIf="modeltype=='QF'">
    <quickfact [docInfo]="docInfo" [tempAnnots]="tempAnnots" [nCaseid]="nCaseid" [linkIds]="linkIds"
      [quickFactDetail]="quickFactDetail" [selectedlinktype]="selectedlinktype" [selectedIssues]="selectedIssues"
      (OnEvent)="OnLinkEvent($event)" [(selectedContacts)]="selectedContacts" />
    <!-- <fact-creation [cFFrom]="cFFrom" class="block min-w-[520px] h-full" [hightlightMode]="modeltype" [nCaseid]="nCaseid"
  [nUserid]="nUserid" [nBundledetailid]="nBundledetailid" [visibleIssueModel]="false" [nUserid]="nUserid"
  [headerType]="'F'" /> -->
  </ng-container>
</ng-container><ng-container *ngIf="modeltype=='F'">
  <ng-container>
    <factform [docInfo]="docInfo" [selectedIssues]="selectedIssues" [tempAnnots]="tempAnnots" [nCaseid]="nCaseid"
      [annotGlobMode]="annotGlobMode" [selectedlinktype]="selectedlinktype" [quickFactDetail]="quickFactDetail"
      (OnEvent)="OnLinkEvent($event)" [selectedContacts]="selectedContacts" />

    <!-- <fact-creation class="block min-w-[520px] h-full" [hightlightMode]="modeltype" [nCaseid]="nCaseid"
  [visibleIssueModel]="false" [nUserid]="nUserid" [headerType]="'F'" /> -->
    <!-- <fact-creation [cFFrom]="cFFrom" class="block min-w-[520px] h-full" [hightlightMode]="modeltype" [nCaseid]="nCaseid"
  [nUserid]="nUserid" [nBundledetailid]="nBundledetailid" [visibleIssueModel]="false" [nUserid]="nUserid"
  [headerType]="'F'" /> -->
  </ng-container>
</ng-container><ng-container *ngIf="modeltype=='D'">
  <ng-container>
    <docform [docInfo]="docInfo" [tempAnnots]="tempAnnots" [nCaseid]="nCaseid" [annotGlobMode]="annotGlobMode"
      [selectedlinktype]="selectedlinktype" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'W'">
  <ng-container *ngIf="modeltype=='W'">
    <webform [docInfo]="docInfo" [tempAnnots]="tempAnnots" [nCaseid]="nCaseid" [annotGlobMode]="annotGlobMode"
      [selectedlinktype]="selectedlinktype" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'RF'">
  <ng-container>
    <factdata [nUserid]="nUserid" [docInfo]="docInfo" [userList]="userList" [linkIds]="linkIds" [nCaseid]="nCaseid"
      [fullMode]="fullMode" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'RQF'">
  <ng-container *ngIf="modeltype=='RQF'">
    <quickfactdata [docInfo]="docInfo" [linkIds]="linkIds" [nCaseid]="nCaseid" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'RW'">
  <ng-container *ngIf="modeltype=='RW'">
    <webdata [nUserid]="nUserid" [userList]="userList" [docInfo]="docInfo" [linkIds]="linkIds" [nCaseid]="nCaseid"
      (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'RD'">
  <ng-container>
    <docdata [nUserid]="nUserid" [userList]="userList" [docInfo]="docInfo" [linkIds]="linkIds" [nCaseid]="nCaseid"
      [fullMode]="fullMode" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'N'">
  <ng-container>
    <app-navigate [userList]="userList" [docInfo]="docInfo" [nCaseid]="nCaseid" [nViewissueid]="nViewissueid"
      (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'LS'">
  <ng-container *ngIf="modeltype=='LS'">
    <div class="fixed z-10 top-0 left-0  h-full w-full" (click)="close()">
    </div>
    <location-share class="relative z-20" [type]="modeltype" [nId]="" [isLocationShared]="true" [nCaseid]="nCaseid"
      [docInfo]="docInfo" [userList]="userList" (OnEvent)="OnLinkEvent($event)" [nUserid]="nUserid" />

  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'IL'">
  <ng-container>
    <app-issuedialog [nCaseid]="nCaseid" (OnEvent)="OnLinkEvent($event)" />
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'VP'||modeltype == 'AP'">
  <ng-container>
    <app-properties [nCaseid]="nCaseid" [viewsection]="false" [ismyfiles]="false" [viewlist]="[docInfo]"
      (changeProperties)="OnLinkEvent($event)" [isTaskPermission]="isTaskPermission"
      [isContactPermission]="isContactPermission" />
    <!-- (changeProperties)="changeProperties($event)" -->
  </ng-container>
</ng-container><ng-container *ngIf="modeltype == 'IF'">
  <ng-container *ngIf="modeltype == 'IF'">
    <app-issue-form [selectedIssues]="selectedIssues" [nCaseid]="nCaseid" (onIssueselect)="onIssueselect($event)" />
    <!-- (changeProperties)="changeProperties($event)" -->
  </ng-container>
</ng-container>
