<div class="flex flex-col h-full bg-reply">
  <header class="py-2.5 px-5 bg-blue-on text-white flex items-center ">
    <span class="font-semibold">
      <icon name="Qfact" type="extra" /> {{ 'FACTS.QUICK.TITLE' | translate }}
    </span>

    <ng-container *ngIf="factlist[0]?.nUserid == nUserid">
      <ng-container *ngIf="factlist?.length==1">
        <btn square class="ms-auto" mode="darkwhite" addcls="hover:!bg-white hover:!text-blue-on"
          (click)="edit(factlist[0])">
          <icon name="edit" type="comnicn" />
        </btn>
        <btn square (click)="deleteqfact(factlist[0],0)" mode="darkwhite" class="ms-2"
          addcls="hover:!bg-white hover:!text-blue-on">
          <icon name="removefill" type="comnicn" />
        </btn>
      </ng-container>
    </ng-container>

    <icon name="close" [ngClass]="{'ms-auto': factlist?.length!=1,'ms-3':factlist?.length==1}" class="text-xs block"
      (click)="back()" />
  </header>
  <div class="h-full overflow-auto p-5">

    <ng-container *ngIf="factlist?.length">
      <ng-container *ngFor="let x of factlist; let i = index">
        <div [ngClass]="{'bg-white p-2 mb-3 rounded-base': factlist?.length>1}">
          <!-- @defer(when !isLoading){
    <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [linktype]="x.jLinktype"
      [heading]="true" />
    }@placeholder {
    <div></div>
    } -->
          <div [ngClass]="{'px-2': factlist?.length>1}">
            <div *ngFor="let z of x.issueList; let $index = index"
              class="flex gap-2.5 group items-center bg-transparent border p-3 hover:bg-white border-white py- rounded-xl mt-2.5 max-md:flex-wrap hover:shadow-[0px_4px_4px_#00000025]"
              [ngClass]="{'shadow-[0px_4px_4px_#00000025]': factlist?.length>1}">
              <div class="flex gap-1 items-center my-auto text-xs font-extrabold leading-4 w-full">
                <span class="rounded-base h-3.5 w-1 bg-red-400" [ngStyle]="{'background': '#'+z.cColor}"></span>
                <div class="justify-center whitespace-nowrap">
                  <!-- {{z.nIid}} -  -->
                  {{z.cIName}}
                  <span>({{z.cCategory}})</span>
                </div>
                <div class="flex items-center ms-auto gap-2">
                  <badge *ngIf="z.cRelevance" type="light" [addcls]="'!py-px px-1 !font-bold '">{{ z.cRelevance}}
                  </badge>
                  <img *ngIf="z.nImpactid" [src]="'assets/icons/impact/' + z.nImpactid + '.png'">
                </div>
              </div>
            </div>
          </div>
          <hr class="my-5 border-grey/25">
          <div *ngIf="x.jTexts?.length"
            class="border border-tab bg-white min-h-5 max-h-28  rounded-base text-xs px-2.5 overflow-auto w-full">
            <ng-container *ngFor="let y of x.jTexts">
              <div *ngIf="y?.trim()"
                class=" overflow-auto  text-xs py-3 border-t first:border-t-0 border-grey focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none"
                [innerHtml]="y">
              </div>
            </ng-container>
          </div>

          <div *ngIf="factlist?.length>1" class="text-xs flex items-center gap-2 underline mt-2 justify-end">
            <span class="cursor-pointer" (click)="edit(x)">{{ 'FACTS.QUICK.EDIT' | translate }}</span>
            <span class="cursor-pointer" (click)="deleteqfact(x,i)">{{ 'FACTS.QUICK.DELETE' | translate }}</span>
          </div>

          <!-- @defer(when factlist?.length){
    <factcard [data]="x" [issueList]="x.issueList" [filelinks]="x.filelinks" [userList]="[]" [quickfact]="true"
      (onCardEvent)="getCardEvent($event,x,$index)" />
    }@placeholder {
    <div></div>
    } -->

          <btn *ngIf="factlist[0]?.nUserid == nUserid" class="w-full mt-5" (click)="convertToFullFact(x)">{{
            'FACTS.QUICK.CONVERT_TO_FULL_FACT' | translate }}</btn>
        </div>
      </ng-container>
    </ng-container>
    <div *ngIf="!factlist?.length"></div>
  </div>
</div>
