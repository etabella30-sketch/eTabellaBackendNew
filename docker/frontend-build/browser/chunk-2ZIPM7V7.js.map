<div class="flex flex-col h-full bg-reply">
        @if (!issuedetail) {
        <header class="flex flex-col justify-center px-5 py-2.5 w-full bg-blue-600  ">
                <div class="flex gap-2.5 items-center  max-md:flex-wrap">
                        <icon class="text-white" name="issue" type="myfileicn" />
                        <h2 class="flex-1 self-stretch my-auto text-lg font-bold tracking-tight text-white">
                                Issues
                        </h2>

                        <btn mode="white" addcls="!text-blue-on hover:bg-white shadow-none active:bg-white shadow-none"
                                (click)="createIssue()">
                                <icon name="addcircle" />
                                New issue
                        </btn>

                        <icon name="close" class="ms-3 text-white text-xs cursor-pointer" (click)="close()" />
                </div>
        </header>
        }
        @if(!issuedetail){
        <div class="px-6 my-6  h-fit overflow-auto pb-3">
                <!-- @defer (on viewport) { -->
                <issueslist #issueListC (clickEvent)="clickevnt($event)" [nCaseid]="nCaseid"></issueslist>
                <!-- }
                @placeholder {
                <div></div>
                } -->
        </div>
        }
        @if(issuedetail){
        <div class=" h-fit overflow-auto">
                <issuedetail (OnEvent)="issueDetailEvent($event)" [issue]="currentdetail"></issuedetail>
        </div>
        }



</div>
