<div class="flex flex-col h-full">
  <header class="py-2.5 px-5 bg-blue-on text-white flex items-center justify-between">
    <span class="font-semibold">{{ 'DOCFORM.CREATE_DOC_LINK' | translate }}</span>
     <icon name="close" class="text-xs" (click)="back()" (keydown.enter)="back()" (keydown.space)="back()" />
  </header>
  <div class="px-5 flex flex-col gap-6 overflow-auto pt-5  p-5 ">
    <div>
      <ng-container *ngIf="docInfo; else docPlaceholder">
        <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [heading]="true"
          [linktype]="selectedlinktype"></source-card>
      </ng-container>
      <ng-template #docPlaceholder>
        <div class="w-full h-24 bg-reply rounded-base animate-pulse"></div>
      </ng-template>
    </div>

    <div class="flex flex-col gap-2" [ngClass]="{'shadow-[0_3px_10px_#94949440] p-5 bg-white rounded-base': jFiles?.length}">
      <ng-container *ngIf="jFiles?.length > 0; else filesPlaceholder">
        <span class="text-xs font-semibold">{{ 'DOCFORM.DESTINATION_FILES' | translate }}</span>
        <ng-container *ngFor="let y of jFiles; let i = index">
          <source-card [deletebtnend]="true" gap="S" [truncate]="false" type="P" [detail]="y"
            (cardevent)="onFilesEvents($event, i)"></source-card>
        </ng-container>
        <div>
          <btn [addcls]="' '" [mode]="'outlined'" (click)="chooseFiles()" (keydown.enter)="chooseFiles()" (keydown.space)="chooseFiles()" class="w-full">{{ 'DOCFORM.CHOOSE_ANOTHER_FILE' | translate }}</btn>
        </div>
      </ng-container>
      <ng-template #filesPlaceholder>
        <div class="p-5 bg-white rounded-base">
          <div>{{ 'DOCFORM.LOADING' | translate }}</div>
            <div class="mt-3">
            <btn [mode]="'solid'" (click)="chooseFiles()" (keydown.enter)="chooseFiles()" (keydown.space)="chooseFiles()" class="w-full">{{ 'DOCFORM.CHOOSE_DESTINATION_FILE' | translate }}</btn>
          </div>
        </div>
      </ng-template>
    </div>

    <ng-container *ngIf="userList?.length > 0; else userPlaceholder">
      <shared-view [userList]="userList" [nCaseid]="nCaseid"></shared-view>
    </ng-container>
    <ng-template #userPlaceholder>
      <div>{{ 'DOCFORM.LOADING' | translate }}</div>
    </ng-template>

    <btn (click)="submit()" (keydown.enter)="submit()" (keydown.space)="submit()" [disabled]="!jFiles?.length" class="w-full">{{ 'DOCFORM.SAVE' | translate }}</btn>
  </div>

</div>
