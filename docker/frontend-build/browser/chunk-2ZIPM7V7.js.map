<header class="py-2.5 px-5 flex items-center justify-between">
  <span class="font-semibold text-lg ">{{ 'LINKS.DOC_DATA.TITLE' | translate }}</span>
  <icon name="close" class="text-xs" (click)="back()" />
</header>

<div class="h-[calc(100%_-_48px)] overflow-auto px-5">
  <ng-container *ngFor="let x of docList">
    <div class="mb-5">

      <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [linktype]="x.jLinktype"
        [heading]="true" />


      <ng-container *ngIf="x.jOText.length>1">
        <p class="text-xs mb-2 mt-3 flex items-center font-medium">{{ 'LINKS.DOC_DATA.SOURCE_TEXT' | translate }}</p>
        <div class="p-2 bg-white  border-grey/60 border-4 w-full rounded-base">
          <ul class="mb-4 h-20 overflow-auto">
            <li *ngFor="let y of x.jOText | paginate: { itemsPerPage: 1, currentPage: nCurrent_annot }">
              <h6 class="text-xs" [innerHTML]="y">
              </h6>
            </li>
          </ul>
          <pagination-controls class="pagebar" previousLabel="" nextLabel="" class="pagebar d-block my-2"
            (pageChange)="changePaginatePage($event)">
          </pagination-controls>
        </div>
      </ng-container>

      <!-- @if(x.jOText?.length){
  <div class="border-4 border-tab min-h-5 max-h-28  rounded-base text-xs px-2.5 overflow-auto">
    @for(y of x.jOText;track y;){
    <div
      class=" overflow-auto  text-xs py-3 border-t first:border-t-0 border-grey focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none"
      [innerHtml]="y">
    </div>
    }
  </div>
  } -->


      <div *ngIf="x.files?.length" class="py-6">
        <ng-container *ngFor="let l of x.files">
          <div class=" bg-white rounded-base shadow-[0_3px_10px_#94949440] hover:shadow-[0_0_6px_#06f] mb-2">
            <source-card gap="S" [nUserid]="x.nUserid" [truncate]="true" [deletebtn]="x.nUserid == nUserid" [detail]="l"
              [linkbtn]="true" (cardevent)="linkedEvents($event,l,x)" [isSelected]="l.isSelected" />
          </div>
        </ng-container>
      </div>


      <ng-container *ngIf="x.shareList?.length && x.nUserid == nUserid">
        <p class="text-xs p-2 mb-2 flex items-center gap-2 mt-3 border-b bg-blue-on text-white">
          {{ 'LINKS.DOC_DATA.SHARE' | translate }}
          <badge type="white" addcls="!py-[1px] !px-[6px] ">{{x['shareCount']}}</badge>
        </p>
        <shared-view *ngIf="x.shareList?.length" [nId]="x.nDocid" type="D" [isUpdate]="true" [hasWrap]="true"
          [userList]="x.shareList" (onEvent)="onEvent($event,x)" [isSelectAll]="false" [ishorizontal]="true"
          [nCaseid]="nCaseid"></shared-view>
      </ng-container>

    </div>

  </ng-container>
</div>
<ng-container *ngIf="docdetail">
  <div class="fixed grid place-items-center top-0 left-0 w-[calc(100%_-_440px)] h-full mt-9"
    [class]="!fullMode ? '!w-[426px] !mt-0':''">
    <div class="absolute h-full w-full top-0 left-0 bg-black/50 z-10" (click)="fullMode=!fullMode;docdetail=null"></div>

    <quick-preview [detail]="docdetail" [fullMode]="fullMode" [nCaseid]="nCaseid" [isOnSameTab]="true"
      (OnEvent)="OnQuickPreviewEvent($event)" />
    <!-- <div class=" h-fit  flex flex-col w-fit relative z-20 bg-white rounded-base">
    <header class="flex p-2 items-center text-lg font-semibold cursor-pointer">
      <span>
        {{docdetail?.jOTexts?.length? ('LINKS.DOC_DATA.SOURCE_TEXT' | translate) : ('LINKS.DOC_DATA.QUICKVIEW_DEST' | translate)}}
      </span>
    </header>
    <div class="h-full  max-h-[70vh] px-2.5 overflow-auto">
      @if (docdetail?.jOTexts?.length) {
      <div class="p-2 w-[560px]" [class]="!fullMode ? '!w-[380px]':''">
        <div class="border-4 border-tab min-h-28 max-h-[50vh]  rounded-base text-xs px-2.5 overflow-auto">
          @for(x of docdetail.jOTexts;track x;){
          <div
            class=" overflow-auto  text-xs py-3 border-t first:border-t-0 border-grey focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none"

      @else {
      <div class="h-[70vh]  flex items-center bg-faint w-[700px] px-2.5 justify-center overflow-auto"

        <span class="opacity-50">{{ 'LINKS.DOC_DATA.NO_IMAGE' | translate }}</span>
      </div>

    </div>
  </div> -->


  </div>
</ng-container>
