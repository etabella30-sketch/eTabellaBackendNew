<div class="flex flex-col h-full">
  <header class="py-2.5 px-5 bg-blue-on text-white flex items-center justify-between">
    <span class="font-semibold">{{ 'PDF.WEBFORM.CREATE_WEB_LINK' | translate }}</span>
    <icon name="close" class="text-xs" (click)="back()" />
  </header>
  <div class="px-5 flex flex-col gap-6 overflow-auto pt-5 pb-5">
    <div>
      <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [heading]="true"
        [linktype]="selectedlinktype" />
    </div>
    <!-- (keyup)="OnValidateUrl()" -->
    <div class="flex items-end gap-2">
      <div class="w-full">
        <h6 class="text-xs mb-1 font-semibold">{{ 'PDF.WEBFORM.URL' | translate }} <span class="text-red-500">*</span>
        </h6>
        <input type="text" [placeholder]="'PDF.WEBFORM.URL_PLACEHOLDER' | translate" [(ngModel)]="cUrl"
          (keyup.enter)="getWebData()" (blur)="getWebData()">
      </div>
      <a class="no-underline h-8.5 w-8.5 flex items-center justify-center border rounded-base hover:border-blue-on hover:text-blue-on "
        href="https://www.google.com" target="_blank">
        <img width="16px" src="../../../../../assets/icons/google.svg">
      </a>
    </div>
    <ng-container *ngIf="isLoading">
      <div class=" w-full min-h-72 bg-reply animate-pulse rounded-base">
      </div>
    </ng-container>

    <ng-container *ngIf="cImg">
      <img [src]="imagepath + cImg" alt="image" class="w-full h-72 object-cover" />
    </ng-container>

    <btn mode="white" addcls="!bg-faint shadow-none" (click)="viewTitlebox=!viewTitlebox">{{
      'PDF.WEBFORM.ADD_TITLE_NOTE' | translate }}</btn>



    <ng-container *ngIf="viewTitlebox">
      <div>
        <h6 class="text-xs mb-1 font-semibold">{{ 'PDF.WEBFORM.TITLE' | translate }} </h6>
        <input type="text" [(ngModel)]="cTitle" [placeholder]="'PDF.WEBFORM.TITLE' | translate" class="w-full" />
      </div>
      <div>
        <h6 class="text-xs mb-1 font-semibold">{{ 'PDF.WEBFORM.NOTE' | translate }} </h6>
        <textarea [(ngModel)]="cNote" [placeholder]="'PDF.WEBFORM.NOTE' | translate"
          class="w-full style h-20"></textarea>
      </div>
    </ng-container>
    <!-- isLoading  this is for skelloton -->
    <ng-container *ngIf="userList.length">
      <ng-container *ngIf="userList.length">
        <shared-view [userList]="userList" [nCaseid]="nCaseid"></shared-view>
      </ng-container>
    </ng-container>
    <btn class="w-full" (click)="submit()" [attr.isdisabled]="!isUrlverified">{{ 'PDF.WEBFORM.DONE' | translate }}</btn>
  </div>

</div>
