@for (x of factlist; track $index) {
<div
    class=" mb-2 hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base group-hover:opacity-50 hover:!opacity-100 cursor-pointer">
    @if(false){
    <div class="flex gap-3 justify-end flex-col relative">
        <!-- isincoming -->
        @if(false){
        <div class="pe-5">
            @defer(on viewport){
            <source-card gap="S" [truncate]="false" mode="dark" [viewbtn]="true" addcls="!rounded-s-none"
                [detail]="x.nBundledetailid ? x : docInfo" [heading]="true" [linktype]="x.jLinktype"
                (onView)="OnViewEvent(x)" />
            }@placeholder {
            <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
            </div>
            }
        </div>
        <div
            class=" bg-grey rounded-full size-11 border text-white border-white flex  justify-center items-center top-1/2 -translate-y-1/2 right-12 absolute z-20 ">
            <icon name="factIn" type="indicn" />
        </div>
        }
        <div class="pe-5">
            @defer(on viewport){
            <source-card addcls="!rounded-s-none" [isnavigate]="true" gap="S" [truncate]="false" mode="dark"
                [viewbtn]="true" [detail]="x.nBundledetailid ? x : docInfo" [heading]="true" [linktype]="x.jLinktype"
                (onView)="OnViewEvent(x)" />
            }@placeholder {
            <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
            </div>
            }
        </div>
    </div>
    }
    @defer(when factlist?.length){
    <factcard class="bg-black block rounded-base" [nFSid]="nFSid" [isFactLink]="true" [type]="type" [data]="x"  [isFactLink]="true"
        [issueList]="x.issueList" [filelinks]="x.linkfile" [nohover]="true" [userList]="userList" isnavigate
        (onCardEvent)="getCardEvent($event,x,$index)" [viewmode]="viewmode" (OnView)="OnViewEvent($event)" [selectedMode]="selectedMode"  />
    }@placeholder {
    <div></div>
    }
    <!-- @defer(on viewport){
    @for (item of x.linkfile; track $index) {
    <source-card [isnavigate]="true" gap="S" [truncate]="false" mode="dark" [viewbtn]="true" [detail]="item"
        [heading]="true" [linktype]="item.jLinktype" (onView)="OnFactViewEvent(x.linkfile)" />
    }
    }@placeholder {
    <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
    </div>
    } -->
</div>
}
