@for (company of companylist; track $index) {

<div class="p-5 rounded-base flex items-center text-white bg-black mb-3 cursor-pointer"
    (click)="getCompFactList(company)">
    <span class="text-xs font-semibold">{{company.cCompany}}
    </span>
    <icon name="chvx" type="comnicn" class=" ms-auto text-xxs" [ngClass]="{'rotate-180': company.expand}" />
</div>

@if(company.expand){
@for (x of company?.factlist; track $index) {
<div class="bg-black  hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base mb-2 group-hover:opacity-50 hover:!opacity-100 cursor-pointer">
    @defer(when company?.factlist?.length){
    <factcard [nFSid]="nFSid" [type]="type" [data]="x" iscontact [issueList]="x.issueList" [filelinks]="x.filelinks" [nohover]="true" isnavigate iscontact
        [userList]="userList" (onCardEvent)="getCardEvent($event,x,$index)" [viewmode]="viewmode" (OnView)="OnViewEvent($event)" />
    }@placeholder {
    <div class="h-72 bg-black/50 animate-pulse"></div>
    }
    <!-- @defer(on viewport){
        <source-card [isnavigate]="true" class=" block mb-2" gap="S" [truncate]="false" mode="dark"  [detail]="docInfo" isnaviga
            addcls="!rounded-s-none" [linktype]="x.jLinktype" [heading]="true" [viewbtn]="true" (onView)="OnViewEvent(x)"/>
        }@placeholder {
        <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
        </div>
        } -->
</div>
}
}
}
