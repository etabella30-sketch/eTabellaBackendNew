<header class="py-2.5 px-5 flex items-center justify-between">
  <span class="font-semibold text-lg ">{{ 'LINKS.WEB_DATA.TITLE' | translate }}</span>
  <icon name="close" class="text-xs" (click)="back()" />
</header>

<div class="h-[calc(100%_-_48px)] overflow-auto px-5 pb-5">
  <ng-container *ngFor="let x of weblist; let i = index">
    <!-- @if(x.jOText.length>1){
  <p class="text-xs mb-2 mt-3 flex items-center font-medium">Source Text</p>
  <div class="p-2 bg-white  border-grey/60 border-4 w-full rounded-base">
    <ul class="mb-4 h-20 overflow-auto">
      @for(y of x.jOText | paginate: { itemsPerPage: 1, currentPage: nCurrent_annot };track y){
      <li>
        <h6 class="text-xs" [innerHTML]="y">
        </h6>
      </li>
      }
    </ul>
    <pagination-controls class="pagebar" previousLabel="" nextLabel="" class="pagebar d-block my-2"
      (pageChange)="changePaginatePage($event)">
    </pagination-controls>
  </div>
  } -->
    <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [linktype]="x.jLinktype"
      [heading]="true" />
    <div (dblclick)="openWeb(x)"
      class="flex gap-2 relative  rounded-base overflow-hidden px-6 py-6 w-full my-3 shadow-[0_3px_10px_#94949440] hover:shadow-[0_0px_6px_#06f]">
      <div *ngIf="nUserid == x.nUserid">
        <div class="flex flex-col gap-2 ">
          <btn [square]="true" mode="outlined" (click)="deleteWeb(x)">
            <icon name="removefill" />
          </btn>
        </div>
        <div class="w-px h-auto bg-grey/30 mx-3"></div>
      </div>
      <div class="w-[calc(100%_-_75px)] flex flex-col gap-2" [class]="{'!w-full':  nUserid != x.nUserid}">
        <div class="flex gap-2 items-center text-xs">
          <img *ngIf="x.cFavicon; else defaultFavicon" [src]="x.cFavicon" width="25px" />
          <ng-template #defaultFavicon>
            <img src="../../../../../assets/icons/default-fev.png" width="20px" />
          </ng-template>
          <span class="font-semibold text-xs ">{{x.cTitle}}</span>
        </div>
        <div class="max-h-12 overflow-auto">
          <pre class="text-xs whitespace-pre-wrap" [innerHTML]="x.cNote"></pre>
        </div>
        <a [href]="x.cUrl" target="_blank" class="text-xs text-blue-on underline">{{x.cUrl}}</a>
        <img *ngIf="x.cImg" [src]="imagepath + x.cImg" class="w-full h-72 object-cover" />
      </div>
    </div>


    <!-- <btn (click)="deleteWeb(x)">Delete</btn>
  <img [src]="x.cFavicon" />
  <span>{{x.cTitle}}</span>
  <pre [innerHTML]="x.cNote"></pre>
  <a>{{x.cUrl}}</a>
  <img [src]="imagepath + x.cImg" /> -->
    <ng-container *ngIf="x.shareList?.length && x.nUserid == nUserid">
      <p class="text-xs p-2 mb-2 flex items-center gap-2 mt-3 border-b bg-blue-on text-white">
        {{ 'LINKS.WEB_DATA.SHARE' | translate }}
        <badge type="white" addcls="!py-[1px] !px-[6px] ">{{x['shareCount']}}</badge>
      </p>
      <ng-container *ngIf="x.shareList?.length">
        <shared-view *ngIf="x.shareList?.length" [nId]="x.nWebid" type="W" [isUpdate]="true" [hasshadow]="false"
          [hasWrap]="true" (onEvent)="onEvent($event,x)" [userList]="x.shareList" [isSelectAll]="false"
          [ishorizontal]="true" [nCaseid]="nCaseid"></shared-view>
      </ng-container>
    </ng-container>
  </ng-container>
</div>
