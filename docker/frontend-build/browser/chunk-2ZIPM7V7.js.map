@for (x of tasklist; track $index) {
<div
    class="bg-black pt-5 hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base mb-2 group-hover:opacity-50 hover:!opacity-100 cursor-pointer">
    <div class="pe-5">
        @defer(on viewport){
        <source-card [isnavigate]="true" gap="S" [truncate]="false" mode="dark" [detail]="docInfo" isnaviga
            addcls="!rounded-s-none" [linktype]="x.jLinktype" [heading]="true" />
        }@placeholder {
        <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
        </div>
        }
        <div class="flex  relative   overflow-hidden px-6 py-6 w-full">
            <div class="flex flex-col gap-3 ">
                <btn [active]="x.nTaskid == nTaskid && type == 'C'"
                    (click)="getCardEvent({ event: 'VIEW', data: 'C' ,x:x},$index)" [square]="true" issmall
                    mode="darkwhite" mode="text" addcls="text-white">
                    <icon name="contacts" type="myfileicn" class="text-xs" />
                </btn>
                <btn [active]="x.nTaskid == nTaskid && type == 'S'"
                    (click)="getCardEvent({ event: 'VIEW', data: 'S' ,x:x},$index)" [square]="true" issmall
                    mode="darkwhite" mode="text" addcls="text-white">
                    <icon name="share" type="extra" class="text-xs" />
                </btn>
            </div>
            <div class="w-px h-auto bg-white/30 mx-3"></div>
            <div class="w-full flex flex-col gap-2">
                <div class="height-fit rounded-base overflow-hidden">
                    <h6 class="flex text-xs text-white h-fit items-center whitespace-nowrap mt-0 group mb-2">
                        <span class="truncate">{{x.cSubject}}</span>
                        <div class="scont small  ms-auto flex gap-1 flex-row">
                            <!-- x.userList -->
                            @for (y of x.userList; track $index) {
                            @if (3 > $index) {
                            <avtr class="block" [ngClass]="{'!-me-3': x?.userList?.length>3}" [detail]="y" size="sm"
                                [matTooltip]="y.cFname+' '+y.cLname" />
                            }
                            }
                            @if (x.userList?.length>4) {
                            <div class="grid place-items-center rounded-full size-6 bg-brand text-white">
                                +{{x.userList?.length-4}}
                            </div>
                            }
                        </div>
                    </h6>
                    <selected-issues [issueList]="x.issueList"></selected-issues>
                    <div class=" ">
                        <div class="text-xs border-4 border-gray-400 max-h-14 overflow-auto rounded-base p-2 mb-3">
                            <h6>{{x.cDesc}}</h6>
                        </div>
                        <div class="h-[68px] flex items-baseline pt-2.5 justify-between rounded-base gap-2.5 text-xs">
                            <div class="left flex flex-col gap-1">
                                <span class="font-semibold">{{x.cPriority}}</span>
                                <div class="flex gap-2 items-center">

                                    <icon name="temp" type="extra" class="text-sm" [ngClass]="
                               {
                                       'text-red-500': x.nPriority==1,
                                       'text-yellow-400': x.nPriority==2,
                                       'text-gray-400': x.nPriority==4,
                                       'text-green-400': x.nPriority==3,
                                  }
                                  " />
                                </div>
                                <!-- <img class="mt-1" src="{{api.folder_icon + y.cImg}}"> -->
                            </div>
                            <div class="midleft">
                                <span class="font-semibold">Progress</span>
                                <h5 class="mt-2 text-xxs font-semibold flex items-center flex-col">
                                    <b class="min-h-2 flex w-full bg-tab rounded-lg">
                                        <span class="bg-blue-on h-[8px] rounded-full"
                                            [ngStyle]="{'width': x.nProgress+'%'}"></span>
                                    </b>
                                    {{x.nProgress}}%
                                </h5>
                            </div>
                            <div class="midright">
                                <span class="font-semibold">Timeline</span>
                                <h5 class="mt-2 px-1.5 py-0.5 rounded-full bg-grey text-white text-xxs">
                                    {{x.jTimeline?.show_tm}}
                                </h5>
                            </div>

                            <!-- <div class="midright">
                                <span class="font-semibold mb-2">Reminder</span>
                                @if (x.jReminders?.length) {
                                @for (r of x.jReminders; track $index) {
                                <span class="block text-xxs mb-0.5">
                                    {{r.value}} {{r.nm == 'D' ? 'Day' : r.nm == 'W' ?'Week' : ''}}
                                </span>
                                }
                                }@else{
                                <span class="block text-xxs my-1">No Reminders</span>
                                }
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
}
