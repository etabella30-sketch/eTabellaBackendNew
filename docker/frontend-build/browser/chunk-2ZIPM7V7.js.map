@if (list?.length) {
@for (x of list; track $index) {
<div
    class="bg-transparent mb-2 hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base  group-hover:opacity-50 hover:!opacity-100  cursor-pointer">
    <!-- <div class="pe-5">
            @defer(on viewport){
            <source-card [isnavigate]="true" gap="S" addcls="!rounded-s-none" [truncate]="false" mode="dark"
                [viewbtn]="true" [detail]="docInfo" [heading]="true" [linktype]="x.jLinktype" (onView)="OnViewEvent(x)" />
            }@placeholder {
            <div class=" w-full h-24 bg-grey rounded-base animate-pulse">
            </div>
            }
        </div> -->
    @if(x.cSource=='F' || x.cSource=='FL'){
    @defer(when list?.length){
    <factcard class="block bg-black rounded-base" [nFSid]="nFSid" [type]="type" [data]="x" [issueList]="x.issueList"
        [quickfact]="x.cSource=='QF'" [filelinks]="x.linkfile" [nohover]="true" [userList]="userList" isnavigate
        [viewmode]="viewmode" (OnView)="OnViewEvent($event, 'F')" (onCardEvent)="getCardEvent($event,x,$index)" />
    }@placeholder {
    <div></div>
    }
    }@else if(x.cSource=='W'){
    <webcard [x]="x" [userList]="userList" [nCaseid]="nCaseid" [viewmode]="viewmode"
        (OnView)="OnViewEvent($event, 'W')" />
    }@else if(x.cSource=='D'){
    <doclinkcard [x]="x" [userList]="userList" [nCaseid]="nCaseid" [viewmode]="viewmode"
        (OnView)="OnViewEvent($event, 'D')" [isnavigate]="true" />
    }
</div>
}
}
