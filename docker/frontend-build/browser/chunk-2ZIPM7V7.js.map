<div class="flex flex-col h-full bg-[#EEEEEE]">
  <ng-container *ngIf="isListview && !isError">
    <header class="py-2.5 px-5 bg-blue-on text-white flex items-center justify-between">
      <span class="font-semibold">{{ 'FACTS.DATA.DETAIL_TITLE' | translate }}</span>
      <icon name="close" class="text-xs" (click)="back()" />
    </header>

    <div class="h-full overflow-auto px-5 pt-5 ">

      <ng-container *ngIf="factlist?.length">
        <ng-container *ngFor="let x of factlist; let i = index">

          <ng-container *ngIf="!isLoading">
            <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo" [linktype]="x.jLinktype"
              [heading]="true" />
          </ng-container>
          <ng-container *ngIf="factlist?.length">
            <factcard [nFSid]="nFSid" [type]="type" [data]="x" [issueList]="x.issueList" [filelinks]="x.filelinks"
              viewmode="'F'" [isLight]="true" (dblclick)="viewFactDetail(x)" [userList]="userList"
              (onCardEvent)="getCardEvent($event,x,i)" />
          </ng-container>
        </ng-container>
      </ng-container>
      <div *ngIf="!factlist?.length"></div>
    </div>
  </ng-container>

  <ng-container *ngIf="!isListview && !isError">
    <!-- <header class="py-5 px-5  flex items-center  gap-3">
    @if(!isListview && factlist?.length>1){
    <icon name="chvy" class="text-lg" (click)="isListview = true;" />
    }
    <span class="font-semibold text-lg ">Fact Sheet </span>
    <div class="flex items-center justify-end ms-auto gap-3">
      @if(!isListview && nUserid==currentFactDetail.nUserid && fullMode && !docInfo?.nPresentid) {
      <icon name="factD" class="text-lg ms-auto hover:text-blue-on" type="indicn" (click)="openBigFactSheet()" />
      }
      <icon name="close" class="text-xs ms-2 hover:text-blue-on" (click)="backToFactDetail()" />
    </div>
  </header> -->


    <header class="py-2.5 px-5 bg-blue-on text-white flex items-center justify-between">
      <icon *ngIf="!isListview && factlist?.length>1" name="chvy" class="text-sm me-3 flex"
        (click)="isListview = true;" />
      <span class="font-semibold">{{ 'FACTS.DATA.SHEET_TITLE' | translate }}</span>
      <icon *ngIf="!isListview && nUserid==currentFactDetail.nUserid && fullMode && !docInfo?.nPresentid" name="factD"
        class="text-base ms-auto" type="indicn" (click)="openBigFactSheet()" />
      <icon name="close" class="text-xs ms-6" (click)="back()" />
    </header>

    <div class="h-full overflow-auto px-5 pt-5">

      <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="docInfo"
        [linktype]="currentFactDetail?.jLinktype" [heading]="true" />

      <ng-container *ngIf="!isLoading">
        <ng-container *ngIf="!isListview">
          <div class="py-1"></div>
          <factdetail [nUserid]="nUserid" [docInfo]="docInfo" [data]="currentFactDetail" [nCaseid]="nCaseid"
            [issueList]="currentFactDetail?.issueList" [filelinks]="currentFactDetail.filelinks" [userList]="userList"
            (cardevent)="openFactLink($event)" />
        </ng-container>
      </ng-container>
      <ng-container *ngIf="isLoading">
        <!-- Scletton here -->
      </ng-container>
    </div>

  </ng-container>

  <empty *ngIf="!(!isListview && !isError) && isError" head="{{ 'FACTS.DATA.NO_DATA' | translate }}" class="h-full">
  </empty>
  <!-- // error message here -->
  <empty *ngIf="(!isListview && !isError) == false && !isListview && !isError == false && !isError"
    head="{{ 'FACTS.DATA.NO_DATA' | translate }}" class="h-full"></empty>
</div>

<ng-container *ngIf="factMode">

  <div class="fixed grid place-items-center top-0 left-0 w-[calc(100%_-_440px)] h-full"
    [ngClass]="{'!w-[426px]': !fullMode}">
    <div class="w-full h-full bg-black/30 absolute z-10 " (click)="!fullMode&&factMode=null">
    </div>
    <div class="w-[620px] max-h-[700px] h-fit overflow-auto relative z-20  rounded-base"
      [ngClass]="{'bg-white': factMode!='S','w-[calc(100%_-_20px)]':!fullMode}">
      <header *ngIf="factMode!='S'" class="flex p-2 items-center text-xs border-b mb-2">
        <span>
          {{factMode=='C' ? ('FACTS.DETAIL.CONTACTS' | translate) : ('FACTS.DETAIL.TASKS' | translate) }}
        </span>
      </header>
      <div class="overflow-auto px-3 max-h-[75vh]">
        <ng-container *ngIf="factMode">
          <ng-container *ngIf="factMode=='C'">
            <ng-container *ngIf="factMode=='C'">
              <div *ngFor="let x of selectedContacts" class="flex gap-2 px-5 py-3 border-b">
                <avtr size="2xl" [detail]="x"></avtr>
                <div class="w-full">
                  <h6 class="text-sm font-semibold ps-5 mb-2 "> {{x.cFname}} {{x.cLname}}</h6>
                  <app-contactdetail [nContactid]="x.nContactid" [onlydetail]="true"></app-contactdetail>
                </div>
              </div>
            </ng-container>

          </ng-container>
          <ng-container *ngIf="factMode=='T'">
            <ng-container *ngIf="factMode=='T'">
              <selected-tasks [selectedTasks]="selectedTasks" showreminder />
            </ng-container>

          </ng-container>
          <ng-container *ngIf="factMode=='S'">
            <ng-container *ngIf="factMode=='S'">
              <!-- <shared-view [userList]="selectedUsers" [hasshadow]="false" [haspadding]="false" [isSelectAll]="false"></shared-view> -->
              <location-share type="F" [nId]="nFSid" mode="light" [userList]="userList" [docInfo]="docInfo"
                [nCaseid]="nCaseid"></location-share>
            </ng-container>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</ng-container>
