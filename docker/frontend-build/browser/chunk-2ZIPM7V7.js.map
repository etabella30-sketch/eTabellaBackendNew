<div class="group-hover:opacity-50 hover:!opacity-100 mb-3 last:mb-0">
    <doclinkcard [x]="x" [userList]="userList" [nCaseid]="nCaseid" (OnView)="OnViewEvent($event)" [isnavigate]="true" />
</div>
