<div class="p-3">
        <div class="h-fit p-5 flex flex-col gap-2  rounded-base w-full text-xs"
                [ngClass]="{'bg-white text-grey': mode=='light','bg-grey text-white': mode=='dark'}">
                <!-- [(ngModel)]="allSelected" (change)="selectAllUsers($event)"  -->
                <div class="flex flex-col  mb-2">
                        <span class="text-xs  flex items-center gap-2"
                                [ngClass]="{'!text-lg font-semibold': mode!='dark'}">
                                {{mode=='dark'?'Quick View Invitation':'Quick Share'}}
                        </span>
                        @if (mode!='dark') {
                        <span>In-app invitaiton</span>
                        }
                </div>
                <div class="flex items-start">
                        <div class="flex gap-2 flex-wrap">
                                @if (userList?.length) {
                                @for (x of userList; track x.nUserid) {
                                @if(x.nUserid != nUserid){
                                @defer(when userList?.length){
                                <avtr class="cursor-pointer" [detail]="x" size="lg"
                                        [matTooltip]="x?.cFname+' '+x?.cLname" [active]="x.isSelected"
                                        (click)="x.isSelected=!x.isSelected;isChanged = true">
                                </avtr>
                                }@placeholder {
                                <sklton [isavatar]="true" height="35px" width="35px"></sklton>
                                <sklton [isavatar]="true" height="35px" width="35px"></sklton>
                                <sklton [isavatar]="true" height="35px" width="35px"></sklton>
                                <sklton [isavatar]="true" height="35px" width="35px"></sklton>
                                }
                                }
                                }
                                }
                        </div>
                        <!-- [isloading]="isLoading"  -->
                        <btn [disabled]="!isChanged" [attr.disabled]="!isChanged" [mode]="mode=='dark'?'white':'solid'"
                                class="ms-auto" (click)="isChanged ? send() : ''">Send</btn>
                </div>
                <hr class="border-black/25 my-3">
                <span>External Link</span>
                <div class="flex items-center gap-5">
                        <input type="text" class="" placeholder="Enter URL" [(ngModel)]="cUrl"
                                [ngClass]="{'bg-black text-white': mode=='dark'}" />
                        <btn mode="white" (click)="copyText()">Copy</btn>
                </div>
        </div>
</div>
