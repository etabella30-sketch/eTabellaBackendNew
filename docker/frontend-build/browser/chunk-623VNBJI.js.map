@for(x of selectedContacts; track x.nContactid) {
<div class="flex items-center gap-2 border border-white hover:bg-white px-5 py-2.5 rounded-base group mb-2 "
        [ngClass]="{'shadow-base hover:shadow-[0px_2px_9px_#94949440]': hasshadow}">
        <avtr size="xl" [detail]="{cFname:x.cFname,cLname:x.cLname,cProfile:''}">
        </avtr>
        <div class="gap-0.5 flex flex-col ">
                <span class="text-xs font-semibold" (click)="contactDetail(x)">{{x.cFname}} {{x.cLname}}

                        @if (showinfo) {
                        <icon name="info" />
                        }
                </span>
                @if (x.cRole) {
                <span class="text-xxs">{{x.cRole}}</span>
                }
                @if (x.cCompany) {
                <span class="text-xxs">{{x.cCompany}}</span>
                }
                @if (x?.cEmail) {
                <span class="underline text-xxs truncate">{{x.cEmail}}</span>
                }
        </div>
        @if(canEdit){
        <btn class="w-fit ms-auto opacity-0 group-hover:opacity-100" [square]="true" mode="outlined"
                (click)="editContact(x)">
                <icon name="edit" />
        </btn>
        }
        @if(canDelete){
        <btn class="w-fit ms-auto opacity-0 group-hover:opacity-100" [ngClass]="{'!ms-0': canEdit}" [square]="true"
                mode="outlined" (click)="deleteContact(x,$index)">
                <icon name="removefill" />
        </btn>
        }
</div>
}
