<div class="bg-dark-blue h-full w-full p-10 overflow-auto">
        <!-- (valueChange)="loginForm.controls['password'].setValue($event)" -->
        <form [formGroup]="caseForm">
                <div class="position-relative w-[824px] ng-star-inserted">
                        <div class="input-wrap w-100 mb-6">
                                <div class="flex gap-3 w-full pb-6">
                                        <div class="w-1/2 ng-star-inserted">
                                                <div class="flex gap-2 text-white items-center h-8.5"
                                                        [ngClass]="{'!hidden': caseForm.value['permission']!='E'||showinput}">
                                                        <span
                                                                class="text-lg  font-semibold">{{caseForm.value['cCasename']}}</span>
                                                        <icon name="edit" (click)="showinput=true"
                                                                class="text-xs text-blue-400 cursor-pointer">
                                                        </icon>
                                                </div>
                                                <ng-container *ngIf="caseForm.value['permission']=='N'||showinput">
                                                        <!-- <div [hidden]="caseForm.value['permission']!='N'&&!showinput"> -->
                                                        <inpt id="casename" type="text" formcontrolname="cCasename"
                                                                [value]="caseForm.value['cCasename']"
                                                                (focusOut)="focusOut($event)"
                                                                (valueChange)="caseForm.controls['cCasename'].setValue($event)"
                                                                placeholder="Case Name" [focus]="true">
                                                        </inpt>
                                                </ng-container>
                                        </div>
                                        <div class="w-1/2"></div>
                                </div>
                                <div class="flex gap-3 w-full pb-6">
                                        <div class="w-1/2">
                                                <inpt [showlabel]="true" [isrequired]="true" labelclas="text-white"
                                                        type="text" placeholder="" formcontrolname="cCaseno"
                                                        [value]="caseForm.value['cCaseno']"
                                                        (valueChange)="caseForm.controls['cCaseno'].setValue($event)">
                                                        Case No.
                                                </inpt>
                                        </div>
                                        <div class="w-1/2"></div>
                                </div>
                                <div class="flex gap-3 w-full pb-6">
                                        <div class="w-full">
                                                <label for="inputcasedesc"
                                                        class="text-xs text-white font-semibold  block">
                                                        Case Description<span class="text-red-500">*</span>

                                                </label>
                                                <span class="text-white/70 text-xs block mb-2">Max 150 words</span>

                                                <txtarea formcontrolname="cDesc" [value]="caseForm.value['cDesc']"
                                                        [maxlength]="150"
                                                        (valueChange)="caseForm.controls['cDesc'].setValue($event)">
                                                </txtarea>
                                        </div>
                                </div>
                                <div class="flex gap-3 w-full pb-6">
                                        <div class="w-1/2"><label for="inputcasename"
                                                        class="text-xs text-white font-semibold mb-2 block">Claimant</label>
                                                <txtarea placeholder="Name of Claimant" formcontrolname="cClaimant"
                                                        [value]="caseForm.value['cClaimant']"
                                                        (valueChange)="caseForm.controls['cClaimant'].setValue($event)">
                                                </txtarea>
                                        </div>
                                        <div class="w-1/2"><label for="inputcasename"
                                                        class="text-xs text-white font-semibold mb-2 block">Respondent</label>
                                                <txtarea placeholder="Name of Respondent" formcontrolname="cRespondent"
                                                        [value]="caseForm.value['cRespondent']"
                                                        (valueChange)="caseForm.controls['cRespondent'].setValue($event)">
                                                </txtarea>
                                        </div>
                                </div>

                                <div class="flex gap-3 w-full pb-6">
                                        <div class="w-1/2"><label for="inputcasename"
                                                        class="text-xs text-white font-semibold mb-2 block">Claimant for
                                                        Transcript</label>
                                                <txtarea placeholder="Name of Claimant Transcript"
                                                        formcontrolname="cTClaimant"
                                                        [value]="caseForm.value['cTClaimant']" maxlenght="20"
                                                        (valueChange)="caseForm.controls['cTClaimant'].setValue($event)">
                                                </txtarea>
                                        </div>
                                        <div class="w-1/2"><label for="inputcasename"
                                                        class="text-xs text-white font-semibold mb-2 block">Respondent
                                                        for Transcript</label>
                                                <txtarea placeholder="Name of Respondent Transcript"
                                                        formcontrolname="cTRespondent"
                                                        [value]="caseForm.value['cTRespondent']"
                                                        (valueChange)="caseForm.controls['cTRespondent'].setValue($event)">
                                                </txtarea>
                                        </div>
                                </div>
                                <div class="flex gap-3 w-full">
                                        <div class="w-1/2">
                                                <label for="inputcasename"
                                                        class="text-xs text-white font-semibold mb-2 block">Index
                                                        Title</label>
                                                <txtarea formcontrolname="cIndexheader"
                                                        placeholder="This the title which appears in the index page"
                                                        [value]="caseForm.value['cIndexheader']"
                                                        (valueChange)="caseForm.controls['cIndexheader'].setValue($event)">
                                                </txtarea>
                                        </div>
                                        <div class="w-1/2"></div>
                                </div>
                        </div>
                        <div class="row mt-6">
                                <div class="col-lg-3 flex gap-3">
                                        <btn [isloading]="isLoading" type="submit" mode="gradient"
                                                [disabled]="caseForm.invalid" (click)="onSubmit()"
                                                [ngClass]="{'pointer-events-none': caseForm.invalid||isLoading}"
                                                addcls="rounded-full px-5">
                                                Save and go to Team
                                        </btn>
                                        @if(nCaseid){
                                        <btn type="submit" mode="dark" (click)="goToteam()"
                                                addcls="rounded-full bg-white text-blue-on px-4">
                                                Skip
                                        </btn>
                                        }
                                </div>
                        </div>
                </div>
        </form>

</div>
