<div class="relative">
    <div *ngIf="!isHost" class="backdrop -top-24 h-52 block  w-28 z-20  absolute"></div>
    <button *ngFor="let button of currentConfig.buttons; let i = index" [style]="button.position"
        [style.width.px]="currentConfig.buttonSize" [matTooltip]="button.label | translate" matTooltipPosition="right"
        [class]="button.active?'border-4 border-blue-hover':''" [style.height.px]="currentConfig.buttonSize" class="absolute z-30 bottom-0 left-0 shadow-lg rounded-full grid place-items-center bg-white hover:bg-blue-deactivate hover:text-blue-on hover:shadow-none 
                 transition-all ease-in-out" [style.transition-duration]="currentConfig.animationDuration + 'ms'"
        [style.transition-delay]="isOpen ? (i * currentConfig.animationDelay) + 'ms' : '0ms'" [class.scale-0]="!isOpen"
        [class.scale-100]="isOpen" [attr.aria-label]="button.label | translate" (click)="onButtonClick(button)">
        <icon [name]="button.icon" [type]="button.type?button.type:'indicn'"></icon>
    </button>

    <button (click)="toggleMenu($event)" [style.width.px]="currentConfig.mainButtonSize"
        [ngClass]="{'-translate-y-[5px]': !this.isHost}" [matTooltip]="'FABBUTTON.VIEW' | translate"
        matTooltipPosition="right" [class]="isOpen?'border-4 border-blue-hover':''"
        [style.height.px]="currentConfig.mainButtonSize"
        class="shadow-lg  -translate-x-1 rounded-full grid place-items-center bg-white relative z-40 hover:bg-blue-deactivate text-blue-on hover:shadow-none  transition-all"
        [style.transition-duration]="currentConfig.animationDuration + 'ms'"
        [attr.aria-label]="'FABBUTTON.TOGGLE_MENU' | translate">
        <icon name="view" type="present" class="text-xl" />
    </button>

</div>
