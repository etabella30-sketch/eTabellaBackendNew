@if(!inProcess){
<div class="bg-white p-2 rounded-base max-h-[300px] overflow-auto shadow-base">
        @for(x of hyperlinkList;track x.nBundledetailid){
        <source-card gap="S" [truncate]="false" mode="light" type="T" [detail]="x" (click)="OpenFile(x)" />
        }
</div>
}@else {
<div class="bg-white p-2 rounded-base shadow-base">
        <div class="w-[300px] h-15 bg-faint rounded-base animate-pulse">
        </div>
</div>
}
