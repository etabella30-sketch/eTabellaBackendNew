<div class="h-full bg-[#f6f6f6] flex flex-col overflow-hidden ">
    <div class="text-lg bg-white  text-dark-blue whitespace-nowrap min-h-20 flex items-center gap-6 px-10">
        <img class="w-15" src="assets/present/public.png" />
        <h6 class="font-bold">3 - Step 1: Choose A Witness </h6>
        <btn class="ms-auto" [disabled]="!nContactid" (click)="gotoFile()"> Next: Choose File </btn>
    </div>
    <div class="flex  px-10 pt-10 pb-5 h-[calc(100%_-_80px)] gap-2.5 overflow-auto">
        <div class="col-span-6 w-[calc(100%_-_440px)] h-full flex flex-col gap-2.5 pe-2.5 over">
            <div class="w-full h-full flex flex-col gap-3">
                <div class="grid grid-cols-2 mb-3 gap-2.5 max-h-full h-fit overflow-auto content-start">
                    @for (x of witnessList; track $index) {
                    <div class="flex items-center  gap-2.5 bg-white hover:bg-blue-deactivate hover:border-white p-5 rounded-base border-solid border cursor-pointer"
                        [class]="x.nContactid == nContactid ? '!bg-dark-blue text-white' : ''"
                        (click)="nContactid = x.nContactid">
                        <avtr size="xl" [detail]="x"></avtr>
                        <h6 class="flex flex-col">
                            <span class="text-sm font-semibold truncate">
                                {{x.cFname}} {{x.cLname}}
                            </span>
                            <span class="text-xs">
                                {{x.cEmail}}
                            </span>
                        </h6>
                    </div>
                    }
                </div>
                <btn mode="outlined-blue" [hidden]="isNew" (click)="isNew = !isNew"> Create a New Contact </btn>
            </div>
        </div>
        @if(isNew){
        <div class="detail bg-white h-full col-span-4 min-w-[412px] rounded-base ">
            <app-contact-form class="block h-full " (OnEvent)="outputEvent($event)" [iscomponent]="true"
                [nCaseid]="nCaseid" [cContactType]="'W'"></app-contact-form>
        </div>
        }
    </div>
</div>
