<div class="flex flex-col h-full">
        <header class="px-8 h-[100px] flex">
                <div class="flex items-center gap-2">
                        <img src="assets/colorlogo.svg" alt="eTabella Logo">
                        <span class="text-3xl font-semibold">{{ 'DASHBOARD.TITLE' | translate }}
                        </span>
                </div>
                <div class="flex items-center gap-2 ms-auto">
                        <span class="text-xs">{{ 'DASHBOARD.WELCOME' | translate: { name: facade.userProfile()?.cFname }
                                }}</span>
                        <div class="flex items-center gap-2" *ngIf="facade.userProfile()?.nUserid">
                                <avtr [path]="facade.userProfile()?.cProfile" class="inline-flex"
                                        [matTooltip]="facade.userProfile()?.cFname+' '+facade.userProfile()?.cLname"
                                        [detail]="facade.userProfile()" [size]="'sm'">
                                </avtr>
                        </div>
                        <btn mode="white" [active]="pm.menuOpen" [matMenuTriggerFor]="menu" #pm="matMenuTrigger">
                                {{ 'DASHBOARD.MY_ACCOUNT' | translate }}
                        </btn>
                        <mat-menu #menu="matMenu" class="!min-w-[640px] mt-5 !overflow-visible">
                                <app-usercreation (click)="$event.stopPropagation()"
                                        (keypress)="$event.stopPropagation()" [nUserid]="facade.userProfile()?.nUserid"
                                        (updateEvent)="updateUser()" [ismyfiles]="true" (closeEvent)="pm.closeMenu()"
                                        *ngIf="facade.userProfile()?.nUserid"></app-usercreation>
                        </mat-menu>
                        <btn mode="outlined" (click)="goToAdmin()" (keypress)="goToAdmin()"
                                *ngIf="facade.userProfile()?.isAdmin">
                                <icon name="setting" class="text-lg"></icon>
                                {{ 'DASHBOARD.SUPER_ADMINISTRATOR' | translate }}
                        </btn>

                        <btn mode="dark" addcls="px-1 !text-blue-on" (click)="logOut()" (keypress)="logOut()">
                                {{ 'DASHBOARD.LOG_OUT' | translate }}
                        </btn>
                </div>
        </header>

        <div class="h-full overflow-auto" #parent>
                <div class="bg-dark-blue p-10">
                        <h6 class="text-lg font-semibold text-white">{{ 'DASHBOARD.ACTIVE_CASES' | translate }}</h6>
                        <div class="flex">
                                <div *ngIf="scrollState != scrollStateEnum.START"
                                        class="fadestart relative -ml-10 left-10 z-20 h-[378px] w-28 bg-gradient-to-r from-dark-blue to-transparent">
                                </div>
                                <ng-scrollbar (reachedEnd)="onReachEnd()" (reachedBottom)="onScroll(scrollStateEnum.END)"
                                        (reachedStart)="onScroll(scrollStateEnum.START)" (scroll)="onScroll2('',$event)">
                                        <div class="flex items-center relative gap-6 overflow-auto py-5">
                                                <casecard
                                                        *ngFor="let caseItem of facade.cases(); trackBy: trackByNcaseid"
                                                        [detail]="caseItem" [ticketCount]="caseItem.ticketCount"
                                                        [ticketOpen]="selectedTicketCaseId == caseItem.nCaseid"
                                                        [sessionId]="caseItem.nSesid"
                                                        (caseChange)="viewTicket($event,caseItem)" />
                                                <div class="flex gap-6" *ngIf="facade.loading()">
                                                        <div *ngFor="let team of skeletonArray; trackBy: trackByIndex"
                                                                class="p-5 group rounded-base border relative border-white w-80 flex-col h-[357px] bg-white text-grey flex justify-center-center">
                                                                <sklton height="26px" width="200px" bg="base"
                                                                        class="mb-2">
                                                                </sklton>
                                                                <sklton height="10px" width="100px" bg="base"></sklton>
                                                                <div
                                                                        class="flex flex-col gap-2.5 h-full overflow-auto mt-5">
                                                                        <div
                                                                                *ngFor="let team of teamSkeletonArray; trackBy: trackByIndex">
                                                                                <sklton bg="base" class="mb-3"
                                                                                        height="10px" width="100px">
                                                                                </sklton>
                                                                                <div
                                                                                        class="flex gap-2.5 flex-wrap mt-3">
                                                                                        <sklton *ngFor="let user of avatarSkeletonArray; trackBy: trackByIndex"
                                                                                                bg="base" height="35px"
                                                                                                width="35px"
                                                                                                [isavatar]="true">
                                                                                        </sklton>
                                                                                </div>
                                                                        </div>
                                                                </div>
                                                                <div class="flex gap-2">
                                                                        <sklton height="30px" width="100px" bg="base">
                                                                        </sklton>
                                                                        <sklton height="30px" width="30px" bg="base"
                                                                                class="ms-auto">
                                                                        </sklton>
                                                                        <sklton height="30px" width="30px" bg="base">
                                                                        </sklton>
                                                                        <sklton height="30px" width="30px" bg="base">
                                                                        </sklton>
                                                                </div>
                                                        </div>
                                                </div>
                                        </div>
                                </ng-scrollbar>
                                <div *ngIf="scrollState != scrollStateEnum.END && facade.cases().length > 4"
                                        class="fadestart relative -mr-10 -left-10 z-20 h-[378px] w-28 bg-gradient-to-l from-dark-blue to-transparent">
                                </div>
                        </div>
                </div>
                <app-tickets [nTicketCaseId]="selectedTicketCaseId" (ticketClose)="selectedTicketCaseId = null;"
                        (ticketCleard)="onTicketResponse($event)" [onTickets]="ticketChange$" *ngIf="selectedTicketCaseId" />
        </div>
</div>
