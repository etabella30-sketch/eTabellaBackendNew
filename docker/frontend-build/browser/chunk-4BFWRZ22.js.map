<button type="button"
        class="px-3 py-2 inline-flex items-center justify-center gap-x-2 text-xs  rounded-base whitespace-nowrap relative"
        [ngClass]="buttonClasses + (square ? (issmall ? ' min-h-6 min-w-6 max-h-6 max-w-6 !p-0 h-6 w-6 rounded-lg ':' min-h-8.5 min-w-8.5 max-h-8.5 max-w-8.5 !px-0 text-xs '):'') "
        [disabled]="disabled || isloading">
        <span class="flex items-center justify-center w-full gap-2" [ngClass]="{'opacity-0': isloading}">
                <ng-content></ng-content>
        </span>
        <span *ngIf="isloading" class="loader absolute" [class]="{'!border-brand':mode=='outlined' || loader == 'dark'}"></span>
</button>
