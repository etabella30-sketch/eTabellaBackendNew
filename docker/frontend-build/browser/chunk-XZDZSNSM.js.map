<div class="page-range-tool flex  items-center gap-1 w-full h-[70px] justify-center bg-black text-white px-5 text-xs z-[999]"
    [class]="!isIframe ? 'absolute bottom-0' : ''">

    @if (pagginationRenge?.length) {
    <mat-radio-group class="flex items-center gap-2" [(ngModel)]="linkType">
        <mat-radio-button value="P" class="flex"  [class]="pageRangeTextSelectionData ? 'pointer-events-none opacity-50 grayscale':''">
            <span class="text-white">Page range</span>
        </mat-radio-button>

        <ng-select appendTo="body" [items]="pagginationRenge" bindLabel="output" [(ngModel)]="startPg" bindValue="page"
            placeholder="--" (change)="OnPageSelected('S')" (keydown)="restrictToNumbers($event)"
            [inputAttrs]="{ inputmode: 'numeric', pattern: '[0-9]*' }"
            [disabled]="pageRangeTextSelectionData?true:false"
            [class]="pageRangeTextSelectionData ? 'pointer-events-none opacity-50':''"
            class="pagerefslct bg-white !px-0 h-6 !rounded-base w-fit  overflow-hidden !border !border-tab"
            style="border: 1px solid #c2c2c2 !important;">
            <ng-template ng-option-tmp let-item="item" let-index="index">
                <b class="text-xs font-normal">{{item.output}}</b>
            </ng-template>
        </ng-select>

        <span>to</span>

        <ng-select appendTo="body" [items]="endPageOptions" bindLabel="output" [(ngModel)]="endPg" bindValue="page"
            placeholder="--" (change)="OnPageSelected('E')" (keydown)="restrictToNumbers($event)"
            [inputAttrs]="{ inputmode: 'numeric', pattern: '[0-9]*' }"
            [disabled]="pageRangeTextSelectionData?true:false"
            [class]="pageRangeTextSelectionData ? 'pointer-events-none opacity-50':''"
            class="pagerefslct bg-white !px-0 h-6 !rounded-base w-fit overflow-hidden !border !border-tab"
            style="border:1px solid #c2c2c2 !important;">
            <ng-template ng-option-tmp let-item="item" let-index="index">
                <b class="text-xs font-normal">{{item.output}}</b>
            </ng-template>
        </ng-select>
    </mat-radio-group>

    <btn [isloading]="loading" class="text-blue ms-20"
        [class]="(!startPg || !endPg) && !pageRangeTextSelectionData ? 'pointer-events-none grayscale opacity-50':''"
        addcls="bg-brand" (click)="createLink()">
        Create link
    </btn>

    } @else {
    <span class="loading-text">Loading page range...</span>
    }

    <button class="close-btn ms-4" (click)="closeChild()">
        ✕
    </button>

</div>
