<div class="rightfloaticons" style="width: 40px; margin-left: auto; height: 100%;">
  <div class="twobubblewrapper !pointer-events-auto group relative group" (click)="iconClick()">
    <div id="pdficons" icon-type="F" class="icons relative z-20 pointer-events-none group-hover:pointer-events-auto"
      [attr.data-connect]="'icon-'+id" [class.isactive]="isActive"
      [style]="{'background-color': color ? (type=='D' ? '#7DBAFF' : (color)) : '#7DBAFF'}">
      <icon [name]="type=='QF' ? 'Qfact' : type=='D' ? 'doclink' : 'fact'" type="indicn" />
    </div>
  </div>
</div>
