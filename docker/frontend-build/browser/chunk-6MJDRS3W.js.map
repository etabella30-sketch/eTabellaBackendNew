<!-- [ngStyle]="{'height': itemSize + 'px', 'min-height': itemSize + 'px'}"  -->
 <!-- [style.height.px]="itemSize" [style.min-height.px]="itemSize" -->
<!-- `w-full` (instead of `max-w-fit w-fit`) makes every page render
     at the wrapper's width — so two consecutive pages no longer
     have visibly different widths just because one happens to have
     a slightly longer line. The wrapper width itself is computed
     in `feed-display.component.ts#recalcFeedWidth` to fit the
     longest measured line in the transcript (capped) so no line
     clips while every page stays uniform. min-w-[956px] keeps the
     legacy minimum so very narrow columns don't squash the
     line-meta / text columns below their designed widths. -->
<div class="page min-w-[956px] relative ps-10 pe-14 pb-6 w-full bg-white flex flex-col overflow-hidden"
    [style.height.px]="itemSize" [style.min-height]="itemSize" [attr.pg]="page?.page" [attr.pg]="page?.page">
    <input
        class="pagetitle bg-neutral-500 text-xs px-2.5 py-1.5 text-white w-full mb-6 fontsize !select-none !pointer-events-none !rounded-none  h-9"
        [value]="('rt.feedPage.pagePrefix' | translate) + ' ' + page?.page" readonly />
    <!-- <app-annotation-layer [selectedFont]="selectedFont" [timestamp]="showTimestamp?106:0" [pageno]="page?.page"
        [annotations]="page?.annotations" [lines]="page?.data" [nEditid]="nEditid"
        (OnIconClick)="OnIconClick($event,'A')" [currentIsseuDetailId]="currentIsseuDetailId"
        [mode]="mode"></app-annotation-layer> -->
    <!-- <app-text-layer (OnIconClick)="OnIconClick($event,'H')" [selectedFont]="selectedFont" [pageno]="page?.page"
        [lines]="page?.data" [hyperlinks]="page?.hyperlinks" [showTimestamp]="showTimestamp"
        [highlightmode]="highlightmode" [spaceBarOptions]="spaceBarOptions" (mouseup)="onMouseUp()"
        [annotations]="page?.annotations" [nEditid]="nEditid" (onTabEvent)="OnTabEvent($event)" [mode]="mode">
    </app-text-layer> -->

    <div class="relative h-full w-full">
        @if(page?.data?.length){
        <annotation-layer class="absolute  h-full w-full" appCallOnVisible [annotations]="annotations"
            [lines]="page?.data" [pageno]="page?.page" [pageIndex]="pageIndex" [activeRange]="activeRange"
            [showTimestamp]="showTimestamp" [visibleMarkNavModel]="visibleMarkNavModel" [filterAnnots]="filterAnnots" />
        }
        <text-layer [lines]="page?.data" [showTimestamp]="showTimestamp" [pageno]="page?.page" [nCaseid]="nCaseid"
            [nUserid]="nUserid" [qMarks]="qMarks" [smallFeed]="smallFeed" [activePageData]="activePageData"
            [realtimeEvent]="realtimeEvent" />
    </div>



</div>
