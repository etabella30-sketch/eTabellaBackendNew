<!-- Custom scrollbar: up/down arrows + track with draggable thumb.
     Positioned right beside the transcript content. -->

<!-- Up arrow -->
<button class="sm-arrow sm-arrow--up" (click)="scrollUp()" title="Scroll up">
  <svg width="8" height="8" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<!-- Track + thumb -->
<div class="sm-track" #track (click)="onTrackClick($event)">
  <div class="sm-thumb"
    [style.top.%]="thumbTop"
    [style.height.%]="thumbHeight"
    (mousedown)="onThumbMouseDown($event)">
  </div>
</div>

<!-- Down arrow -->
<button class="sm-arrow sm-arrow--down" (click)="scrollDown()" title="Scroll down">
  <svg width="8" height="8" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <path d="M6 9l6 6 6-6"/>
  </svg>
</button>
