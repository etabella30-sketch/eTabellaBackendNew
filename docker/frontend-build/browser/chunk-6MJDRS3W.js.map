<!-- {{lines?.length}} -->
@for(line of lines;track trackByLine($index, line)){
<feed-line [showTimestamp]="showTimestamp" [id]="'line-' + pageno + '-' + $index" [line]="line" [lineIndex]="$index + 1"  [pageno]="pageno" [nCaseid]="nCaseid" [nUserid]="nUserid" [qMarks]="qMarks"  [smallFeed]="smallFeed" [activePageData]="activePageData" [realtimeEvent]="realtimeEvent" />

    [mode]="mode">
  </app-feed-line> -->
}
