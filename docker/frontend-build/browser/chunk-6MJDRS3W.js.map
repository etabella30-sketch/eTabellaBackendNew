@if(!review){
<div class="h-[185px] bg-tab relative">
    <div class="overflow-visible w-full bg-white relative ">
        <div class="h-2 overflow-visible bg-[#FF5900]" [style.marginLeft]="splitScreenEnabled ?40*zoomLevel+'px':''"
            [style.width]="splitScreenEnabled ? 'calc(100% - ' + (40*zoomLevel) + 'px)' : ''">
        </div>
        @if(!splitScreenEnabled){
        <div [matTooltip]="'rt.activeFeed.splitDualView' | translate"
            class="w-[45px] h-[45px] hover:scale-105 transition-all flex items-center shadow-lg justify-center absolute -top-14 right-5 z-30 rounded-full bg-[#FF5900] border-2 border-[#FEBA9C]"
            (click)="openSplitScreen()">
            <svg width="22" height="24" viewBox="0 0 22 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12.0008 1.50078C12.0008 1.31513 11.927 1.13708 11.7958 1.00581C11.6645 0.874531 11.4864 0.800781 11.3008 0.800781C11.1151 0.800781 10.9371 0.874531 10.8058 1.00581C10.6745 1.13708 10.6008 1.31513 10.6008 1.50078V22.5008C10.6008 22.6864 10.6745 22.8645 10.8058 22.9958C10.9371 23.127 11.1151 23.2008 11.3008 23.2008C11.4864 23.2008 11.6645 23.127 11.7958 22.9958C11.927 22.8645 12.0008 22.6864 12.0008 22.5008V1.50078ZM0.800781 6.40078C0.800781 5.65817 1.09578 4.94598 1.62088 4.42088C2.14598 3.89578 2.85818 3.60078 3.60078 3.60078H9.20078V20.4008H3.60078C2.85818 20.4008 2.14598 20.1058 1.62088 19.5807C1.09578 19.0556 0.800781 18.3434 0.800781 17.6008V6.40078ZM13.4008 20.4008H19.0008C19.7434 20.4008 20.4556 20.1058 20.9807 19.5807C21.5058 19.0556 21.8008 18.3434 21.8008 17.6008V6.40078C21.8008 5.65817 21.5058 4.94598 20.9807 4.42088C20.4556 3.89578 19.7434 3.60078 19.0008 3.60078H13.4008V20.4008Z"
                    fill="white" />
            </svg>
        </div>
        }

        <div class="w-full absolute h-4 shadow-div z-20" [style.marginLeft]="splitScreenEnabled ?40*zoomLevel+'px':''"
            [style.width]="splitScreenEnabled ? 'calc(100% - ' + (40*zoomLevel) + 'px)' : ''"></div>

        <div class="flex w-full">

            <div class="bg-white w-full" [style.paddingLeft]="40*zoomLevel+'px'"
                [style.paddingRight]="40*zoomLevel+'px'">
                <div class="w-[65px] min-h-[32px] bg-[#ffaa89]" [style.width]="(65*zoomLevel)+'px'">
                </div>
            </div>

            <div class="text-xs flex items-center sticky z-30 right-0 whitespace-nowrap  px-3 h-8 top-2 gap-5 py-2 bg-[#FF5900] w-fit text-white">
                @if(activePage){
                {{ 'rt.activeFeed.page' | translate }} {{activePage}}
                }
                <icon name="close" (click)="closeActiveFeed()"></icon>
            </div>

        </div>


    </div>
    <div class="w-full bg-white h-full px-10" [style.zoom]="zoomLevel">
        @if(activePage){
        @for(line of activePageData;track checkTrackBy(line,$index) ){
        <feed-line [showTimestamp]="showTimestamp" [isActiveFeed]="true" [line]="line.item" [lineIndex]="line.index + 1"
            [pageno]="activePage" />
        <!-- <app-feed-line [highlightmode]="highlightmode" (lineSelect)="onLineSelect($event)" [line]="line" [spaceBarOptions]="spaceBarOptions" 
    [lineIndex]="lineIndex + 1" [pageno]="pageno" [showTimestamp]="showTimestamp" [annots]="line?.annots"  [nEditid]="nEditid" (onTabEvent)="OnTabEvent($event)"
    [mode]="mode">
  </app-feed-line> -->
        }
        }
    </div>
</div>
}
