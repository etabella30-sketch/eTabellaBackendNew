

@if(visible){
<div class="flex items-stretch line relative text-[15px]" #linediv [attr.timestamp]="line.time" [attr.lno]="lineIndex"
  [attr.pno]="pageno" [attr.oPage]="line.oPage" [attr.identity]="line.unicid" [attr.oLine]="line.oLine"
  [attr.data-identity]="line.unicid" [attr.data-page]="pageno" [attr.data-line]="lineIndex"
  [attr.data-hid]="line.nHid" [attr.data-time]="line.time" [attr.data-opage]="line.oPage" [attr.data-oline]="line.oLine"
  [class.ishighlight]="line.nHid" [ngStyle]="{'--highlightcolor':qMarkColor }">
  <div
    class="inline-flex justify-end  text-[15px]  me-3 line-number  text-end !font-normal select-none lefttxt  relative z-20 highlightermode"
    (click)="highlightLine()">
    <div class="flex items-center justify-end" [ngClass]="isActiveFeed ? '!bg-[#ffaa89]' : 'bg-reply'">
    <input [class]="showTimestamp?'w-20':'w-[65px]'" [class]="isActiveFeed?'!bg-[#ffaa89]':''"
      [value]="lineIndex==1||showTimestamp ? pageno+'.'+lineIndex :  lineIndex" readonly
      class="bg-reply px-[6px] w-[65px] line-number inline text-end justify-end   !select-none !pointer-events-none user-select-none"
      style="letter-spacing: -0.3px;">
    </div>
    @if(showTimestamp){
    <div class="flex items-center justify-end">
    <input [value]="line.time | timestamp" readonly
      class="timestamp whitespace-nowrap  px-[6px] w-[75px] user-select-none overflow-hidden !text-xs select-none focus:outline-none pointer-events-none inline"
      style="letter-spacing: -0.3px;">
    </div>
    }
  </div>

  <div
    [ngClass]="{'w-[calc(100%_-_68px)]': !showTimestamp,'w-[calc(100%_-_174px)]': showTimestamp,'parenthetical': line.formate == 'PRNTH'}"
    class="line-text text-start block relative  pointer-events-auto   text-[15px] !select-text !cursor-text leading-6 "
    [class.isbold]="line.formate == 'QES' || line.formate == 'QES-CONTINUE' || line.isBold">
    <pre class="relative z-10 block whitespace-pre-wrap leading-6 m-0 p-0" [style.user-select]="'text'"  (click)="clickOnTabs($event)" (mouseover)="onHoverHyperlink($event)"
      [innerHTML]="(line.lines.join(' ')).trim() | highlight: searchService.highlightTerm: searchService.getCurrentMatchPosition(): searchService.isCurrentMatch(lineIndex, pageno): searchService.iswholeWord:line.links: fds.demoStream">
    </pre>
  </div>
</div>
}
