<svg class="annotation-layer overflow-visible -translate-y-px" width="100%" height="100%">
  @for(annotation of qFacts;track $index){
  <g class="mix-blend-lighten">
    @for (r of annotation.jCordinates; track $index) {

    @if (r.type === 'D') {
    <line class="opacity-80 pointer-events-none" [attr.x1]="r.x" [attr.y1]="r.y"
      [attr.x2]="r.x2" [attr.y2]="r.y2 ?? r.y"
      [attr.stroke-width]="1" stroke-linecap="round" stroke="#0066FF" stroke-dasharray="6,2">
    </line>
    } @else {
    <rect class="opacity-80 pointer-events-none" [attr.x]="r.x" [attr.y]="r.y"
      [attr.width]="r.width" [attr.height]="r.height"
      [ngStyle]="{ fill: annotation.color }" fill="#7DBAFF">
    </rect>
    }
    }

    @if(!annotation?.isTemp && !annotation?.isRefense){
    <foreignObject class="w-[calc(100%_+_44px)]  pointer-events-none peer/icon" [id]="'annot-' + annotation?.id"
      [attr.y]="annotation.iconY" [attr.height]="annotation.iconHeight">
      <annot-icon [isActive]="false" [type]="annotation.cType" [color]="annotation.color" [id]="annotation.id"
        (iconClickEvent)="iconClickEvent(annotation)" init (init)="onIconLoaded(annotation)" />
    </foreignObject>

    }

  </g>
  }

</svg>
