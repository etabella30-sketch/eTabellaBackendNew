<div class="grid grid-cols-2 gap-2.5 rounded-base h-full overflow-auto">
  @for(x of teamUsersList;track x.nTeamid){ @if(x?.users?.length){
  <div class="bg-white p-5">
    <div class="flex justify-between border-b mb-2.5 pb-2.5">
      <span class="text-sm font-semibold">{{ x.cTeamname }}</span>
      <mat-checkbox [(ngModel)]="x.isChecked" (change)="checkAll(x)">{{
        x.isChecked ? "Deselect all" : "Select all"
      }}</mat-checkbox>
    </div>
    @if(x.users?.length){
    <div class="flex flex-col gap-2.5">
      @for(y of x.users;track y.nUserid){
      <div class="flex justify-between text-xs h-6 items-center">
        {{ y.cFname }} {{ y.cLname }}
        <mat-checkbox
          [(ngModel)]="y.isChecked"
          type="checkbox"
          (change)="onUserSelect(y, x)"
        ></mat-checkbox>
      </div>
      }
    </div>
    }
  </div>
  } }
</div>
