<div class="h-full bg-[#f6f6f6] flex flex-col overflow-hidden">

    <div class="text-lg bg-white  text-dark-blue whitespace-nowrap min-h-20 flex  items-center gap-6 px-10 ">
        <img class="w-15" src="assets/present/public.png">
        <h6>
            Step 1: Presentation Set Up
        </h6>
        <btn class="ms-auto" [disabled]="!selectedUser?.length || !cName" (click)="ChooseFile()">

            Next: Choose {{ type =='W' ? 'Witness' : 'File' }}

        </btn>
    </div>
    <div class="flex p-10 h-[calc(100%_-_80px)] gap-6">
        <div class="w-full h-full flex flex-col gap-2.5 pe-2.5 ">
            <div class="w-1/2">
                <span class="text-xs font-semibold">
                    Name of Presentation: <span class="text-red-500">*</span>
                </span>
                <input type="text" [(ngModel)]="cName" placeholder="Name of Presentation">
            </div>
            <span class="text-xs font-semibold">
                Choose viewer(s):
            </span>
            @if(presentData?.nCaseid){
            @defer (when presentData?.nCaseid) {
            <present-teamuser class="block h-[calc(100%_-_94px)]" [presentData]="presentData"
                [(selectedUser)]="selectedUser" />
            }@placeholder {
            }
            }
        </div>
        <hr class="h-full bg-tab w-px">
        @defer(when presentData?.nCaseid){
        <present-group [nCaseid]="nCaseid" [(cName)]="cName" [(selectedUser)]="selectedUser"
            [presentData]="presentData" />
        }@placeholder {

        }


    </div>



</div>
