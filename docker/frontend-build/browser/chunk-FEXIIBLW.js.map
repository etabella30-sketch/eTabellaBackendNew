<div class="action flex items-center gap-2">
    @if (x.cStatus == 'C') {
    <btn mode="outlined" (click)="downloadFile()" [isloading]="isDownloadLoading">
        <icon class="text-lg" type="extra" name="download"></icon>
        Download
    </btn>
    }
    @if (x.cStatus == 'F') {
    <btn mode="outlined" addcls="!text-red-500 hover:!bg-red-500 hover:!text-white" (click)="retryDownload()"
        [isloading]="isDownloadLoading">
        <!-- {{x.cStatus == 'F' ? 'Restart' : 'Retry'}}  -->
        Retry
        <icon name="retry" type="extra"></icon>
    </btn>
    }
    @if (x.cStatus == 'C' ||x.cStatus == 'F') {
    <!-- 
    <btn mode="outlined" (click)="deleteFile()" [isloading]="isDeleteLoading">
        <icon class="text-lg" type="extra" name="Delete"></icon>
        Delete
    </btn> -->
    <btn (click)="copy()" mode="outlined" [square]="true" class="ms-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-copy-icon lucide-copy">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
    </btn>

    <btn [matMenuTriggerFor]="deleteconf" class="opacity-0 group-hover:opacity-100" [square]="true" mode="text"
        [isloading]="isDeleteLoading">
        <icon class="text-lg" name="delete"></icon>
    </btn>



    <mat-menu #deleteconf="matMenu" class="!bg-black p-5  rounded-base" xPosition="before">
        <div>
            <h6 class="mb-6 min-w-64 text-white text-xs">Confirm Delete ?</h6>
            <div class="flex gap-2">
                <btn (click)="deleteFile()">
                    Delete</btn>
                <btn mode="dark">cancel</btn>
            </div>
        </div>
    </mat-menu>
    }
</div>
