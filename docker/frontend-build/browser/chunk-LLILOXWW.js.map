<div [ngClass]="{'me-5': presentDocType=='CF'||presentDocType=='C'}" #fileheader
  class="files-wrapper pe-2 relative min-w-fit" id="tableparent" [ngStyle]="{
  '--hasdesc': reqcols?.desc?.view?'2':'1',
  '--hasname': reqcols?.name?.view?'2':'1',
  '--bundle': reqcols?.bundle?.view?'65px':'0px',
  '--tab': reqcols?.tab?.view?'70px':'0px',
  '--links': reqcols.link?.view?'100px':'0px',
  '--link': reqcols.link?.view?'100px':'0px',
  '--relevence': reqcols?.relevence?.view?'65px':'0px',
  '--impact': reqcols?.impact?.view?'55px':'0px',
  '--pagination': reqcols?.page?.view?'55px':'0px',
  '--page': reqcols?.page?.view?'55px':'0px',
  '--exhibit': reqcols?.exhibit?.view?'120px':'0px',
  '--kind': reqcols?.kind?.view?'55px':'0px',
  '--doi': reqcols?.date?.view?'100px':'0px',
  '--extra': reqcols?.extra?.view?'20px':'0px'
  }">
  <header [ngClass]="{'': !reqcols?.extra?.view}"
    class="header sortheader w-full  rounded-full text-white px-3  [&>dl]:bg-grey [&>dl]:py-0.5 [&>dl]:text-xxs ">
    <dl class="gap-col   !bg-transparent" [class]="checkoutside?'!w-11 !min-w-11':'!w-8 !min-w-8'">
    </dl>

    <dl class="drag !bg-transparent" *ngIf="reqcols?.drag?.view" [ngStyle]="{'--drag': reqcols?.drag?.view?'':'0px'}">
    </dl>
    <dl class="order" *ngIf="reqcols?.order" [ngStyle]="{'--order': reqcols?.order?'':'0px'}">
      Order</dl>
    <dl class="input rounded-s-full justify-center"
      [ngStyle]="{'--checkbox': reqcols?.check?(isadmin?'40px':'10px'):(isadmin?'40px':'10px')}"></dl>

    <dl class="kind relative group flex items-center cursor-pointer" *ngIf="reqcols?.index?.view">
      {{SType =='W' ? 'ES': SType =='C' ? 'CS': 'Sr'}} No. </dl>
    <ng-container *ngFor="let column of reqcolKeys">
      <dl *ngIf="reqcols?.[column]?.view && reqcols?.[column]?.name"
        [class.last]="getVisibleColumns(reqcols?.[column]?.order)&&!isadmin"
        class="relative group flex items-center cursor-pointer" [ngClass]="reqcols?.[column]?.class"
        [ngStyle]="{'order':reqcols?.[column]?.order}">

        <span class="relative z-10 pointer-events-none"> {{reqcols?.[column]?.name}} </span>

        <ng-container *ngIf="isadmin && reqcols?.[column]?.isEdit; else sortableColumn">
          <ng-container *ngIf="reqcols?.[column]?.name =='Tab'; else manualEdit">
            <button type="button" [matMenuTriggerFor]="menu"
              class="bg-white z-20 text-blue-on rounded-base flex items-center justify-center h-4/5 w-4/5 m-auto absolute opacity-0 group-hover:opacity-100 cursor-pointer"
              aria-label="Edit column">
              <icon class="text-[8px]" name="add" />
            </button>

            <mat-menu #menu="matMenu" class="p-2.5">
              <button type="button" class="text-xs select-none"
                (click)="editCol(reqcols?.[column],'A')"
                (keydown.enter)="editCol(reqcols?.[column],'A')"
                (keydown.space)="$event.preventDefault(); editCol(reqcols?.[column],'A')">
                {{'Auto'}}
              </button>
              <span aria-hidden="true"> | </span>
              <button type="button" class="text-xs select-none"
                (click)="editCol(reqcols?.[column],'M')"
                (keydown.enter)="editCol(reqcols?.[column],'M')"
                (keydown.space)="$event.preventDefault(); editCol(reqcols?.[column],'M')">
                {{'Manual'}}
              </button>
            </mat-menu>
          </ng-container>

          <ng-template #manualEdit>
            <button type="button" (click)="editCol(reqcols?.[column],'M')"
              (keydown.enter)="editCol(reqcols?.[column],'M')"
              (keydown.space)="$event.preventDefault(); editCol(reqcols?.[column],'M')"
              class="bg-white z-20 text-blue-on rounded-base flex items-center justify-center h-4/5 w-4/5 m-auto absolute opacity-0 group-hover:opacity-100 cursor-pointer"
              aria-label="Edit column">
              <icon class="text-[8px]" name="add" />
            </button>
          </ng-template>
        </ng-container>

        <ng-template #sortableColumn>
          <ng-container *ngIf="reqcols?.[column]?.sortKey">
            <button type="button"
              (click)="sort_array(reqcols?.[column]?.sortKey,'flag1')"
              (keydown.enter)="sort_array(reqcols?.[column]?.sortKey,'flag1')"
              (keydown.space)="$event.preventDefault(); sort_array(reqcols?.[column]?.sortKey,'flag1')"
              class="bg-black items-center h-5/6 pe-2 absolute rounded-full w-full z-0 me-2 -translate-x-2 hidden group-hover:flex"
              aria-label="Sort">
              <icon class="text-[8px] ms-auto" name="sort" type="extra"></icon>
            </button>
          </ng-container>
        </ng-template>
      </dl>
    </ng-container>

    <dl class="extra rounded-e-full" *ngIf="reqcols?.extra?.view"
      [ngStyle]="{'--extra': reqcols?.extra?.view? '20px':'0px','order':reqcols?.extra?.order}">
    </dl>
  </header>
</div>
