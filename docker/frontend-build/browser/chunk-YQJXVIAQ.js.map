<div class="p-5 w-full flex gap-6 bg-white shadow-[0_3px_10px_#94949440] rounded-base cursor-pointer"
        [ngClass]="buttonClasses">
        <img src="./assets/icons/doc-icons/pdf.svg" *ngIf="detail?.cFiletype=='PDF'" class="thumbnail size-20">
        <img src="assets/icons/doc-icons/word.svg" *ngIf="detail?.cFiletype=='DOCX'" class="size-20">
        <img src="assets/icons/doc-icons/xlsx.png" width="80px" height="80px" *ngIf="detail?.cFiletype=='XL'"
                class="size-20">
        <img *ngIf="detail?.cFiletype=='MP3'" src="assets/icons/doc-icons/mp3.svg" class="size-20">
        <div class=" w-[calc(100%_-_100px)]">
                <h6 class="text-xs font-semibold  brak-word truncate w-full">{{detail?.cName || detail?.cFilename ||
                        ''}}</h6>
                <h6 class="text-xxs mt-1">[ {{detail?.cBundletag?detail?.cBundletag:'-'}} |
                        {{detail?.cTab?detail?.cTab:'-'}}
                        |{{detail?.cPage?detail?.cPage:'-'}}
                        ]
                </h6>
                <h6 class="text-xxs mt-1" *ngIf="detail?.cExhibitno">Exhibit No {{detail?.cExhibitno}}</h6>
        </div>
</div>
