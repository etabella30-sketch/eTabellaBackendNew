@if (hyperlinkService.hyperlinkList?.length) {
<div class="bg-grey flex flex-col  overflow-auto">
  <div class="flex items-center gap-2 px-5 py-2.5 text-white">
    <span class="text-base font-semibold">Hyperlinking ({{hyperlinkService.hyperlinkList?.length }} Files) </span>
    <icon class="text-xs ms-auto" (click)="closeHyperLink()" name="close" />
  </div>
  <!-- <div class="text-xs text-white my-2 px-5">
    Hyperlinking {{hyperlinkService.hyperlinkList?.length }} Files
  </div> -->
  <div class="px-5 overflow-auto max-h-[300px]">
    @for(x of hyperlinkService.hyperlinkList;track $index){
    <div class="flex items-center gap-4 text-white bg-grey py-2.5 border-t border-white/25 w-full first:border-t-0 ">
      <div class="text-[13px] w-full font-semibold justify-between  flex items-center">
        Hyperlinking <div class="ms-auto w-fit">
          {{x.nCompleted}} /
          <span class="text-white">
            {{x.nTotal}} Completed</span>
          @if (x.nFailed) {
          <span class="text-sred ms-3">{{x.nFailed}}
            Failed </span>
          }
        </div>
      </div>
    </div>
    }
  </div>
</div>
}
