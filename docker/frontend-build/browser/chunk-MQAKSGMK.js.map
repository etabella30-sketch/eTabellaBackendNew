<div class="pop-container p-10">
  <div mat-dialog-content class="mb-6">
    <p class="m-0 font-semibold text-lg mb-2.5"> Download Batch File Section</p>

    <btn mode="outlined" (click)="isSepcomponent = true" [matMenuTriggerFor]="menuRef">
      Choose a folder
      <icon name="chvx" />
    </btn>

    <mat-menu #menuRef="matMenu" id="menuRef" class="h-fit w-[300px]" (closed)="onMenuClosed()">
      @defer{
      <folders #folderCom (click)="$event.stopPropagation();" [menuTrigger]="menuTrigger"
        (changeFolder)="changeFolder($event)" [nSectionid]="activeSection?.nSectionid ? activeSection?.nSectionid : null"
        [selectedIDs]="selectedIDs" [nCaseid]="nCaseid" [isadmin]="true" [isSepcomponent]="isSepcomponent"
        class="h-100">
      </folders>
      }

      @placeholder (minimum 1.1s) {
      <h6 class="text-xs text-center my-12">loading</h6>
      }
    </mat-menu>


    @if (selectedbatchfolder.length) {
    <div class="flex bg-black/30 rounded-xl gap-2.5 p-2.5 max-w-[810px] flex-wrap mt-3">
      <div class="text-sm font-medium flex items-center p-2 px-3 bg-white rounded-xl gap-3 "
        *ngFor="let f of selectedbatchfolder;let fi = index">
        <span *ngFor="let item of f.bundle;let ind = index" class="flex items-center gap-2">
          {{item}} {{ind < (f.bundle.length-1) ? '>' :''}} <span class="flex"
            (click)="removeFolder(selectedbatchfolder,fi)">
            <icon class="text-lg" name="backspace" type="extra" />
        </span>
        </span>
      </div>
    </div>
    }
    <hr class="my-4">
    <div class="mb-2">
      <inpt [showlabel]="true" [isrequired]="true" labelclas="font-medium" type="text"
        placeholder="Case Name_Batch_File" [(value)]="cFilename">
        File name
      </inpt>
      <!-- <input type="text" class="main-input" [(ngModel)]="cFilename" placeholder="Case Name_Batch_File"> -->
    </div>
  </div>

  <h6 class="text-xs mb-2">Index table column titles <span class="!font-normal">(Drag to reposition)</span></h6>
  <div cdkDropList cdkDropListOrientation="horizontal" class="example-list w-fit" (cdkDropListDropped)="drop($event)">
    <div class="bg-gray-100 flex items-center justify-center ">
      <div class="items-center space-x-1 group bg-neutral-800 text-white p-2.5 border-e border-white"
        *ngFor="let timePeriod of timePeriods;let ind=index" cdkDrag
        [ngClass]="{'!bg-neutral-400': !timePeriod.isShow}">
        <!-- [ngClass]="timePeriod.isShow ? 'flex' : 'hidden'" -->
        <div class="flex gap-2 items-center" ngclas>
          <input type="text"
            class="bg-transparent p-2.5 text-center text-xs  rounded-base border border-white focus:outline-none"
            (click)="!timePeriod.isedit=true" [ngClass]="{' bg-white text-grey': timePeriod.isedit}"
            [(ngModel)]="timePeriod.key" [readonly]="!timePeriod.isedit" [ngStyle]="{'width':timePeriod.dwidth +'px'}"
            (keyup.enter)="timePeriod.isedit = false" (focusout)="timePeriod.isedit = false">

          <!-- <h6 *ngIf="!timePeriod.isedit" class="text-xs  m-0 text-nowrap">{{timePeriod.key}}</h6> -->

          <!-- <icon *ngIf="!timePeriod.isedit" name="edit" class="text-blue  hover:text-black ms-auto"
                        (click)="timePeriod.isedit = true">
                    </icon> -->
          <icon *ngIf="!timePeriod.isShow" name="eye" class="text-lg opacity-0 group-hover:opacity-100"
            [ngClass]="{'!block': timePeriod.isedit}" (click)="timePeriod.isShow = true">
          </icon>
          <icon [ngClass]="{'!block': timePeriod.isedit}" *ngIf="timePeriod.isShow" name="eyeoff"
            class="text-lg opacity-0 group-hover:opacity-100" (click)="timePeriod.isShow = false">
          </icon>
        </div>
      </div>

      <!-- <div class="example-box px-5 bg-neutral-800 h-15">
                <div class="flex items-center h-full">
                    <icon name="addfill" [matMenuTriggerFor]="menu" class="text-base text-white ms-auto"></icon>
                    <mat-menu #menu="matMenu" class="p-2.5" yPosition="below">
                        @for(x of tablecols; track x){
                        <div class="mb-2 cursor-pointer group gap-3 shadow-none flex items-center px-2.5 py-2 rounded-base last:mb-0 "
                            mode="white" (click)="changeTabcols(x);$event.stopPropagation()"
                            [ngClass]="{'bg-blue-on !text-white' :x.isshow ,'hover:bg-blue-deactivate':!x.isshow}">
                            <icon class="group-hover:opacity-100 opacity-0 " *ngIf="!x.isshow" name="addcircle"
                                type="comnicn" />
                            <icon name="removecircle" type="comnicn" *ngIf="x.isshow && !checkId(x, false)" />
                            <span class="text-xs select-none"> {{x.name}}
                            </span>
                        </div>
                        }
                    </mat-menu>
                </div>
            </div> -->

    </div>
    <hr class="mb-4 mt-6">
    <span class="text-xs mb-2" *ngIf="process">{{responceMsg}}</span>
    <span *ngIf="isFailed" class="text-red-500 text-xs mb-2">{{responceMsg}}</span>
    <div class="flex mt-5 gap-2.5">
        <btn [ngClass]="{'pointer-events-none': !cFilename||process}" [disabled]="!cFilename" (click)="downloadBfile()"
            [isloading]="process">{{cFilename}}.xlsx</btn>
        <btn mode="white" (click)="close()">Cancel</btn>
    </div>
</div>
