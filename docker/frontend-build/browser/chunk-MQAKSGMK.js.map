<div class="pop-container p-10">
    <div mat-dialog-content class="mb-6">
        <p class="m-0 font-semibold text-lg mb-1">Generate Bundle Index</p>
        <div class="flex gap-3 items-center mt-2.5 w-100">
            <!-- <input class="main-input w-230" [value]="activesaction.cFolder" placeholder="Enter bundle name" type="text"
                id="newbundleid"> -->
            <inpt [showlabel]="false" id="casename" type="text" (valueChange)="cFilename = $event"
                [value]="'Master Index'" class="w-60" placeholder="Case Name" [focus]="true">
                <!-- (valueChange)="caseForm.controls['cCasename'].setValue($event)" -->
            </inpt>

            <label for="email" class="text-xs flex gap-2 mb-0 whitespace-nowrap leading-normal">
                <mat-checkbox [(ngModel)]="isCoverpg"></mat-checkbox>
                Include Cover Page
            </label>
            <label for="email" class="text-xs flex gap-2 mb-0 whitespace-nowrap leading-normal">
                <mat-checkbox [(ngModel)]="isIndexpg"></mat-checkbox>
                Include Cover Page 2
            </label>
        </div>
        <div class="flex gap-2.5 items-center mt-6">
            <mat-checkbox [checked]="cHyperlinktype ==='E'" (change)="cHyperlinktype = 'E'"> By Exhibit
                no</mat-checkbox>
            <mat-checkbox [checked]="cHyperlinktype ==='T'" (change)="cHyperlinktype = 'T'"> By Tab</mat-checkbox>
        </div>

    </div>

    <hr class="mb-6 mt-4">
    <h6 class="text-xs mb-2">Index table column titles <span class="!font-normal">(Drag to reposition)</span></h6>
    <div cdkDropList cdkDropListOrientation="horizontal" class="example-list w-fit" (cdkDropListDropped)="drop($event)">
        <div class="bg-gray-100 flex items-center justify-center ">
            <div class="items-center space-x-1 group bg-neutral-800 text-white p-2.5 border-e border-white"
                *ngFor="let timePeriod of timePeriods;let ind=index" cdkDrag
                [ngClass]="{'!bg-neutral-400': !timePeriod.isShow}">
                <!-- [ngClass]="timePeriod.isShow ? 'flex' : 'hidden'" -->
                <div class="flex gap-2 items-center" ngclas>
                    <input type="text"
                        class="bg-transparent p-2.5 text-center text-xs  rounded-base border border-white focus:outline-none"
                        (click)="!timePeriod.isedit=true" [ngClass]="{' bg-white text-grey': timePeriod.isedit}"
                        [(ngModel)]="timePeriod.key" [readonly]="!timePeriod.isedit"
                        [ngStyle]="{'width':timePeriod.dwidth +'px'}" (keyup.enter)="timePeriod.isedit = false"
                        (focusout)="timePeriod.isedit = false">

                    <!-- <h6 *ngIf="!timePeriod.isedit" class="text-xs  m-0 text-nowrap">{{timePeriod.key}}</h6> -->

                    <!-- <icon *ngIf="!timePeriod.isedit" name="edit" class="text-blue  hover:text-black ms-auto"
                        (click)="timePeriod.isedit = true">
                    </icon> -->
                    <icon *ngIf="!timePeriod.isShow" name="eye" class="text-lg opacity-0 group-hover:opacity-100"
                        [ngClass]="{'!block': timePeriod.isedit}" (click)="timePeriod.isShow = true">
                    </icon>
                    <icon [ngClass]="{'!block': timePeriod.isedit}" *ngIf="timePeriod.isShow" name="eyeoff"
                        class="text-lg opacity-0 group-hover:opacity-100" (click)="timePeriod.isShow = false">
                    </icon>
                </div>
            </div>

            <div class="example-box px-5 bg-neutral-800 h-[58px]">
                <div class="flex items-center h-full">
                    <icon name="addfill" [matMenuTriggerFor]="menu" class="text-base text-white ms-auto"></icon>
                    <mat-menu #menu="matMenu" class="p-2.5" yPosition="below">
                        @for(x of tablecols; track x){
                        <!-- (click)="changeTabcols(x);$event.stopPropagation()" -->
                        <div class="mb-2 cursor-pointer group gap-3 shadow-none flex items-center px-2.5 py-2 rounded-base last:mb-0 "
                            mode="white"
                            [ngClass]="{'bg-blue-on !text-white' :x.isshow ,'hover:bg-blue-deactivate':!x.isshow}">
                            <icon class="group-hover:opacity-100 opacity-0 " *ngIf="!x.isshow" name="addcircle"
                                type="comnicn" />
                            <!-- *ngIf="x.isshow && !checkId(x, false)" -->
                            <icon name="removecircle" type="comnicn" />
                            <span class="text-xs select-none"> {{x.name}}
                            </span>
                        </div>
                        }
                    </mat-menu>
                </div>
            </div>

        </div>
        <hr class="mb-4 mt-6">

        <h6 *ngIf="indexGeneration" class="text-xs mb-2">{{responceMsg}}</h6>
        <h6 *ngIf="isIndexFailed" class="text-red-500 text-xs">{{responceMsg}}</h6>
        <div class="flex mt-5 gap-2.5">
            <!-- @if(indexGeneration){ -->
            <btn (click)="geterateIndex();" [disabled]="indexGeneration" [isloading]="indexGeneration"
                [attr.isdisabled]="indexGeneration">
                {{indexGeneration?'Generating...':'Generate'}}
            </btn>
            <btn mode="white" (click)="close()">Cancel
            </btn>
        </div>
    </div>
</div>
