<div class="flex h-full w-full">
        <div class="bg-blue-100 py-10 h-full w-52 relative overflow-hidden">
                <img src="assets/login/background.webp"
                        class="absolute z-10 top-48 h-[130vh] object-cover mix-blend-multiply object-[-330px_0px]">
                <profile [isdark]="true" *ngIf="userdetail" [detail]="userdetail" size="xl"
                        class="mx-auto block relative w-fit z-20">
                </profile>
        </div>
        <div class="bg-dark-blue p-10 w-[calc(100%_-_208px)] ">
                <div class="flex items-center justify-between mb-4">
                        <h6 class="text-lg text-blue-hover">Admin Panel</h6>
                        <img class="cursor-pointer" src="assets/colorlogo.svg" (click)="goTodashboard()">
                </div>
                <div class="flex items-center">
                        <div class="flex items-center gap-3">
                                <span class="text-3xl font-semibold text-white">Active Cases</span>
                                <icon [matMenuTriggerFor]="options" class="text-white cursor-pointer" name="menu">
                                </icon>
                                <mat-menu #options="matMenu" class="!rounded-none w-fit !bg-dark-blue">
                                        <div mat-menu-item class="!p-3 hover:!bg-white/10" (click)="viewArchive()">
                                                <span class="text-xs  text-white">View archived cases</span>
                                        </div>
                                        <div mat-menu-item class="!p-3 hover:!bg-white/10" (click)="viewOCRQueue()">
                                                <span class="text-xs  text-white">OCR Queue</span>
                                        </div>
                                </mat-menu>
                                <div class="relative flex items-center cursor-pointer">
                                        <input placeholder="Search by case name & case no " type="text"
                                                [(ngModel)]="cSearch" (keyup)="getCaselist()"
                                                class="placeholder-shown:size-9 peer cursor-pointer focus:cursor-auto border-0  placeholder-shown:z-30 text-sm placeholder:text-sm placeholder-shown:bg-transparent focus:placeholder:text-blue-hover placeholder:text-black/0  focus:z-10  rounded-full  focus:outline-none focus:w-96 w-96 h-9  transition-all 
                                                focus:ps-8 ps-4  bg-white/100 focus:bg-white/100 focus:border-blue-700  focus:border-4">
                                        <icon name="search"
                                                class="absolute left-2.5 z-20 peer-focus:text-blue-hover cursor-pointer text-sm text-white" />
                                </div>
                        </div>
                        <btn mode="dark" class=" ms-auto" (click)="GoToNewCase()">
                                <icon name="add" class="text-xs font-light me-1"></icon> New Case
                        </btn>
                </div>
                <div class="flex">
                        <div *ngIf="reached!='S'"
                                class="fadestart relative -ml-10 left-10 z-20 h-[400px] w-28 bg-gradient-to-r from-dark-blue to-transparent">
                        </div>
                        <ng-scrollbar [visibility]="'hover'" [appearance]="'compact'" (reachedEnd)="onReachEnd()"
                                (reachedBottom)="onScroll('E',$event)" (scroll)="onScroll('',$event)">
                                <div class="flex items-center gap-6 overflow-auto pt-5 w-full">
                                        @defer (when caselist) {
                                        @for(x of caselist; track x.nCaseid) {
                                        <casecard [detail]="x" [isAdmin]="true" [ticketCount]="x.nTotaltickets"
                                                (caseChange)="chieldEmit($event,x)">
                                        </casecard>
                                        }
                                        }
                                        @if(loding){
                                        <div class="flex gap-6">
                                                @for (team of caselist.length ? [1,2] : [1,2,3,4,5,6]; track team) {
                                                <div
                                                        class="p-5 group rounded-base border relative border-white w-80 flex-col h-[357px]  bg-white  text-grey flex justify-center-center">
                                                        <sklton height="26px" width="200px" bg="base" class="mb-2">
                                                        </sklton>
                                                        <sklton height="10px" width="100px" bg="base"></sklton>
                                                        <div class=" flex flex-col gap-2.5 h-full overflow-auto mt-5">
                                                                @for (team of [1,2,3]; track team) {
                                                                <div>
                                                                        <!-- <span class="text-sm  font-semibold mb-2.5 block">{{team.cTeamname}}</span> -->
                                                                        <sklton bg="base" class="mb-3" height="10px"
                                                                                width="100px">
                                                                        </sklton>
                                                                        <div class="flex gap-2.5 flex-wrap mt-3">
                                                                                @for (user of [1,2,4]; track user) {
                                                                                <sklton bg="base" height="35px"
                                                                                        width="35px" [isavatar]="true">
                                                                                </sklton>
                                                                                }
                                                                        </div>
                                                                </div>}
                                                        </div>
                                                        <div class="flex gap-2">
                                                                <sklton height="30px" width="100px" bg="base"></sklton>
                                                                <sklton height="30px" width="30px" bg="base"
                                                                        class="ms-auto">
                                                                </sklton>
                                                                <sklton height="30px" width="30px" bg="base"></sklton>
                                                                <sklton height="30px" width="30px" bg="base"></sklton>
                                                        </div>
                                                </div>}
                                        </div>
                                        }
                                </div>
                        </ng-scrollbar>

                        <div *ngIf="reached!='E'&&caselist.length>4"
                                class="fadestart relative -mr-10 -left-10 z-20 h-[400px] w-28 bg-gradient-to-l from-dark-blue to-transparent">
                        </div>
                </div>
        </div>
</div>
