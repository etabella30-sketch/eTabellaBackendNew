<ng-container *ngIf="qmarkList?.length">
    <div *ngFor="let x of qmarkList; let index = index" class="link-line-bar" [id]="x.nHid" [attr.data-page]="x.nPage"
        (click)="scrollFeedToPage(x);historyInsert(x)">
        <nav-qfactcard class="group/qfactcard" [data]="x" [isQmark]="isQmark">
        </nav-qfactcard>
    </div>
</ng-container>
