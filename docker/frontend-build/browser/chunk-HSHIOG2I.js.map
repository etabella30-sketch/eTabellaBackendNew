<div *ngIf="!showsource" class="fixed flex flex-col justify-center items-center left-0 w-[calc(100%_-_520px)] bottom-0"
    [class]="isIndividual ? 'h-[calc(100vh-50px)]' : 'h-[calc(100vh-108px)]'">
    <div class="w-full h-full bg-black/70 absolute z-10">
    </div>

    <div class="w-[620px] flex justify-end z-20 mb-4 pe-2.5">
        <icon name="close" class="text-xs text-white" (click)="close()"></icon>
    </div>
    <div class="w-[620px] max-h-[75vh]  h-fit overflow-auto relative z-20  rounded-base p-10 bg-white">
        <!-- [class]="selectedTab=='L' ?'!w-fit rounded-none':''" -->

        <!-- @if(selectedTab!='L'){ -->



        <header *ngIf="detailViewMode!='S'&&detailViewMode!='M'"
            class="flex items-center text-xs font-semibold mb-1 gap-1">
            <span>
                {{detailViewMode=='C' ? ('NAV.VIEW_MODEL.CONTACTS' | translate) : detailViewMode=='T' ?
                ('NAV.VIEW_MODEL.TASKS' | translate) : ('NAV.VIEW_MODEL.SOURCE_TEXT' | translate) }}
            </span>
            <span *ngIf="detailViewMode=='C'"
                class="h-[18px] min-w-[18px] flex items-center justify-center w-fit bg-tab text-white rounded-full">
                {{selectedContacts.length}}
            </span>
        </header>

        <div class="overflow-auto max-h-[calc(75vh-100px)]">
            <ng-container *ngIf="detailViewMode">
                <ng-container *ngIf="detailViewMode=='S'">
                    <div *ngIf="isFullViewLoading" class="flex items-center justify-center h-full">
                        {{'COMMON.LOADING' | translate}}
                    </div>
                    <ng-container *ngIf="!isFullViewLoading">
                        <nav-share-permission [showBar]="true" [isDocLink]="true" [isView]="true" [userList]="userList"
                            [nUserid]="nUserid"></nav-share-permission>

                        <empty *ngIf="!userList" [head]="'NAV.VIEW_MODEL.NO_DATA' | translate"
                            class="block mb-2 h-[300px]"></empty>
                    </ng-container>
                </ng-container>
                <ng-container *ngIf="detailViewMode=='ST'">

                    <div>
                        <!-- @if(selectedTab=='L'){
                <div class="w-[378px] flex">
                    <img class="w-full mx-auto" src="../../../assets/sample.png">
                </div>
                }
                @else { -->

                        <div
                            class="border-4 border-tab min-h-28 max-h-[50vh]  rounded-base text-xs px-2.5 overflow-auto">
                            <div
                                class=" overflow-auto  text-xs py-3 border-t first:border-t-0 border-grey focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none">
                                <span *ngFor="let item of docData?.jOT" [innerHtml]="item">
                                </span>
                            </div>

                        </div>

                        <!-- } -->
                    </div>
                </ng-container>
            </ng-container>
        </div>
        <!-- } -->

        <!-- @if(selectedTab=='L'){
        <div>
            <img class="w-[300px] h-[500px] mx-auto" src="../../../assets/sample.png">
        </div>
        } -->

    </div>

</div>

<div *ngIf="showsource" class="fixed grid place-items-center top-0 left-0 w-full h-full mt-9 z-[1000]">
    <div class="absolute h-full w-full top-0 left-0 bg-black/75 z-10" (click)="deselect()"></div>

    <quick-preview [detail]="docData" [nCaseid]="nCaseid" [isOnSameTab]="true"
        (OnEvent)="OnQuickPreviewEvent($event)" />
</div>
