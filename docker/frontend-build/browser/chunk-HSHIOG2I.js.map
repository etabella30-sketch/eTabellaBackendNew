<div class="bg-white border  border-tab p-4 rounded-base mt-2.5">
    <div class="flex items-center space-x-3">
        <!-- Input Field -->
        <div class="flex-1 relative">
            <textarea type="text" [(ngModel)]="currentComment" placeholder="Comment (in Rich text)....."
                class="w-full border-none rounded-none !shadow-none focus:outline-none  focus:border-transparent text-xs resize-none"
                 (keydown.control.enter)="handleComment()"></textarea>

            <!-- Clear Button -->
            @if (currentComment.trim()) {
            <button (click)="clearBox()" class="absolute right-3 top-1/2 transform -translate-y-1/2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            }
        </div>

        <!-- Add Comment Button -->
        <btn (click)="handleComment()" [disabled]="!currentComment.trim() || isLoading" [isloading]="isLoading" >
            @if(editCommentItem?.nCid){
            Update
            } @else {
            Add
            }
            Comment
        </btn>
    </div>
</div>
