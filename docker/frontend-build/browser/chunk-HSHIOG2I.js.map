<ng-container *ngIf="factlist?.length">
    <div *ngFor="let x of factlist; let index = index"
        (click)="scrollFeedToPage(x);historyInsert(x);updateVisibleAnnotDetails(x)" class="link-line-bar" [id]="x.nFSid"
        [attr.data-page]="x.nPage">
        <!-- nUserid passed so nav-qfactcard hides the Convert / Edit /
             Delete action bar for non-owners (QFacts created by other
             team members are visible here via team sharing but the
             underlying SPs reject mutations from non-owners with a
             silent no-op). Same gate applied in navall. -->
        <nav-qfactcard class="group/qfactcard" [data]="x" [isQmark]="isQmark" (CardEvent)="CardEvent($event)"
            [cFFrom]="cFFrom" [nUserid]="nUserid" />
    </div>
</ng-container>
