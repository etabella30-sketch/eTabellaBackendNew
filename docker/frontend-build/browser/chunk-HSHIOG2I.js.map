<div class="flex flex-col h-full bg-reply">

    <issue-header [(headerType)]="headerType" [(enableDelete)]="enableDelete" [(enableSearch)]="enableSearch"
        [enableQFact]="enableQFact" (enableQFactChange)="onEnableQFactChange($event)"
        (headerEvents)="headerEvents($event)"
        [(selectedIssues)]="selectedIssues" [(enabledEdit)]="enabledEdit" [issuesLength]="issuesLength">
    </issue-header>

    @if(enableSearch){<app-nav-search-box></app-nav-search-box>}

    <div class="h-fit overflow-auto" [class.h-full]="headerType =='C' || headerType =='E'||headerType =='M'"
        [class.px-5]="headerType =='M'" [class.py-3]="headerType =='M'">
        @if(headerType == 'M') {

        @if(enableQFact){
        <!-- QFact-mode save callout. Sits inside the body (not the header)
             so the user reads the explanation before scrolling into the
             list. Tick / untick / drag changes are staged locally; this
             button flushes them to /issue/qfact/sequence and refreshes the
             LEFT QFact panel without closing the dialog. -->
        <div class="bg-white rounded-base p-3 mb-3 flex items-start gap-3 border border-blue-deactivate">
            <icon name="info" class="text-blue-on text-base mt-0.5"></icon>
            <div class="flex-1">
                <h6 class="text-sm font-semibold text-grey mb-0.5">Save your QFact selection & order</h6>
                <p class="text-xs text-grey">
                    Tick the issues you want visible on the QFact panel and drag to reorder. Click <strong>Save</strong> to apply your changes.
                </p>
            </div>
            <btn (click)="save()" mode="primary"
                addcls="!bg-blue-on !text-white hover:!bg-blue-hover px-4 h-8.5 text-xs font-semibold rounded-base">
                Save
            </btn>
        </div>
        }

        <issue-list [nUserid]=" nUserid" [nCaseid]="nCaseid" [(enableDelete)]="enableDelete"
            [(enabledEdit)]="enabledEdit" [enableQFact]="enableQFact" [isDrag]="true" [(nEditIssueid)]="nEditIssueid"
            [(headerType)]="headerType" [(userIssuePermission)]="userIssuePermission"
            [(selectedIssues)]="selectedIssues"
            (issuesLengthChange)="issuesLengthChange($event)"></issue-list>



        }@else if(headerType == 'C' || headerType == 'E'){
        <issue-create [nUserid]="nUserid" [nCaseid]="nCaseid" [(headerType)]="headerType"
            [(nEditIssueid)]="nEditIssueid" [(userIssuePermission)]="userIssuePermission" />
        }

    </div>
</div>
