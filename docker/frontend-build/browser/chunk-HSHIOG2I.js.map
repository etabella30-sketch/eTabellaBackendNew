<div class="w-full z-[999] pointer-events-auto">
        <div class="flex bg-blue-deactivate p-2.5 w-full">
                <div class="flex gap-0">
                        <div class="relative w-40">
                                <!-- Clear button -->
                                <icon *ngIf="searchTerm" name="close"
                                        class="absolute top-1/2 -translate-y-1/2 right-3 text-xxs cursor-pointer"
                                        (click)="clearsearch()">
                                </icon>

                                <!-- Input -->
                                <input [placeholder]="'rt.navSearchBox.placeholder' | translate" class="px-3.5 py-2 pe-9 rounded-base placeholder-shown:bg-white bg-faint block w-full 
                 focus:shadow-[0px_0px_6px_#0066FF] border shadow-sm focus:outline-none text-xs"
                                        [(ngModel)]="searchTerm" (keyup.enter)="search()" />
                        </div>

                        <!-- Whole word checkbox -->
                        <mat-checkbox [disabled]="!searchTerm" [(ngModel)]="wholeWord" class="ms-2 my-auto"
                                (change)="search()">
                                <span class="whitespace-nowrap">{{'rt.navSearchBox.wholeWord' | translate}}</span>
                        </mat-checkbox>
                </div>

                <!-- Matches + navigation -->
                <div class="px-3 ms-auto flex items-center gap-2.5" *ngIf="searchTerm">
                        <span class="text-xs whitespace-nowrap" *ngIf="totalMatches">
                                {{currentMatch}} {{'rt.navSearchBox.of' | translate}} {{totalMatches}} {{'rt.navSearchBox.matches' | translate}}
                        </span>

                        <btn mode="outlined" [square]="true" (click)="onPrevious()"
                                [disabled]="!totalMatches || currentMatch == 1">
                                <svg width="10" height="12" viewBox="0 0 10 12" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M1 0.75C0.818762 0.750008 0.643658 0.815643 0.50707 0.934767C0.370481 1.05389 0.281648 1.21845 0.257 1.398L0.25 1.5V10.5C0.250058 10.69 0.322244 10.8729 0.451972 11.0118C0.581701 11.1506 0.759299 11.2351 0.94888 11.248C1.13846 11.261 1.32589 11.2015 1.4733 11.0816C1.62071 10.9617 1.7171 10.7902 1.743 10.602L1.75 10.5V1.5C1.75 1.30109 1.67098 1.11032 1.53033 0.96967C1.38968 0.829018 1.19891 0.75 1 0.75ZM9.28 0.97C9.15301 0.842982 8.98466 0.765754 8.80555 0.752358C8.62644 0.738961 8.44847 0.790286 8.304 0.897L8.22 0.97L3.72 5.47C3.59298 5.59699 3.51575 5.76534 3.50236 5.94445C3.48896 6.12356 3.54029 6.30153 3.647 6.446L3.72 6.53L8.22 11.03C8.354 11.163 8.53321 11.2405 8.72186 11.2471C8.91051 11.2538 9.09473 11.189 9.23775 11.0658C9.38077 10.9426 9.47207 10.77 9.49344 10.5825C9.5148 10.3949 9.46465 10.2062 9.353 10.054L9.28 9.97L5.31 6L9.28 2.03C9.42045 1.88937 9.49934 1.69875 9.49934 1.5C9.49934 1.30125 9.42045 1.11063 9.28 0.97Z"
                                                fill="currentColor" />
                                </svg>
                        </btn>

                        <btn mode="outlined" [square]="true" (click)="onNext()"
                                [disabled]="!totalMatches || currentMatch == totalMatches">
                                <svg width="10" height="12" viewBox="0 0 10 12" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M8.75129 0.75C8.93253 0.750008 9.10763 0.815643 9.24422 0.934767C9.38081 1.05389 9.46964 1.21845 9.49429 1.398L9.50129 1.5V10.5C9.50124 10.69 9.42905 10.8729 9.29932 11.0118C9.16959 11.1506 8.99199 11.2351 8.80241 11.248C8.61283 11.261 8.4254 11.2015 8.27799 11.0816C8.13059 10.9617 8.03419 10.7902 8.00829 10.602L8.00129 10.5V1.5C8.00129 1.30109 8.08031 1.11032 8.22096 0.96967C8.36162 0.829018 8.55238 0.75 8.75129 0.75ZM0.471293 0.97C0.598281 0.842982 0.766636 0.765754 0.945745 0.752358C1.12485 0.738961 1.30282 0.790286 1.44729 0.897L1.53129 0.97L6.03129 5.47C6.15831 5.59699 6.23554 5.76534 6.24894 5.94445C6.26233 6.12356 6.21101 6.30153 6.10429 6.446L6.03129 6.53L1.53129 11.03C1.39729 11.163 1.21808 11.2405 1.02943 11.2471C0.840781 11.2538 0.656562 11.189 0.513542 11.0658C0.370521 10.9426 0.279218 10.77 0.257856 10.5825C0.236493 10.3949 0.286642 10.2062 0.398293 10.054L0.471293 9.97L4.44129 6L0.471293 2.03C0.330843 1.88937 0.251953 1.69875 0.251953 1.5C0.251953 1.30125 0.330843 1.11063 0.471293 0.97Z"
                                                fill="currentColor" />
                                </svg>
                        </btn>
                </div>
        </div>
</div>
