@if(visibleIssueModel){
<issue-manage class="block min-w-[520px] w-[520px]  h-full z-10" [nCaseid]="nCaseid"
    [visibleIssueModel]="visibleIssueModel" [visibleIssueModelChange]="visibleIssueModelChange" [nUserid]="nUserid"
    [(nEditIssueid)]="nEditIssueid" [hightlightMode]="hightlightMode" [initialQFactMode]="initialQFactMode" />
}

@if(['QF', 'F'].includes(hightlightMode) ){
<!-- Hidden (not removed) when the manage panel is open so the user's
     in-progress note / issue picks survive a round-trip through Manage
     Claims & Issues. Two 520px siblings rendering side-by-side would
     overflow the side-modal slot in double-page PDF mode. -->
<fact-creation [annotToolMode]="annotToolMode" class="block min-w-[520px] w-[520px]  h-full"
    [class.hidden]="visibleIssueModel"
    [hightlightMode]="hightlightMode" [nCaseid]="nCaseid" [visibleIssueModel]="visibleIssueModel"
    [visibleIssueModelChange]="visibleIssueModelChange" [nUserid]="nUserid" [headerType]="'F'"
    [(nEditIssueid)]="nEditIssueid" [nSesid]="nSesid" [(nEditFactid)]="nEditFactid"
    [hightlightModeChange]="hightlightModeChange" [nBundledetailid]="nBundledetailid" [cFFrom]="cFFrom"
    [annotGlobMode]="annotGlobMode" [selectedlinktype]="selectedlinktype" />
}

@if(hightlightMode == 'D'){
<doc-link-creation class="block min-w-[520px] w-[520px]  h-full" [hightlightMode]="hightlightMode" [nCaseid]="nCaseid"
    [nSesid]="nSesid" [nUserid]="nUserid" [hightlightModeChange]="hightlightModeChange"
    [nBundledetailid]="nBundledetailid" [cFFrom]="cFFrom" [annotGlobMode]="annotGlobMode"
    [selectedlinktype]="selectedlinktype" />
}


@if(visibleMarkNavModel){
<!-- [linkLinesChange]="linkLinesChange" [linkLines]="linkLines" -->
<marknav [isIndividual]="isIndividual" class="block min-w-[520px] w-[520px]  h-full z-10" [fullViewMode]="fullViewMode"
    [nCaseid]="nCaseid" [nSesid]="nSesid" [nUserid]="nUserid" [visibleMarkNavModel]="visibleMarkNavModel"
    [visibleMarkNavModelChange]="visibleMarkNavModelChange" [(nEditFactid)]="nEditFactid"
    [hightlightMode]="hightlightMode" [hightlightModeChange]="hightlightModeChange"
    [visibleAnnotDetails]="visibleAnnotDetails" [visibleAnnotDetailsChange]="visibleAnnotDetailsChange"
    [currentPage]="currentPage" [sideNavPanelLeft]="sideNavPanelLeft" [feedPanelLeft]="feedPanelLeft"
    [zoomLevel]="zoomLevel" [splitScreenEnabled]="splitScreenEnabled" [compareEnabled]="compareEnabled"
    [cFFrom]="cFFrom" [nBundledetailid]="nBundledetailid" [bIsTranscipt]="bIsTranscipt" [onEvent]="onEvent"
    [jExtraFilters]="jExtraFilters" [(jFilters)]="jFilters" (jFiltersChange)="jFiltersChange.emit($event)" />
}
