<div class="py-2.5">
    <div class="flex items-center ">
        <h6 class="text-xs font-bold">{{
            (cType == 'QF' ? 'FILTERS.QFACT_DETAIL' : 'FILTERS.QMARK_DETAIL') | translate }}</h6>
        <icon name="close" class="text-xs mx-3" (click)="removeFilter(cType)"></icon>
    </div>
        <ng-container *ngIf="cType == 'QF'">
            <div class="flex flex-wrap gap-2 mt-2">

                <contact-select clearOnSelect (activeContactsChange)="onActiveContactsChange($event)" [userList]="contactList"></contact-select>

                <ng-container *ngFor="let x of selectedContact; let i = index; trackBy: trackByIndex">
                    <btn mode="white">
                        <avtr size="sm" [detail]="x"></avtr>
                        <span class="text-xs">{{ x.cFname }} {{ x.cLname }}</span>
                        <icon name="backspace" (click)="onRemoveContact(x)" type="extra" class="text-sm"></icon>
                    </btn>
                </ng-container>
            </div>
        </ng-container>
    <div class="flex items-center gap-2.5 mt-2">
        <ng-select [clearable]="false" [(ngModel)]="selecteddatetype" appendTo="body" [items]="qfactdatetype"
            bindLabel="cKey" bindValue="nValue" [placeholder]="'FILTERS.CHOOSE_RELEVANCE' | translate"
            class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden">
            <ng-template ng-label-tmp let-item="item">
                {{item.cKey | translate}}
            </ng-template>
            <ng-template ng-option-tmp let-item="item" let-index="index">
                <b class="text-xs font-normal">{{item.cKey | translate}}</b>
            </ng-template>
        </ng-select>
        <datepicker [isRange]="selecteddatetype==2" (dateChange)="handleDateChange($event)" [type]="''" />
    </div>
</div>
