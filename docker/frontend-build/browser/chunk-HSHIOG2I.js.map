<header class="flex flex-col justify-center px-5 py-2.5 w-full bg-blue-on">
    <div class="flex gap-2.5 items-center  max-md:flex-wrap">

        @if(currentStep == 1){
        @if(hightlightMode == 'QF'){
        <icon class="text-white text-xl" name="Qfact" type="extra" />
        }
        @else {
        <icon class="text-white text-lg" name="fact" type="indicn" />
        }

        <h2 class="flex-1 self-stretch my-auto text-lg font-semibold tracking-tight text-white">
            {{ hightlightMode =='QF' ? ' qFact' : 'Full Fact' }}
        </h2>

        <btn mode="outlined" addcls="!bg-transparent text-white hover:!bg-white" (click)="openIssueManager()">
            {{issuesLength ? 'Manage Claims & Issues' :'+ Claims & Issues'}}
        </btn>

        }@else {
        <btn mode="outlined" (click)="back()" addcls="text-white bg-white/10 border-white/50 hover:!bg-white">
            <icon class="text-xs" name="chvy" />
            Back
        </btn>
        }

        <span class="h-8.5 flex items-center ms-auto" [matMenuTriggerFor]="closemenu">
            <icon name="close" class="ms-3 text-xs cursor-pointer text-white" />
        </span>
        <mat-menu #closemenu="matMenu" class="!bg-black p-5  !min-w-[370px]  !max-w-[370px] rounded-base"
            xPosition="before">
            <div>
                <h6 class="mb-0.5 min-w-64 text-white text-sm">Discard changes?</h6>
                <h6 class="mb-6 min-w-64 text-white text-xs whitespace-nowrap">If you close now, any unsaved
                    annotations will be lost.
                </h6>
                <div class="flex gap-2">
                    <btn mode="dark">Cancel</btn>
                    <btn (click)="close()">Discard </btn>
                </div>
            </div>
        </mat-menu>
    </div>
</header>
