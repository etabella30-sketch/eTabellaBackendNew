<ng-container *ngIf="factlist?.length">
    <ng-container *ngFor="let x of factlist; let index = index">
        <div *ngIf="x.cFType=='F' || selectedMode=='A'"
            class="bg-transparent mb-2 hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base  group-hover:opacity-50 hover:!opacity-100  cursor-pointer link-line-bar"
            [id]="x.nFSid" [attr.data-page]="x.nPage"
            (click)="scrollFeedToPage(x);historyInsert(x);updateVisibleAnnotDetails(x)">

            <!-- @defer(when factlist?.length) -->
            <factcard *ngIf="factlist?.length" class="block bg-black rounded-base" [nFSid]="nFSid" [type]="type"
                [data]="x" [issueList]="x.issueList" [filelinks]="x.linkfile" [nohover]="true" [userList]="userList"
                isnavigate [viewmode]="viewmode" (onCardEvent)="getCardEvent($event,x,index)"
                (OnView)="OnViewEvent($event)" [cFFrom]="cFFrom" />
            <!-- }@placeholder {
            <div></div>
            } -->

        </div>
    </ng-container>
</ng-container>
