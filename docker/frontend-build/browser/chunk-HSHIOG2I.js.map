<div class="flex gap-2 flex-col py-2.5">
    <div class="flex items-center justify-between">
        <h6 class="text-xs font-bold">{{ 'FILTERS.SHARING' | translate }}</h6>
        <icon name="close" class="text-xs" (click)="removeall('S')"></icon>
    </div>
    <mat-checkbox (change)="handleChange($event, 'M')">{{ 'FILTERS.MY_ITEMS' | translate }}</mat-checkbox>
    <mat-checkbox (change)="handleChange($event, 'O')">{{ 'FILTERS.SHARED_BY_OTHERS' | translate }}</mat-checkbox>
</div>
