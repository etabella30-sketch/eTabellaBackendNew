<ng-container *ngFor="let company of companylist; let index = index">

    <div class="p-5 rounded-base flex items-center text-white bg-black mb-2 cursor-pointer"
        (click)="getCompFactList(company)">
        <span class="text-xs font-semibold">{{company.cCompany}}
        </span>
        <icon name="chvx" type="comnicn" class=" ms-auto text-xxs" [class.rotate-180]="company.expand" />
    </div>

    <ng-container *ngIf="company.expand">
        <ng-container *ngFor="let x of company?.factlist; let subIndex = index">
            <!-- [attr.data-page]="x.nPage" -->
            <div class="bg-black  hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base mb-2 group-hover:opacity-50 hover:!opacity-100 cursor-pointer link-line-bar"
                [id]="x.nFSid" [attr.data-page]="x.nPage"
                (click)="scrollFeedToPage(x);historyInsert(x);updateVisibleAnnotDetails(x)">
                <!-- @defer(when company?.factlist?.length) -->
                <factcard *ngIf="company?.factlist?.length" [nFSid]="nFSid" [type]="type" [data]="x"
                    [issueList]="x.issueList" [filelinks]="x.filelinks" [nohover]="true" isnavigate iscontact
                    [userList]="userList" (onCardEvent)="getCardEvent($event,x,subIndex)" [viewmode]="viewmode"
                    (OnView)="OnViewEvent($event)" [cFFrom]="cFFrom" />
                <!-- }@placeholder {
            <div class="h-72 bg-black/50 animate-pulse"></div>
            } -->
            </div>
        </ng-container>
    </ng-container>
</ng-container>
