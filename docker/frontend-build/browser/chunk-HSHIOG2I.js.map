<ng-container *ngFor="let item of factlist; let index = index">
    <factcard class="block bg-black rounded-base" [data]="item" [issueList]="item.issueList" [filelinks]="item.linkfile"
        [nohover]="true" isnavigate [viewmode]="viewmode" (onCardEvent)="factCardEvent($event,item)"
        [cFFrom]="cFFrom" />
</ng-container>
