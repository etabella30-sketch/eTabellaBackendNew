<div class="bg-white rounded-base flex flex-col  divide-y gap-2 max-h-[calc(100%-40px)] overflow-auto"
    [class.px-2]="!isAll">


    <div class="py-2.5">
        <!-- <div class="flex flex-col gap-2.5" [class.flex-col]="tabmode != 'AL'">
            @if(tabmode=='DL' || tabmode=='AL'){
            <mat-checkbox>Outgoing Link</mat-checkbox>
            }
            <mat-checkbox>Incoming Link</mat-checkbox>
            @if(tabmode=='FL' || tabmode=='AL'){
            <mat-checkbox>Note</mat-checkbox>
            }
        </div> -->
        <!-- 
        <div class="flex gap-2 mt-2">

            <contact-select></contact-select>
            @for (x of selectedIssues; track $index) {
            <btn mode="white">
                <span class="text-xs">
                    {{x.cIName}}
                </span>
                <icon name="backspace" type="extra" class="text-sm"></icon>
            </btn>
            }
        </div> -->

        <div class="flex flex-wrap gap-2 mt-2">
            <contact-select clearOnSelect class="block w-[264px]"
                (activeContactsChange)="onActiveContactsChange($event)" [userList]="userList"></contact-select>

                        <ng-container *ngFor="let x of selectedContact; let i = index; trackBy: trackByIndex">
                            <btn mode="white">
                                <avtr size="sm" [detail]="x"></avtr>
                                <span class="text-xs">{{ x.cFname }} {{ x.cLname }}</span>
                                <icon name="backspace" type="extra" class="text-sm" (click)="onRemoveContact(x)"></icon>
                            </btn>
                        </ng-container>
        </div>
        <!-- <div class="flex items-center gap-2.5 mt-2">
            <ng-select [clearable]="false" [(ngModel)]="selecteddatetype" appendTo="body" [items]="qfactdatetype"
                bindLabel="cKey" bindValue="nValue" placeholder="Choose relevance..."
                class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden">
                <ng-template ng-option-tmp let-item="item" let-index="index">
                    <b class="text-xs font-normal">{{item.cKey}}</b>
                </ng-template>
            </ng-select>
            <btn square mode="outlined">
                <datepicker></datepicker>
            </btn>
        </div> -->

        <div class="flex items-center gap-2.5 my-2">
            <ng-select [clearable]="false" [(ngModel)]="selecteddatetype" appendTo="body" [items]="qfactdatetype"
                [(ngModel)]="resetSelect" bindLabel="cKey" bindValue="nValue" placeholder="{{ 'FILTERS.CHOOSE_RELEVANCE' | translate }}"
                class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                <ng-template ng-option-tmp let-item="item" let-index="index">
                    <b class="text-xs font-normal">{{item.cKey}}</b>
                </ng-template>
            </ng-select>
            <btn square mode="outlined">
                <datepicker [isRange]="selecteddatetype==2" (dateChange)="handleDateChange($event)">
                </datepicker>
            </btn>
        </div>

                <ng-container *ngIf="!isAll">
                    <div class="flex gap-2 flex-col">
                        <h6 class="text-sm font-bold mt-2">{{ 'FILTERS.SHARING' | translate }}</h6>
                        <mat-checkbox>{{ 'FILTERS.MY_ITEMS' | translate }}</mat-checkbox>
                        <mat-checkbox>{{ 'FILTERS.SHARED_BY_OTHERS' | translate }}</mat-checkbox>
                    </div>
                </ng-container>
    </div>

</div>
