<div class="w-[680px] max-w-[680px] ms-auto  h-full p-5 ">
    <header>
        <span class="text-lg  flex gap-3 items-center mb-3 text-white">
            <span class="font-semibold">

                {{selectedTab == 'A' ? 'All Filter' : selectedTab == 'F' ? 'Fact Filter' :
                selectedTab == 'L' ? 'Link Filter' : 'Choose Filter' }}
            </span>

            <btn #menuTrigger="matMenuTrigger" mode="white" class="" addcls="hover:!bg-white" [matMenuTriggerFor]="menu"
                 (keydown.enter)="menuTrigger.openMenu()" (keydown.space)="$event.preventDefault(); menuTrigger.openMenu()">
                {{ selectedFilters.length ? '+ Filter Group' : 'Choose Filter Group' }}
            </btn>

            <mat-menu #menu="matMenu" class="mt-1 !min-w-[156px] !max-w-[156px] p-2.5">
                <div class="flex flex-col gap-2f">
                    <ng-container *ngFor="let x of filters; index as i">
                        <ng-container *ngIf="x.allowedTabs?.includes(tab)">
                            <div role="button" tabindex="0" (click)="addfilter(x)" (keydown.enter)="addfilter(x)" (keydown.space)="$event.preventDefault(); addfilter(x)"
                                class="hover:bg-reply group relative p-2 px-5  text-xs flex items-center cursor-pointer rounded-base">
                                {{ x.name }}
                                <icon *ngIf="selectedFilters.includes(x.value)" class="ms-auto absolute right-5" name="addfill"></icon>
                            </div>
                        </ng-container>
                    </ng-container>
                </div>
            </mat-menu>


            <btn mode="white" (click)="cancelFilter()" class="" addcls="hover:!bg-white">
                Cancel
            </btn>

            <btn mode="white" (click)="saveFilter(true)" class="" addcls="hover:!bg-white">
                Save
            </btn>

            <btn mode="white" class="" addcls="hover:!bg-white"
                [class]="selectedFilters.length ?'':'opacity-50 pointer-events-none'" (click)="clearAllFilter()">Clear
                All
                Filter</btn>
        </span>
    </header>

    <div *ngIf="selectedFilters.length" class="bg-white px-2.5 rounded-base flex flex-col  divide-y gap-2 max-h-[calc(100%-40px)] overflow-auto">

        <claims *ngIf="selectedFilters.includes(FILTER_ITEM.CL)" (onClear)="saveFilter(false)" [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jClaims)]="jClaims"></claims>

        <issues *ngIf="selectedFilters.includes(FILTER_ITEM.I)" (onClear)="saveFilter(false)" [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jIssues)]="jIssues" [(jRels)]="jRels" [(jImps)]="jImps" [(IsNote)]="IsNote" [(IsFactlink)]="IsFactlink" [(IsComment)]="IsComment" [tab]="tab"></issues>

        <factdetailfilter *ngIf="selectedFilters.includes(FILTER_ITEM.FD)" (onClear)="saveFilter(false)" [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jDate)]="jDate" [(jFiletypes)]="jFiletypes" [(jLevels)]="jLevels" [(jFilters)]="jFilters" [(jStatus)]="jStatus" [(createDate)]="createDate" [(createBy)]="createBy"></factdetailfilter>

        <factcontactfilter *ngIf="selectedFilters.includes(FILTER_ITEM.C)" (onClear)="saveFilter(false)" [nCaseid]="nCaseid" [contactFilter]="contactFilter" [nUserid]="nUserid" [(jContacts)]="jContacts" [(jCRoles)]="jCRoles" [(jCPartys)]="jCPartys" [(jCCompanies)]="jCCompanies" [(IsContactNote)]="IsContactNote" [selectedFilters]="selectedFilters"></factcontactfilter>

        <facttaskfilter *ngIf="selectedFilters.includes(FILTER_ITEM.T)" (onClear)="saveFilter(false)" [nCaseid]="nCaseid" [nUserid]="nUserid" [(jTasks)]="jTasks" [(IsTaskDesc)]="IsTaskDesc" [(jTShared)]="jTShared" [(jTStatus)]="jTStatus" [(jTPriority)]="jTPriority" [(dTDate)]="dTDate" [selectedFilters]="selectedFilters"></facttaskfilter>

        <qfactdetailfilter *ngIf="selectedFilters.includes(FILTER_ITEM.QF)" [nCaseid]="nCaseid" [nUserid]="nUserid" [(createDate)]="createDate" [(createBy)]="createBy" [selectedFilters]="selectedFilters" (onEmitData)="emitFilters()" [cType]="'QF'"></qfactdetailfilter>

        <linkfilter *ngIf="selectedFilters.includes(FILTER_ITEM.L)" [isAll]="true" tab="AL" [selectedFilters]="selectedFilters" [nCaseid]="nCaseid" [nUserid]="nUserid" (onEmitData)="emitFilters()"></linkfilter>

        <share-filter *ngIf="selectedFilters.includes(FILTER_ITEM.S)" [selectedFilters]="selectedFilters" [(IsCreateByMe)]="IsCreateByMe" [(IsShared)]="IsShared" (onEmitData)="emitFilters()"></share-filter>

        <qfactdetailfilter *ngIf="selectedFilters.includes(FILTER_ITEM.QM)" [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(createDate)]="createDate" [(createBy)]="createBy" (onEmitData)="emitFilters()" [cType]="'QM'"></qfactdetailfilter>
    </div>
</div>
