<div class="flex flex-col h-full bg-reply">
    <header class="py-2.5 px-5 bg-blue-on text-white flex items-center ">
        <icon name="doclink" type="indicn" />
        <span class="font-semibold ms-3">Doc Link</span>
        <btn (click)="addmore()" mode="white" class="ms-auto" addcls="!text-blue-on hover:bg-white">
            <icon name="addcircle" class="text-lg"></icon> Another File
        </btn>
        <icon name="close" class="text-xs mx-3" (click)="back()" />
    </header>
    <div class="px-5 flex flex-col gap-2.5 overflow-auto pt-5  p-5 h-full ">

        <h6 class="text-xs font-semibold">Destination Files</h6>

        <!-- @if (jFiles.length) { -->
        <div class="flex flex-col gap-2">
            @for (y of jFiles; track $index) {
            @defer(when jFiles.length>0){
            <source-card [deletebtnend]="true" gap="S" [truncate]="false" mode="light" [type]="y?.jLinktype?.type"
                [detail]="y" (cardevent)="OnFilesEvnets($event,$index)" />
            }@placeholder {
            Loading..
            }
            }

        </div>

        <teamshare [isDocLink]="true" title="Share" showbadge [userList]="userList"
            [adminPDisabled]="true" />

        <!-- <button
            class="p-3 bg-white rounded-base border focus-within:shadow-[0px_0px_6px_#0067ff] max-h-[140px] overflow-auto h-fit">
            <mat-form-field class="p-0 w-full !text-xs !border-0 !shadow-none !rounded-none">
                <textarea [(ngModel)]="cNote" maxlength="150" matInput #textnote rows="3" placeholder="Add note"
                    cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="1"
                    class=" block w-full px-3 py-2 border  rounded-base shadow-sm focus:outline-none !text-xs border-tab text-gray focus:shadow-[0px_0px_6px_#0066FF] focus:border-blue-deactivate "></textarea>
            </mat-form-field>
        </button> -->


        @if(jTexts?.length){
        @defer(when jTexts?.length){
        <fact-note [(isEmpty)]="isEmpty" [(jTexts)]="jTexts" [type]="'QF'" (jTextsChange)="textchange($event)"
            [isAddNote]="cPermission=='N'" [(isNoteEdited)]="isNoteEdited" [nCaseid]="nCaseid"
            (onEvent)="emitFactNote($event)" />
        }@placeholder {
        }
        }

        <!-- <span class="text-blue-on text-xxs mt-0.5">
            Type &#64; to search and link participants from the case contact list.
        </span> -->

        <btn (click)="submit()" [attr.isdisabled]="!jFiles.length" class="w-full mt-auto">

            @if(isSubmitted){
            <div class="flex items-center justify-center">
                <div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-blue-500"></div>
            </div>
            }@else{
            Create DocLink
            }

        </btn>
    </div>

</div>
