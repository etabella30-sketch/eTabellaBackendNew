<div *ngFor="let x of doclist; let index = index"
    class="group-hover:opacity-50 hover:!opacity-100 mb-3 last:mb-0 group/doccard link-line-bar" [id]="x.nDocid"
    [attr.data-page]="x.nPage" (click)="scrollFeedToPage(x);historyInsert(x);updateVisibleAnnotDetails(x)">
    <nav-doc-link-card [viewmode]="viewmode" (onCardEvent)="getCardEvent($event,x)" [x]="x" [cFFrom]="cFFrom"
        [nUserid]="nUserid" [nFSid]="nFSid" />
    <div *ngIf="x.nUserid == nUserid" class="hidden group-hover/doccard:flex pt-3">
        <div [matMenuTriggerFor]="deletemenu"
            class="flex items-center justify-start gap-2.5 border border-white px-2.5  rounded-base w-full text-xs h-8.5 cursor-pointer">
            <icon class="text-lg" name="removecircle"></icon>
            {{'ACTIONBAR.DELETE' | translate}}
        </div>

        <mat-menu #deletemenu="matMenu" class="!bg-black p-5  rounded-base" xPosition="before">
            <div>
                <h6 class="mb-6 min-w-64 text-white text-xs">{{'ACTIONBAR.CONFIRM_DELETE' | translate}}</h6>
                <div class="flex gap-2">
                    <btn (click)="deleteDocLink(x.nDocid)">{{'ACTIONBAR.DELETE' | translate}}</btn>
                    <btn mode="dark">{{'ACTIONBAR.CANCEL' | translate}}</btn>
                </div>
            </div>
        </mat-menu>
    </div>
</div>
