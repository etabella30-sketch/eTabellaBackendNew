<ng-container *ngIf="list?.length">
    <div *ngFor="let x of list; let index = index"
        class=" group-hover:opacity-50 hover:!opacity-100  cursor-pointer link-line-bar" [id]="x.id"
        [class.!opacity-100]="visibleAnnotDetails?.id && visibleAnnotDetails?.id == x.id"
        [class.!opacity-50]="visibleAnnotDetails?.id && visibleAnnotDetails?.id != x.id"
        [attr.data-page]="x.nPage || x?.jLinktype?.pages?.[0] || (x?.jLinktype?.start ? x?.jLinktype?.start : 1)"
        (click)="scrollFeedToPage(x);historyInsert(x);updateVisibleAnnotDetails(x)">

        <ng-container *ngIf="x.cSource == 'QF' || x.cSource == 'QM'">
            <!-- nUserid passed so nav-qfactcard can compare against
                 data.nUserid (the QFact's creator) and hide the
                 Convert / Edit / Delete action bar for non-owners.
                 Non-owners still see the QFact card itself (read access
                 via team sharing); only the mutation buttons are hidden. -->
            <nav-qfactcard [id]="'fact-'+x.id" class="group/qfactcard" [data]="x" [activeID]="visibleAnnotDetails?.id"
                [type]="x.cType" [attr.data-connect]="'icon-'+x.id" (CardEvent)="qFactCardEvent($event)"
                (OnView)="onViewDocLink(x);" [isQmark]="x.cSource == 'QM'" [cFFrom]="cFFrom"
                [nUserid]="nUserid" />
        </ng-container>

        <ng-container *ngIf="x.cSource=='F'">
            <!-- (click)="scrollFeedToPage(x)" -->
            <div
                class="bg-transparent mb-2 hover:shadow-[0_0px_6px_#06f] border-transparent border hover:border-white rounded-base  group-hover:opacity-50 hover:!opacity-100  cursor-pointer">

                <factcard class="block bg-black rounded-base" [data]="x" [issueList]="x.issueList"
                    [filelinks]="x.linkfile" [nohover]="true" isnavigate [viewmode]="viewmode"
                    (onCardEvent)="factCardEvent($event,x)" (OnView)="onViewDocLink(x);" [cFFrom]="cFFrom"
                    [nFSid]="nFSid" [type]="type" />

            </div>
        </ng-container>


        <ng-container *ngIf="x.cSource=='D'">
            <!-- (click)="scrollFeedToPage(x)" -->
            <div class="group-hover:opacity-50 hover:!opacity-100 mb-3 last:mb-0 group/doccard link-line-bar"
                [id]="x.id" [class.!opacity-100]="visibleAnnotDetails?.id && visibleAnnotDetails?.id == x.id"
                [class.!opacity-50]="visibleAnnotDetails?.id && visibleAnnotDetails?.id != x.id"
                [attr.data-page]="x.nPage || x?.jLinktype?.pages?.[0] || (x?.jLinktype?.start ? x?.jLinktype?.start : 1)">
                <nav-doc-link-card class="block mb-2.5" [viewmode]="viewmode" [x]="x"
                    (onCardEvent)="docCardEvent($event,x)" (OnView)="onViewDocLink(x);" [cFFrom]="cFFrom"
                    [nUserid]="nUserid" [nFSid]="nFSid" />
                <div *ngIf="x.nUserid == nUserid"
                    class="max-h-0 mb-0 group-hover/doccard:max-h-[34px] transition-all duration-300 overflow-hidden group-hover/doccard:mb-2.5"
                    [class]="dd.menuOpen ? 'max-h-[34px] mb-2.5' : 'max-h-0 mb-0'">
                    <div [matMenuTriggerFor]="deletemenu" #dd="matMenuTrigger"
                        class="flex items-center justify-start gap-2.5 border border-white px-2.5  rounded-base w-full text-xs h-8.5 cursor-pointer">
                        <icon class="text-lg" name="removecircle"></icon>
                        {{'ACTIONBAR.DELETE' | translate}}
                    </div>

                    <mat-menu #deletemenu="matMenu" class="!bg-black p-5 mt-1 rounded-base" xPosition="after">
                        <div>
                            <h6 class="mb-6 min-w-64 text-white text-xs">{{'ACTIONBAR.CONFIRM_DELETE' | translate}}</h6>
                            <div class="flex gap-2">
                                <btn (click)="deleteDocLink(x.id)">{{'ACTIONBAR.DELETE' | translate}}</btn>
                                <btn mode="dark">{{'ACTIONBAR.CANCEL' | translate}}</btn>
                            </div>
                        </div>
                    </mat-menu>
                </div>
            </div>

        </ng-container>

    </div>
</ng-container>
