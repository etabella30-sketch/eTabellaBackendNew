@if(isLoading){
<div class="flex items-center justify-center h-full">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-gray-900"></div>
</div>
}
@else {
<header class="flex w-full mb-2.5">
    <h6 class="text-xs font-semibold">Fact Discussion</h6>
    <div class="flex items-center gap-1.5 ms-auto">
        @for (x of commentsUsers; track x.nUserid) {
        <avtr size="sm" [detail]="x" />
        }
    </div>
</header>

<div class="bg-reply h-fit max-h-[500px] overflow-auto flex flex-col p-5">
    <div class="flex-1  space-y-2.5 overflow-y-auto" #commentsContainer>
        @for (comment of comments; track $index) {
        <user-comment class="block" [comment]="comment" [isCurrentUser]="comment.nUserid === nUserid"
            [(editCommentItem)]="editCommentItem" (editCommentItemChange)="removeComment($event)"
            [commentLength]="comments.length" [index]="$index" [enableAddComment]="enableAddComment" />
        }
    </div>

    @if(enableAddComment){
    <add-comment [nFSid]="nFSid" [nSesid]="nSesid" [nUserid]="nUserid" [comments]="comments"
        [commentsUsers]="commentsUsers" [(editCommentItem)]="editCommentItem" [nBundledetailid]="nBundledetailid"
        [(shouldScrollToBottom)]="shouldScrollToBottom" />
    }
</div>
}
