<div class="flex flex-col h-full w-full" [ngClass]="{'bg-faint': viewsection,'bg-white':!viewsection}">
        <ng-container *ngIf="!selectedtab">

        <div class="flex items-center justify-between px-5 py-2.5 h-[45px] mb-5 mt-2.5">
                <h2 class="text-lg font-semibold">{{ 'PROPERTIES.DOCUMENT_ASSOCIATIONS' | translate }}</h2>
                        <btn class="me-1" mode="clean" addcls="border-none" [square]="true">
                                <icon name="close" class="text-xs" (click)="close()" (keydown.enter)="close()" (keyup.space)="close()" />
                        </btn>
        </div>
        <div class=" bg-white flex flex-col justify-between w-full px-5">
                <div *ngFor="let x of tablist; let i = index" class="w-full flex realtive group pb-2.5 items-center justify-between text-xs cursor-pointer border-b border-tab/50 last:!border-b-0 mb-2.5 last:!mb-0"
                        [class]="x.type==TAB_TYPE.CUSTOM_BUNDLE ? 'opacity-50 pointer-events-none' : ''" (click)="selecttab(x)" (keydown.enter)="selecttab(x)" (keyup.space)="selecttab(x)">
                        <span class="group-hover:font-semibold">{{x.name}}</span>
                                <btn mode="outlined" addcls="border-none" [square]="true">
                                        <icon name="chvy" class="rotate-180 text-xs"></icon>
                                </btn>
                </div>
        </div>
        </ng-container>

        <ng-container *ngIf="selectedtab">

        <div class="h-full flex flex-col overflow-hidden">
                <ng-container *ngIf="selectedtab.type == TAB_TYPE.METADATA || selectedtab.type == TAB_TYPE.CUSTOM_BUNDLE">

                <header class="bg-white flex items-center  py-2.5 px-5 ">
                                <icon name="chvy" class="text-xs me-4" (click)="back()" (keydown.enter)="back()" (keyup.space)="back()" />
                        <span class="text-lg font-semibold">
                                {{selectedtab.name}}
                        </span>
                </header>
                </ng-container>


                <div class="h-full overflow-auto">
                        <ng-container *ngIf="selectedtab.type == TAB_TYPE.CUSTOM_BUNDLE">
                        <ng-container *ngIf="viewsection">
                        <!-- Defer block omitted: not supported in legacy syntax. Consider using *ngIf or manual loading. -->
                        <div class="h-full overflow-hidden px-5 flex flex-col py-6 gap-6">
                                <ng-container *ngIf="bundleList?.length">
                                <btn class="text-lg font-semibold w-full" addcls="!border-blue-hover !text-blue-on"
                                        (click)="viewsection = !viewsection" (keydown.enter)="viewsection = !viewsection" (keyup.space)="viewsection = !viewsection" tabindex="0" mode="outlined">
                                        <icon name="properties" type="extra" class="text-lg"></icon>
                                        Assign Again
                                </btn>
                                <div class="h-full overflow-auto">
                                        <selected-custombundle [viewsection]="viewsection" [nCaseid]="nCaseid"
                                                [jBDids]="jBDids" (changeCustombundle)="changeCustombundle($event)"
                                                [bundleList]="bundleList"></selected-custombundle>
                                </div>
                                </ng-container>
                                <ng-container *ngIf="!bundleList?.length">
                                <empty [head]="'No File Assigned.'" class="block h-full" addcls="bg-white/10">
                                        <btn class="text-lg font-semibold mt-2" (click)="viewsection = !viewsection" (keydown.enter)="viewsection = !viewsection" (keyup.space)="viewsection = !viewsection" tabindex="0" mode="outlined">
                                                <icon name="properties" type="extra" class="text-lg"></icon>
                                                Start Assigning
                                        </btn>
                                </empty>
                                </ng-container>
                        </div>
                        <!-- Placeholder omitted: not supported in legacy syntax. -->
                        </ng-container>
                        <ng-container *ngIf="!viewsection">
                        <!-- Defer block omitted: not supported in legacy syntax. Consider using *ngIf or manual loading. -->
                        <div class="h-fit max-h-full overflow-auto pb-3">
                                <choose-custombundle [panelwidth]="rightpanelwidth" [viewsection]="viewsection"
                                        [nCaseid]="nCaseid" [ismyfiles]="ismyfiles" [viewlist]="viewlist"
                                        (changeCustombundle)="changeCustombundle($event)"
                                        [bundleList]="bundleList"></choose-custombundle>
                        </div>
                        <div class="h-full overflow-auto">
                                <ng-container *ngIf="bundleList?.length">
                                <selected-custombundle [viewsection]="viewsection" [nCaseid]="nCaseid" [jBDids]="jBDids"
                                        (changeCustombundle)="changeCustombundle($event)"
                                        [bundleList]="bundleList"></selected-custombundle>
                                </ng-container>
                                <ng-container *ngIf="!bundleList?.length">
                                <div></div>
                                </ng-container>
                        </div>
                        <div class="px-5 py-3 flex items-center gap-2.5 bg-grey text-xs text-white mx-5"
                                *ngIf="isSuccess">
                                <span class="flex items-center gap-2.5">

                                        <icon name="check" class="me-3 text-sgreen" />
                                        Successfully assigned.
                                </span>

                                <a class="underline ms-auto" (click)="viewsection = true;isSuccess=false">View</a>
                        </div>
                        <!-- Placeholder omitted: not supported in legacy syntax. -->
                        </ng-container>
                        </ng-container>
                        <ng-container *ngIf="(selectedtab.type != TAB_TYPE.CUSTOM_BUNDLE && selectedtab.type != TAB_TYPE.METADATA) && !viewsection">
                        <div class="px-5">
                                <div *ngFor="let x of viewlist; let i = index">
                                  <source-card gap="S" [heading]="true" mode="light" class="block mb-2" [truncate]="false"
                                        type="P" [detail]="x" />
                                </div>
                        </div>
                        </ng-container>
                        <ng-container *ngIf="selectedtab.type == TAB_TYPE.CONTACT">

                        <!-- Defer block omitted: not supported in legacy syntax. Consider using *ngIf or manual loading. -->

                        <assign-contact [nCaseid]="nCaseid" [selectedContacts]="selectedContacts" [showEditBtn]="true"
                                (OnEvent)="changeContact($event)"></assign-contact>
                        <div class="px-5 py-3 flex items-center gap-2.5 bg-grey text-xs text-white mx-5"
                                *ngIf="isSuccess">
                                <span class="flex items-center gap-2.5">

                                        <icon name="check" class="me-3 text-sgreen" />
                                        Successfully assigned.
                                </span>

                                <a class="underline ms-auto" (click)="viewsection = true;isSuccess=false">View</a>
                        </div>
                        <!-- Placeholder omitted: not supported in legacy syntax. -->

                        </ng-container>
                        <ng-container *ngIf="selectedtab.type == TAB_TYPE.TAG">
                        <!-- Defer block omitted: not supported in legacy syntax. Consider using *ngIf or manual loading. -->

                        <choose-tag [viewsection]="viewsection" [selectedtaglist]="selectedtaglist" [nTagid]="editid"
                                [isedit]="isedit" (changeTag)="changeTag($event)" [nCaseid]="nCaseid"
                                [ismyfiles]="ismyfiles" [isSuccess]="isSuccess"></choose-tag>



                        <!-- Placeholder omitted: not supported in legacy syntax. -->

                        </ng-container>
                        <ng-container *ngIf="selectedtab.type == TAB_TYPE.TASK">

                        <!-- Defer block omitted: not supported in legacy syntax. Consider using *ngIf or manual loading. -->
                        <assign-fact-task class="block h-full bg-white" [nCaseid]="nCaseid"
                                (OnEvent)="changeTask($event)" [selectedTasks]="selectedTasks" [showEditBtn]="true"
                                (activeFormChange)="activeFormChange($event)" [isFiletask]="true" />
                        <!-- Placeholder omitted: not supported in legacy syntax. -->
                        </ng-container>


                        <ng-container *ngIf="selectedtab.type == TAB_TYPE.METADATA">
                        <metadata class="h-full" [metadata]="metadata"></metadata>
                        </ng-container>
                </div>
        </div>
        <!-- }  -->
        </ng-container>
</div>
