@if(!showTagForm){

<div class="h-full flex flex-col overflow-hidden">

    <div class="px-5 pt-5 pb-3 flex items-center gap-2">
        <icon name="chvy" class="text-xs mt-px" (click)="back()" />
        <span class="font-semibold text-lg ms-2">Choose Flag</span>
        <btn (click)="addtag()" mode="white" class="ms-auto">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M0 8C-1.56548e-08 6.94943 0.206926 5.90914 0.608964 4.93853C1.011 3.96793 1.60028 3.08601 2.34315 2.34315C3.08601 1.60028 3.96793 1.011 4.93853 0.608964C5.90914 0.206926 6.94943 0 8 0C9.05058 0 10.0909 0.206926 11.0615 0.608964C12.0321 1.011 12.914 1.60028 13.6569 2.34315C14.3997 3.08601 14.989 3.96793 15.391 4.93853C15.7931 5.90914 16 6.94943 16 8C16 10.1217 15.1571 12.1566 13.6569 13.6569C12.1566 15.1571 10.1217 16 8 16C5.87827 16 3.84344 15.1571 2.34315 13.6569C0.842855 12.1566 3.16163e-08 10.1217 0 8ZM8 4C7.82319 4 7.65362 4.07024 7.5286 4.19526C7.40357 4.32029 7.33333 4.48986 7.33333 4.66667V7.33333H4.66667C4.48986 7.33333 4.32029 7.40357 4.19526 7.5286C4.07024 7.65362 4 7.82319 4 8C4 8.17681 4.07024 8.34638 4.19526 8.47141C4.32029 8.59643 4.48986 8.66667 4.66667 8.66667H7.33333V11.3333C7.33333 11.5101 7.40357 11.6797 7.5286 11.8047C7.65362 11.9298 7.82319 12 8 12C8.17681 12 8.34638 11.9298 8.47141 11.8047C8.59643 11.6797 8.66667 11.5101 8.66667 11.3333V8.66667H11.3333C11.5101 8.66667 11.6797 8.59643 11.8047 8.47141C11.9298 8.34638 12 8.17681 12 8C12 7.82319 11.9298 7.65362 11.8047 7.5286C11.6797 7.40357 11.5101 7.33333 11.3333 7.33333H8.66667V4.66667C8.66667 4.48986 8.59643 4.32029 8.47141 4.19526C8.34638 4.07024 8.17681 4 8 4Z"
                    fill="currentColor" />
            </svg>
            New Flag
        </btn>
    </div>

    <div class="min-h-fit flex flex-col overflow-hidden px-5 pb-0">
        <div>
            <div class="border-tab border rounded-base bg-white">
                <div class="flex gap-2 items-center px-2 relative">
                    <svg class="absolute left-5 z-[999]" width="14" height="15" viewBox="0 0 14 15" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8.4308 0.640625C6.99106 0.640625 5.61028 1.21256 4.59223 2.23062C3.57417 3.24867 3.00223 4.62945 3.00223 6.0692C3.00223 7.25891 3.38509 8.35891 4.03366 9.25377L0.395947 12.8915C0.23866 13.0465 0.147259 13.2562 0.140794 13.4769C0.134328 13.6976 0.213298 13.9123 0.361243 14.0763C0.509188 14.2402 0.714691 14.3407 0.934921 14.3569C1.15515 14.373 1.37311 14.3035 1.54338 14.1629L1.60852 14.1041L5.24623 10.4663C6.17185 11.1385 7.28687 11.4996 8.4308 11.4978C9.87055 11.4978 11.2513 10.9258 12.2694 9.90777C13.2874 8.88972 13.8594 7.50894 13.8594 6.0692C13.8594 4.62945 13.2874 3.24867 12.2694 2.23062C11.2513 1.21256 9.87055 0.640625 8.4308 0.640625ZM8.4308 2.35491C9.41589 2.35491 10.3606 2.74624 11.0572 3.4428C11.7538 4.13936 12.1451 5.08411 12.1451 6.0692C12.1451 7.05429 11.7538 7.99903 11.0572 8.69559C10.3606 9.39216 9.41589 9.78348 8.4308 9.78348C7.44571 9.78348 6.50097 9.39216 5.80441 8.69559C5.10784 7.99903 4.71652 7.05429 4.71652 6.0692C4.71652 5.08411 5.10784 4.13936 5.80441 3.4428C6.50097 2.74624 7.44571 2.35491 8.4308 2.35491Z"
                            fill="CurrentColor" />
                    </svg>
                    <ng-select [(ngModel)]="choosedtag" (ngModelChange)="onTagSelectionChange({value:$event})" appendTo="body"
                        [items]="filteredTaglist" bindLabel="cTag" bindValue="nTagid"
                        placeholder="Type to search by Flag"
                        class="pagerefslct autocmpltselect w-full  !pe-0 !ps-6 h-8.5  overflow-hidden novalue-select ng-option-nocheck">
                        <ng-template ng-option-tmp let-item="item" let-index="index">
                            <div class="flex items-center text-xs gap-1 px-2.5 py-1">
                                <svg [ngStyle]="{'color': '#'+ (item?.cClr || '').replace('#','')}" width="15"
                                    height="17" viewBox="0 0 15 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.59825 15.8148H1.61719V1.42578H13.39L10.5449 6.05081L13.39 10.6758H2.59825V15.8148Z"
                                        fill="currentColor" stroke="currentColor" stroke-width="1.30809"
                                        stroke-linejoin="round" />
                                </svg>
                                {{item?.cTag}}
                            </div>
                        </ng-template>
                    </ng-select>
                </div>
                <div class="border-t">
                    <mat-select [(ngModel)]="choosedtag" (selectionChange)="onTagSelectionChange($event)"
                        panelClass="sortfltrpnl contactnew !p-2.5" disableOptionCentering class="sortfilterslct addcont"
                        placeholder="Select a flag to assign">
                        <mat-select-trigger>
                            @if(selectedTag){
                            <ng-container>
                                <div class="flex gap-2 items-center">
                                    <svg [ngStyle]="{'color': '#'+ (selectedTag?.cClr || '').replace('#','')}" width="15"
                                        height="17" viewBox="0 0 15 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M2.59825 15.8148H1.61719V1.42578H13.39L10.5449 6.05081L13.39 10.6758H2.59825V15.8148Z"
                                            fill="currentColor" stroke="currentColor" stroke-width="1.30809"
                                            stroke-linejoin="round" />
                                    </svg>
                                    {{selectedTag?.cTag}}
                                    <btn mode="clear" class="ms-auto" [square]="true" [disabled]="!selectedTag"
                                        (click)="addtag(selectedTag?.nTagid);$event.stopPropagation()">
                                        <icon name="edit" class="text-grey" />
                                    </btn>
                                </div>
                            </ng-container>
                            }
                            @else {
                            <ng-container>
                                Select a flag to assign
                            </ng-container>
                            }
                        </mat-select-trigger>


                        @for (x of filteredTaglist; track x.nTagid) {
                        <mat-option class="sortfltroptn" [value]="x.nTagid" class="nocheck group !p-0 mb-0.5 last:mb-0"
                            style="--mat-option-padding:0">
                            <div>
                                <div
                                    class="px-5 py-1 hover:bg-blue-deactivate rounded-md flex text-xs items-center gap-2.5 group-[.mdc-list-item--selected]:bg-blue-deactivate group-[.mdc-list-item--selected]:font-semibold">
                                    <div class="w-full flex items-center gap-2">
                                        <!-- <icon name="tag" 
                                            type="myfileicn" /> -->
                                        <svg [ngStyle]="{'color': '#'+ (x?.cClr || '').replace('#','')}" width="15"
                                            height="17" viewBox="0 0 15 17" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M2.59825 15.8148H1.61719V1.42578H13.39L10.5449 6.05081L13.39 10.6758H2.59825V15.8148Z"
                                                fill="currentColor" stroke="currentColor" stroke-width="1.30809"
                                                stroke-linejoin="round" />
                                        </svg>
                                        {{x.cTag}}
                                    </div>
                                </div>
                            </div>
                        </mat-option>
                        }
                        @if (filteredTaglist.length === 0) {
                        <div class="px-5 py-3 text-center text-sm text-gray-500">
                            No Flags found
                        </div>
                        }
                    </mat-select>

                </div>
            </div>
        </div>

        <div class="flex gap-2 my-3">
            <btn class="flex-1" [attr.isdisabled]="!selectedTag" class="w-full" (click)="Savetag()">Add Flag</btn>
        </div>
    </div>

    <div class="h-full overflow-auto bg-reply p-5">
        <selected-tags [selectedtaglist]="selectedtaglist" [nCaseid]="nCaseid"
            (OnEvent)="changeSelectedTag($event)"></selected-tags>
    </div>
</div>
}

<!-- Tag Form as Child Component -->
@if (showTagForm) {

<tag-form [nCaseid]="nCaseid" class="block h-full" [editable_list]="editableTag" (formClosed)="onTagFormClosed($event)">
</tag-form>

}
