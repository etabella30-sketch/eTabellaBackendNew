@if(selectedtaglist.length > 0){
@for (x of selectedtaglist; track $index) {
<div
        class="group rounded-base p-1 border-white border-2 px-2.5  flex items-center mb-2.5 gap-2  hover:shadow-[1px_1px_7px_#00000014]">
        <!-- <icon name="tag" type="myfileicn" [ngStyle]="{'color': '#' + x.cClr}" /> -->

        <svg [ngStyle]="{'color': '#'+ (x.cClr).replace('#','')}" width="15" height="17" viewBox="0 0 15 17" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M2.59825 15.8148H1.61719V1.42578H13.39L10.5449 6.05081L13.39 10.6758H2.59825V15.8148Z"
                        fill="currentColor" stroke="currentColor" stroke-width="1.30809" stroke-linejoin="round" />
        </svg>

        <div class="flex flex-col ">
                <span class="text-xs">{{x.cTag}}</span>
                <span class="text-xxs">{{x.cDesc}}</span>
        </div>

        <btn mode="clear" class="opacity-0 group-hover:opacity-100 ms-auto" [square]="true"
                (click)="removeTag(x,$index)">
                <icon name="removefill" class="text-base" />
        </btn>
</div>
}
}
