@for (x of bundleList; track $index) {
<div class=" group rounded-base p-2.5 border-white border-2 hover:bg-white flex items-center mb-2.5 gap-2">
        <span class="text-xs">{{x.cBundlename }}</span>
        <btn mode="outlined" class="ms-auto opacity-0 group-hover:opacity-100" [square]="true"
                (click)="deleteBundle(x,$index)">
                <icon name="removefill" />
        </btn>
        <!-- <btn class="opacity-0 group-hover:opacity-100" mode="outlined" [square]="true" (click)="viewFolder(x)">
                <icon name="removefill" />
        </btn> -->
</div>
}
