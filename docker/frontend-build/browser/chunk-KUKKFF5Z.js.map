<form class=" h-full flex flex-col overflow-hidden" [formGroup]="tg_frm">
        <!-- [formGroup]="tg_frm" -->
        <div class="flex items-center gap-2  text-lg font-semibold mb-6 pt-5 px-5">
                <icon name="chvy" class="text-xs" (click)="close()" />
                Flags
        </div>
        <div class="h-full overflow-auto px-5 pb-5">
                <div for="isuename" class="my-6">
                        <h6 class="text-xs font-semibold mb-2">Flags Name <span class="text-red-500">*</span></h6>
                        <h2 class="subtagname" class="flex gap-2">
                                <!-- (blur)="checktag()" -->
                                <!-- [attr.disabled]="(showsubtag|| (tg_frm.controls.subid)>0 ) ? true : null" -->
                                <input class="w-full" type="text" name="isuename" id="isuename" formControlName="cTag">
                                <!-- (click)="sub_tg_bx()" -->
                        </h2>
                </div>
                <div for="isuename" class="my-3" *ngIf="issubTag">
                        <h6 class="text-xs font-semibold mb-2">Sub Flags</h6>
                        <input class="main-input" type="text" name="isuename" id="isuename" formControlName="cSubtag">
                </div>
                <div class="profileslider w-100 bg-transparent">
                        <div class="color-pickercss w-100">
                                <!-- <div class="">
                    <span [style.background]="arrayColors_tag[selectedColor_tag]"
                        [cpToggle]="true" [cpDialogDisplay]="'inline'"
                        [(colorPicker)]="arrayColors_tag[selectedColor_tag]"></span>
                </div> -->

                                <div>
                                        <div class="profileslider w-100 bg-transaparent overflow-hidden rounded-3 ">
                                                <div class="color-pickercss w-100 bg-transaparent ">
                                                        <div class="rounded-3">
                                                                <app-colorpicker #colorPicker class="mx-auto"
                                                                        [(myColor)]="cClr"
                                                                        [colorslist]="colorslist"></app-colorpicker>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                                <!-- <div class="color box resent">
    
                    <div class="color-box" [style.background]="arrayColors_tag['color2']"
                        (click)="selectedColor_tag='color2'"></div>
    
                    <div class="color-box" [style.background]="arrayColors_tag['color3']"
                        (click)="selectedColor_tag='color3'"></div>
    
                    <div class="color-box" [style.background]="arrayColors_tag['color4']"
                        (click)="selectedColor_tag='color4'"></div>
    
                    <div class="color-box" [style.background]="arrayColors_tag['color5']"
                        (click)="selectedColor_tag='color5'"></div>
                </div> -->

                        </div>
                </div>

                <div class="other-isudtl">
                        <label for="desc">
                                <h6 class="text-xs font-semibold mb-2">Description</h6>
                                <input class="main-input" type="text" name="desc" id="desc" formControlName="cDesc">
                                <!-- [attr.disabled]="(tg_frm.controls.subid)>0 ? true : null" -->
                        </label>
                </div>

                <!-- <button class="custbtn brand full" (click)="tag_submit(tg_frm,'tag_assigned')">
            Add
        </button> -->

                <div class="flex items-center justify-between gap-2 position-relative mt-6">
                        <!-- (click)="tag_submit(tg_frm,'tag_assigned')" -->
                        <!-- [disabled]="tg_frm.invalid" [class.disabled]="tg_frm.invalid" -->
                        <btn class="w-full" (click)="submit()" [disabled]="tg_frm.invalid">
                                <!-- {{tg_frm.value.cPermission == 'N' ? 'Add ' : 'Update'}} -->
                                {{ tg_frm.value.permission =='E' ? 'Update' : 'Add'}}
                        </btn>
                        <!-- (focusin)="showconfpop=true" (focusout)="timeout()" -->
                        <btn *ngIf="tg_frm.value.permission=='E'" mode="outlined" class="w-full"
                                [matMenuTriggerFor]="delete" #t="matMenuTrigger">
                                Delete
                        </btn>
                        <mat-menu #delete="matMenu" class="!bg-black p-5  rounded-base" xPosition="before">
                                <div>
                                        <h6 class="mb-6 min-w-64 text-white text-xs">Confirm Delete ?</h6>
                                        <div class="flex gap-2">
                                                <btn (click)="deleteTag()">
                                                        Delete</btn>
                                                <btn mode="dark">cancel</btn>
                                        </div>
                                </div>
                        </mat-menu>
                        <!-- *ngIf="tg_frm.value.cPermission != 'N'" -->
                </div>
        </div>
</form>
