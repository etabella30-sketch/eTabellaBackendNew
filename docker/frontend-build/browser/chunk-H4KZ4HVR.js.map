<div class="p-3 h-full overflow-auto">

    <div class="w-full" *ngFor="let d of List;let ind = index">
        <h6 class="text-sm font-bold mb-3">{{d.cCompany}}</h6>
        <mat-accordion class="myfileexpand" class="d-block me-2 w-100 rounded-3">
            <mat-expansion-panel class="!shadow-none !mb-3 !mt-0 rounded-0 bg-transparent px-2"
                *ngFor="let x of d.contactls;let i = index;" [expanded]="ind==0&&i===0"
                (opened)="x.isopened=true;getContactfiles(x)" (closed)="x.isopened=false" hideToggle>

                <mat-expansion-panel-header
                    [ngClass]="{'hover:!bg-grey !bg-grey': x.isopened,'hover:!bg-reply':!x.isopened}"
                    class="!h-10 titleM  text-white py-[10px] px-5 !rounded-[10px] bg-reply">
                    <mat-panel-title class="text-xs font-semibold" [class.!text-white]="x.isopened">
                        <icon class="me-2 text-[8px] opacity-75" [class.rotate-[270deg]]="!x.isopened" name="caret"
                            type="extra" />
                        <div class="flex gap-2 items-center">
                            <avtr class="flex" [detail]="{'cFname':x.cFname,'cLname':x.cLname,'cProfile':x.cProfile}"
                                size="sm">
                            </avtr>
                            <span>
                                {{x.cFname}} {{x.cLname}}
                            </span>
                        </div>
                    </mat-panel-title>
                </mat-expansion-panel-header>

                @if (isLoading) {
                @for (x of [1,2,3,4,5,6]; track $index) {
                <div class="bg-reply animate-pulse h-9 mt-2 rounded-base"></div>
                }
                }
                @else{
                @if(x?.tablelist.length){
                <div class="my-2 bg-transparent p-2.5 rounded-base shadow-[1px_1px_11px_#0000001f] overflow-auto">
                    <app-filehader class="block min-w-fit w-full" [isadmin]="false" [reqcols]="reqcols"></app-filehader>
                    <!-- <cdk-virtual-scroll-viewport itemSize="46"
                            class="example-viewport foldervitual h-[calc(100%_-_86px)]" #scrollViewport> -->
                    <div class="min-w-fit w-full" *ngFor="let item of x.tablelist ;let i = index;">
                        <div class="relative group min-w-fit w-full">
                            <app-table [checkoutside]="true" [col]="reqcols" [filedetail]="item" [isCopy]="false"
                                [nCaseid]="nCaseid" [nSectionid]="nSectionid" (changeTable)="changeTable($event,item)"
                                (emitEvent)="eventEmit($event,item.nBundledetailid)" [isLink]="isLink"  [reqcolKeys]="reqcolKeys" >
                            </app-table>
                        </div>
                    </div>
                    <!-- </ng-template> -->
                    <!-- </cdk-virtual-scroll-viewport> -->
                </div>
                }
                }

            </mat-expansion-panel>
        </mat-accordion>
        <hr class="opacity-75 mb-5 " *ngIf="ind!=List.length-1">
    </div>

</div>

<!-- <empty head="No Issues" desc="Assign issues to file from my files" class="block h-full"></empty> -->
