<div #folderparent class="w-full flex gap-2 items-center overflow-auto  "
        [ngClass]="{'dropelemt': mfs.isfolderdraging||!folders.length}" (dragover)="onDragOver($event)"
        (drop)="onDrop($event,folderparent)">

        <div *ngFor="let x of folders" (dragover)="onDragOver($event)" (drop)="onDrop($event,folderparent)"
                class="folder px-5 h-11 flex bg-white rounded-base items-center gap-2 text-xs draggable-item"
                [ngClass]="{'hidden': mfs.isfolderdraging,'bg-blue-deactivate text-blue-on' : x.isactive}">
                <button type="button" class="flex items-center gap-2 text-xs cursor-pointer" (click)="changeFolder(x)">
                        <icon name="folder" />
                        <div class="flex items-center">
                                <ng-container *ngFor="let y of x.path; let last = last">
                                        <ng-container *ngIf="x.path.length > 2">
                                                <ng-container *ngIf="last">
                                                        <span class="group whitespace-nowrap font-medium" [matTooltip]="x.path.join(' / ')"> ... <span
                                                                        class="group-last:hidden mx-2">></span>
                                                        </span>
                                                        <span class="group flex whitespace-nowrap font-medium">
                                                                <span class="truncate block max-w-[80px]">
                                                                        {{y}}
                                                                </span>
                                                                <span class="group-last:hidden mx-2">></span>
                                                        </span>
                                                </ng-container>
                                        </ng-container>

                                        <ng-container *ngIf="x.path.length <= 2">
                                                <span class="group whitespace-nowrap flex font-medium">
                                                        <span class="truncate block max-w-[80px]">
                                                                {{y}}
                                                        </span>
                                                        <span class="group-last:hidden mx-2">></span>
                                                </span>
                                        </ng-container>
                                </ng-container>
                        </div>
                </button>

                <button type="button" class="ms-5 text-gray-400 hover:text-blue-on" (click)="closeFolder(x); $event.stopPropagation()">
                        <icon name="close" class="text-[8px]" />
                </button>
        </div>
</div>
