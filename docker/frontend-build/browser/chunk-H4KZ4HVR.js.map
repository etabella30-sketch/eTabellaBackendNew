<div class="p-3 h-full overflow-auto">
    <div class="w-full" *ngFor="let d of List;let ind = index">
        <mat-accordion class="myfileexpand" class="d-block me-2 w-100 rounded-3">
            @if(d.sublist && d.sublist.length){
            <mat-expansion-panel class="!shadow-none !mb-3 !mt-0 rounded-0 bg-transparent p-0"
                *ngFor="let x of d.sublist;let i = index;" [expanded]="ind==0&&i===0"
                (opened)="x.isopened=true;getTagfiles(x)" (closed)="x.isopened=false" hideToggle>

                <mat-expansion-panel-header
                    [ngClass]="{'hover:!bg-grey !bg-grey': x.isopened,'hover:!bg-white':!x.isopened}"
                    class="!h-10 titleM  text-white py-[10px] px-5 !rounded-[10px]">
                    <mat-panel-title class="text-xs font-semibold" [class.!text-white]="x.isopened">
                        <icon class="me-2 text-[8px] opacity-75" [class.rotate-[270deg]]="!x.isopened" name="caret"
                            type="extra" />
                        <icon name="tag" type="myfileicn" class="text-base me-1" [ngStyle]="{'color': '#'+x.cClr}" />
                        {{x.cTag}}
                    </mat-panel-title>
                </mat-expansion-panel-header>

                @if (isLoading) {
                @for (x of [1,2,3,4,5,6]; track $index) {
                <div class="bg-reply animate-pulse h-9 mt-2 rounded-base"></div>
                }
                }
                @else {
                @if(x.tablelist && x.tablelist.length){
                <div class="my-2 bg-transparent overflow-auto ">
                    <app-filehader class="block w-full" [reqcols]="reqcols" [isadmin]="false"></app-filehader>
                    <!-- <cdk-virtual-scroll-viewport itemSize="46"
                            class="example-viewport foldervitual h-[calc(100%_-_86px)]" #scrollViewport> -->
                    <div class="w-fit" *ngFor="let item of x.tablelist ;let i = index;">
                        <div class="relative group w-fit">
                            <app-table [reqcolKeys]="reqcolKeys" [col]="reqcols" [filedetail]="item" [isCopy]="false"
                                [nCaseid]="nCaseid" [nSectionid]="nSectionid" (changeTable)="changeTable($event,item)"
                                (emitEvent)="eventEmit($event,item.nBundledetailid)" [isLink]="isLink">
                            </app-table>
                        </div>
                    </div>
                    <!-- </ng-template> -->
                    <!-- </cdk-virtual-scroll-viewport> -->
                </div>
                }
                }


            </mat-expansion-panel>
            }@else {
            <mat-expansion-panel class="!shadow-none !mb-0 !mt-0 rounded-0 bg-transparent px-2  " [expanded]="ind==0"
                (opened)="d.isopened=true;getTagfiles(d)" (closed)="d.isopened=false" hideToggle>
                <mat-expansion-panel-header
                    [ngClass]="{'hover:!bg-grey !bg-grey': d.isopened,'hover:bg-reply':!d.isopened}"
                    class="!h-10 titleM  text-white py-[10px] px-5 !rounded-[10px] bg-reply">
                    <mat-panel-title class="text-xs font-semibold" [class.!text-white]="d.isopened">
                        <icon class="me-2 text-[8px] opacity-75" [class.rotate-[270deg]]="!d.isopened" name="caret"
                            type="extra" />
                        <icon name="tag" type="myfileicn" class="text-base me-2"
                            [ngStyle]="{'color': '#'+d.cClr.replace('#','')}" />
                        {{d.cTag}}
                    </mat-panel-title>
                </mat-expansion-panel-header>
                @if(d.tablelist && d.tablelist.length){
                <div class="my-3 p-2.5 bg-transparent rounded-base shadow-[1px_1px_11px_#0000001f] overflow-auto">
                    <app-filehader class="block min-w-fit w-full" [reqcols]="reqcols" [isadmin]="false"></app-filehader>
                    <!-- <cdk-virtual-scroll-viewport itemSize="46"
                                            class="example-viewport foldervitual h-[calc(100%_-_86px)]" #scrollViewport> -->

                    <div class="min-w-fit w-full" *ngFor="let item of d.tablelist ;let i = index;">
                        <div class="relative group min-w-fit w-full">
                            <app-table [checkoutside]="true" [col]="reqcols" [filedetail]="item" [isCopy]="false"
                                [nCaseid]="nCaseid" [nSectionid]="nSectionid" (changeTable)="changeTable($event,item)" (emitEvent)="eventEmit($event,item.nBundledetailid)">
                            </app-table>
                        </div>
                    </div>
                    <!-- </ng-template> -->
                    <!-- </cdk-virtual-scroll-viewport> -->
                </div>
                }
            </mat-expansion-panel>
            }
        </mat-accordion>
        <!-- <hr class="opacity-75 mb-5 " *ngIf="ind!=List.length-1"> -->
    </div>

</div>

<!-- <empty head="No Issues" desc="Assign issues to file from my files" class="block h-full"></empty> -->
