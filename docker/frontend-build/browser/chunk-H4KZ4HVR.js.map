<ng-container *ngIf="Allsectionlist?.length && cFoldertype =='ALL'">

<div class="h-[calc(100%_-_50px)] w-full  folderscroll overflow-auto">
   <div class="flex items-center gap-2.5 font-semibold text-xs p-3 h-9 mb-2">
      {{ 'MYFILES.SECTION.APPROVED_CASE_FILES' | translate }}
      <icon [matMenuTriggerFor]="options" name="info-outline" type="extra" />
      <mat-menu #options="matMenu" class="!rounded-none w-fit !bg-[#4b4d52]">
         <ng-container>
            <div class="!p-3 flex justify-between gap-10 items-center ">
               <span class="text-xs font-medium text-white">{{ 'MYFILES.SECTION.APPROVED_CASE_FILES_DESC' | translate }}</span>
               <icon name="close" class="text-xs me-2 text-white/70"></icon>
            </div>
         </ng-container>
      </mat-menu>
   </div>
   <ng-container *ngFor="let x of Allsectionlist[0]">
   <div
      class="relative flex flex-col flex-grow items-center min-w-full mb-2 overflow-visible cursor-pointer mat-tree-node group min-h-10 text-grey w-fit first:mt-0 rounded-base"
      [ngClass]="{'bg-reply': x.isActive}">
      <div class="w-full h-full rounded-base bg-white"
         [ngClass]="{'!bg-blue-deactivate': x.nSectionid === nSectionid && x.isActive}">
         <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10">
            <button type="button" class="flex items-center w-full h-full gap-5 text-left bg-transparent border-0 p-0"
               [ngClass]="{'text-blue-on': x?.nSectionid === nSectionid && x.isActive}"
               (click)="changeSection(x)">

               <div class="flex items-center w-full h-full gap-2">
                  <div class="flex items-center gap-2.5 px-3 w-full py-1.5 ">
                     <ng-container *ngIf="![SectionFolderTypes.CORE_BUNDLE, SectionFolderTypes.USER_FILES, SectionFolderTypes.TRANSCRIPT].includes(x.cFoldertype)">
                        <icon name="bundle"> </icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.CORE_BUNDLE">
                        <icon name="custombundle" type="myfileicn"> </icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.TRANSCRIPT">
                        <icon name="transcript" type="myfileicn"></icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.USER_FILES">
                        <icon name="userfiles" type="myfileicn"></icon>
                     </ng-container>
                     <span class="text-xs font-semibold"
                        [ngClass]="{'opacity-50': !x.isActive}">{{x.cFolder}}</span>
                  </div>
               </div>
            </button>
         </div>
      </div>
      <ng-container *ngIf="x.nSectionid == nSectionid">
      <div class="w-full" [style.height]="(TREE_DATA.length*48)+'px'">
         <folders [isIndividual]="isIndividual" [detail]="detail" [nSectionid]="nSectionid" [nCaseid]="nCaseid"
            [OnlyFolders]="true" [nBundleid]="nBundleid ? nBundleid : null" [changeF]="changeF"
            (changeFolder)="changeFolderEmitter($event)" [cutCopyType]="cutCopyType" [cFoldertype]="cFoldertype"
            [Allsectionlist]="Allsectionlist" (changeSectionAll)="changeSectionAllEmitter($event)"
            (getSelection)="getSelectionEmitter($event)" [selectedBundles]="selectedBundles"
            [nSelectedFolderid]="nSelectedFolderid" [presentDocType]="presentDocType"
            (isEmptyevent)="isEmptyeventEmitter($event)" [assignPopup]="assignPopup"
            [(isFolderLoading)]="isFolderLoading" [TREE_DATA]="TREE_DATA" (TREE_DATAChange)="onTreeDataChange($event)"
            [LAST_TREE_DATA_STAT]="LAST_TREE_DATA_STAT" (LAST_TREE_DATA_STATChange)="onLastTreeDataStatChange($event)"
            [onFileEvent]="onFileEvent" [searchedBundles]="searchedBundles"
            (searchedBundlesChange)="onsearchedBundlesChange($event)" [isPreview]="isPreview"
            (isPreviewChange)="onIspreviewChange($event)" [allSectionViewPort]="allSectionViewPort"
            [allSectionEvent]="loadFolderChild">
         </folders>
      </div>
      </ng-container>
   </div>

   </ng-container>

   <ng-container *ngIf="Allsectionlist[1].length">
   <hr class="mt-3">
   <div class="flex text-xs items-center gap-2.5 font-semibold h-9 px-2.5 mb-2">
      {{ 'MYFILES.SECTION.ASSIGNED_FILES' | translate }}
   </div>
   <ng-container *ngFor="let x of Allsectionlist[1]">
   <div
      class="relative flex flex-col flex-grow items-center min-w-full mb-2 overflow-visible cursor-pointer mat-tree-node group min-h-10 text-grey w-fit first:mt-0 rounded-base"

      <div class="w-full h-full rounded-base bg-white"
         [ngClass]="{'!bg-blue-deactivate': x.nSectionid === nSectionid && x.isActive}">
         <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10">
            <button type="button" class="flex items-center w-full h-full gap-5 text-left bg-transparent border-0 p-0"
               [ngClass]="{'text-blue-on': x?.nSectionid === nSectionid && x.isActive}"
               (click)="changeSection(x)">

               <div class="flex items-center w-full h-full gap-2">
                  <div class="flex items-center gap-2.5 px-3 w-full py-1.5 ">
                     <ng-container *ngIf="![SectionFolderTypes.CORE_BUNDLE, SectionFolderTypes.USER_FILES, SectionFolderTypes.TRANSCRIPT].includes(x.cFoldertype)">
                        <icon name="bundle"> </icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.CORE_BUNDLE">
                        <icon name="custombundle" type="myfileicn"> </icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.TRANSCRIPT">
                        <icon name="transcript" type="myfileicn"></icon>
                     </ng-container>
                     <ng-container *ngIf="x.cFoldertype===SectionFolderTypes.USER_FILES">
                        <icon name="userfiles" type="myfileicn"></icon>
                     </ng-container>
                     <span class="text-xs font-semibold"
                        [ngClass]="{'opacity-50': !x.isActive}">{{x.cFolder}}</span>
                  </div>
               </div>
            </button>
         </div>
      </div>
      <ng-container *ngIf="x.nSectionid == nSectionid">
      <div class="w-full" [style.height]="(TREE_DATA.length*48)+'px'">
         <folders [isIndividual]="isIndividual" [detail]="detail" [nSectionid]="nSectionid" [nCaseid]="nCaseid"
            [OnlyFolders]="true" [nBundleid]="nBundleid ? nBundleid : null" [changeF]="changeF"
            (changeFolder)="changeFolderEmitter($event)" [cutCopyType]="cutCopyType" [cFoldertype]="cFoldertype"
            [Allsectionlist]="Allsectionlist" (changeSectionAll)="changeSectionAllEmitter($event)"
            (getSelection)="getSelectionEmitter($event)" [selectedBundles]="selectedBundles"
            [nSelectedFolderid]="nSelectedFolderid" [presentDocType]="presentDocType"
            (isEmptyevent)="isEmptyeventEmitter($event)" [assignPopup]="assignPopup"
            [(isFolderLoading)]="isFolderLoading" [TREE_DATA]="TREE_DATA" (TREE_DATAChange)="onTreeDataChange($event)"
            [LAST_TREE_DATA_STAT]="LAST_TREE_DATA_STAT" (LAST_TREE_DATA_STATChange)="onLastTreeDataStatChange($event)"
            [onFileEvent]="onFileEvent" [searchedBundles]="searchedBundles"
            (searchedBundlesChange)="onsearchedBundlesChange($event)" [isPreview]="isPreview"
            (isPreviewChange)="onIspreviewChange($event)" [allSectionViewPort]="allSectionViewPort"
            [allSectionEvent]="loadFolderChild">
         </folders>
      </div>
      </ng-container>
   </div>

   </ng-container>
   </ng-container>


   <ng-container *ngIf="Allsectionlist[2].length">
   <hr class="mt-3">
   <div class="flex text-xs items-center gap-2.5 font-semibold h-9 px-2.5 mb-2">

      </ng-container>

   </ng-container>
   <ng-container *ngIf="Allsectionlist[3].length">
   <hr class="my-3">
   <ng-container *ngFor="let x of Allsectionlist[3]">
   <div
      class="relative flex flex-col flex-grow items-center min-w-full mb-2 overflow-visible cursor-pointer mat-tree-node group min-h-10 text-grey w-fit first:mt-0 rounded-base"

</ng-container>
