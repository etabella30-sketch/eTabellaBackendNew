<div class="p-10 flex flex-col h-full">
        <header class="h-fit">
                <h6 class="mb-2">Control panel</h6>
                <h6 class="text-4xl flex justify-between items-center  mb-7 gap-3">
                        <span class="font-bold" (click)="back()">
                                {{ nRoleid ? 'Role Permission' : 'User Permission'}}
                        </span>
                        <span>></span>
                        <span>{{cRole}}</span>
                        <span> {{cFname }} {{cLname}}</span>
                        <btn mode="outlined" class="ms-auto flex" addcls="!text-blue-500 border-blue-500"
                                (click)="ResetDefaultPermission()">
                                Reset to default
                        </btn>
                        <icon (click)="back()" name="close" class="text-base  cursor-pointer hover:text-blue-500" />
                </h6>
        </header>
        <div class="flex flex-col h-full overflow-hidden">
                <div class="flex px-5 py-2.5 gap-5 border rounded-full  [&_div]:text-base [&_div]:font-semibold mb-6">
                        <div class="w-1/5">Module</div>
                        <div class="w-2/5">Status</div>
                        <div class="w-2/5 text-end">Permission</div>
                </div>

                <div class="px-6 h-full overflow-auto">
                        <div *ngFor="let x of moduleList" class="tabbody flex gap-0 py-1.5 rounded-full relative ">
                                <div class="text-sm flex items-center w-1/5">
                                        <span>
                                                {{x.cModule}}
                                        </span>
                                </div>
                                <div class="text-sm w-2/5 flex items-center">
                                        <span>
                                                {{x.bValue ? 'Enabled' : 'Disabled'}}
                                        </span>
                                </div>
                                <div class="w-2/5 flex">
                                        <mat-slide-toggle hideIcon class="permission ms-auto me-4"
                                                (change)="updatePermission(x)" [(ngModel)]="x.bValue">
                                        </mat-slide-toggle>
                                </div>
                        </div>
                </div>

                <div class="px-6 h-full overflow-auto" *ngIf="false">
                        <div *ngFor="let x of [1,2,3,4,4]"
                                class="last:border-b-0 last:pb-0 last:mb-0 border-b pb-5 mb-5">
                                <h6 class="text-sm font-bold mb-3">Respondent</h6>
                                <div *ngFor="let x of [1,2,3,4,5]"
                                        class="tabbody flex gap-0 py-1.5 rounded-full relative ">
                                        <div class="text-sm flex items-center w-1/5">
                                                <span>
                                                        Workspace
                                                </span>
                                        </div>
                                        <div class="text-sm w-2/5 flex items-center">
                                                <span>
                                                        Disabled
                                                </span>
                                        </div>
                                        <div class="w-2/5 flex">
                                                <mat-slide-toggle hideIcon class="permission ms-auto me-4">
                                                </mat-slide-toggle>
                                        </div>
                                </div>
                        </div>
                </div>
        </div>
