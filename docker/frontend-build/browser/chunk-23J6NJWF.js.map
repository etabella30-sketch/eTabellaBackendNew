<div class=" relative block h-full w-[500px]">
    <form class="addnewcontact  py-5 flex flex-col h-full overflow-auto" [formGroup]="frm">
        <div class="text-lg font-semibold items-center gap-2 flex mb-6 px-5" #header>
            {{permission == 'N' ? 'Add ' : 'Edit ' }} Module
        </div>



        <div class="px-5">

            <label for="frstname">
                <h6 class="text-xs mb-2 font-semibold">Title <span class="valid-star">*</span></h6>
                <input class="main-input" [class.error]="frm.get('cTitle').invalid&&formsubmit" formControlName="cTitle"
                    type="text" id="frstname">
                <ng-container>
                    <div class="validators-required validation-required validation"
                        *ngIf="(frm.get('cTitle').hasError('required')&&formsubmit)">
                        Title is required
                    </div>
                </ng-container>
            </label>

            <label for="lstname">
                <h6 class="text-xs mb-2 font-semibold">Link <span class="valid-star">*</span></h6>
                <input class="main-input" [class.error]="frm.get('cLink').invalid&&formsubmit" formControlName="cLink"
                    type="text" id="lstname">
                <ng-container>
                    <div class="validators-required validation-required validation"
                        *ngIf="(frm.get('cLink').hasError('required')&&formsubmit)">
                        Link is required
                    </div>
                </ng-container>
            </label>
            <label for="note" class="selects">
                <h6 class="text-xs font-semibold mb-2">Desciption</h6>
                <textarea class="style" rows="3" type="text" id="note" formControlName="cDescription"
                    maxlength="250"></textarea>
                <!-- <ng-container>
                    <div class="validators-required validation-required validation"
                        *ngIf="(frm.get('cDescription').hasError('required')&&formsubmit)">
                        Description is required
                    </div>
                </ng-container> -->
            </label>

            <label for="lstname">
                <h6 class="text-xs mb-2 font-semibold">Tags <span class="valid-star">*</span></h6>
                <input class="main-input" placeholder="Type and press enter to add tag" (keypress)="addtag($event)"
                    type="text" id="lstname">

            </label>

            @if (tags.length > 0) {
            <div class="flex flex-wrap gap-2">
                @for (x of tags; track $index) {
                <div class="flex items-center gap-2 text-xs border py-1.5 px-2 rounded-base"> {{x}}
                    <icon class="text-xs" name="backspace" type="extra" (click)="removetag(x)"></icon>
                </div>
                }
            </div>
            }

            <btn class="w-full mt-5" addcls="w-full" (click)="onsubmit()">
                {{permission == 'N'?'Add':'Update'}}
            </btn>

        </div>
    </form>
</div>
