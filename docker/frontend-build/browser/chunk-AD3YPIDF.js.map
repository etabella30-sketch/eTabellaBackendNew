<div class="qfact-popup-backdrop" (click)="cancel()"></div>
<div #popupRoot class="qfact-popup"
     [style.left.px]="position().left"
     [style.top.px]="position().top"
     (click)="$event.stopPropagation()">

  <header class="qfact-popup__head">
    <span class="qfact-popup__icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 2.5L11.2 11L8 11.4L9.9 16.8L8.2 17.4L6.3 12L4 14V2.5Z" fill="currentColor" />
        <circle cx="15.4" cy="6.3" r="2.1" fill="#ffffff" />
      </svg>
    </span>
    <h2 class="qfact-popup__title">qFact</h2>
    @if (showSavedHint()) {
    <span class="qfact-popup__saved" aria-live="polite">✔ Saved</span>
    }
    <!-- Close button removed per UX request — popup still dismisses on
         click-outside (backdrop) and on Escape (handled in cancel()
         binding from the host key listener), so no functionality is
         lost; the × was visual clutter on a one-action popup. -->
  </header>

  <div class="qfact-popup__body">
    <h6 class="qfact-popup__heading">Assigned Claim &amp; Issue</h6>

    @if (selectedIssues?.length) {
    <div class="qfact-popup__chips">
      @for (iss of selectedIssues; track iss.nIid) {
      <span class="qfact-chip" [matTooltip]="iss.cIName" matTooltipPosition="above">
        <span class="qfact-chip__dot" [style.background-color]="'#' + (iss.cColor || 'd6dde8')"></span>
        <span class="qfact-chip__label">{{ iss.cIName }}</span>
      </span>
      }
    </div>
    } @else {
    <div class="qfact-popup__empty">No issue assigned</div>
    }

    <mat-checkbox class="qfact-popup__check"
                  [(ngModel)]="bUseHighlightedText"
                  (ngModelChange)="onUseHighlightedTextChange($event)">
      <span class="qfact-popup__check-label">Use highlighted text in note (editable)</span>
    </mat-checkbox>

    <textarea #noteInput
              class="qfact-popup__note"
              rows="4"
              maxlength="500"
              placeholder="Add a note (optional)"
              [(ngModel)]="cNote"
              (blur)="onNoteBlur()"></textarea>
  </div>
</div>
