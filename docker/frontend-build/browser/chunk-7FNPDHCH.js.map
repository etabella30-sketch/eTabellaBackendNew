

<!-- <video id="remote-video" autoplay playsinline></video> -->

<div [hidden]="!isStarted" class="video-container">
  <video #remoteVideo class="h-full w-full fixed left-0 top-0 bg-black" autoplay playsinline></video>
  
  <!-- @if(isStarted && (!remoteVideo.srcObject || !isVideoPlaying)){
    <div class="video-loading">
      <span>Loading screen share...</span>
      <div class="loading-spinner"></div>
    </div>
  } -->

  @if(debugInfo && isStarted && !isVideoPlaying){
    <div class="debug-info">
      <h3>Debug Information</h3>
      <pre>{{debugInfo}}</pre>
      <button class="retry-btn" (click)="tryReconnect()" [disabled]="isReconnecting">
        Retry Connection
      </button>
    </div>
  }
</div>

@if(showPopUpForRunningScreenShare){
<div class="fixed top-0 left-0 z-[99999] h-full w-full grid place-items-center">
  <div class="absolute top-0 left-0 z-[10] h-full w-full bg-black/50"></div>
  <div class="z-20 relative block w-[500px] bg-[#f6fbff] p-10 rounded-base">

    <div>
      <div class="flex p-2.5">
        <div>
          <h6 class="text-lg whitespace-nowrap font-semibold mb-2.5">
            Ready to join
          </h6>
          <h6 class="text-xs whitespace-nowrap">
            Would you like to join the live screen sharing?
          </h6>
        </div>
        @if(isAsked){
        <svg class="w-[50px] ms-auto" viewBox="0 0 50 50">
          <circle class="path" cx="25" cy="25" r="20" fill="none" stroke="black" stroke-width="2.5"></circle>
          <circle class="path" cx="25" cy="25" r="20" fill="none" stroke="#ff3d00" stroke-width="3"
            stroke-dasharray="90, 150" stroke-dashoffset="-35">
            <animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="0.75s"
              repeatCount="indefinite" />
          </circle>
        </svg>
        }
      </div>
      <div class="flex items-center gap-2.5 mt-4">
        <btn (click)="askForScreenShare()" [disabled]="isAsked">Join</btn>
        <btn mode="white" (click)="closePopUp()">Close</btn>
      </div>
    </div>

  </div>
</div>
}
