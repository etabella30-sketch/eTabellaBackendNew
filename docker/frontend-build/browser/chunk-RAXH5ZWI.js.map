<div class="h-full bg-blue-deactivate flex flex-col overflow-hidden">
    <div
        class="text-3xl font-bold text-dark-blue whitespace-nowrap py-10 flex flex-col justify-center items-center gap-6 px-24 shadow-[0px_22px_60px_#002d5b2b]">
        <img class="w-20" src="assets/present/public.png">
        <h6>
            Set up a type of public presentation below
        </h6>
    </div>
    <div class="flex h-[calc(100%_-_208px)] justify-center items-center gap-10">
        @for (item of subTypes; track $index) {
        <div class="bg-white flex cursor-pointer justify-center items-center flex-col h-fit rounded-base w-64 p-10 hover:bg-dark-blue group transition-all duration-200"
            (click)="setup(item)">
            <icon class="text-2xl text-dark-blue group-hover:text-blue-hover mb-3"
                [name]="item.jOther?.type=='F'?'myfiles':item.jOther?.type=='W'?'witness':'corefile'"
                [type]="item.jOther?.type=='F' ?'extra':'present'"></icon>
            <!-- <icon class="text-2xl text-dark-blue group-hover:text-blue-hover mb-3" name="add"></icon> -->
            <span class="text-lg text-dark-blue font-semibold group-hover:text-blue-hover whitespace-nowrap">
                {{item.cKey}}
            </span>
            <div
                class="border-t w-full duration-300 border-transparent text-center text-xs group-hover:border-grey mt-0 group-hover:pt-6 pt-0 max-h-0 overflow-hidden group-hover:max-h-14 group-hover:mt-6 transition-all">
                <span class="group-hover:text-white">{{item.jOther?.title}}</span>
            </div>
        </div>
        }
    </div>
</div>
