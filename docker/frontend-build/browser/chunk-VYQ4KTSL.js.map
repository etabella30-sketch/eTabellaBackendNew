@if(visibleIssueModel){
<issue-manage class="h-[calc(100vh-56px)] block" [nUserid]="nUserid" [nCaseid]="nCaseid" [visibleIssueModel]="visibleIssueModel"
    (issueManagerEmit)="issueManagerEmit($event)" />
}
@else {
<header class="flex flex-col justify-center px-5 py-2.5 w-full bg-blue-on">
    <div class="flex gap-2.5 items-center  max-md:flex-wrap">
        <icon class="text-white" name="issue" type="myfileicn" />
        <h2 class="flex-1 self-stretch my-auto text-lg font-semibold tracking-tight text-white">
            Issues
        </h2>
        <btn mode="outlined" addcls="!bg-transparent text-white hover:!bg-white" (click)="openIssueManager()">
            <icon class="text-base" name="issue" type="myfileicn" />
            Issue Manager
        </btn>
        <!-- (click)="ActiveForm = ''" -->
        <icon class="text-xs text-white mx-2" name="close" (click)="close()" />
    </div>
</header>

<div class="px-5 pt-3  h-fit max-h-[70vh] overflow-auto bg-reply">
    <!-- [modelType]="'V'" [isManager]="true" -->
    <issue-list [isDrag]="true" [(selectedIssues)]="selectedIssues" [nUserid]="nUserid"
        [headerType]="'F'" [nCaseid]="nCaseid" [ImidiatChange]="true"></issue-list>
</div>

<div class="flex justify-end px-5 py-2.5 w-full bg-reply">
    <btn class="w-full block" (click)="close()"> Update </btn>
</div>
}
