<div class="flex p-3 h-10 rounded-tr-lg  bg-white  items-center justify-between min-w-36 w-72 cursor-pointer "
        [ngClass]="{'!bg-blue-deactivate text-blue-hover': !active}">
        <span class="text-xs truncate whitespace-nowrap block pe-2">
                {{name}}
        </span>
        @if(!linkexplorerMode){
        @if(!compareMode){
        @if(isClose){
        <icon class="text-xxs" name="close" (click)="closeTab()" />
        }
        }@else {


        @if((nPresentid&&isHost) || !nPresentid){

        @if(isChecked!=true && compareDocumentList?.length>=4){
        <mat-checkbox #checkinput (click)="checkdisable(checkinput)"></mat-checkbox>
        }
        @else {
        @if(length!=1){
        <mat-checkbox [(ngModel)]="isChecked" [disabled]="isChecked!=true && compareDocumentList?.length>=4"
                (change)="OnChnageEvent($event)"></mat-checkbox>
        }
        }

        }



        }
        }


</div>
