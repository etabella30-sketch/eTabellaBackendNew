<!-- Callout Overlay - draggable popup with captured image + SVG highlight layer -->
<div class="callout-backdrop" (click)="dismiss()">
  <div #calloutContainer class="callout-container"
       [class.dragged]="position !== null"
       [class.image-loaded]="imgWidth > 0"
       [style.width.px]="containerWidth"
       [style.height.px]="containerHeight"
       [style.left.px]="position?.x"
       [style.top.px]="position?.y"
       (click)="$event.stopPropagation()">

    <!-- Close button -->
    <button class="callout-close-btn" (click)="dismiss()">
      <icon name="close" />
    </button>

    <!-- Draggable header + Toolbar -->
    <div class="callout-header" (mousedown)="onDragStart($event)"
         [class.dragging]="isDragging">
      <!-- Drag handle -->
      <div class="drag-handle">
        <svg width="16" height="10" viewBox="0 0 16 10">
          <circle cx="3" cy="2" r="1.5" fill="#aaa"/><circle cx="8" cy="2" r="1.5" fill="#aaa"/><circle cx="13" cy="2" r="1.5" fill="#aaa"/>
          <circle cx="3" cy="8" r="1.5" fill="#aaa"/><circle cx="8" cy="8" r="1.5" fill="#aaa"/><circle cx="13" cy="8" r="1.5" fill="#aaa"/>
        </svg>
      </div>

      <!-- Drawing tools (only for editable / host) -->
      @if (isEditable) {
        <div class="callout-tools">
          <button class="tool-btn" [class.active]="activeTool === 'rect'"
                  (click)="setTool('rect');$event.stopPropagation()" title="Rectangle">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <rect x="2" y="2" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <button class="tool-btn" [class.active]="activeTool === 'freehand'"
                  (click)="setTool('freehand');$event.stopPropagation()" title="Freehand">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path d="M2 14C4 8 8 4 16 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="tool-btn" [class.active]="activeTool === 'arrow'"
                  (click)="setTool('arrow');$event.stopPropagation()" title="Arrow">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <line x1="2" y1="16" x2="14" y2="4" stroke="currentColor" stroke-width="2"/>
              <polyline points="8,3 15,3 15,10" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <button class="tool-btn color-btn" (click)="cycleColor();$event.stopPropagation()" title="Change Color">
            <div class="color-swatch" [style.backgroundColor]="activeColor"></div>
          </button>

          <div class="toolbar-divider"></div>

          <button class="tool-btn" (click)="undo();$event.stopPropagation()" title="Undo" [disabled]="highlights.length === 0">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path d="M4 8L2 6L4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M2 6H12C14.2 6 16 7.8 16 10C16 12.2 14.2 14 12 14H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="tool-btn" (click)="clearAll();$event.stopPropagation()" title="Clear All" [disabled]="highlights.length === 0">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <line x1="4" y1="4" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="14" y1="4" x2="4" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <button class="tool-btn" (click)="zoomOut();$event.stopPropagation()"
                  title="Zoom out" [disabled]="!canZoomOut">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <circle cx="7.5" cy="7.5" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
              <line x1="5" y1="7.5" x2="10" y2="7.5" stroke="currentColor" stroke-width="2"/>
              <line x1="11.5" y1="11.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="tool-btn zoom-label" (click)="resetZoom();$event.stopPropagation()"
                  title="Reset zoom">{{ zoomPercent }}%</button>
          <button class="tool-btn" (click)="zoomIn();$event.stopPropagation()"
                  title="Zoom in" [disabled]="!canZoomIn">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <circle cx="7.5" cy="7.5" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
              <line x1="5" y1="7.5" x2="10" y2="7.5" stroke="currentColor" stroke-width="2"/>
              <line x1="7.5" y1="5" x2="7.5" y2="10" stroke="currentColor" stroke-width="2"/>
              <line x1="11.5" y1="11.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Image + SVG drawing overlay -->
    <div class="callout-image-wrapper">
      <img #calloutImage
           [src]="imageUrl"
           class="callout-image"
           [style.width.px]="displayWidth"
           (load)="onImageLoaded()"
           draggable="false" />

      <!-- SVG overlay for drawing highlights -->
      <svg #svgOverlay
           class="callout-svg-overlay"
           [attr.width]="getDisplayWidth()"
           [attr.height]="getDisplayHeight()"
           [class.drawing]="isEditable && activeTool"
           (mousedown)="onDrawStart($event)"
           (mousemove)="onDrawMove($event)"
           (mouseup)="onDrawEnd($event)"
           (mouseleave)="onDrawEnd($event)">

        <defs>
          <marker id="callout-arrowhead" markerWidth="10" markerHeight="7"
                  refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
            <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
          </marker>
        </defs>

        @for (h of highlights; track h.id) {
          @if (h.type === 'rect') {
            <rect [attr.x]="getRectAttrs(h).x" [attr.y]="getRectAttrs(h).y"
                  [attr.width]="getRectAttrs(h).width" [attr.height]="getRectAttrs(h).height"
                  [attr.stroke]="h.color" fill="none" [attr.stroke-width]="h.strokeWidth" />
          }
          @if (h.type === 'freehand') {
            <polyline [attr.points]="toSvgPolylinePoints(h.points)"
                      [attr.stroke]="h.color" fill="none" [attr.stroke-width]="h.strokeWidth"
                      stroke-linecap="round" stroke-linejoin="round" />
          }
          @if (h.type === 'arrow') {
            <line [attr.x1]="getArrowAttrs(h).x1" [attr.y1]="getArrowAttrs(h).y1"
                  [attr.x2]="getArrowAttrs(h).x2" [attr.y2]="getArrowAttrs(h).y2"
                  [attr.stroke]="h.color" [attr.stroke-width]="h.strokeWidth"
                  marker-end="url(#callout-arrowhead)" />
          }
        }

        @if (currentDraw) {
          @if (currentDraw.type === 'rect' && currentDraw.points.length >= 2) {
            <rect [attr.x]="getRectAttrs(currentDraw).x" [attr.y]="getRectAttrs(currentDraw).y"
                  [attr.width]="getRectAttrs(currentDraw).width" [attr.height]="getRectAttrs(currentDraw).height"
                  [attr.stroke]="currentDraw.color" fill="none" [attr.stroke-width]="currentDraw.strokeWidth"
                  stroke-dasharray="4 2" />
          }
          @if (currentDraw.type === 'freehand') {
            <polyline [attr.points]="toSvgPolylinePoints(currentDraw.points)"
                      [attr.stroke]="currentDraw.color" fill="none" [attr.stroke-width]="currentDraw.strokeWidth"
                      stroke-linecap="round" stroke-linejoin="round" />
          }
          @if (currentDraw.type === 'arrow' && currentDraw.points.length >= 2) {
            <line [attr.x1]="getArrowAttrs(currentDraw).x1" [attr.y1]="getArrowAttrs(currentDraw).y1"
                  [attr.x2]="getArrowAttrs(currentDraw).x2" [attr.y2]="getArrowAttrs(currentDraw).y2"
                  [attr.stroke]="currentDraw.color" [attr.stroke-width]="currentDraw.strokeWidth"
                  stroke-dasharray="4 2" marker-end="url(#callout-arrowhead)" />
          }
        }
      </svg>
    </div>
  </div>
</div>
