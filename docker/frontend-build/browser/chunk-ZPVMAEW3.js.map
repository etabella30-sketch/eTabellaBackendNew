
<div class="w-full h-full p-5">
  <header>
    <span class="text-lg flex gap-3 items-center mb-3 text-white">
      <btn mode="white" class="" addcls="hover:!bg-white" [matMenuTriggerFor]="menu">
        <ng-container *ngIf="selectedFilters.length; else chooseFilter">+ Filter Group</ng-container>
        <ng-template #chooseFilter>{{ 'COMMON.CHOOSE_FILTER_GROUP' | translate }}</ng-template>
      </btn>
      <mat-menu #menu="matMenu" class="mt-1 !min-w-[156px] !max-w-[156px] p-2.5">
        <div class="flex flex-col gap-2f">
          <ng-container *ngFor="let x of filters; trackBy: trackByFilterOption">
            <div (click)="addfilter(x)" (keydown)="$event.key === 'Enter' && addfilter(x)" 
              class="hover:bg-reply group relative p-2 px-5 text-xs flex items-center cursor-pointer rounded-base">
              {{x.name}}
              <ng-container *ngIf="selectedFilters.includes(x.value)">
                <icon class="ms-auto absolute right-5" name="addfill" />
              </ng-container>
            </div>
          </ng-container>
        </div>
      </mat-menu>
      <btn mode="white" (click)="cancelFilter()" (keydown)="$event.key === 'Enter' && cancelFilter()" class="" addcls="hover:!bg-white">Cancel</btn>
      <btn mode="white" (click)="saveFilter(true)" (keydown)="$event.key === 'Enter' && saveFilter(true)" class="" addcls="hover:!bg-white">Save</btn>
      <btn mode="white" (click)="clearAllFilter()" (keydown)="$event.key === 'Enter' && clearAllFilter()" class="" addcls="hover:!bg-white"
        [class]="selectedFilters.length ?'':'opacity-50 pointer-events-none'">Clear All Filter</btn>
    </span>
  </header>

  <ng-container *ngIf="nUserid && selectedFilters.length">
    <div class="bg-white px-2.5 rounded-base flex flex-col divide-y gap-2 max-h-[calc(100%-40px)] overflow-auto filter-area">
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.CL)">
        <claims [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jClaims)]="jClaims"></claims>
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.I)">
        <issues [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jIssues)]="jIssues" [(jRels)]="jRels" [(jImps)]="jImps" [(IsNote)]="IsNote" [(IsFactlink)]="IsFactlink" [(IsComment)]="IsComment" [tab]="tab"></issues>
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.FD)">
        <factdetailfilter [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jDate)]="jDate" [(jFiletypes)]="jFiletypes" [(jLevels)]="jLevels" [(jFilters)]="jFilters" [(jStatus)]="jStatus" [(createDate)]="createDate" [(createBy)]="createBy"></factdetailfilter>
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.C)">
        <factcontactfilter [nCaseid]="nCaseid" [contactFilter]="contactFilter" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jContacts)]="jContacts" [(jCRoles)]="jCRoles" [(jCPartys)]="jCPartys" [(jCCompanies)]="jCCompanies" [(IsContactNote)]="IsContactNote"></factcontactfilter>
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.T)">
        <facttaskfilter [nCaseid]="nCaseid" [nUserid]="nUserid" [selectedFilters]="selectedFilters" [(jTasks)]="jTasks" [(IsTaskDesc)]="IsTaskDesc" [(jTShared)]="jTShared" [(jTStatus)]="jTStatus" [(jTPriority)]="jTPriority" [(dTDate)]="dTDate"></facttaskfilter>
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.QF)">
        <!-- Add Qfact sub-filter here if needed -->
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.L)">
        <!-- Add Link sub-filter here if needed -->
      </ng-container>
      <ng-container *ngIf="selectedFilters.includes(FILTER_ITEM.QM)">
        <!-- Add Q Mark sub-filter here if needed -->
      </ng-container>
    </div>
  </ng-container>
</div>
