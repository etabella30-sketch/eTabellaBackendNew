<mat-form-field class="bg-white w-full ">
        <mat-select placeholder="Tasks" multiple #taskfltr [(ngModel)]="selected" name="item" panelClass="!p-0"
                (selectionChange)="OnSelect($event)">
                <!-- <mat-select-trigger class="py-0">
                        <input class="w-full border-none focus:shadow-none shadow-none focus:outline-none px-0.5"
                                placeholder="Tasks" #input type="text" [value]="selected">
                </mat-select-trigger> -->
                <mat-select-trigger class="py-0">
                        <span class="text-xs">Tasks</span>
                </mat-select-trigger>
                @for (x of gropuList; track x) {
                <mat-optgroup class="issdropgrup">
                        <div class="flex gap-2.5 text-xs font-semibold items-center cursor-pointer"
                                (click)="x.isopen=!x.isopen"> {{x.cCategory}}
                                <icon class="text-[8px]" name="chvy" class="-rotate-90" />
                        </div>
                        @for (y of x.sublist; track y) {

                        @if(x.cCategory == 'Timeline' && y.cKey == 'Custom' && x.isopen){
                        <mat-option [value]="y"
                                class="nocheck group my-0.5 [&>.mdc-list-item__primary-text]:!opacity-100 pointer-events-auto"
                                disabled style="
                                --mat-option-focus-state-layer-color:#ffffff00;
                                --mat-option-hover-state-layer-color:#ffffff00;
                                ">
                                <div
                                        class="flex gap-2.5 rounded-base py-1 items-center ps-6 group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate">
                                        <span class="relative size-4  flex items-center justify-center">
                                                <icon name="addcircle"
                                                        class="opacity-0 group-hover:opacity-100 text-base abolute group-[&.mdc-list-item--selected]:hidden" />
                                                <icon name="removecircle"
                                                        class="abolute hidden text-base group-[&.mdc-list-item--selected]:inline-block" />
                                        </span>
                                        <div>
                                                <span>Custom</span>
                                                <div class="flex text-base  gap-2 pe-2 " style="pointer-events: all;">
                                                        <input class="w-12" [(ngModel)]="y.cValue" />
                                                        <btn (click)="customDay(y);$event.stopPropagation();"
                                                                [disabled]="!y.cValue || y.cValue ==''">
                                                                Done</btn>
                                                </div>
                                        </div>
                                </div>
                        </mat-option>

                        }@else {

                        <mat-option (click)="taskfltr.close()" [ngClass]="{'!hidden': !x?.isopen}" [value]="y"
                                class="ps-3 nocheck group" style="
          --mat-option-focus-state-layer-color:#ffffff00;
          --mat-option-hover-state-layer-color:#ffffff00;
          ">
                                <div
                                        class="flex gap-2.5 rounded-base py-1 items-center ps-6 group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate">
                                        <span class="relative size-4  flex items-center justify-center">
                                                <icon name="addcircle"
                                                        class="opacity-0 group-hover:opacity-100 text-base abolute group-[&.mdc-list-item--selected]:hidden" />
                                                <icon name="removecircle"
                                                        class="abolute hidden text-base group-[&.mdc-list-item--selected]:inline-block" />
                                        </span>
                                        <span class="h-3 w-1 rounded-2xl block"></span>
                                        {{y.cKey}}
                                </div>
                        </mat-option>
                        }

                        }

                </mat-optgroup>
                }
                <mat-option (click)="taskfltr.close()"
                        class="nocheck !sticky bottom-0 h-12 !bg-white overflow-visible !py-3" style=" 
--mat-option-focus-state-layer-color:#ffffff00;
--mat-option-hover-state-layer-color:#ffffff00;
" [value]="0">
                        <div
                                class="flex gap-2.5 shadow-base rounded-base py-1 items-center  group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate justify-center">
                                Select All
                        </div>
                </mat-option>
                <!-- } -->
        </mat-select>
</mat-form-field>

@if(selected?.length){
<div class="p-2.5 bg-white rounded-base flex items-center flex-wrap gap-1 mt-2">
        @for (x of selected; track $index) {
        <span
                class="bg-white shadow-base rounded-base flex items-center  py-2  ps-2 pe-3 gap-2 text-xs w-fit cursor-pointer text-grey">
                <span>
                        {{x.cKey}}</span>
                <icon name="backspace" type="extra" class="text-sm" (click)="remove($index)" />
        </span>
        }


</div>
}
