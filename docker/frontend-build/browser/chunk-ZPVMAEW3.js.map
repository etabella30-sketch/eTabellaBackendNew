<mat-form-field class="bg-white w-full ">
        <mat-select placeholder="Relevance" multiple #relevancefltr [(ngModel)]="selected" name="item" panelClass="!p-0"
                (selectionChange)="OnSelect($event)">
                <!-- <mat-select-trigger class="py-0">
                        <input class="w-full border-none focus:shadow-none shadow-none focus:outline-none px-0.5" #input
                                placeholder="Relavance" type="text" [value]="selected">
                </mat-select-trigger> -->
                <mat-select-trigger class="py-0">
                        <span class="text-xs">Relevance</span>
                </mat-select-trigger>
                @for (x of relevance; track $index) {
                <mat-option (click)="relevancefltr.close()" [value]="x" class="nocheck group my-0.5" style="
--mat-option-focus-state-layer-color:#ffffff00;
--mat-option-hover-state-layer-color:#ffffff00;
">
                        <div
                                class="flex gap-2.5 rounded-base py-1 items-center ps-6 group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate">
                                <span class="relative size-4  flex items-center justify-center">
                                        <icon name="addcircle"
                                                class="opacity-0 group-hover:opacity-100 text-base abolute group-[&.mdc-list-item--selected]:hidden" />
                                        <icon name="removecircle"
                                                class="abolute hidden text-base group-[&.mdc-list-item--selected]:inline-block" />
                                </span>
                                {{x.cKey}}
                        </div>
                </mat-option>

                }
                <mat-option (click)="relevancefltr.close()"
                        class="nocheck !sticky bottom-0 h-12 !bg-white overflow-visible !py-3" style="
--mat-option-focus-state-layer-color:#ffffff00;
--mat-option-hover-state-layer-color:#ffffff00;
" [value]="0">
                        <div
                                class="flex gap-2.5 shadow-base rounded-base py-1 items-center  group-[&.mdc-list-item--selected]:text-white group-[&.mdc-list-item--selected]:bg-blue-on hover:bg-blue-deactivate justify-center">
                                Select All
                        </div>
                </mat-option>
                <!-- } -->
        </mat-select>
</mat-form-field>




@if(selected?.length){
<div class="p-2.5 bg-white rounded-base flex items-center flex-wrap gap-1 mt-2">
        @for (x of selected; track $index) {
        <span
                class="bg-white shadow-base rounded-base flex items-center  py-2  ps-2 pe-3 gap-2 text-xs w-fit cursor-pointer text-grey">
                <span>{{x.cKey}}</span>
                <icon name="backspace" type="extra" class="text-sm" (click)="remove($index)" />
        </span>
        }
        @if(isMessage && selected?.length && selected?.length == relevance?.length) {
        <div class="p-5 flex items-center gap-2.5 bg-grey text-sm text-white mt-2 w-full">
                <span class="flex items-center gap-2.5">
                        <icon name="info" class="text-base" />
                        All Relevance selected
                </span>
                <icon name="close" class="text-xs ms-auto" (click)="isMessage = false" />
        </div>
        }

</div>
}
