<div class="flex flex-col gap-6 p-10 w-full h-full">
  <!-- Header -->
  <div class="flex items-center justify-between pr-10">
    <!-- Left Section -->
    <div class="flex items-center gap-2.5 pr-5">
      <icon name="transcript" type="myfileicn" class="text-grey text-xl"></icon>
      <h1 class="text-lg font-semibold text-grey tracking-tighter italic">Transcript Import</h1>
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-2.5">
      <avtr [size]="'sm'" [detail]="userDetails"></avtr>
      <btn 
        mode="white"
        [issmall]="true"
          addcls="shadow-base"
        (click)="onSignOut()">
        <span class="text-xs text-grey">Sign out</span>
      </btn>
    </div>
  </div>

  <!-- Action Button -->
  <div class="flex">
      <btn 
        mode="solid"
        [issmall]="true"
        addcls="bg-brand text-white"
        (click)="importTranscript()">
      <span class="text-xs">Import Transcript</span>
    </btn>
  </div>

  <!-- Table -->
  <transcript-table (onEvent)="tableEvent($event)" [selectedTheme]="selectedTheme" class="h-full" ></transcript-table>
</div>
