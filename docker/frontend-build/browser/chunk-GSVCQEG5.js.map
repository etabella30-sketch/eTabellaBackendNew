<div class="p-10 bg-[#F4F6F9]">
  <!-- <h6 class="text-base flex justify-between font-semibold mb-7">{{permission == 'N' ? 'Create' : 'Update'}} Section
        <icon name="close" class="text-xs ms-auto cursor-pointer hover:text-blue-500" (click)="close()" />
    </h6> -->
  <h6 class="text-lg font-semibold mb-2">Publish Transcript</h6>
  <div class="mb-5">
    <div class="flex-1 mb-2.5">
      <h6 class="font-semibold text-xs text-grey mb-2">Case Name</h6>
      <mat-select placeholder="Select case name"
        class="w-full border bg-white border-tab text-xs text-grey rounded-base" [(ngModel)]="nCaseid"
        (selectionChange)="getSessionCombo()">
        @for (theme of cases; track theme.nCaseid) {
        <mat-option [value]="theme.nCaseid">
          {{ theme.cCasename }}
        </mat-option>
        }
      </mat-select>
    </div>
    <div class="flex-1">
      <h6 class="font-semibold text-xs text-grey mb-2">Session</h6>
      <mat-select placeholder="Select session" class="w-full border bg-white border-tab text-xs text-grey rounded-base"
        [(ngModel)]="nSesid">
        @for (theme of sessions; track theme.nSesid) {
        <mat-option [value]="theme.nSesid">
          {{ theme.cName }}
        </mat-option>
        }
      </mat-select>
    </div>
  </div>
  <div class="flex gap-2">
    <btn [disabled]="!cTransid || !nCaseid || !nSesid" (click)="publish()" [isloading]="isLoading">Publish</btn>
    <btn mode="white" (click)="close()">Cancel</btn>
  </div>


  <mat-menu #PublishConfirmMenu="matMenu" class="!bg-black p-5  rounded-base" xPosition="before">
    <div>
      <h4 class="mb-6 min-w-64 text-white text-xs"></h4>
      <h6 class="mb-6 min-w-64 text-white text-xs">Are you sure you want to publish despite these issues?</h6>
      <div class="flex gap-2">
        <btn (click)="publish(true)">
          Yes, Publish Anyway</btn>
        <btn mode="dark">Cancel</btn>
      </div>
    </div>
  </mat-menu>
  <button [matMenuTriggerFor]="PublishConfirmMenu" #menuTrigger="matMenuTrigger" style="display: none;">
  </button>
</div>
