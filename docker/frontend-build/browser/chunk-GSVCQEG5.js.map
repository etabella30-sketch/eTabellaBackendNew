@if (!mainpreview) {
<div class="h-8 flex items-center px-5">
    <h6>Print preview</h6>
</div>
}
<div class="flex flex-col gap-2 h-full" [class]="mainpreview ? '' : 'p-5 bg-[#8A8A8A]'">
    <ngx-extended-pdf-viewer class="block h-full" #pdfViewer [src]="pdfSrc" [showToolbar]="false"
        [activeSidebarView]="1" [showBorders]="false">
    </ngx-extended-pdf-viewer>
</div>
