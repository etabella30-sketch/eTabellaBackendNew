<div class="h-full max-h-full overflow-auto  relative block bg-white" [class]="iscomponent?'h-full':'h-fit'">



  <form class="addnewcontact error py-5 flex flex-col h-fit" [formGroup]="frm" [hidden]="active_forms!=''">

    <div class="text-lg font-semibold items-center gap-2 flex mb-6 px-5 h-8.5" #header>
      <icon name="chvy" class="text-xs me-2 mt-px" (click)="back()" />
      <!-- {{frm.value.permission == 'N' ? 'Add ' : 'Edit ' }} Contact -->
      Contact
    </div>



    <div class="inputs h-full overflow-auto px-5">
      <div class="mb-6 flex items-center gap-6">
        <span
          class="flex items-center justify-center rounded-full text-center leading-4 text-xs font-medium h-[35px] w-[35px] bg-gray-300"
          *ngIf="!frm.value.cProfile||frm.value.cProfile==''">
        </span>
        <img
          class="flex items-center justify-center rounded-full text-center leading-4 text-xs font-medium h-[35px] w-[35px] bg-gray-300"
          [src]="profileUrl + frm.value.cProfile" *ngIf="frm.value.cProfile&&frm.value.cProfile!=''">
        <input type="file" name="profile" #someInput id="profile" class="!hidden"
          accept="image/png, image/jpg, image/jpeg,image/svg" (change)="onFileChange($event)">
        <btn mode="outlined" (click)="imgpicker()">
          <span *ngIf="!frm.value.cProfile||frm.value.cProfile==''">Upload</span>
          <span *ngIf="frm.value.cProfile&&frm.value.cProfile!=''">Edit</span>
        </btn>
      </div>
      <label for="frstname">
        <h6 class="text-xs mb-2 font-semibold">First Name <span class="valid-star">*</span></h6>
        <input class="main-input" [class.error]="frm.get('cFname').invalid&&formsubmit" formControlName="cFname"
          type="text" id="frstname">
        <ng-container *ngFor="let validation of validation_messages.cFname">
          <div class="validators-required validation-required validation"
            *ngIf="(frm.get('cFname').hasError(validation.type)&&formsubmit)">
            {{ validation.message }}
          </div>
        </ng-container>
      </label>

      <label for="lstname">
        <h6 class="text-xs mb-2 font-semibold">Last Name <span class="valid-star">*</span></h6>
        <input class="main-input" [class.error]="frm.get('cLname').invalid&&formsubmit" formControlName="cLname"
          type="text" id="lstname">
        <ng-container *ngFor="let validation of validation_messages.cLname">
          <div class="validators-required validation-required validation"
            *ngIf="(frm.get('cLname').hasError(validation.type)&&formsubmit)">
            {{ validation.message }}
          </div>
        </ng-container>
      </label>
      <label for="Email">
        <h6 class="text-xs mb-2 font-semibold">Email <span class="valid-star">*</span></h6>
        <input class="main-input" [class.error]="frm.get('cEmail').invalid&&formsubmit" formControlName="cEmail"
          type="text" id="Email">
        <ng-container *ngFor="let validation of validation_messages.cEmail">
          <div class="validators-required validation-required validation"
            *ngIf="(frm.get('cEmail').hasError(validation.type)&&formsubmit)">
            {{ validation.message }}
          </div>
        </ng-container>
      </label>

      <div class="w-full flex gap-2.5">
        <!-- <label for="cMentiontag" class="block w-full">
          <h6 class="text-xs mb-2 font-semibold flex items-centerf">Mention Tag <span class="valid-star ms-1">*</span>

              </svg>
              <div
                class="p-2.5 absolute top-full -left-8 mt-2 hidden group-hover:block z-[999] bg-black rounded-base text-white text-xs w-[413px]">
                Used to reference this person in notes or facts.
                Typing ‘&#64;’ followed by this tag (e.g. &#64;name) will link to this contact.
              </div>
            </div>


          </h6>
          <div class="relative">
            <input class="main-input ps-10" [class.error]="frm.get('cMentiontag').invalid&&formsubmit"
              formControlName="cMentiontag" type="text" id="cMentiontag" (blur)="checkMentionExists($event)"
              (keypress)="onMentiontagKeyPress($event)">
            <span class="absolute top-1/2 -translate-y-1/2 left-3 text-xs text-gray-300">
              &#64;
            </span>
          </div>
          <ng-container *ngFor="let validation of validation_messages.cMentiontag">
            <div class="validators-required validation-required validation"
              *ngIf="(frm.get('cMentiontag').hasError(validation.type)&&formsubmit)">
              {{ validation.message }}
            </div>
          </ng-container>


          @if(isTagExists){
          <ng-container>
            <div class="validators-required validation-required validation">
              Tag already exists
            </div>
          </ng-container>
          }


        </label> -->
        <label class="selects w-full">
          <h6 class="text-xs mb-2 font-semibold">Company <span class="valid-star">*</span></h6>
          <div class="flex gap-2">
            <div class="w-full">
              <div mat-button [matMenuTriggerFor]="companyMenu" #company="matMenuTrigger"
                (menuClosed)="CompanyValue = '';addnewcompany=false"
                [class]="company.menuOpen ? 'shadow-[0px_0px_6px_#0051ff]' : ''"
                class="w-full h-8.5 flex items-center justify-between px-3 border border-tab rounded-base text-left bg-white"
                [class.error]="frm.get('nCompanyid').invalid && formsubmit">
                <span class="text-xs">{{ selectedCompanyText }}</span>
                <icon name="chvx" class="text-xxs"></icon>
              </div>

              <mat-menu #companyMenu="matMenu" class="role-menu !min-w-[480px]  ">
                <div class="flex gap-1 flex-col p-3 pb-0 max-h-[300px] overflow-auto">
                  @for (company of company_list; track company.nCompanyid) {

                  @if (!company.isEdit) {
                  <div (click)="selectCompany(company)"
                    class="min-h-6 text-xs px-2.5 flex items-center group rounded-lg hover:shadow-[0px_0px_6px_#0051ff]">
                    {{ company.cCompany }}

                    @if (company.canEdit ?? true) {
                    <div class="gap-2.5 hidden group-hover:flex ms-auto items-center"
                      (click)="$event.stopPropagation()">
                      <icon name="edit" matTooltip="Edit"
                        (click)="$event.stopPropagation(); editcompany(company, $index)" class="hover:text-blue-on">
                      </icon>
                      <icon name="removefill" matTooltip="Delete" (click)="deleteCompany(company, $event)"
                        class="hover:text-blue-on"></icon>
                    </div>
                    }
                  </div>
                  } @else {
                  <!-- (blur)="onCompanyEditBlur(company, $event)" -->
                  <button class="main-input focus-within:shadow-[0px_0px_6px_#0051ff]">
                    <input type="text" (keypress)="onCompanyEditKeyPress(company, $event)"
                      (click)="$event.stopPropagation()" [id]="'companyeditinput' + $index"
                      [value]="company.cCompany" />
                    <span class="flex size-4 items-center justify-center text-xs text-gray-300">
                      <icon name="check" class="text-xs"></icon>
                    </span>
                  </button>

                  }
                  }
                </div>
                <div class="sticky bottom-0 p-2.5">
                  @if (!addnewcompany) {
                  <div (click)="$event.stopPropagation(); addnewcompanyfn()"
                    class="h-6 text-xs px-2.5 flex items-center group rounded-lg text-blue-on bg-blue-deactivate gap-2.5 ">
                    <icon name="addcircle"></icon>
                    Add a new company
                  </div>
                  } @else {
                  <!-- (blur)="onAddCompanyBlur($event)" -->
                  <!-- (keypress)="onAddCompanyKeyPress($event)" -->
                  <button
                    class="flex items-center gap-2.5 h-8.5 px-2.5 rounded-base border border-blue-deactivate w-full focus-within:shadow-[0px_0px_6px_#0051ff]"
                    (click)="$event.stopPropagation()">
                    <input type="text" id="companymaininput" [(ngModel)]="CompanyValue"
                      [ngModelOptions]="{standalone:true}" (keypress)="onAddCompanyKeyPress($event)"
                      (keypress.enter)="onAddCompanyBlur($event)"
                      class="!border-none !p-0 !rounded-none !shadow-none w-full" />
                    <span class="flex size-4 items-center justify-center text-xs text-blue-on bg-white shadow-sm"
                      (click)="$event.stopPropagation();onAddCompanyBlur($event)">
                      <icon name="check" class="text-xs "></icon>
                    </span>
                  </button>
                  }
                </div>
              </mat-menu>
            </div>
          </div>
        </label>
        <label for="cOccupation" class="block w-full">
          <h6 class="text-xs mb-2 font-semibold">Occupation <span class="valid-star">*</span> </h6>
          <input class="main-input" [class.error]="frm.get('cOccupation').invalid&&formsubmit"
            formControlName="cOccupation" type="text" id="cOccupation">
          <h6></h6>
        </label>
      </div>

      

      <!-- <label class="selects">
        <h6 class="text-xs mb-2 font-semibold">Phone no <span class="valid-star">*</span></h6>

        <ngx-intl-tel-input #phoneInput class="main-input" name="cMobile" [(ngModel)]="mobileValue"
          [ngModelOptions]="{standalone:true}" [cssClass]="'custom'" [enableAutoCountrySelect]="false"
          [enablePlaceholder]="true" [searchCountryFlag]="true" [selectFirstCountry]="false" [maxLength]="15"

            {{ validation.message }}
          </div>
        </ng-container>
      </label> -->

        <div>
          <h6 class="text-xs font-semibold mb-2 focus-visible:outline-none focus-visible:border-gray-400">
            Time Zone <span class="text-red-500">*</span></h6>
          <div class="w-full flex items-baseline gap-2 ">

                  {{ x.cKey }}
                </mat-option>

            </btn>

              Enable user timezone
            </btn>
            }
          </div>

      </label> -->



      <div class="w-full flex gap-2.5">


        <label class="selects w-full">
          <h6 class="text-xs mb-2 font-semibold">Role in case <span class="valid-star">*</span></h6>
          <div class="flex gap-2">
            <div class="w-full">
              <div mat-button [matMenuTriggerFor]="roleMenu" #role="matMenuTrigger"
                [class]="role.menuOpen ? 'shadow-[0px_0px_6px_#0051ff]' : ''"
                class="w-full h-8.5 flex items-center justify-between px-3 border border-tab  rounded-base text-left bg-white "
                [class.error]="frm.get('nRoleid').invalid&&formsubmit">
                <span class="text-xs">{{selectedRoleText}}</span>
                <icon name="chvx" class="text-xxs"></icon>
              </div>
              <mat-menu #roleMenu="matMenu" class="role-menu !min-w-[234px] ">
                <div class="flex gap-1 flex-col p-3 max-h-[300px] overflow-auto">
                  @for (role of role_list; track role.nCRoleid) {


                  @if(!role.isEdit){

                  <div (click)="selectRole(role)"
                    class="min-h-6 text-xs px-2.5 flex items-center group rounded-lg hover:shadow-[0px_0px_6px_#0051ff] ">
                    {{ role.cRole }}

                    @if(role.canEdit){
                    <!--user created roles -->
                    <div class="gap-2.5 hidden group-hover:flex ms-auto  items-center"
                      (click)="$event.stopPropagation()">
                      <icon name="edit" matTooltip="Edit" (click)="$event.stopPropagation();editrole(role,$index)"
                        class="hover:text-blue-on">
                      </icon>
                      <icon name="removefill" matTooltip="Delete" (click)="deleteRole(role, $event)"
                        class="hover:text-blue-on"></icon>
                    </div>
                    }
                  </div>
                  }
                  @else {
                  <!-- (blur)="onRoleEditBlur(role, $event)"  -->
                  <input type="text" #editinput (keypress)="onRoleEditKeyPress(role, $event)"
                    (click)="$event.stopPropagation()" [id]="'editinput'+$index" [value]="role.cRole"
                    class="main-input focus:shadow-[0px_0px_6px_#0051ff]">
                  }
                  }

                </div>
                <div class="sticky bottom-0 p-2.5">
                  @if(!addnewrole){
                  <div (click)="$event.stopPropagation();addnewrolefn()"
                    class="h-6 text-xs px-2.5 flex items-center group rounded-lg text-blue-on bg-blue-deactivate gap-2.5">
                    <icon name="addcircle"></icon>
                    Add a new role
                  </div>
                  }
                  @else {
                  <!-- (blur)="onAddRoleBlur($event)" -->
                  <input type="text" id="maininput" (click)="$event.stopPropagation()"
                    (keypress)="onAddRoleKeyPress($event)" (keypress.enter)="onAddRoleBlur($event)"
                    class="main-input focus:shadow-[0px_0px_6px_#0051ff]">
                  }
                </div>
              </mat-menu>
            </div>
            <!-- (click)="showaddrole=!showaddrole" -->
            <!-- <btn [square]="true" mode="outlined" class="w-fit" (click)="choose_form('R')">
              <icon name="edit" />
            </btn> -->
          </div>
        </label>
        <label class="selects w-full">
          <h6 class="text-xs mb-2 font-semibold">Party <span class="valid-star">*</span></h6>
          <div class="flex gap-2">
            <mat-form-field appearance="fill" class="h-8.5 w-full">
              <mat-select panelClass="sortfltrpnl contactnew" disableOptionCentering class="sortfilterslct addcont"
                placeholder="Select..." formControlName="nPartyid"
                [class.error]="frm.get('nPartyid').invalid&&formsubmit">
                <mat-option class="sortfltroptn" *ngFor="let x of party_list" [value]="x.nValue">
                  {{x.cKey}}
                </mat-option>
              </mat-select>
            </mat-form-field>
            <!-- (click)="showaddrole=!showaddrole" -->
            <!-- <btn [square]="true" mode="outlined" class="w-fit" (click)="choose_form('P')">
              <icon name="edit" />
            </btn> -->
          </div>
        </label>


      </div>

      <label for="note" class="selects">

        <textarea class="style" rows="3" type="text" id="note" formControlName="cNote" maxlength="250"
          placeholder="Add Note"></textarea>
      </label>
      <btn class="w-full " addcls="w-full" (click)="onsubmit()" [disabled]="frm.invalid">
        {{cPermission === 'N'?'Add':'Update'}}
      </btn>
    </div>
  </form>
  <!-- @if(active_forms=='R'){
  <app-roles class="h-full absolute top-0 w-full bg-white" [nCaseid]="nCaseid" [role_list]="role_list"
    (roleparent)="responce_child($event)">
  </app-roles>
  }
  @if(active_forms=='C'){
  <app-company class="h-full absolute top-0 w-full bg-white" [nCaseid]="nCaseid" [company_list]="company_list"
    (roleparent)="responce_child($event)">
  </app-company>
  } -->
</div>
