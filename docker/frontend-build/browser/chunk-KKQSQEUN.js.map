<div class="h-full flex flex-col overflow-hidden">
    <div class="text-lg font-semibold items-center gap-2 flex px-5 py-2.5">
        <icon (click)="back()" name="chvy" class="text-base" />
        Edit Occupation
        <btn mode="outlined" class="w-fit ms-auto" [square]="true" (click)="addnewrole()">
            <icon name="addfill" type="comnicn" />
        </btn>
    </div>

    <!-- <input id="roleinput" class="main-input" type="text"> -->
    <div class="overflow-auto h-full py-1.5 px-5">
        @if(showroleinput){
        <div for="frstname" class="p-2  flex gap-2 items-center">
            <input id="roleinput" class="main-input" [(ngModel)]="newrole" type="text">
            <btn (click)="save_role()">OK</btn>
        </div>
        }
        <div class="py-2 flex flex-col gap-2">
            @for (r of role_list; track $index) {
            <div class="bg-white text-grey rounded-base group hover:shadow-[1px_1px_8px_#0000001a] p-2.5 text-xs group flex items-center justify-between"
                [ngClass]="{'iseditable': r.iseditable,'disable':r.cIsdefault=='Y'}">
                <h6 *ngIf="!r.iseditable">{{r.cRole}}</h6>
                <input *ngIf="r.iseditable" class="main-input" type="text" id="{{'editrole'+ $index}}"
                    [(ngModel)]="r.cRole" (keyup.enter)="save_rolename($event,r)" maxlength="55" name="text"
                    class="dropnew me-2">
                <!-- <div class="edtcontct" *ngIf="r.cIsdefault!='Y'">
                    <icon name="edit" (click)="r.iseditable=!r.iseditable;">
                    </icon>
                    <icon name="delete" (click)="remove_role(r,$index)"> </icon>
                </div> -->
                <div class="flex opacity-0 gap-2 group-hover:opacity-100" *ngIf="r.cIsdefault!='Y'">
                    <btn mode="outlined" (click)="r.iseditable=!r.iseditable;editRole('E')" [square]="true">
                        <icon name="edit" />
                    </btn>
                    <btn mode="outlined" [square]="true" (click)="remove_role(r,$index)">
                        <icon name="delete"> </icon>
                    </btn>
                </div>
            </div>
            }
        </div>
    </div>


</div>
