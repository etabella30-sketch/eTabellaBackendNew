<div class="addnewcontact error  flex flex-col overflow-hidden h-full">
  <div class="text-lg px-5 py-2.5 font-semibold items-center gap-2 flex sticky top-0 bg-white">
    <icon (click)="back()" name="chvy" class="text-base" />
    Edit Company
    <btn mode="outlined" class="w-fit ms-auto" [square]="true" (click)="addnewcomp()">
      <icon name="addfill" type="comnicn" />
    </btn>
  </div>
  <div class="px-5 pt-1.5 overflow-auto h-full">

    @if (showcompinput) {
    <div for="frstname" class="p-2 flex gap-2 items-center">
      <input class="main-input" [(ngModel)]="newcomp" type="text" id="compinput">
      <btn (click)="save_comp()">OK</btn>
    </div>
    }

    <div class="py-2 flex flex-col gap-2">
      @for (r of company_list; track $index) {
      <div
        class="bg-white text-grey rounded-base group hover:shadow-[1px_1px_8px_#0000001a] p-2.5 text-xs group flex items-center justify-between"
        [class.iseditable]="r.iseditable" [ngClass]="{'iseditable': r.iseditable}">
        <h6 *ngIf="!r.iseditable">{{r.cCompany}}</h6>
        <input *ngIf="r.iseditable" class="main-input" type="text" id="{{'editrole'+ $index}}" [(ngModel)]="r.cCompany"
          (keydown.enter)="save_rolename($event,r)" maxlength="55" name="text" class="dropnew"
          onInput="this.parentNode.dataset.replicatedValue = this.value">
        <div class="flex opacity-0 gap-2 group-hover:opacity-100">
          <btn mode="outlined" (click)="r.iseditable=!r.iseditable;" [square]="true">
            <icon name="edit" />
          </btn>
          <btn mode="outlined" [square]="true" (click)="remove_comp(r,$index)">
            <icon name="delete"> </icon>
          </btn>
        </div>
      </div>
      }
    </div>
  </div>
