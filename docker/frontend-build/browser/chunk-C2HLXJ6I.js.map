@if(docInfo.cPath && filetype == 'pdf'){
<ngx-extended-pdf-viewer [src]="pdfSrc" [zoom]="'page-fit'" [pageViewMode]="'single'" [page]="onPage"
  [showToolbar]="false" [textLayer]="false" [height]="'100%'" class="h-full" (progress)="onProgress($event)"
  (pdfLoadingStarts)="onPdfLoadingStart($event)" (pdfLoadingFailed)="onPdfLoadingFailed($event)"
  (pagesLoaded)="OnPageLoad($event)" (dblclick)="onOpen()">
</ngx-extended-pdf-viewer>
} @else if(docInfo.cPath && (filetype == 'document' || filetype == 'image' || filetype == 'video' ||
filetype
== 'xlsx' || filetype
==
'ppt' || filetype == 'pptx' || filetype == 'msg')){
<doc-viewer [path]="docInfo.cPath" [filetype]="filetype" [isMyfile]="false" [bIsconvert]="docInfo.bIsconvert"
  [isRealtime]="docInfo.isRealtime" [nBundledetailid]="docInfo.nBundledetailid" [docInfo]="docInfo" [nCaseid]="nCaseid"></doc-viewer>
}

@if(!pdfLoaded){

<div
  class="min-h-full w-[842px] bg-white grid place-items-center transition-all origin-center mx-auto max-w-[100%] absolute top-0 left-1/2 -translate-x-1/2 z-20">
  <svg width="120" height="120" viewBox="0 0 100 100">
    <text alignment-baseline="baseline" x="70" y="70" text-anchor="middle">
      <tspan x="50" y="57" dy="-0.18em" font-size="20" font-weight="normal" fill="#444444">
        {{loadingProgress}}
      </tspan>
      <tspan font-size="10" font-weight="normal" fill="#444444">%</tspan><!---->
      <tspan x="50" y="57" dy="0.82em" font-size="10" font-weight="normal" fill="#A9A9A9">progress</tspan>
    </text>
    <circle cx="50" cy="50" r="45" stroke="#e6e6e6" stroke-width="5" fill="none" />
    <circle style="transform: rotate(270deg);transform-origin: center;stroke-linecap: round;"
      [attr.stroke-dashoffset]="282.743 - (loadingProgress / 100) * 282.743" class="progress-circle" cx="50" cy="50"
      r="45" stroke="#ff3d00" stroke-width="5" fill="none" stroke-dasharray="282.743" />
  </svg>
</div>
}
