<label class="px-2 border rounded-base h-8.5 flex items-center w-fit bg-white border-[#c2c2c2]">
        <input #hour type="tel" style="max-width: 25px;"
                class="text-xs outline-none text-center mt-px px-0 !border-none min-w-5 !shadow-none !bg-transparent" pattern="\d*"
                min="0" max="12" maxlength="2" placeholder="HH" (keydown)="preventNonNumeric($event)"
                (input)="validateInput($event,'H')" (keyup)="handleHourInput($event,minut)" [(ngModel)]="timeH"
                (change)="UpdateTime()" [disabled]="disabled">
        <span class="px-px">:</span>
        <input #minut type="tel" style="max-width: 25px;" min="1" max="12" maxlength="2" pattern="\d*" placeholder="MM"
                (keydown)="preventNonNumeric($event)" (keyup)="handleMinuteInput($event,hour)"
                class="text-xs text-center outline-none mt-px px-0 !border-none min-w-5 !shadow-none !bg-transparent"
                (input)="validateInput($event,'M')" [(ngModel)]="timeM" (change)="UpdateTime()" [disabled]="disabled">
        <ul class="flex w-fit gap-1 ms-1">
                <li>
                        <button [disabled]="disabled" [class]="ttype =='AM' ? '!text-blue-600 !bg-blue-100':''"  (click)="setAMPM('AM')"
                                class="inline-flex items-center justify-between w-fit px-2 py-1 text-center text-gray-500 bg-white rounded-lg cursor-pointer   hover:text-gray-600 hover:bg-gray-100">
                                <div class="block">
                                        <div class="w-full text-xs font-semibold">AM </div>
                                </div>
                        </button>
                </li>
                <li>
                        <button [disabled]="disabled" (click)="setAMPM('PM')" [class]="ttype =='PM' ? '!text-blue-600 !bg-blue-100':''"
                                class="inline-flex items-center justify-between w-fit px-2 py-1 text-center text-gray-500 bg-white rounded-lg cursor-pointer   hover:text-gray-600 hover:bg-gray-100">
                                <div class="block">
                                        <div class="w-full text-xs font-semibold">PM</div>
                                </div>
                        </button>
                </li>
        </ul>
</label>
