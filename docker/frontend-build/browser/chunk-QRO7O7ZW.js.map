<div class="p-5">
    <h6 class="text-base flex justify-between font-semibold mb-7">
        Hyper Link
        <icon name="close" class="text-xs ms-auto cursor-pointer hover:text-blue-500" (click)="close()" />
    </h6>



    @if (cName) {
    <div class="text-xs mb-2">
        {{ cName }}
    </div>
    }

    <hr class="my-6">

    <h6 class="text-xs flex justify-between font-semibold mb-2 ">
        Hyper Link Options
    </h6>

    <div class="gap-2 ">
        <mat-radio-group [(ngModel)]="linkType">
            <div class="flex gap-2 self-start">
                <mat-radio-button class="p-2 border rounded-base flex" [value]="'T'">By Tab</mat-radio-button>
                <mat-radio-button class="p-2 border rounded-base flex" [value]="'E'">By Exhibit no.</mat-radio-button>
                <mat-radio-button class="p-2 border rounded-base flex" [value]="'TW'">
                    {{"By Tab Without {}"}}
                </mat-radio-button>
                <mat-radio-button class="p-2 border rounded-base flex" [value]="'EW'">{{
                    "By Exhibit No. Without {}"
                    }}</mat-radio-button>
            </div>
        </mat-radio-group>
    </div>


    <!-- <h6 class="text-xs flex justify-between font-semibold mb-2 ">
        Previous Hyperlink
    </h6>
    <mat-radio-group [(ngModel)]="prevhyp">
        <div class="flex gap-2 self-start">
            <mat-radio-button [value]="'K'" class="p-2 border rounded-base">Keep</mat-radio-button>
            <mat-radio-button [value]="'R'" class="p-2 border rounded-base">Replace</mat-radio-button>
        </div>
    </mat-radio-group> -->


    <div class="flex items-center gap-2 justify-between mt-6 ">
        <mat-checkbox [(ngModel)]="prevhyp">Keep Previous Hyperlink
            <icon name="info-outline" type="extra" matTooltip="If you uncheck previous hyperlink will be replaced" />
        </mat-checkbox>
        <btn [attr.isdisabled]="!linkType" (click)="onSubmit('K')">
            Start Hyperlink
        </btn>
        <!-- <btn [attr.isdisabled]="!linkType" (click)="onSubmit('K')">
            Keep </btn>

        <btn [attr.isdisabled]="!linkType" (click)="onSubmit('R')">
            Replace
        </btn> -->

    </div>


</div>
