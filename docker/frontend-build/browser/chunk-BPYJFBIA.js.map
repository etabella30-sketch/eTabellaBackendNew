<div>
  <h6 *ngIf="(type=='F'||type=='QF')&&linkType=='H'"
    class="text-xs text-start font-semibold mb-2 focus-visible:outline-none focus-visible:border-gray-400"
    for="factBox">
    <mat-checkbox [(ngModel)]="bIsHighlighted" (change)="pushhilight($event)">{{ 'FACTS.NOTE.USE_HIGHLIGHTED' |
      translate }}</mat-checkbox>
  </h6>

  <div class="bg-white p-1.5 rounded-base" (click)="onContainerClick($event)"
  [ngClass]="{'shadow-[0px_0px_8px_#0063ffde]': isFocus ,'border rounded-base ps-2.5 pe-1.5 bg-white' :  isnotHeader ,'!shadow-none bg-transparent p-0':!isnotHeader,'min-h-28':type=='QF'}">

  <!-- Shared inner note content so table and sidebar use identical body -->
  <ng-template #noteBody>
	<div class="text-xs h-full">
      <ng-container *ngIf="bIsHighlighted">
        <ng-container *ngFor="let x of jOTexts; let i = index">
          <div
            class=" text-xs opacity-70 pt-2.5 focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none parent"
            contenteditable="false" aria-readonly="true" [innerHTML]="x">
          </div>
          <hr *ngIf="i!=((jOTexts.length)-1)" class="mt-2 mb-2 border-tab">
        </ng-container>
      </ng-container>
      <hr *ngIf="bIsHighlighted && jOTexts?.length" class="mt-2 mb-2 border-tab">

      <pre *ngFor="let x of jEditedTexts; let i = index" contenteditable="true" #editableDiv
        (focus)="isFocus = true" (blur)="isFocus = false" (input)="updateJText($event, i)"
        (keyup.backspace)="OnBackSpaceKeyUp($event,i)" [ngClass]="{'bg-white': isnotHeader}"
        class=" text-xs note-text m-0 focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none parent whitespace-pre-wrap"
        [innerHTML]="x" [attr.data-placeholder]="getPlaceholderText()">
      </pre>
    </div>
  </ng-template>

  <!-- Default (sidebar / full) uses NgScrollbar -->
  <ng-container *ngIf="isnotHeader; else tableNoteScroll">
    <ng-scrollbar class="thinthumb"
      style="max-height: 112px; min-height: 112px;--scrollbar-track-color:white;--scrollbar-thickness: 11;"
      [orientation]="'vertical'" [visibility]="'visible'" [appearance]="'native'">
      <ng-container *ngTemplateOutlet="noteBody"></ng-container>
    </ng-scrollbar>
  </ng-container>

  <!-- In table cells, use native scrollbar so it matches
       the pre-edit note box behavior (same bar, same edge). -->
  <ng-template #tableNoteScroll>
  <div class="w-full h-full">
      <ng-container *ngTemplateOutlet="noteBody"></ng-container>
    </div>
  </ng-template>

  </div>
  <span *ngIf="isnotHeader&&type=='F'" class="text-xxs text-blue-on mt-3">
    {{ 'FACTS.NOTE.SEARCH_HINT' | translate }}
  </span>
</div>
