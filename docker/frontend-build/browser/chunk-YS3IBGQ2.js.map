<div class="flex bg-grey items-center gap-3 h-[54px] px-5">
  <div class="gap-2 flex text-white">
    <btn square (click)="linkChange('F')" mode="outlined"
      [addcls]="linkExplorerType!='F' ?'!border-none !bg-transparent !text-white hover:!bg-white/25 hover:!text-white':'!bg-white/25 !text-white'">
      <icon [name]="linkExplorerMode=='I'?'factIn':'factOut'" type="indicn" />
    </btn>
    <btn
      [addcls]="linkExplorerType!='D' ?'!border-none !bg-transparent !text-white hover:!bg-white/25 hover:!text-white':'!bg-white/25 !text-white'"
      square (click)="linkChange('D')" mode="outlined">
      <icon [name]="linkExplorerMode=='I'?'docIn':'docOut'" type="indicn" />
    </btn>
  </div>

  <!-- <span class="text-white">{{linkExplorerMode}}</span> -->

  <mat-form-field class="bg-white ms-auto w-52">
    <mat-select class=" text-white" panelClass="min-w-72 !p-2" [placeholder]="getPlaceholder()"
      [(ngModel)]="selectedLink" (selectionChange)="changeDoc(selectedLink)">
      @for (x of linkedList; track $index) {
      <mat-option [value]="x" class="my-1 rounded-base">
        <source-card class="block m-2" gap="S" [truncate]="false" mode="light" type="T" [detail]="x"
          addcls="!bg-transparent !p-0" />
      </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div class="gap-2 flex text-white">
    <btn (click)="ChangeFile(-1)" mode="outlined" square
      addcls=" !bg-transparent border-none hover:!bg-white/25 hover:border hover:!text-white text-white">
      <icon name="chvy" />
    </btn>
    <btn (click)="ChangeFile(1)" mode="outlined" square
      addcls="hover:!bg-white/25 !bg-transparent border-none hover:border hover:!text-white text-white">
      <icon name="chvy" class="rotate-180" />
    </btn>
  </div>

</div>
