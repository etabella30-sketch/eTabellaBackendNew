<div class="p-10">
    <h6 class="text-lg font-semibold mb-2">Module Name</h6>
    <div class="mb-6 flex items-center gap-6">
        <span (click)="getFile()"
            class="flex items-center cursor-pointer justify-center rounded-base text-center  leading-4 text-xs font-medium h-52 w-full bg-blue-50 border border-dashed border-blue-hover text-blue-on"
            *ngIf="!cImage||cImage==''">
            <div class="text-center">
                <h6 class="text-sm font-semibold underline">Browse image</h6>
                <p class="text-xs text-blue-hover mt-0.5">Upload a module image to help users identify the module</p>
            </div>
        </span>
        <img class="flex items-center justify-center rounded-base text-center leading-4 text-xs font-medium h-52 w-full bg-gray-300"
            [src]="helpcenterURL + cImage" *ngIf="cImage&&cImage!=''">
        <input type="file" name="profile" id="moduleimage" class="!hidden"
            accept="image/png, image/jpg, image/jpeg,image/svg" (change)="onFileChange($event)">
        @if(cImage&&cImage!=''){
        <btn mode="outlined">
            <span>Edit</span>
        </btn>
        }
    </div>
    <div class="flex items-end gap-2 mb-6">
        <inpt [isrequired]="true" placeholder="Enter Module Name" class="block  w-full" [showlabel]="false"
            [value]="cTitle" (valueChange)="cTitle = $event;"></inpt>
    </div>
    <div class="flex gap-2 justify-end">
        <btn [attr.isdisabled]="!cTitle || cTitle?.trim() == ''" (click)="onSubmit()"> {{permission == 'N' ? 'Create'
            :
            'Update'}}</btn>
        <btn [mode]="'white'" (click)="close()">Cancel</btn>
    </div>
</div>
