<div class="flex flex-col h-full overflow-hidden">
    <div class="flex items-center justify-between gap-2.5 mb-3">
        <h6 class="text-xl font-bold">Modules</h6>

        <btn mode="outlined" (click)="createModule()">
            <icon name="add" class="text-xs inline-flex"></icon> Add Module
        </btn>
    </div>

    <div class="w-full h-full overflow-auto">
        @for (module of modules; track module.id) {
        <div class="mb-2.5" [ngClass]="{'bg-white flex flex-col  rounded-t-base items-center': module.isExpanded}">
            <div class="relative group bg-white rounded-base px-5 z-20 flex items-center w-full gap-5 min-h-10 cursor-pointer"
                [ngClass]="{'!text-blue-on': module.isExpanded}" (click)="toggleModule(module,$index)">
                <div class="flex  items-center gap-5 w-full h-full">
                    <svg [class.rotate-90]="module.isExpanded" style="min-width: 6px; transition: transform 0.2s;"
                        xmlns="http://www.w3.org/2000/svg" width="6" height="10" fill="none" viewBox="0 0 6 10">
                        <path fill="currentColor" stroke="currentColor"
                            d="M.57.84.55.83a.2.2 0 0 1 0-.28.18.18 0 0 1 .25 0l3.83 3.91a.2.2 0 0 1 0 .28L.81 8.64a.18.18 0 0 1-.25 0 .2.2 0 0 1 0-.27v-.01l3.15-3.42.31-.34-.31-.34L.57.84Z" />
                    </svg>
                    <div class="flex items-center gap-2 h-full w-full">
                        <svg [ngClass]="{'!text-blue-on': module.isExpanded}" [class.close]="module.isExpanded"
                            xmlns="http://www.w3.org/2000/svg" width="18" height="14" fill="none" viewBox="0 0 18 14"
                            class="text-grey" style="min-width: 18px;">
                            <path fill="currentColor" fill-rule="evenodd"
                                d="M6.41 1.878h7.268c.836 0 1.516.68 1.516 1.516.008 3.554-.003 5.546.005 9.1l-.38 1.04a.45.45 0 0 1-.05.101c-.261.38-.57.365-1.091.365H1.548C.71 14 .03 13.32.03 12.485V1.878C.03 1.043.71.363 1.547.363H4.58a.756.756 0 0 1 .536.222L6.41 1.878ZM1.736 12.312V3.69h11.61v8.622H1.736Z"
                                clip-rule="evenodd" />
                            <path fill="currentColor"
                                d="M3.619 6.558A.91.91 0 0 1 4.459 6h12.163a.91.91 0 0 1 .838 1.267l-2.555 6.017H2.167a.91.91 0 0 1-.84-1.263l2.292-5.463Z"
                                class="foldersvg" [class.close]="!module.isExpanded" />
                        </svg>
                        <span
                            class="block text-xs font-semibold truncate mat-mdc-tooltip-trigger whitespace-nowrap foldername ng-star-inserted">
                            {{module.cTitle}}
                        </span>
                        <icon (click)="addsubmodule(module)" name="addfolder" matTooltip="Add folder" type="adminicn"
                            class="hidden group-hover:block cursor-pointer text-blue-on ms-auto" />
                    </div>
                </div>
            </div>
            @if (module.isExpanded) {
            @for (submodule of module.submodules; track submodule.id) {
            <div (click)="selectmodule(submodule,module)" class="relative bg-white  px-5 z-20 flex items-center w-full hover:bg-blue-deactivate gap-5 min-h-10  mb-2.5 last:mb-0 cursor-pointer"
                [ngClass]="{'!text-blue-on !bg-blue-deactivate': submodule.isselected}">
                <div class="flex items-center gap-5 w-[calc(100%_-_30px)] h-full ps-12">
                    <div class="flex items-center gap-2 h-full w-[calc(100%_-_30px)]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" fill="none" viewBox="0 0 18 14"
                            style="min-width: 18px;">
                            <path fill="currentColor" fill-rule="evenodd"
                                d="M6.41 1.878h7.268c.836 0 1.516.68 1.516 1.516.008 3.554-.003 5.546.005 9.1l-.38 1.04a.45.45 0 0 1-.05.101c-.261.38-.57.365-1.091.365H1.548C.71 14 .03 13.32.03 12.485V1.878C.03 1.043.71.363 1.547.363H4.58a.756.756 0 0 1 .536.222L6.41 1.878ZM1.736 12.312V3.69h11.61v8.622H1.736Z"
                                clip-rule="evenodd" />
                            <path fill="currentColor"
                                d="M3.619 6.558A.91.91 0 0 1 4.459 6h12.163a.91.91 0 0 1 .838 1.267l-2.555 6.017H2.167a.91.91 0 0 1-.84-1.263l2.292-5.463Z"
                                class="foldersvg close" />
                        </svg>
                        <span
                            class="block text-xs font-semibold truncate mat-mdc-tooltip-trigger whitespace-nowrap foldername ng-star-inserted">
                            {{submodule.cTitle}}
                        </span>
                    </div>
                </div>
            </div>
            }
            }
        </div>
        }
    </div>
</div>
