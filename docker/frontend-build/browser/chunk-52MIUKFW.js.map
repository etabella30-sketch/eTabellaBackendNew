<div class="h-[100px] px-10 flex items-center bg-dark-blue">
    <h6 class="text-lg font-bold flex items-center h-full text-white">
        <icon class="text-sm me-3" name="chvy" /> Help Center Admin
    </h6>
</div>
<div class="h-[calc(100%_-_100px)] bg-[#f5f5f5] !px-10 pt-10  flex  overflow-auto gap-2.5">
    <div class="min-w-[400px] h-full">
        <moduleslist #moduleslist (selectedmodule)="selectedmoduleEvent($event)"></moduleslist>
    </div>
    <div class="h-full w-full">
        @if (!selectedmodule&&!addform) {
        <empty head="No Modules Selected" desc="Select Modules from the Modules List" class="h-full"></empty>
        }
        @else {
        <div class="bg-white flex flex-col items-center">
            @defer (when selectedmodule||addform) {
            <moduleform [selectedmodule]="selectedmodule" [curruntmodule]="curruntmodule" (moduleupdated)="moduleupdated($event)"></moduleform>
            }
        </div>
        }
    </div>
</div>
