<h6 *ngIf="ishilight&&bIsHighlighted&&!inTable"
    class="text-xs text-end font-semibold mb-1 pointer-events-none focus-visible:outline-none focus-visible:border-gray-400"
    for="factBox" [class]="!bIsHighlighted ?'':'saturate-0 brightness-[3.5]'">
    <mat-checkbox [(ngModel)]="bIsHighlighted"><span class="brightness-[0.3] pointer-events-none">{{
            'FACTS.BOX.USE_HIGHLIGHTS' | translate }}
        </span>
    </mat-checkbox>
</h6>
<div class="h-fit border-tab p-0.5  rounded-base"
    [ngClass]="mode == 'light' ? 'bg-white text-grey border-2' : ' border-4'">
    <div class="  min-h-5 max-h-[100px]  rounded-base text-xs px-2.5 overflow-auto" [class]="classList"
        [class.max-h-36]="isLarge">

        <ng-container *ngIf="bIsHighlighted">
            <div *ngFor="let x of jOT"
                class=" bg-reply rounded-md px-1 text-xs opacity-70 py-2.5 focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none parent"
                [innerHTML]="jOT">
            </div>
        </ng-container>


        <ng-container *ngFor="let x of jTexts; let i = index">
                <div class=" overflow-auto  text-xs py-3 note-text focus-visible:!border-none focus-visible:!outline-none focus:!border-none focus:!outline-none"
                    [innerHTML]="x">
            </div>
            <hr *ngIf="i!=((jTexts?.length)-1)" class="mt-2 border-tab">
        </ng-container>
    </div>
</div>
