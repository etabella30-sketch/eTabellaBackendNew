<div class="h-full w-full bg-light-blue border border-dashed border-blue-hover rounded-base flex flex-col items-center justify-center"
        [ngClass]="addClasses" >
        <icon *ngIf="icon" [name]="icon.name" [type]="icon.type?icon.type:'commonicn'" />
        @if (head) {
        <h6 class="text-lg text-blue-hover">{{head}}</h6>
        }
        @if (desc) {
        <h6 class="text-xxs" [ngClass]="subcls ? subcls : 'text-blue-hover'">{{desc}}</h6>
        }
        <ng-content></ng-content>
</div>
