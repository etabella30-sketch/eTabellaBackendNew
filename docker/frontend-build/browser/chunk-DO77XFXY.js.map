<div class="h-screen flex items-center justify-center bg-blue-700 overflow-hidden relative">
        <img class="absolute z-20 mix-blend-multiply w-full h-[185vh] mt-40 object-cover "
                src="assets/login/background.webp">
        <div
                class="bg-gray-50  shadow-[0px_0px_0px_11px_#ffffff38]  absolute z-10 w-[971px] h-[400px] rounded-3xl -translate-y-7 mt-1">

        </div>
        <div class="h-fit w-fit relative z-30 ">
                <div class="flex h-[400px] rounded-3xl overflow-hidden">
                        <div class="w-[400px] flex ">
                                <img class="m-auto w-28" src="assets/logo.svg">
                        </div>
                        <form class="w-[571px] h-full bg-white p-24">
                                <h6 class="text-lg font-semibold mb-5">
                                        {{enterpassword?'Enter a new password':'Reset your password'}}
                                </h6>

                                <h6 class=" text-xs mb-3 " *ngIf="!enterpassword">Enter your email address to reset your
                                        password.</h6>
                                <form [formGroup]="loginForm" *ngIf="!enterpassword">
                                        <inpt type="text" placeholder="Enter Email" [icon]="{name:'email','dir':'L'}"
                                                class="block mb-5" [value]="loginForm?.value?.cEmail"
                                                (valueChange)="loginForm.controls['cEmail'].setValue($event)">
                                        </inpt>
                                        <h6 class="text-sred text-xs font-bold" *ngIf="logS.isinvalid">Invalid email
                                                address</h6>
                                        <h6 class="text-blue-on text-xs font-bold" *ngIf="false">A link has
                                                been sent to your email.</h6>
                                </form>
                                <form [formGroup]="resetpass" *ngIf="enterpassword">
                                        <inpt [error]="logS.isinvalid" [icon]="{name:'lock','dir':'L'}"
                                                [isoutside]="true" [value]="loginForm?.value?.password" type="password"
                                                placeholder="Enter Password" class="block mb-2.5"
                                                (valueChange)="loginForm.controls['password'].setValue($event)"></inpt>
                                        <inpt [error]="logS.isinvalid" [icon]="{name:'lock','dir':'L'}"
                                                [isoutside]="true" [value]="loginForm?.value?.password" type="password"
                                                placeholder="Enter Password" class="block mb-2.5"
                                                (valueChange)="loginForm.controls['password'].setValue($event)"></inpt>
                                        <h6 class="text-blue-on text-xs font-bold" *ngIf="false">A link has
                                                been sent to your email.</h6>
                                </form>
                                <!--  -->
                                <btn mode="solid" (click)="onSubmit()"
                                        [attr.isdisable]="isloading||this.loginForm.status=='INVALID'"
                                        [disabled]="isloading||this.loginForm.status=='INVALID'" [isloading]="isloading"
                                        addcls="w-full mt-5">Reset
                                </btn>
                        </form>
                </div>
                <div class="flex text-white text-xs w-[971px] mt-9">
                        <span>© {{getYear}} eTabella. All rights reserved. </span>
                        <span class="flex text-end gap-4 ms-auto"><span class="cursor-pointer">Terms of
                                        Service</span><span class="cursor-pointer">Privacy Policy</span> <span
                                        class="cursor-pointer">Security</span> </span>
                </div>
        </div>


</div>
