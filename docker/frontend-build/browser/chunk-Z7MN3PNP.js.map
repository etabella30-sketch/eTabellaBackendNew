<div class="flex absolute bottom-0 gap-1 w-full h-[70px] items-center bg-black text-white px-5 text-xs">
    @if(!confirmcancel){
    <mat-radio-group class="flex gap-2" [(ngModel)]="linkType">
        <mat-radio-button value="C"> <span class="text-white"> Current Page</span></mat-radio-button>
        <mat-radio-button value="P"><span class="text-white">Page range </span></mat-radio-button>
        <mat-radio-button value="D"><span class="text-white">Document</span></mat-radio-button>
    </mat-radio-group>
    <btn (click)="submit()" class="text-blue ms-auto">{{linkType=='P'?'Open':'Apply'}}</btn>

    <!-- <icon (click)="close()" name="close" class="text-xs cursor-pointer ms-4" /> -->
    }
</div>

@if(enablePageRange){
<preview-page-range [activeFile]="activeFile" [nCaseid]="nCaseid"
    class="block fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[calc(90vw+1px)] h-[calc(90vh+1px)] rounded-base overflow-hidden  z-[998]"
    [nSectionid]="nSectionid" [hightlightMode]="hightlightMode" />

<div class="inline-block h-fit fixed bottom-[2vw] left-1/2 -translate-x-1/2 w-[90vw] rounded-b-base overflow-hidden z-[998]">
    @if(pageRangeSelector){
    <page-range-tool [(pageRangeSelector)]="pageRangeSelector" [(enablePageRange)]="enablePageRange" [isIframe]="true"
        (onPageRangeToolEvent)="onPageRangeToolEvent($event)" (onEmitEvent)="onEmitEvent($event)"
        [(pageRangeTextSelectionData)]="pageRangeTextSelectionData" />
    }
</div>
}
