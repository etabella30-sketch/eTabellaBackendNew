<ng-container *ngIf="isLoading; else loaded">
    <div class="flex items-center justify-center h-full">
        <b class="text-xs font-normal">{{ 'COMMON.LOADING' | translate }}</b>
    </div>
</ng-container>
<ng-template #loaded>
    <div class="py-2.5">
        <div class="flex items-center">
            <h6 class="text-xs font-bold">{{ 'FILTERS.ISSUE' | translate }}</h6>
            <icon name="close" class="text-xs mx-3" (click)="removeall('I')"></icon>
        </div>

        <div class="flex flex-wrap gap-2 mt-2">
            <ng-select [clearable]="false" (change)="OnValueChnaged($event , 'I')" appendTo="body" [items]="issueList"
                [(ngModel)]="resetSelect" bindLabel="cIName" bindValue="cIName" placeholder="{{ 'NAVFILTERS.CLAIMS_PLACEHOLDER' | translate }}"
                class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                <ng-template ng-option-tmp let-item="item" let-index="index">
                    <div class="flex items-center gap-1">
                        <span class="rounded-base h-3.5 w-1 bg-red-400" [style.background]="'#'+item.cColor"></span>
                        <b class="text-xs font-normal" [class.text-gray-400]="isOptionDisabled(item, 'I')">{{ item.cIName }}</b>
                    </div>
                </ng-template>
            </ng-select>

            <ng-container *ngFor="let x of selectedIssues; let i = index; trackBy: trackByIndex">
                <btn mode="white">
                    <span class="text-xs">{{ x.cIName }}</span>
                    <icon name="backspace" type="extra" (click)="remove(i , 'I')" class="text-sm"></icon>
                </btn>
            </ng-container>

        </div>
        <div class="flex flex-wrap gap-2 mt-2">
            <ng-select [clearable]="false" appendTo="body" [items]="relevance" bindLabel="cKey" bindValue="cKey"
                [(ngModel)]="resetSelect" (change)="OnValueChnaged($event ,'R')" placeholder="{{ 'FILTERS.CHOOSE_RELEVANCE' | translate }}"
                class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                <ng-template ng-option-tmp let-item="item" let-index="index">
                    <b class="text-xs font-normal" [class.text-gray-400]="isOptionDisabled(item, 'R')">{{ item.cKey }}</b>
                </ng-template>
            </ng-select>

            <ng-container *ngFor="let x of selectedRelavance; let i = index; trackBy: trackByIndex">
                <btn mode="white">
                    <span class="text-xs">{{ x.cKey }}</span>
                    <icon name="backspace" type="extra" (click)="remove(i , 'R')" class="text-sm"></icon>
                </btn>
            </ng-container>

        </div>
        <div class="flex flex-wrap gap-2 mt-2">
            <ng-select [clearable]="false" appendTo="body" [items]="impact" bindLabel="cKey" bindValue="cKey"
                [(ngModel)]="resetSelect" (change)="OnValueChnaged($event ,'IM')" placeholder="{{ 'FILTERS.CHOOSE_IMPACT' | translate }}"
                class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                <ng-template ng-option-tmp let-item="item" let-index="index">
                    <b class="text-xs font-normal" [class.text-gray-400]="isOptionDisabled(item, 'IM')">{{ item.cKey }}</b>
                </ng-template>
            </ng-select>

            <ng-container *ngFor="let x of selectedImpact; let i = index; trackBy: trackByIndex">
                <btn mode="white">
                    <span class="text-xs">{{ x.cKey }}</span>
                    <icon name="backspace" (click)="remove(i , 'IM')" type="extra" class="text-sm"></icon>
                </btn>
            </ng-container>

        </div>
        <div class="flex items-center gap-2.5 mt-2 mb-2">
            <mat-checkbox [(ngModel)]="IsNote" (ngModelChange)="handleChange()">{{ 'FILTERS.NOTE' | translate }}</mat-checkbox>
            <ng-container *ngIf="tab != 'QF'">
                <mat-checkbox [(ngModel)]="IsFactlink" (ngModelChange)="handleChange()">{{ 'FILTERS.FACT_LINK' | translate }}</mat-checkbox>
                <mat-checkbox [(ngModel)]="IsComment" (ngModelChange)="handleChange()">{{ 'FILTERS.COMMENT' | translate }}</mat-checkbox>
            </ng-container>
        </div>
    </div>
</ng-template>
