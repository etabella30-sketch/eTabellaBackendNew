<div class="py-2.5">

    <div class="flex items-center ">
        <h6 class="text-xs font-bold">{{ 'FILTERS.CLAIMS' | translate }}</h6>
        <icon name="close" class="text-xs mx-3" (click)="removeFilter('CL')"></icon>
    </div>

    <div class="flex flex-wrap gap-2 mt-2">
        <ng-select [clearable]="false" (change)="OnValueChnaged($event)" appendTo="body" [items]="claimList"
            [(ngModel)]="resetSelect" bindLabel="cCategory" bindValue="nICid" placeholder="Type/choose claim name "
            class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
            <ng-template ng-option-tmp let-item="item" let-index="index">
                <b class="text-xs font-normal" [class.text-gray-400]="isOptionDisabled(item)">{{item.cCategory}}</b>
            </ng-template>
        </ng-select>

                <ng-container *ngFor="let x of selectedClaims; let i = index; trackBy: trackByIndex">
                    <btn mode="white">
                        <span class="text-xs">{{ x.cCategory }}</span>
                        <icon name="backspace" (click)="remove(i)" type="extra" class="text-sm"></icon>
                    </btn>
                </ng-container>

    </div>
</div>
