<div class="py-2.5">
    <div class="flex items-center ">
        <h6 class="text-xs font-bold">{{ 'FILTERS.CONTACT' | translate }}</h6>
        <icon name="close" class="text-xs mx-3" (click)="removeFilter('C')"></icon>
    </div>
    <div>
        <div class="flex flex-wrap gap-2 mt-2">

            <contact-select clearOnSelect class="block w-[264px]"
                (activeContactsChange)="onActiveContactsChange($event)" [userList]="contactList"></contact-select>

                        <ng-container *ngFor="let x of selectedContact; let i = index; trackBy: trackByIndex">
                            <btn mode="white">
                                <avtr size="sm" [detail]="x"></avtr>
                                <span class="text-xs">{{ x.cFname }} {{ x.cLname }}</span>
                                <icon name="backspace" (click)="remove(i, 'CN')" type="extra" class="text-sm"></icon>
                            </btn>
                        </ng-container>
        </div>
        <div class="w-full">
            <div class="flex flex-wrap gap-2 mt-2">
                <ng-select [clearable]="false" (change)=" OnValueChnaged($event,'R')" appendTo="body"
                    [items]="role_list" [(ngModel)]="resetSelect" bindLabel="cRole" bindValue="nCRoleid"
                    [placeholder]="'FILTERS.CHOOSE_ROLE_TYPE' | translate"
                    class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                    <ng-template ng-option-tmp let-item="item" let-index="index">
                        <b class="text-xs font-normal"
                            [class.text-gray-400]="isOptionDisabled(item, 'R')">{{item.cRole}}</b>
                    </ng-template>
                </ng-select>

                                <ng-container *ngFor="let x of selectedroles; let i = index; trackBy: trackByIndex">
                                    <btn mode="white">
                                        <span class="text-xs">{{ x.cRole }}</span>
                                        <icon name="backspace" (click)="remove(i, 'R')" type="extra" class="text-sm"></icon>
                                    </btn>
                                </ng-container>

            </div>
        </div>
        <div class="w-full">
            <div class="flex flex-wrap gap-2 mt-2">
                <ng-select [clearable]="false" (change)="OnValueChnaged($event,'P')" appendTo="body"
                    [items]="party_list" [(ngModel)]="resetSelect" bindLabel="cKey" bindValue="nValue"
                    [placeholder]="'FILTERS.CHOOSE_PARTY' | translate"
                    class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                    <ng-template ng-option-tmp let-item="item" let-index="index">
                        <b class="text-xs font-normal"
                            [class.text-gray-400]="isOptionDisabled(item, 'P')">{{item.cKey}}</b>
                    </ng-template>
                </ng-select>

                                <ng-container *ngFor="let x of selectedParties; let i = index; trackBy: trackByIndex">
                                    <btn mode="white">
                                        <span class="text-xs">{{ x.cKey }}</span>
                                        <icon name="backspace" (click)="remove(i, 'O')" type="extra" class="text-sm"></icon>
                                    </btn>
                                </ng-container>

            </div>
        </div>
        <div class="w-full">
            <div class="flex flex-wrap gap-2 mt-2">
                <ng-select [clearable]="false" (change)="OnValueChnaged($event,'C')" appendTo="body"
                    [items]="company_list" [(ngModel)]="resetSelect" bindLabel="cCompany" bindValue="nCompanyid"
                    [placeholder]="'FILTERS.CHOOSE_COMPANY' | translate"
                    class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                    <ng-template ng-option-tmp let-item="item" let-index="index">
                        <b class="text-xs font-normal"
                            [class.text-gray-400]="isOptionDisabled(item, 'C')">{{item.cCompany}}</b>
                    </ng-template>
                </ng-select>

                                <ng-container *ngFor="let x of selectedCompanies; let i = index; trackBy: trackByIndex">
                                    <btn mode="white">
                                        <span class="text-xs">{{ x.cCompany }}</span>
                                        <icon name="backspace" (click)="remove(i, 'C')" type="extra" class="text-sm"></icon>
                                    </btn>
                                </ng-container>

            </div>
        </div>
        <div class="mt-2">
            <mat-checkbox [(ngModel)]="IsContactNote" (ngModelChange)="handleChange()">{{ 'FILTERS.NOTE' | translate
                }}</mat-checkbox>
        </div>
    </div>
