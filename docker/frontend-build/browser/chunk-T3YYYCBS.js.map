<div class="py-2.5">
    <div class="flex items-center ">
        <h6 class="text-xs font-bold">{{ 'FILTERS.FACT' | translate }}</h6>
        <icon name="close" class="text-xs mx-3" (click)="removeFilter('FD')"></icon>
    </div>
    <div class="mb-2.5">
        <date-form [jDate]="jDate" (jDateChange)="OnDateChange($event)" />
    </div>

    <div>
        <div class="w-full">
            <div class="flex flex-wrap gap-2 mt-2">
                <ng-select [clearable]="false" (change)="OnValueChnaged($event,'T')" appendTo="body"
                    [items]="filetypeList" [(ngModel)]="resetSelect" bindLabel="cKey" bindValue="nValue"
                    placeholder="Choose file type..."
                    class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden novalue-select ng-option-nocheck">
                    <ng-template ng-option-tmp let-item="item" let-index="index">
                        <b class="text-xs font-normal"
                            [class.text-gray-400]="isOptionDisabled(item, 'T')">{{item.cKey}}</b>
                    </ng-template>
                </ng-select>

                                <ng-container *ngFor="let x of selectedType; let i = index; trackBy: trackByIndex">
                                    <btn mode="white">
                                        <span class="text-xs">{{ x.cKey }}</span>
                                        <icon name="backspace" (click)="remove(i,'T')" type="extra" class="text-sm"></icon>
                                    </btn>
                                </ng-container>

            </div>
        </div>

                <ng-container *ngFor="let x of selectedStatus; let i = index; trackBy: trackByIndex">
                    <btn mode="white">
                        <span class="text-xs">{{ x.cKey }}</span>
                        <icon name="backspace" (click)="remove(i,'S')" type="extra" class="text-sm"></icon>
                    </btn>
                </ng-container>

        <div>
            <div class="flex items-center gap-2.5 my-2">
                <ng-select [clearable]="false" [(ngModel)]="selecteddatetype" appendTo="body" [items]="qfactdatetype"
                    bindLabel="cKey" bindValue="nValue" placeholder="Choose date..."
                    class="bg-white ng-select-main w-[198px] !border !border-tab  !rounded-base overflow-hidden ">
                    <ng-template ng-option-tmp let-item="item" let-index="index">
                        <b class="text-xs font-normal">{{item.cKey}}</b>
                    </ng-template>
                </ng-select>
                <datepicker [isRange]="selecteddatetype==2" [defaultBlank]="true"
                    [date]="createDate ? (selecteddatetype==2 ? [createDate.start, createDate.end] : createDate.start) : null"
                    (dateChange)="handleDateChange($event)">
                </datepicker>
            </div>
        </div>

        <div class="flex items-center gap-2.5 mt-2 mb-2">
            <mat-checkbox [checked]="isFileLevel" name="fileLevel" (change)="handleLevel($event)">{{ 'FILTERS.FILE_LEVEL' | translate }}</mat-checkbox>
            <mat-checkbox [checked]="isPageLevel" name="pageLevel" (change)="handleLevel($event)">{{ 'FILTERS.PAGE_LEVEL' | translate }}</mat-checkbox>
        </div>
    </div>
