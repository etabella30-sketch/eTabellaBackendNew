<div class="flex flex-col bg-neutral-100 h-full">
    <div class="flex h-full overflow-hidden">
        <fileexplorer #fileExplorer [activeSection]="activeSection" [nCaseid]="nCaseid" [isadmin]="false"
            [nUPid]="nUPid" [isMyfile]="true" class="w-full h-full overflow-hidden" [(jFilter)]="hs.jFilter">
        </fileexplorer>

    </div>

    <div class="flex items-center gap-4 text-white z-50 p-5   ms-auto fixed bottom-0 bg-grey" *ngIf="isExport">
        <icon name="info" />
        <span class="text-[13px] font-semibold flex items-center gap-2">
            Exporting {{exportData?.cStatus =='F' ? 'Failed' : exportData?.cStatus == 'C' ? 'Completed' : 'Inprogress'}}
            <span class="text-sgreen" *ngIf="exportData?.cStatus != 'F' && exportData?.cStatus != 'C'">
                <!-- {{calcCompPprogres(exportData.comp_progres,exportData.total_prog)}}% -->
                {{ exportData.comp_progres }} %
                Complete
            </span>
        </span>
        <btn mode="text" (click)="openExport()" (keydown)="openExport()" addcls="!text-white">View</btn>
    </div>
</div>
