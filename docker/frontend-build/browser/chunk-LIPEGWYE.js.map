<div class="h-full bg-blue-deactivate px-24 ">
    <div class="h-28 bg-gradient-to-b -translate-y-6 from-[#002d5b2b] to-transparent top-1/2 absolute w-full left-0">
    </div>

    <div class="flex h-full pt-24 gap-24 relative z-50">
        <div class="w-1/2 h-full flex flex-col items-center justify-center">
            <div class="text-3xl font-bold text-dark-blue mb-10 whitespace-nowrap">
                Choose a type of presentation to begin
            </div>
            @if(caseDetails.msg ==1){
            <div
                class="bg-white rounded-b-base border-[#DAE2EA] text-center w-full flex flex-col gap-1 py-3 shadow-[0px_4px_4px_#00000040]">
                <h6 class="text-dark-blue text-xs font-semibold ">{{caseDetails.cCasename}} - {{caseDetails.nCaseid}} </h6>
                <h6 class="text-dark-blue text-xxs">{{caseDetails.cDesc}}</h6>
            </div>
            }
            <div class="h-[170px] mt-11 flex justify-around w-full ">
                @for (item of presentTypes; track $index) {
                <div (click)="setup(item)" class="gap-6 flex items-center flex-col cursor-pointer">
                    <span class="text-lg text-dark-blue font-semibold"> {{item.cKey}}</span>
                    <img class="w-36" draggable="false" src="assets/present/{{item?.jOther?.icon}}.png">
                </div>
                }
            </div>
        </div>
        <div class="w-1/2 ">
            @defer () {
                <present-list [presentTypes]="presentTypes" [nCaseid]="nCaseid"(changeHandler)="refetch($event)" ></present-list>
            }@placeholder {

            }
            
        </div>
    </div>

</div>
