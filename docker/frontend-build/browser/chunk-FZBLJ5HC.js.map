<div class="px-5 py-1 bg-blue-deactivate flex h-12 items-center gap-x-4 [&>span]:cursor-pointer justify-end">

        <ng-container *ngIf="!docInfo?.nPresentid || !docInfo?.isHost">
                <div class="flex me-auto bg-white rounded-base overflow-hidden">
                        <toolbox
                                [intoolbar]="true"
                                [highlightMode]="highlightMode"
                                [annotToolMode]="annotToolMode"
                                [tempAnnots]="tempAnnots"
                                [isChecked]="true"
                                [isLink]="highlightMode"
                                [highlightIndex]="0"
                                (OnEvent)="onToolboxClick($event)"
                                [nFSid]="nFSid"
                                [docInfo]="docInfo">
                        </toolbox>

                        <ng-container *ngIf="highlightMode === 'QF' || highlightMode === 'F'">
                                <button
                                        type="button"
                                        mat-button
                                        [matMenuTriggerFor]="issues"
                                        #i="matMenuTrigger"
                                        (menuOpened)="loadIssue()"
                                        class="bg-white h-8.5 px-3 cursor-pointer flex items-center gap-2 text-xs w-56 rounded-e-base"
                                        aria-haspopup="true"
                                        [attr.aria-expanded]="i.menuOpen">

                                        <ng-container *ngIf="selectedIssues?.length === 1">
                                                <span
                                                        class="w-1 h-3.5 rounded-lg bg-red-300 block"
                                                        [ngStyle]="{'background': selectedIssues[0]?.cColor ? ('#' + selectedIssues[0].cColor) : 'transparent'}"></span>
                                                {{ selectedIssues[0].cIName }}
                                                <icon class="ms-auto text-xxs" name="chvx"></icon>
                                        </ng-container>

                                        <ng-container *ngIf="selectedIssues?.length > 1">
                                                {{ 'ANNOT_TOOLS.MULTIPLE_ISSUES_SELECTED' | translate }}
                                                <icon class="ms-auto text-xxs" name="chvx"></icon>
                                        </ng-container>

                                        <ng-container *ngIf="!selectedIssues?.length">
                                                {{ 'ANNOT_TOOLS.SELECT_ISSUES' | translate }}
                                                <icon class="ms-auto text-xxs" name="chvx"></icon>
                                        </ng-container>
                                </button>

                                <mat-menu #issues="matMenu" class="!rounded-lg mt-1 w-[380px] max-h-[400px]">
                                        <div class="bg-faint h-full" (click)="$event.stopPropagation()">
                                                <div *ngIf="i.menuOpen" class="h-full overflow-x-hidden">
                                                        <choose-issue
                                                                #issuesComponent
                                                                [intoolbar]="true"
                                                                [selectedIssues]="selectedIssues"
                                                                class="block h-full"
                                                                (Onevent)="onEvent($event, i)"
                                                                [nCaseid]="nCaseid">
                                                        </choose-issue>
                                                </div>
                                        </div>
                                </mat-menu>
                        </ng-container>
                </div>
        </ng-container>

        <div class="flex items-center gap-3" [class]="docInfo.nPresentid && docInfo?.isHost ? 'me-auto' : ''">
                <span *ngIf="!docInfo?.nPresentid || !docInfo?.isHost" class="text-xs">Chosen annotation style:</span>

                <ng-container *ngFor="let x of icons; let idx = index">
                        <ng-container *ngIf="highlightMode.includes(x.for)">
                                <button
                                        type="button"
                                        (click)="changeType(x.type)"
                                        [matTooltip]="x.toolTip"
                                        class="flex rounded-base p-1.5 hover:text-blue-on"
                                        [class]="x.type==annotToolMode ? 'hover:bg-white !text-blue-on !bg-blue-hover !border-blue-on hover:shadow-[inset_0px_0px_4px_0px_#9FCCFF] shadow-[inset_0px_0px_4px_0px_#9FCCFF]' : 'hover:bg-white active:bg-white'"
                                        [attr.aria-pressed]="x.type==annotToolMode">
                                        <icon
                                                [name]="x.name"
                                                class="text-2xl"
                                                [type]="((x.type == '' && docInfo?.nPresentid && docInfo?.isHost) ? 'extra' : (x.type=='F' ? 'real_icn' : 'toolicn'))">
                                        </icon>
                                </button>
                        </ng-container>
                </ng-container>
        </div>

        <div class="h-full w-px bg-tab"></div>

        <button type="button" class="text-xs" aria-label="Close annotation" (click)="onAnnotClose()">
                <icon name="close"></icon>
        </button>
</div>
