<div
  class="transcript-content-wrapper h-full overflow-auto"
  #scrollContainer
  [class.compact]="mode === 'sidebar' || mode === 'evidence'"
  [style.font-size.px]="baseFontSize * (zoomLevel / 100)">

  @if (loading) {
    <div class="flex items-center justify-center py-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500"></div>
    </div>
  }

  @if (!loading && !htmlPages.length) {
    <!-- Same empty state as RT feed-display: bg-white wrapper + empty component -->
    <div class="bg-white h-full p-5 overflow-auto w-full">
      <empty [head]="'No Feed data Found'" [desc]="'Once a session starts or data is shared, it will appear here automatically.'" [subcls]="'text-black'" style="height: 100%;"></empty>
    </div>
  }

  @if (!loading && htmlPages.length) {
    <cdk-virtual-scroll-viewport
      class="h-full"
      [itemSize]="estimatedPageHeight"
      #virtualScroll>
      <div
        *cdkVirtualFor="let page of htmlPages; trackBy: trackByPage"
        class="transcript-virtual-page"
        [attr.data-page]="page.pageNumber">
        <div [innerHTML]="page.safeHtml"></div>
      </div>
    </cdk-virtual-scroll-viewport>
  }
</div>
