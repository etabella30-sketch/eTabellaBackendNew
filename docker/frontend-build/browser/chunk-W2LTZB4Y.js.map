<!-- PDF-style toolbar for transcript viewer -->
<div class="relative z-20 flex items-center h-[50px] bg-white px-2.5 justify-between">
  <!-- Left section: Page navigation -->
  <div class="flex items-center gap-x-2">
    <div class="flex items-center bg-reply px-2 h-8.5 rounded-base">
      <!-- First page -->
      <button class="flex items-center justify-center w-6 h-6 hover:bg-neutral-200 rounded"
        (click)="jumpToFirstPage()" title="First page">
        <svg width="20" height="20" viewBox="0 0 24 24" class="rotate-180">
          <path fill="currentColor" d="M5.59,7.41L10.18,12L5.59,16.59L7,18L13,12L7,6L5.59,7.41M16,6H18V18H16V6Z"></path>
        </svg>
      </button>
      <!-- Previous page -->
      <button class="flex items-center justify-center w-6 h-6 hover:bg-neutral-200 rounded"
        (click)="prevPage()" title="Previous page">
        <svg width="20" height="20" viewBox="0 0 24 24" class="rotate-180">
          <path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path>
        </svg>
      </button>
      <!-- Next page -->
      <button class="flex items-center justify-center w-6 h-6 hover:bg-neutral-200 rounded"
        (click)="nextPage()" title="Next page">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path>
        </svg>
      </button>
      <!-- Last page -->
      <button class="flex items-center justify-center w-6 h-6 hover:bg-neutral-200 rounded"
        (click)="jumpToLastPage()" title="Last page">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="currentColor" d="M5.59,7.41L10.18,12L5.59,16.59L7,18L13,12L7,6L5.59,7.41M16,6H18V18H16V6Z"></path>
        </svg>
      </button>

      <!-- Page input -->
      <div class="flex items-center gap-1 mx-2">
        <input type="text"
          [value]="currentPage"
          (change)="onPageInputChange($event)"
          (keyup.enter)="onPageInputChange($event)"
          class="w-10 h-6 text-center text-xs border border-neutral-300 rounded bg-white focus:outline-none focus:border-blue-500" />
      </div>
    </div>

    <!-- Zoom controls -->
    @if (config.showZoom) {
    <div class="flex items-center gap-1">
      <button class="flex items-center justify-center w-7 h-7 hover:bg-neutral-100 rounded border border-neutral-200"
        (click)="onZoomIn()" title="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button class="flex items-center justify-center w-7 h-7 hover:bg-neutral-100 rounded border border-neutral-200"
        (click)="onZoomOut()" title="Zoom out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <span class="text-xs text-neutral-600 min-w-[50px] text-center">{{ zoomLevel }}%</span>
    </div>
    }

    <!-- Search -->
    @if (config.showSearch) {
    <button class="flex items-center justify-center w-7 h-7 hover:bg-neutral-100 rounded border border-neutral-200"
      [class.bg-blue-50]="searchOpen" [class.border-blue-300]="searchOpen"
      (click)="toggleSearch()" title="Search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    }
  </div>

  <!-- Search bar (shown when search is open) -->
  @if (searchOpen) {
  <div class="absolute left-1/2 -translate-x-1/2 top-full z-30 bg-white shadow-lg rounded-b-lg border border-neutral-200 p-2 flex items-center gap-2">
    <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()"
      placeholder="Search transcript..."
      class="px-2 py-1 border border-neutral-300 rounded text-xs w-48 focus:outline-none focus:border-blue-500" autofocus />
    <button class="text-xs px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700" (click)="onSearch()">Find</button>
    <button class="text-xs px-2 py-1 text-neutral-500 hover:text-neutral-800" (click)="toggleSearch()">Close</button>
  </div>
  }

  <!-- Right section: Actions -->
  <div class="flex items-center gap-x-2">
    <!-- Timestamp toggle -->
    @if (config.showTimestampToggle) {
    <button class="flex items-center gap-1.5 h-8.5 px-3 text-xs border border-neutral-200 rounded-base hover:bg-neutral-50"
      [class.bg-blue-50]="showTimestamps" [class.border-blue-300]="showTimestamps"
      (click)="onToggleTimestamps()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Timestamps
    </button>
    }

    <!-- Export -->
    @if (config.showExport) {
    <div class="flex items-center border-l border-neutral-200 pl-2 gap-1">
      <button class="h-8.5 px-3 text-xs border border-neutral-200 rounded-base hover:bg-neutral-50"
        (click)="onExportPdf()">PDF</button>
      <button class="h-8.5 px-3 text-xs border border-neutral-200 rounded-base hover:bg-neutral-50"
        (click)="onExportDocx()">DOCX</button>
    </div>
    }

    <!-- More options -->
    <button class="flex items-center justify-center w-8.5 h-8.5 border border-neutral-200 rounded-base hover:bg-neutral-50">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
      </svg>
    </button>
  </div>
</div>
