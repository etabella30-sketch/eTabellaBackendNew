<div class="p-10">
        <header>
                <h6>Control panel</h6>
                <h6 class="text-3xl flex justify-between font-semibold mb-7">Role Permission
                        <icon (click)="close()" name="close"
                                class="text-lg ms-auto cursor-pointer hover:text-blue-500" />
                </h6>
        </header>
        <div>
                <div
                        class="flex px-5 py-2.5 border rounded-full [&_div]:w-1/5 [&_div]:text-lg [&_div]:font-semibold mb-6">
                        <div class="!w-1/4">Name</div>
                        <div class="!w-1/4">Status</div>
                        <div class="">User Level Permission</div>
                        <div class="">Last Updated</div>
                </div>

                <div *ngFor="let x of rolePermissionLs" class="tabbody flex px-5 py-2.5 rounded-full relative">
                        <div class="w-1/4">
                                <div class="absolute top-1/2 -translate-y-1/2 px-5  rounded-full items-center flex gap-2 transition-all"
                                        [ngClass]="{'bg-grey text-white w-72': !x.expanded,'w-full bg-zinc-300 text-grey':x.expanded,'bg-grey/50':!x.users.length}">

                                        <badge (click)="x.expanded=x.users.length?true:false"
                                                class="flex cursor-pointer" [type]="x.expanded?'dark':'solid'"
                                                [square]="true">{{x.users.length}}
                                        </badge>

                                        <div class="text-sm cursor-pointer font-semibold whitespace-nowrap w-60 py-2"
                                                (click)="x.expanded=x.users.length?true:false">{{x.cRole}}</div>
                                        <icon *ngIf="!x.expanded" (click)="x.expanded=x.users.length?true:false"
                                                class="rotate-180 font-light text-xs ms-auto cursor-pointer"
                                                name="chvy" />
                                                
                                        <ng-scrollbar [visibility]="'hover'" [appearance]="'compact'">
                                                <div class="users flex gap-2 w-full overflow-auto scrollthin"
                                                        *ngIf="x.expanded">
                                                        <div class="flex gap-2 items-center my-4"
                                                                *ngFor="let user of x.users">
                                                                <avtr [detail]="{'cFname':user.cFname,'cLname':user.cLname,}"
                                                                        size="sm"></avtr>
                                                                <div class=" whitespace-nowrap text-xs">{{user.cFname}}
                                                                        {{user.cLname}}
                                                                </div>
                                                        </div>
                                                </div>
                                        </ng-scrollbar>
                                        <icon *ngIf="x.expanded&&x.users.length"
                                                class="font-light text-xs ms-4 cursor-pointer"
                                                (click)="x.expanded=false" name="close" />
                                </div>
                        </div>
                        <div class="w-1/4">
                                <span [ngClass]="{'bg-teal-500': x.cStatus == 'A','bg-neutral-500': x.cStatus != 'A'}"
                                        (click)="manageRole(x)"
                                        class=" w-36 block cursor-pointer py-2  text-xs rounded-full text-white text-center">
                                        {{ x.cStatus == 'A' ? 'Enabled' : 'Disabled'}}
                                </span>
                        </div>
                        <div class="w-1/5 flex items-center">
                                <span class="custcls" (click)="editPermission(x)">
                                        View & Modify
                                </span>
                        </div>
                        <div class="w-1/5 text-sm flex items-center"><span> Last modified on {{x.dLastmodified ?
                                        (x.dLastmodified | date : 'MM/dd/YYYY') : 'MM/DD/YYYY'}}</span></div>
                </div>
        </div>
</div>
