<div class="flex flex-col  main-bg overflow-hidden h-screen">
  <img loading="lazy" src="assets/login/background.webp"
    class="object-cover absolute inset-0 size-full mix-blend-multiply" />
  <img loading="lazy" src="assets/img/asset.png" class="object-cover absolute  w-[500px] -left-1/4 rotate-45" />
  <img loading="lazy" src="assets/img/asset.png" class="object-cover absolute  w-[500px] -right-[20%] -rotate-45" />
  <header class="px-8 min-h-15 flex bg-dark-blue relative z-20">
    <div class="flex items-center gap-6 text-blue-deactivate/70">
      <img width="30px" class="cursor-pointer" src="assets/colorlogo.svg" (click)="goToHome()">
      <div>
        <span class="text-sm  text-blue-deactivate/70 cursor-pointer" (click)="goToHome()">Dashboard
        </span>/ <span class="text-sm font-semibold  " (click)="selectedsubmodule=null"
          [ngClass]="{'text-blue-deactivate/70 hover:text-white  cursor-pointer': selectedsubmodule ,'text-white underline': !selectedsubmodule}">
          Help Center
        </span>
        @if(selectedsubmodule){
        / <span class="text-sm font-semibold text-white underline ">{{selectedsubmodule.cTitle}}
        </span>
        }
      </div>
    </div>
    <div class="flex items-center gap-2 ms-auto">
      <profile [userguidebtn]="false" [icon]="false" [detail]="userdetail" size="lg" [icon]="true" [iconwhite]="true">
      </profile>
    </div>
  </header>

  <helpcenterview (selectedsubmodule)="selectedsubmoduleEvent($event)" class="block h-[calc(100vh_-_50px)]">
  </helpcenterview>


</div>
