<div class="flex flex-col bg-[#f6f6f6] h-full">
    <div class="text-lg bg-white font-bold text-dark-blue whitespace-nowrap min-h-20 flex items-center gap-6 px-10">
        <img class="w-15" src="assets/present/public.png" />
        <h6>1 - Step 1: Presentation Set Up</h6>
    </div>
    <div class="h-full  flex flex-col overflow-hidden w-3/4 p-10">
        <empty>
            <div class="flex justify-between w-full px-12 h-20 items-center text-blue-hover text-lg">
                <span class=" font-semibold">
                    New Witness Schedule
                </span>
                <div class="ms-auto" (click)="setup()">
                    <btn>Create </btn>
                </div>
            </div>
        </empty>

        <h6 class="text-xs font-semibold mt-5 mb-2.5">
            Saved Presentation:
        </h6>
        <div class="h-full overflow-auto flex flex-col gap-3">
            @for (x of scheduleList; track $index) {
            <div
                class="flex items-center group gap-2.5 bg-white border border-white hover:bg-dark-blue hover:text-white p-5 rounded-base h-[75px] ">
                <avtr [detail]="{cFname:x.cFname,cLname:x.cLname}"></avtr>
                <h6 class="flex flex-col gap-2.5">
                    <span class="text-sm font-semibold truncate">
                        {{x.cFname}} {{x.cLname}}
                    </span>
                </h6>
                <div class="ms-auto gap-2.5 hidden group-hover:flex">
                    <btn (click)="viewSchedule(x.nPresentid)">
                        View Schedule
                    </btn>
                    <div class="h-8 bg-tab w-px mx-2.5">
                    </div>
                    <btn square mode="darkwhite"  (click)="editSchedule(x)">
                        <icon name="edit" />
                    </btn>
                    <btn square mode="darkwhite" [matMenuTriggerFor]="schedulelist" #d="matMenuTrigger">
                        <icon name="delete" />
                    </btn>
                    <mat-menu #schedulelist="matMenu" class="!bg-black p-5  rounded-base !min-w-52" xPosition="before">
                        <div>
                            <h6 class="mb-6  text-white text-xs">
                                Confirm delete ?
                            </h6>
                            <div class="flex gap-2">
                                <btn (click)="deleteSchedule(x.nPCid,$index)">
                                    Delete
                                </btn>
                                <btn mode="dark">
                                    Cancel
                                </btn>
                            </div>
                        </div>
                    </mat-menu>


                </div>
            </div>
            }
        </div>

    </div>
</div>
