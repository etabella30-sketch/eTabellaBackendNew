
<ngx-file-drop class="draging-overlay w-full block h-[60vh] bg-dark-blue" (onFileDrop)="onFileDrop($event)"
        [multiple]="true" [disabled]="isDragging">
        <ng-template ngx-file-drop-content-tmp let-openFileSelector="openFileSelector" class="draging-overlay h-full" >
                <div class="!p-2.5 w-full h-full bg-dark-blue" (click)="!isDragging ? openFileSelector() : null ">
                        <!-- (click)="us.uploadstep=2" -->
                        @if(isDragging){
                        <label for="uploadFile1"
                                class="bg-white/20 w-full text-white text-base rounded-base  h-full flex  items-center justify-center cursor-pointer border-2 border-stone-300/50 border-dashed mx-auto font-[sans-serif]">

                                <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"
                                        stroke="#fff">
                                        <g fill="none" fill-rule="evenodd">
                                                <g transform="translate(1 1)" stroke-width="2">
                                                        <circle stroke-opacity=".5" cx="18" cy="18" r="18" />
                                                        <path d="M36 18c0-9.94-8.06-18-18-18">
                                                                <animateTransform attributeName="transform"
                                                                        type="rotate" from="0 18 18" to="360 18 18"
                                                                        dur="1s" repeatCount="indefinite" />
                                                        </path>
                                                </g>
                                        </g>
                                </svg>
                        </label>
                        }
                        @else {
                        <label for="uploadFile1"
                                class="bg-white/20 w-full text-white text-base rounded-base  h-full flex  items-center justify-center cursor-pointer border-2 border-stone-300/50 border-dashed mx-auto font-[sans-serif]">

                                <svg width="48" height="41" viewBox="0 0 48 41" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M21 21.4193H27V10.7526H36L24 0.0859375L12 10.7526H21V21.4193ZM30 15.4193V19.5313L43.737 24.0859L24 30.6273L4.263 24.0859L18 19.5313V15.4193L0 21.4193V32.0859L24 40.0859L48 32.0859V21.4193L30 15.4193Z"
                                                fill="white" />
                                </svg>

                                <!-- <input type="file" id='uploadFile1' class="hidden" /> -->
                                <div class=" text-sm font-semibold ms-6">
                                        Upload file
                                        <p class="text-xs font-normal mt-1 mb-2">Drag & drop file here from your system
                                        </p>
                                </div>
                        </label>
                        }

                </div>
        </ng-template>
</ngx-file-drop>
