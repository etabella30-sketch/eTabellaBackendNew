
<div class="pt-6 px-10 flex items-center bg-neutral-100">
    <div class="text-lg font-semibold flex items-center gap-2.5 ">
        <!-- <icon name="chvy" class="text-lg cursor-pointer" (click)="goBack()"></icon> -->
        <span class="capitalize">{{(hs?.currentadminpath | async) == 'my files' ? (hs.isGlobalSearch ? (
            hs.search_within == 'I' ? 'Content Search' : 'Metadata Search') :
            'Evidence') : hs?.currentadminpath | async}}</span>
        <!-- <icon [matMenuTriggerFor]="options" class="cursor-pointer text-base" name="menu"
            *ngIf="(hs.isCaseedit | async)"></icon>
        <mat-menu #options="matMenu" class="!rounded-none w-fit !bg-dark-blue">
            <ng-container>
                <div mat-menu-item class="!p-3 border-b " (click)="download()">
                    <icon name="download" type="extra" class="text-xs me-2 text-white/70"></icon>
                    <span class="text-xs  text-white/70 font-semibold">Download Agreed Files</span>
                </div>
            </ng-container>
        </mat-menu> -->
        <btn mode="outlined" (click)="download()">
            <icon name="download" type="extra" class="text-lg "></icon>
            <span class="text-xs">Download Agreed Files</span>
        </btn>
        @if(hs.nSectionid){
        <search *ngIf="(hs?.currentadminpath | async)=='Admin Panel'||(hs?.currentadminpath | async)=='my files'"
            [isAdmin]="false" [currentfolder]="hs.currentfolder" [jFilter]="hs.jFilter"></search>
        }
    </div>

    <!-- <div class="ms-auto flex items-center gap-3">
        <h6 class="text-lg font-semibold">{{hs.Casedetail?.cCaseno}} | <span>{{hs.Casedetail?.cCasename}}</span>
        </h6>
        <profile *ngIf="hs.userdetail" [detail]="hs.userdetail" size="lg" class="mx-auto block relative w-fit z-20" />
        <img class="cursor-pointer" (click)="gohome()" *ngIf="(hs?.currentadminpath | async)!='my files'"
            src="assets/colorlogo.svg">
    </div> -->

    <user-notification [userNotificationVisible]="userNotificationVisible" [cStatus]="cStatus"></user-notification>

</div>
