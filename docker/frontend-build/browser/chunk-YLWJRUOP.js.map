@if (!isRange) {

@if(!iconOnly){
<div class="flex items-center relative border border-[#c2c2c2] rounded-base min-h-8.5 " [class]="addcls">
  <input [disabled]="disabled"
    class="focus:border-none outline-none placeholder:text-grey cursor-pointer pe-5 !border-none !shadow-none h-full "
    placeholder="Select date" readonly (click)="custdatepicker.open()" matInput [matDatepicker]="custdatepicker"
    [(ngModel)]="selectedDate" (dateChange)="onDateChange($event); "   [min]="minDate" [max]="maxDate">
  <mat-datepicker #custdatepicker (closedStream)="onPickerClosed()" (opened)="onPickerOpened()">
    @if(enableCustomAction){
    <mat-datepicker-actions>
      <btn mat-button matDatepickerCancel (click)="clearDate()" mode="white">Clear</btn>
    </mat-datepicker-actions>
    }
  </mat-datepicker>
  <mat-datepicker-toggle [class]="noIcon ? '!hidden' : ''" class="absolute top-1/2 -translate-y-1/2  right-2 "
    matSuffix [for]="custdatepicker">
  </mat-datepicker-toggle>
</div>
}@else {
<div class=" px-3 w-0 p-0 h-0 border-none ">
  <input placeholder=" Type/pick date" class="p-0 border-none !rounded-none"  matInput [matDatepicker]="datepicker"  [min]="minDate" [max]="maxDate"
    [(ngModel)]="selectedDate" (dateChange)="onDateChange($event)" />
</div>

<btn square mode="outlined" [hidden]="showrangelabel">
  <mat-datepicker-toggle matIconSuffix [for]="datepicker" [class]="noIcon ? '!hidden' : ''"></mat-datepicker-toggle>
</btn>

<mat-datepicker #datepicker>
  <mat-datepicker-actions>
    <button mat-button matDatepickerCancel (click)="clearDate()">Clear</button>
  </mat-datepicker-actions>
</mat-datepicker>

}

}@else {
<div class="flex items-center relative border rounded-base min-h-8.5 min-w-8.5 justify-center " [class.px-2]="!showrangelabel"
  [class.cust-daterangepicker]="showrangelabel" [class]="addcls" (click)="rangePicker.open()">
  @if(showrangelabel && !iconOnly){
  <span class="absolute left-3 text-xs top-1/2 -translate-y-1/2 z-10 mt-px">Start</span>
  }
  <mat-date-range-input [class]="nolabel ? ' -ms-1 invisible !p-0 !max-w-0 !w-0':''" [rangePicker]="rangePicker"
    class="focus:border-none outline-none placeholder:!text-grey !cursor-pointer !pe-1 !border-none !shadow-none !h-full !text-xs "
     [min]="minDate" [max]="maxDate">
    <input (click)="rangePicker.open()" matStartDate placeholder="Start date" matInput class="!shadow-none"
      [(ngModel)]="selectedStartDate"  >
    <input (click)="rangePicker.open()" matEndDate placeholder="End date" matInput class="!shadow-none"
      [(ngModel)]="selectedEndDate" (dateChange)="onRangeChange()"  >
  </mat-date-range-input>
  @if(showrangelabel && !iconOnly){
  <span class="absolute right-1/2 translate-x-8 text-xs top-1/2 -translate-y-1/2 z-10 mt-px">End</span>
  }

  <mat-datepicker-toggle [class]="noIcon ? '!hidden' : ''" matSuffix
    [for]="rangePicker"></mat-datepicker-toggle>

  <mat-date-range-picker #rangePicker></mat-date-range-picker>

</div>
}
