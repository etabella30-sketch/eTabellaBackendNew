<div class="fixed top-0 left-0 z-[99999] h-full w-full grid place-items-center">
    <div class="absolute top-0 left-0 z-[10] h-full w-full bg-black/50 " (click)="close()"></div>
    <div class="fixed top-0 left-0 z-[99999] h-full w-full grid place-items-center">
        <div class="absolute top-0 left-0 z-[10] h-full w-full bg-black/50 " (click)="close()"></div>
        <div class="z-20 relative block w-[500px] bg-white p-10 rounded-base">
            <div class="p-2.5">
                <div>
                    <svg class="mb-2.5 mx-auto" width="20" height="20" viewBox="0 0 20 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5.85556 0C3.56882 2.28674 0 5.85556 0 5.85556V14.1444L5.85556 20H14.1444L20 14.1444V5.85556L14.1444 0"
                            fill="#4B4D52" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M13.7933 6.72303C14.1839 7.11356 14.1839 7.74672 13.7933 8.13725L11.672 10.2586L13.7933 12.3799C14.1839 12.7704 14.1839 13.4036 13.7933 13.7941C13.4028 14.1846 12.7697 14.1846 12.3791 13.7941L10.2578 11.6728L8.13649 13.7941C7.74597 14.1846 7.1128 14.1846 6.72228 13.7941C6.33175 13.4036 6.33175 12.7704 6.72228 12.3799L8.8436 10.2586L6.72228 8.13725C6.33175 7.74672 6.33176 7.11356 6.72228 6.72303C7.1128 6.33251 7.74597 6.33251 8.13649 6.72303L10.2578 8.84435L12.3791 6.72303C12.7697 6.33251 13.4028 6.33251 13.7933 6.72303Z"
                            fill="white" />
                    </svg>

                    <h6 class="text-lg whitespace-nowrap text-center font-semibold mb-1">
                        {{title}}
                    </h6>
                    <h6 class="text-xs whitespace-wrap text-center">
                        <!-- @if(isIndex){
                            This action will close the master index. Are you sure you want to continue?
                        }@else{ -->
                        {{subTitle}}
                        <!-- }                         -->
                    </h6>
                </div>
                <div>
                </div>
                <div class="flex mt-5 items-center justify-center gap-2.5">
                    <btn mode="white" (click)="onClose(true)">Confirm exit</btn>
                    <!-- <btn mode="white" (click)="onClose(false)">Cancel</btn> -->
                    <mat-checkbox [(ngModel)]="bShowAgain" (change)="onChange($event)">Don’t show this
                        again.</mat-checkbox>
                </div>
            </div>

        </div>
    </div>
</div>
