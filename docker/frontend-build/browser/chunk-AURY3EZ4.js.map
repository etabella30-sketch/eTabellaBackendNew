<div class="p-10 flex flex-col h-full">
        <header class="h-fit">
                <h6 class="mb-2">Control panel</h6>
                <h6 class="text-4xl flex justify-between items-center font-bold mb-7">User Permission
                        <icon (click)="close()" name="close"
                                class="text-lg ms-auto cursor-pointer hover:text-blue-500" />
                </h6>
        </header>
        <div class="flex flex-col h-full overflow-hidden">
                <div
                        class="flex px-5 py-2.5 gap-5 border rounded-full [&_div]:w-1/6 [&_div]:text-base [&_div]:font-semibold mb-6">
                        <div>Name</div>
                        <div>Role</div>
                        <div>Status</div>
                        <div>Permission</div>
                        <div>Quota</div>
                        <div></div>
                </div>
                <div class="px-6 h-full overflow-auto">
                        <div *ngFor="let x of teamlist" class="last:border-b-0 last:pb-0 last:mb-0 border-b pb-5 mb-5">
                                <h6 class="text-sm font-bold mb-3">{{x.cTeamname}}</h6>
                                <div *ngFor="let user of x.users"
                                        class="tabbody flex gap-0 py-1.5 rounded-full relative ">
                                        <div class="text-sm flex items-center w-1/6">
                                                <span>
                                                        {{user.cFname}} {{user.cLname}}
                                                </span>
                                        </div>
                                        <div class="text-sm w-1/6 flex items-center">
                                                <span>
                                                        {{user.cRole}}
                                                </span>
                                        </div>
                                        <div class="w-1/6" >
                                                <span [ngClass]="{'bg-teal-500': user.cStatus == 'A','bg-neutral-500': user.cStatus != 'A'}"
                                                        [class.disabled]="!userInfo.isAdmin && userInfo.nUserid == user.nUserid"
                                                        (click)="manageUser(user)"
                                                        class=" w-32 block cursor-pointer py-2  text-xs rounded-full text-white text-center">
                                                        {{ user.cStatus == 'A' ? 'Enabled' : 'Disabled'}}
                                                </span>
                                        </div>
                                        <div class="w-1/6">
                                                <span (click)="editPermission(user)"
                                                        [class.disabled]="!userInfo.isAdmin && userInfo.nUserid == user.nUserid"
                                                        class="cursor-pointer  px-3  py-2 border border-gray-600 hover:bg-neutral-500 text-gray-500 text-xs rounded-full hover:text-white text-center">
                                                        View & Modify
                                                </span>
                                        </div>
                                        <div class="w-1/6">
                                                <mat-form-field class="w-full">
                                                        <mat-select class="w-full" placeholder="Select..."
                                                                [disabled]="!userInfo.isAdmin && userInfo.nUserid == user.nUserid"
                                                                [(ngModel)]="user.nQuota"
                                                                (selectionChange)="manageQuota(user)">
                                                                @for (food of foods; track food) {
                                                                <mat-option
                                                                        [value]="food.value">{{food.viewValue}}</mat-option>
                                                                }
                                                        </mat-select>
                                                </mat-form-field>
                                        </div>
                                        <div class="w-1/6">
                                                <btn mode="outlined" matTooltip="Edit User" class="block w-fit  ml-auto"
                                                        addcls="rounded-full" [square]="true" (click)="editUser(user)">
                                                        <icon name="edit"></icon>
                                                </btn>
                                        </div>
                                </div>
                        </div>
                </div>
        </div>
