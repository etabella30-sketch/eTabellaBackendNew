<div class="ps-10 pe-5 py-5 flex gap-2.5 items-center h-[50px]">
        <!-- <img class="cursor-pointer" src="../../../../assets/colorlogo.svg"> -->

        @if(currentCase){
        <h6 class="text-sm">
                <span class="text-dark-blue text-base font-semibold me-1.5">
                        <icon name="realtime" type="adminicn"></icon> {{ 'rt.header.title' | translate }}
                </span>
                <span class="">
                        {{currentCase?.cCasename}}
                        <span> - {{currentCase?.cCaseno}} </span>
                </span>
        </h6>
        }
@if(isOnRealtimeDashboard){
        <div class="ms-auto flex items-center gap-2">
                <!-- Demo button placeholder -->
                <button class="ml-2 p-1 rounded-full hover:bg-gray-200" (click)="toggleSettingsPopup()" [matTooltip]="'rt.header.settings_tooltip' | translate">
                        <icon name="setting" class="text-xl text-gray-600"></icon>
                </button>
                
                <avtr size="sm" [detail]="user"></avtr>
                
                @if(showSettingsPopup) {
                        <div class="fixed inset-0 z-40" (click)="closeSettingsPopup()"></div>
                        <div class="absolute top-16 right-10 z-50 bg-white border border-gray-300 rounded-t shadow-lg min-w-[200px] text-center" (click)="$event.stopPropagation()">
                                <div class="py-4">
                                        <div class="text-sm text-gray-800 mb-2 cursor-pointer" (click)="handleOpenAssignServers()">{{ 'rt.header.connected_servers' | translate }}</div>
                                        <div class="text-sm text-gray-800 cursor-pointer" (click)="handleOpenSettings()">{{ 'rt.header.transmitter' | translate }}</div>
                                </div>
                                <div class="h-3 bg-[#002e5b] rounded-b w-full"></div>
                        </div>
                }
        </div>
}

        <btn mode="dark" (click)="handleExit()" addcls="bg-white/10 text-blue-on" [class.ms-auto]="!isOnRealtimeDashboard">
                {{ 'rt.header.exit' | translate }}
        </btn>

</div>
