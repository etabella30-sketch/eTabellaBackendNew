<!--
  Connection-status toast. Driven by NetworkStatusService.isOnline$
  (window online/offline events + 10s HTTP connectivity probe). Anchored
  bottom-left so it stays out of the way of headers / right-side panels
  but is still glanceable. Single dark pill that swaps icon + text + the
  "Refresh" affordance based on connectionBanner$ state.

  States (see connectionBanner$ in app.component.ts):
    'lost'     — slashed-wifi icon (white), "You are currently offline.",
                 + Refresh link, persistent until network is back.
    'restored' — green wifi icon, "Back online", auto-hides after 3s.
    'ok'       — hidden (no DOM element rendered).

  Inline SVGs (instead of icon-asset files) keep the toast self-contained
  so this snippet is portable into any other shell without a dependency
  on the global icon registry.
-->
<ng-container *ngIf="(connectionBanner$ | async) as bannerState">
  <div *ngIf="bannerState !== 'ok' && dismissedBannerState !== bannerState"
       class="fixed bottom-5 left-5 z-[10000] flex items-center gap-3 bg-[#222222] text-white text-sm rounded-2xl px-4 py-3 shadow-[0_4px_16px_rgba(0,0,0,0.35)] max-w-[380px]">

    <!-- Offline: slashed-wifi icon, white -->
    <svg *ngIf="bannerState === 'lost'" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         class="text-white shrink-0">
      <path d="M1 1l22 22"></path>
      <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 015.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0122.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 014.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 016.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>

    <!-- Restored: regular wifi icon, green. Same shape as the slashed
         variant but without the diagonal line — keeps the "wifi" mental
         model consistent across both states; only colour + slash change. -->
    <svg *ngIf="bannerState === 'restored'" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         class="text-green-500 shrink-0">
      <path d="M5 12.55a11 11 0 0114.08 0"></path>
      <path d="M1.42 9a16 16 0 0121.16 0"></path>
      <path d="M8.53 16.11a6 6 0 016.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>

    <span class="flex-1 leading-snug">
      {{ bannerState === 'lost' ? 'You are currently offline.' : 'Your Internet connection was restored.' }}
    </span>

    <!-- Refresh affordance (offline state only). Hard-reloads so the SPA
         picks up a clean state after a long disconnect — common request
         when stale cached responses have left the UI in a weird state. -->
    <button *ngIf="bannerState === 'lost'"
            (click)="reloadPage()"
            class="text-blue-400 hover:text-blue-300 font-semibold px-1 cursor-pointer bg-transparent border-0">
      Refresh
    </button>

    <!-- X-close. Per-state dismiss so closing the offline toast doesn't
         suppress the "restored" toast that fires when network returns. -->
    <button (click)="dismissBanner(bannerState)"
            class="ml-1 w-7 h-7 rounded-full bg-[#3a3a3a] hover:bg-[#505050] flex items-center justify-center cursor-pointer border-0 text-white shrink-0"
            aria-label="Dismiss">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</ng-container>

<ng-container *ngIf="ispage('myfiles')">
        <app-mainheader></app-mainheader>
</ng-container>
<ng-container *ngIf="ispage('present')">
        <app-present-header></app-present-header>
</ng-container>
<div class=" flex flex-col overflow-hidden" [ngClass]="ispage('myfiles') ? 'ps-16 h-[calc(100%_-_56px)]' : 'h-full'">
        <app-sidenav *ngIf="ispage('myfiles')"

        class="absolute top-14 left-0 h-[calc(100%_-_56px)] w-fit z-50"></app-sidenav>
        <ng-container *ngIf="ispage('casebuilder')||ispage('bundlemanagement')">
                <app-adminheader></app-adminheader>
        </ng-container>

        <ng-container *ngIf="ispage('myfiles/filesaction')">
                <app-header></app-header>
        </ng-container>
        
        <ng-container *ngIf="ispage('realtime')">
                <app-realtimeheader
                        [currentCase]="rtFacade.currentCase()"
                        [user]="rtFacade.user()"
                        [isOnRealtimeDashboard]="rtFacade.isOnRealtimeDashboard()"
                        (exit)="rtFacade.exitRealtime()"
                        (openSettings)="openRtSettings()"
                        (openAssignServers)="openRtAssignServers()"
                ></app-realtimeheader>
        </ng-container>

        <ng-container *ngIf="ispage('upload')">
                <app-uploadheader></app-uploadheader>
        </ng-container>
        <div class="mode" [class]="mode"></div>
        <div class="rheight" [ngStyle]="{
                '--headheight': ispage('casebuilder') || ispage('bundlemanagement') ? '84px' :
                                ispage('realtime') ? '50px' :
                                ispage('upload') ? '107px' :
                                ispage('present') ? '56px' :
                                ispage('myfiles/filesaction') ? '60px' :
                                '0px'
              }">
                <router-outlet />
        </div>
</div>
