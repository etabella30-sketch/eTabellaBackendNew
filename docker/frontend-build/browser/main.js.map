<div class="h-14 flex items-center bg-gradient-to-br from-[#263244] to-[#7DBAFF]">
        <div class="flex items-center gap-3 w-full px-5">
                <div class="text-white text-xs ">{{sectionName}}</div>
                <div class="h-4 w-px bg-white"></div>
                <div class="text-white text-xs font-semibold flex flex-col">
                        <span>{{hs.Casedetail?.cCasename}} - {{hs.Casedetail?.cCaseno}}</span>
                        <!-- <span> {{hs.Casedetail?.cDesc}}</span> -->
                </div>

                <div class="relative text-dark-blue ms-auto me-2" matTooltip="Notifications" [matMenuTriggerFor]="menu"
                        (click)="NotificationS._isNotification.next(false);syncNotifcation()" #n="matMenuTrigger">
                        <icon name="notification" />
                        @if(NotificationS._isNotification | async){
                        <span class="flex absolute top-0 end-0 size-2 -me-1 ">
                                <span class="relative inline-flex rounded-full size-2 bg-red-600"></span>
                        </span>
                        }
                </div>

                <mat-menu #menu="matMenu" class="!max-w-[348px] !min-w-[348px] mt-7 -mr-5 !overflow-visible"
                        backdropClass="notification-backdrop">
                        <span
                                class="p-2 rotate-45 absolute -top-1.5  bg-white rounded-[2px] right-5 skew-x-12 skew-y-12">
                        </span>
                        @if(hs.nCaseid){
                        @defer (when hs.nCaseid) {
                        <notifications [nCaseid]="hs.nCaseid" (clickevnts)="closenotify($event,n);n.closeMenu()">
                        </notifications>
                        }
                        @placeholder {
                        <div class="p-2 text-center text-sm text-dark-blue"></div>
                        }
                        }
                </mat-menu>

                <profile *ngIf="hs.userdetail" [detail]="hs.userdetail" size="lg" type="user" [icon]="false"
                        class="block relative w-fit z-20 " />
                <btn mode="dark" addcls="bg-white/10 text-white" (click)="gohome()" matTooltip="Return to Dashboard">
                        Exit Case
                </btn>
        </div>
</div>
