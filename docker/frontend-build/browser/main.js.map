<div (mouseover)="mouseover()" (mouseleave)="mouseleave()" (focus)="mouseover()"
        class="py-8.5 flex flex-col gap-15  overflow-visible shadow-lg h-full bg-white w-16 transition-all slow-ease duration-700"
        [ngClass]="{'w-40': expandnav}">
        <ng-container *ngFor="let item of sidelist; trackBy: trackByIndex">
        <div class="w-full overflow-visible" *ngIf="!item.hidden">
                <div class="flex justify-center items-center relative group"
                        [class]="{'text-dark-blue': item.selected, 'cursor-not-allowed': isItemDisabled(item)}"
                        [style.color]="isItemDisabled(item) ? '#9ca3af' : null"
                        [style.opacity]="isItemDisabled(item) ? '0.7' : null"
                        (click)="selectOption(item)" (keydown.enter)="selectOption(item)" (keydown.space)="selectOption(item)" role="button" tabindex="0">
                        <span class="h-[26px] w-2 bg-dark-blue absolute left-0" *ngIf="item.selected"></span>
                        <div class="flex gap-2.5 items-center"
                                [ngClass]="isItemDisabled(item) ? 'cursor-not-allowed' : 'cursor-pointer'">
                                <icon class="text-2xl" [name]="item.icon" [type]="item.icontype" />
                                <span class="text-xs block  w-0 overflow-hidden whitespace-nowrap text-balance  font-semibold transition-all slow-ease duration-700 max-h-8 pe-0"
                                        [ngClass]="{'!w-24 !pe-14': expandnav}">
                                        {{item.name}}
                                </span>
                        </div>
                        <span class="flex absolute -top-2 right-1" *ngIf="item.cType == 'RT' && isSessionLive()">
                                <span
                                        class="relative inline-flex rounded-full font-semibold text-xxs border border-green-400 bg-green-50  text-green-600 px-1.5 h-4 items-center">
                                        Live
                                </span>
                        </span>
                        <div
                                class="p-5 hidden group-hover:block top-1/2 -translate-y-1/2 !rounded-base left-full !bg-dark-blue text-white min-w-36  !overflow-visible absolute opacity-100">
                                <span
                                        class="size-2 absolute top-1/2 -translate-x-1/2 -translate-y-1/2 left-0 block rotate-45 bg-dark-blue"></span>
                                <ng-container *ngIf="isItemDisabled(item); else defaultTip">
                                        <span class="text-xs block font-semibold mb-2 whitespace-nowrap">No active realtime session</span>
                                        <span class="text-xxs block leading-snug">Access transcripts via the Evidence module's Transcript folder</span>
                                </ng-container>
                                <ng-template #defaultTip>
                                        <span class="text-xs block font-semibold mb-2">
                                                {{item.name}}
                                        </span>
                                        <span class="text-xxs block leading-snug">
                                                {{item.tooltip}}
                                        </span>
                                </ng-template>
                        </div>
                </div>
        </div>
        </ng-container>
</div>
