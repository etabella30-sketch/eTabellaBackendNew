<header class="py-2.5 px-5 flex items-center bg-faint ">
        <span class="text-lg font-bold">{{ 'rt.realtimeSetting.title' | translate }}</span>
</header>
<form [formGroup]="frm" class="p-5 flex flex-col gap-6">
        <div>
                <h6 class="text-base font-bold mb-2">{{ 'rt.realtimeSetting.mode' | translate }}</h6>
                <mat-form-field class="w-full">
                        <mat-select [placeholder]="'rt.realtimeSetting.selectPlaceholder' | translate" formControlName="mode">
                                <mat-option *ngFor="let x of modes; trackBy: trackByMode" [value]="x.type">
                                        {{ x.name }}
                                </mat-option>
                        </mat-select>
                </mat-form-field>
        </div>
        <div class="flex gap-2">


                <div class="mb-2 w-1/2">
                        <label class="text-sm font-bold mb-2 block">
                                {{ 'rt.realtimeSetting.localIp' | translate }}
                                <span class="text-xxs font-normal text-gray-500 ms-2"></span>
                        </label>
                        <input class="block w-full px-3 py-2 border  rounded-base shadow-sm focus:outline-none text-xs border-tab text-gray focus:shadow-[0px_0px_6px_#0066FF] focus:border-blue-deactivate"
                                [placeholder]="'rt.realtimeSetting.enterLocalIp' | translate" type="text" formControlName="ip" />
                </div>


                <div class="mb-2 w-1/2">
                        <label class="text-sm font-bold mb-2 block">
                                {{ 'rt.realtimeSetting.tcpIpPort' | translate }}
                                <span class="text-xxs font-normal text-gray-500 ms-2"></span>
                        </label>
                        <input class="block w-full px-3 py-2 border  rounded-base shadow-sm focus:outline-none text-xs border-tab text-gray focus:shadow-[0px_0px_6px_#0066FF] focus:border-blue-deactivate"
                                [placeholder]="'rt.realtimeSetting.enterTcpIpPort' | translate" type="text" formControlName="port" />
                </div>




        </div>
        <!-- <div>
                <h6 class="text-base font-bold mb-2">Protocol</h6>
                <mat-form-field class="w-full">
                        <mat-select placeholder="Select.." formControlName="protocol">
                                <mat-option *ngFor="let x of protocols" [value]="x.value">
                                        {{ x.name }}
                                </mat-option>
                        </mat-select>
                </mat-form-field>
        </div> -->
        <!-- 
        <div>
                <h6 class="text-base font-bold mb-2">Realtime Protocol:</h6>
                <h6 class="text-sm ">CaseView Protocol</h6>
        </div> -->
        <div class="flex gap-2">
                <btn [attr.isdisabled]="this.frm.invalid" (click)="submit()">{{ 'rt.realtimeSetting.ok' | translate }}</btn>
                <btn [attr.isdisabled]="this.frm.invalid" (click)="retry()"  mode="outlined" [isloading]="isReconnecting" >{{ 'rt.realtimeSetting.reconnect' | translate }}</btn>
        </div>
</form>
