<!-- Icon-only switcher: small cursor button used inside the selection popup
     (annot-box / toolbox). Click delegates to the toolbar's dropdown via
     the service so the menu anchors to the toolbar pill, not here. -->
<button *ngIf="iconOnly" type="button"
  (click)="onSwitcherClick()"
  title="Switch selection mode"
  class="sa-switcher">
  <span class="sa-switcher__box">
    <svg width="12" height="12" viewBox="0 0 20 20" fill="none">
      <path d="M4 2.5L11.2 11L8 11.4L9.9 16.8L8.2 17.4L6.3 12L4 14V2.5Z" fill="white" />
      <circle cx="15.4" cy="6.3" r="2.1" fill="#60a5fa" />
    </svg>
  </span>
</button>

<!-- Default toolbar pill -->
<button *ngIf="!iconOnly" type="button"
  [matMenuTriggerFor]="menu"
  [matTooltip]="(sa.isCopy() || sa.isSingle()) ? sa.summary() : ''"
  [class.compact]="compact"
  [class.dark]="dark"
  [class.is-copy]="sa.isCopy()"
  [class.is-single]="sa.isSingle()"
  class="sa-pill">
  <span class="sa-pill__icon">
    <ng-container [ngSwitch]="true">
      <icon *ngSwitchCase="sa.isQFactRapid()" name="Qfact" type="indicn"></icon>
      <icon *ngSwitchCase="sa.singleKind() === 'F'" name="fact" type="indicn"></icon>
      <icon *ngSwitchCase="sa.singleKind() === 'D'" name="doclink" type="indicn"></icon>
      <ng-container *ngSwitchCase="sa.isCopy()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
        </svg>
      </ng-container>
      <svg *ngSwitchDefault width="14" height="14" viewBox="0 0 20 20" fill="none">
        <path d="M4 2.5L11.2 11L8 11.4L9.9 16.8L8.2 17.4L6.3 12L4 14V2.5Z" fill="currentColor" />
        <circle cx="15.4" cy="6.3" r="2.1" fill="#0066ff" />
      </svg>
    </ng-container>
  </span>
  <span class="sa-pill__label" *ngIf="showLabel">{{ label }}</span>
  <span class="sa-pill__detail" *ngIf="showLabel && detail">{{ detail }}</span>
  <svg class="sa-pill__chev" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
</button>

<mat-menu #menu="matMenu" class="sa-menu" xPosition="before" yPosition="below">
  <div class="sa-dropdown" (click)="$event.stopPropagation()">
    <div class="sa-dropdown__head">
      <div class="sa-dropdown__eyebrow">Text selection actions</div>
    </div>

    <mat-radio-group class="sa-dropdown__body" [value]="radioMode" (change)="onRadioChange($event)">
      <div class="sa-row sa-row--radio" (click)="setQFact()">
        <mat-radio-button value="QF" color="warn"></mat-radio-button>
        <span class="sa-row__icon"><icon name="Qfact" type="indicn"></icon></span>
        <span class="sa-row__text">
          <span class="sa-row__label">QFact</span>
          <span class="sa-row__hint">Capture facts quickly from selected text</span>
        </span>
      </div>

      <div class="sa-suboptions sa-suboptions--qf" *ngIf="sa.state().qf">
        <mat-checkbox color="warn" [checked]="sa.state().qfIncludeNote" (change)="setQfNote($event.checked)">Include note</mat-checkbox>
        <mat-checkbox color="warn" [checked]="sa.state().qfIncludeTextPlusNote" (change)="setQfTextNote($event.checked)">Include selected text + note</mat-checkbox>
      </div>

      <div class="sa-row sa-row--check" (click)="toggleAdditive('fact')">
        <mat-checkbox color="warn" [checked]="sa.state().fact && !sa.isCopy() && !sa.state().qf"></mat-checkbox>
        <span class="sa-row__icon"><icon name="fact" type="indicn"></icon></span>
        <span class="sa-row__text">
          <span class="sa-row__label">Fact</span>
          <span class="sa-row__hint">Create a detailed fact record</span>
        </span>
      </div>

      <div class="sa-row sa-row--check" (click)="toggleAdditive('doclink')">
        <mat-checkbox color="warn" [checked]="sa.state().doclink && !sa.isCopy() && !sa.state().qf"></mat-checkbox>
        <span class="sa-row__icon"><icon name="doclink" type="indicn"></icon></span>
        <span class="sa-row__text">
          <span class="sa-row__label">DocLink</span>
          <span class="sa-row__hint">Link selected text to a document</span>
        </span>
      </div>

      <div class="sa-divider"></div>

      <div class="sa-row sa-row--radio sa-row--copy" (click)="setCopy()">
        <mat-radio-button value="COPY" color="warn"></mat-radio-button>
        <span class="sa-row__icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
          </svg>
        </span>
        <span class="sa-row__text">
          <span class="sa-row__label">Copy</span>
          <span class="sa-row__hint">Copy selected text</span>
        </span>
      </div>

      <div class="sa-suboptions sa-suboptions--copy" *ngIf="sa.isCopy()">
        <mat-checkbox color="warn" [checked]="sa.state().copyDocName" (change)="setCopyDocName($event.checked)">Include document name</mat-checkbox>
        <mat-checkbox color="warn" [checked]="sa.state().copyPagination" (change)="setCopyPagination($event.checked)">Include page &amp; line reference</mat-checkbox>
      </div>
    </mat-radio-group>

    <div class="sa-dropdown__foot">
      <ng-container *ngIf="footerLabel"><span class="sa-foot__label">{{ footerLabel }}:</span> </ng-container>
      <span class="sa-foot__hint">{{ footerHint }}</span>
    </div>
  </div>
</mat-menu>
