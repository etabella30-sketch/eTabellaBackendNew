<div class="flex bg-white rounded-base flex-col max-h-full overflow-hidden h-fit w-full">
  <header class="p-5 flex items-center gap-2.5 pb-3">
    <span class="text-lg font-semibold">Expand View</span>
    <span class="underline text-xs block ms-auto cursor-pointer select-none" (click)="checkAll()">{{ !isAllChecked ?
      'Select' : 'Deselect'}} all</span>
    <icon name="close" class="text-xs" (click)="onClose()">Close</icon>
  </header>
  <div class="h-fit overflow-auto flex flex-col gap-4 w-full px-5">

    @for(detail of viewlist; track detail.nBundledetailid){
    <source-card addcls="!p-0 mt-3" (cardevent)="cardevent($event)" gap="S" [detail]="detail" [isCheckbox]="true" [isAllChecked]="isAllChecked" />
    <!-- <div class="p-5 w-full flex gap-6  rounded-base cursor-pointer bg-white">
      <mat-checkbox [(ngModel)]="detail.isChecked" (change)="OnSelect()" />
      <icon name="file" class="text-2xl" />
      <div class="top">
        <h6 class="text-xs font-semibold  brak-word truncate w-full">{{detail?.cName}}</h6>
        <h6 class="text-xxs mt-1">[ {{detail?.cBundletag?detail?.cBundletag:'-'}} |
          {{detail?.cTab?detail?.cTab:'-'}}
          |{{detail?.cPage?detail?.cPage:'-'}}
          ]
        </h6>
        @if(detail?.cExhibitno){
        <h6 class="text-xxs mt-1">Exhibit No {{detail?.cExhibitno}}</h6>
        }
      </div>
    </div> -->
    }   

    <!-- @for(x of viewlist; track x.nBundledetailid){
    <mat-checkbox [(ngModel)]="x.isChecked" />
    <div>
      {{x.cName}}
    </div>
    } -->
  </div>
  <footer class="p-5 mt-4 flex items-center  gap-2.5">

    @if(isLink){ 
    <btn [disabled]="!isSelected" [attr.isdisabled]="!isSelected" (click)="OnSubmit()" class="w-full" addcls="w-full">Confirm</btn>
    }@else{
    <btn (click)="OnSubmit()" class="w-full" addcls="w-full">Open</btn>
    <btn mode="white" (click)="onClose()" addcls="w-full" class="w-full">Close preview</btn>
    }

  </footer>
</div>
