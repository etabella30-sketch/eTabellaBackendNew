<div class="p-2.5">
        <div class="flex h-fit">
                <color-palette [hue]="hue" (color)="onclr($event)"></color-palette>
                <color-slider (color)="hue=$event" style="margin-left:16px"></color-slider>
        </div>
        <div class="flex mt-4">
                <div
                        class="flex items-center gap-2.5 w-fit bg-white border-none justify-center rounded-lg border border-white p-2 h-fit ">
                        <div class="rounded-none size-8" [ngStyle]="{'background-color': color || 'white'}"></div>
                        <span class="text-xs">{{color}} sdf</span>
                </div>
                <div class=" flex items-center flex-wrap ml-2.5 gap-2 p-2">
                        <span *ngFor="let x of colorslist" [ngStyle]="{'background': x.cClr}"
                                (click)="selectClr(x.cClr)" class="size-4 block  border-2 border-white">
                        </span>
                </div>
                <!-- <div class=" flex items-center flex-wrap" *ngIf="colorslist&&colorslist.length">
                        <span *ngFor="let x of colorslist;" [ngStyle]="{'background':x.cClr}"
                                class="size-4 block  border-2 border-white "></span>
                </div> -->
        </div>
</div>
