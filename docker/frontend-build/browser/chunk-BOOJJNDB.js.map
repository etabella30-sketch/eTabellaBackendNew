<div class="relative rounded-2xl w-5 max-w-5 h-full">
  <div class="background-wraper rounded-full overflow-hidden shadow-[0px_2px_9px_#94949440] border-2 border-white cursor-grab">
    <canvas #canvas class="color-slider blur-[8px]" width="22" height="270" (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)">
    </canvas>
  </div>
  <span
    class="h-3 w-8  block absolute shadow-[0px_2px_9px_#94949440] border-2 border-white -mt-1.5 rounded-lg -ml-1.5 cursor-grab active:cursor-grabbing"
    [ngStyle]="{'top':client_y+ 'px','background':crclr}" (mousedown)="onbarselect()"></span>
</div>
