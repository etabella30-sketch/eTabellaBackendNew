<!-- type - {{isLink}} -->

<ng-container *ngIf="this.activesectiontype=='TS'&&nCaseid=='e0cd23d4-12fa-4b80-bdc0-88ec4287957b'; else elseBlock">
  <feed-display (dblclick)="transview()" class="w-full outline-none displaycomp" [isTranscViewer]="true"
    [class]="'h-full'" [nSesid]="'3695e05a-b8bf-4b13-9e80-f38b10bf7cf1'"
    [nUserid]="'400a9554-67ea-4b84-907a-17da829821b7'" [nCaseid]="'bc669a9e-6388-42af-9a94-f438e907ea30'"
    [primary]="true" [splitScreenEnabled]="false" [tabActivated]="true" />
</ng-container>
<ng-template #elseBlock>

  <ng-container *ngIf="path && filetype == 'pdf'">
    <pdf [path]="path" [docInfo]="docInfo" (docInfoChange)="onDocInfoChange($event)" (onEvent)="pdfEvent($event)" [fullMode]="isFullmode" [nCaseid]="nCaseid"
      [compareMode]="compareMode" [compareIndex]="compareIndex" [isLink]="isLink" [onViewerEvent]="changingValue"
      [linkExplorerMode]="linkExplorerMode" [linkExplorerType]="linkExplorerType" [nRFSid]="nRFSid" [nRDocid]="nRDocid"
      [nRWebid]="nRWebid" [nSectionid]="nSectionid" [activesectiontype]="activesectiontype" [nPageno]="nPageno"
      [jFilter]="jFilter" />
  </ng-container>

  <ng-container *ngIf="!(path && filetype == 'pdf')">
    <ng-container *ngIf="docInfo?.bIsconvert && path && (filetype == 'document' || filetype == 'image' || filetype == 'video' ||
filetype == 'xlsx' || filetype == 'ppt' || filetype == 'pptx' || filetype == 'msg')">
      <doc-viewer (viewerEvent)="pdfEvent($event)" [path]="path" [filetype]="filetype" [isMyfile]="isMyfile"
        [nCaseid]="nCaseid" [bIsconvert]="docInfo.bIsconvert" [isRealtime]="docInfo.isRealtime"
        [nBundledetailid]="docInfo.nBundledetailid" [fullMode]="isFullmode" [docInfo]="docInfo"
        [hightlightMode]="isLink"></doc-viewer>
    </ng-container>

    <ng-container *ngIf="!(docInfo?.bIsconvert && path && (filetype == 'document' || filetype == 'image' || filetype == 'video' ||
filetype == 'xlsx' || filetype == 'ppt' || filetype == 'pptx' || filetype == 'msg'))">
      <ng-container *ngIf="path && !filetypes.includes(filetype)">
        <div class="flex flex-col h-full">
          <ng-container *ngIf="docInfo.isRealtime">
            <div
              class="pdf-toolbars flex items-center justify-between bg-white relative z-20 ng-tns-c2287261145-4 !bg-dark-blue px-0 h-[59px]">
              <div
                class="pdf-toolbars gap-x-2 flex items-center me-2 ng-tns-c2287261145-4 justify-end !w-1/2 !ml-auto h-full !pl-5 !bg-blue-on !mr-0 ">

                <div class="flex text-white ms-3 me-5 ng-tns-c2287261145-4 ng-star-inserted">
                  <icon name="close" [matTooltip]="'PDF.VIEWER.CLOSE_PREVIEW' | translate" (click)="closeRealtimePdf()"
                    class="block text-sm " type="comnicn"></icon>
                </div>
              </div>
            </div>
          </ng-container>
          <div class="h-full " [ngClass]="{'w-1/2 ms-auto': docInfo.isRealtime}">
            <ng-container *ngIf="(isLink == 'F' || isLink == 'D') && path">
              <div class="p-2 bg-white">
                <btn class="group-focus-within:z-30 w-fit relative ms-auto" mode="outlined"
                  addcls="rounded-full hover:bg-white hover:!border-brand " (click)="linkDoc()">
                  <icon name="addfill"
                    class="text-base block group-focus-within:text-brand transition-all duration-500 slow-ease" />
                  {{ 'PDF.VIEWER.ADD_TO' | translate }}
                  {{isLink == 'F' ? ('PDF.VIEWER.FACT' | translate):('PDF.VIEWER.DOC' | translate)}} {{
                  'PDF.VIEWER.LINK' |
                  translate }}
                </btn>
              </div>
            </ng-container>
            <div class="flex items-center justify-end h-full gap-2 p-5" style="background:#c4c4c4">
              <div class="flex flex-col items-center justify-center w-full h-full bg-white">
                <h6 class="mb-2 text-sm font-semibold">{{ 'PDF.VIEWER.OPEN_NATIVE' | translate }}</h6>
                <!-- <a class="titleN text-decoration-underline pointer" style="cursor: pointer !important;"
        [href]="cloudurl + '/' + this.path" download>Download</a> -->
                <a class="text-xs underline cursor-pointer" (click)="downloadURI(path,docInfo.cFilename)">{{
                  'PDF.VIEWER.DOWNLOAD' | translate }}</a>
                <!-- <button class="button white bord ">
        Download
      </button> -->
              </div>
              <!-- <button *ngIf="isMyfile() && documenttype == 'D'" class="button orange " (click)="expandview()">Expand</button> -->
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="!(path && !filetypes.includes(filetype))">
        <div></div>
      </ng-container>
    </ng-container>
  </ng-container>

</ng-template>
