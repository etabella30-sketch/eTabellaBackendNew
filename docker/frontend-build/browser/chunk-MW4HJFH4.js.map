<!-- Claim assign relevance impact
@for(x of issueList;track x.nIssueid){
{{x.cColor}} / {{x.cIName}} / {{x.cRelevance}} / {{x.cImpact}}

} -->
<div>
        @for (c of gropuIssueList; track c) {
        <div>
                @if(viewmode == 'F'){
                <!-- <div class="grid grid-cols-12 mb-3 text-xs font-medium">
                        <div class="col-span-6">Claim: {{ c.cCategory }}</div>
                        @if ($index === 0) {
                        <div class="col-span-3">Relevance</div>
                        <div class="col-span-3">Impact</div>
                        }
                </div> -->
                }
                <div *ngFor="let s of c.sublist; let j = index">
                        <div class="grid grid-cols-12 my-2 last:mb-0 text-xs">
                                <div class="col-span-6 flex items-center gap-2 px-1">
                                        <span class="rounded-base h-3.5 w-1"
                                                [ngStyle]="{'background': '#' + s.cColor}"></span>
                                        {{ s.cIName }}
                                </div>
                                <div class="col-span-3 px-1 flex">
                                        <ng-container *ngIf="s.cRelevance; else noRelevance">
                                                <badge type="light" [addcls]="'!py-px px-1 !font-bold '">{{ s.cRelevance
                                                        }}</badge>
                                        </ng-container>
                                        <ng-template #noRelevance>
                                                <span class="ps-4">-</span>
                                        </ng-template>
                                </div>
                                <div class="col-span-3 px-1">
                                        <ng-container *ngIf="s.nImpactid > 0; else noImpact">
                                                <img [src]="'assets/icons/impact/' + s.nImpactid + '.png'">
                                        </ng-container>
                                        <ng-template #noImpact>
                                                <span class="ps-2">-</span>
                                        </ng-template>
                                </div>
                        </div>
                </div>
        </div>
        }
</div>
