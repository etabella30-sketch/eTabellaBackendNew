<div class="w-full folderscroll" [ngClass]="!OnlyFolders ? 'h-[calc(100%_-_50px)]' : 'h-full'"
  *ngIf="(TREE_DATA?.length || sharedByuser.length)">

  <cdk-virtual-scroll-viewport itemSize="48" class="h-[99%] w-[calc(100%_+_14px)] ">

    <ng-container *ngIf="loading">
      <div>
        <div class="flex items-center gap-3 mb-2 bg-white rounded-base ps-10" *ngFor="let x of loadingSkeletonRows"
          style="height:40px;">
          <icon name="chvy" class="text-gray-300 rotate-180 text-xxs" />
          <icon name="folder" class="text-gray-300" />
          <sklton bg="base" height="12px" width="130px" />
        </div>
      </div>
    </ng-container>

    <div [hidden]="assignPopup">
      <ng-container *ngIf="cFoldertype === FOLDER_TYPES.CORE_BUNDLE && sharedByuser.length">
      <div>
        <button type="button" class="w-full h-full bg-white rounded-md mt-2.5 p-0 border-0 text-left"
          (click)="shareexpand=!shareexpand" [attr.aria-expanded]="shareexpand"
          [class]="shareexpand&&!viewSection ? '!bg-blue-deactivate' : ''">
          <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10 cursor-pointer">
            <mat-checkbox class="invisible" disabled>
            </mat-checkbox>
            <div class="flex items-center gap-5 w-[calc(100%_-_30px)] h-full">
              <svg style="min-width: 6px;" [class.!rotate-90]="shareexpand" xmlns="http://www.w3.org/2000/svg" width="6"
                [class]="shareexpand&&!viewSection ? 'text-blue-on' : ''" height="10" fill="none" viewBox="0 0 6 10">
                <path fill="currentColor" stroke="currentColor"
                  d="M.57.84.55.83a.2.2 0 0 1 0-.28.18.18 0 0 1 .25 0l3.83 3.91a.2.2 0 0 1 0 .28L.81 8.64a.18.18 0 0 1-.25 0 .2.2 0 0 1 0-.27v-.01l3.15-3.42.31-.34-.31-.34L.57.84Z" />
              </svg>
              <div class="flex items-center gap-2 h-full w-[calc(100%_-_30px)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" fill="none" viewBox="0 0 18 14"
                  class="text-grey" style="min-width: 18px;" [class]="shareexpand&&!viewSection ? '!text-blue-on' : ''">
                  <path fill="currentColor" fill-rule="evenodd"
                    d="M6.41 1.878h7.268c.836 0 1.516.68 1.516 1.516.008 3.554-.003 5.546.005 9.1l-.38 1.04a.45.45 0 0 1-.05.101c-.261.38-.57.365-1.091.365H1.548C.71 14 .03 13.32.03 12.485V1.878C.03 1.043.71.363 1.547.363H4.58a.756.756 0 0 1 .536.222L6.41 1.878ZM1.736 12.312V3.69h11.61v8.622H1.736Z"
                    clip-rule="evenodd"></path>
                  <path fill="currentColor"
                    d="M3.619 6.558A.91.91 0 0 1 4.459 6h12.163a.91.91 0 0 1 .838 1.267l-2.555 6.017H2.167a.91.91 0 0 1-.84-1.263l2.292-5.463Z"
                    class="foldersvg"  [ngClass]="{'close': !shareexpand}"></path>
                </svg><span
                  class="block text-xs font-semibold truncate mat-mdc-tooltip-trigger whitespace-nowrap foldername ng-star-inserted" [class]="shareexpand&&!viewSection ? 'text-blue-on' : ''">{{ 'MYFILES.FOLDERS.SHARED_WITH_ME' | translate }}</span>
              </div>
            </div>
          </div>
        </button>
        <ng-container *ngIf="shareexpand">
        <ng-container *ngFor="let user of sharedByuser">
        <button type="button" style="padding-left: 28px;" class="w-full h-full bg-white rounded-md text-left border-0"
          [ngClass]="{'!bg-blue-deactivate':user?.nSectionid==viewSection?.nSectionid && !nBundleid}"
          (click)="activeCBSection(user,true,true)">
          <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10">
            <mat-checkbox class="invisible" disabled>
            </mat-checkbox>
            <div class="flex items-center gap-5 w-[calc(100%_-_30px)] h-full">
              <svg style="min-width: 6px;" [class.!rotate-90]="user.expanded" xmlns="http://www.w3.org/2000/svg" [class]="user?.nSectionid==viewSection?.nSectionid && !nBundleid ? '!text-blue-on' : ''"
                width="6" height="10" fill="none" viewBox="0 0 6 10">
                <path fill="currentColor" stroke="currentColor"
                  d="M.57.84.55.83a.2.2 0 0 1 0-.28.18.18 0 0 1 .25 0l3.83 3.91a.2.2 0 0 1 0 .28L.81 8.64a.18.18 0 0 1-.25 0 .2.2 0 0 1 0-.27v-.01l3.15-3.42.31-.34-.31-.34L.57.84Z" />
              </svg>
              <div class="flex items-center gap-2 h-full w-[calc(100%_-_30px)]"><svg xmlns="http://www.w3.org/2000/svg"
                  width="18" height="14" fill="none" viewBox="0 0 18 14" class="text-grey" style="min-width: 18px;" [class]="user?.nSectionid==viewSection?.nSectionid && !nBundleid ? '!text-blue-on' : ''">
                  <path fill="currentColor" fill-rule="evenodd"
                    d="M6.41 1.878h7.268c.836 0 1.516.68 1.516 1.516.008 3.554-.003 5.546.005 9.1l-.38 1.04a.45.45 0 0 1-.05.101c-.261.38-.57.365-1.091.365H1.548C.71 14 .03 13.32.03 12.485V1.878C.03 1.043.71.363 1.547.363H4.58a.756.756 0 0 1 .536.222L6.41 1.878ZM1.736 12.312V3.69h11.61v8.622H1.736Z"
                    clip-rule="evenodd"></path>
                  <path fill="currentColor"
                    d="M3.619 6.558A.91.91 0 0 1 4.459 6h12.163a.91.91 0 0 1 .838 1.267l-2.555 6.017H2.167a.91.91 0 0 1-.84-1.263l2.292-5.463Z"
                    class="foldersvg" [ngClass]="{'close': !user.expanded}"></path>
                </svg><span
                  class="block text-xs font-semibold truncate mat-mdc-tooltip-trigger whitespace-nowrap foldername ng-star-inserted" [class]="user?.nSectionid==viewSection?.nSectionid && !nBundleid ? '!text-blue-on' : ''">{{user.cSharedby}}
                </span>
              </div>
            </div>
          </div>
        </button>
        <ng-container *ngIf="user.expanded">
        <sharedfolder (click)="activeCBSection(user)" (keydown.enter)="activeCBSection(user)" (keydown.space)="activeCBSection(user)" [isIndividual]="isIndividual" #folderCom
          [nSectionid]="user.nSectionid" [nUserid]="user.nUserid" [nCaseid]="nCaseid"
          (changeFolder)="changeSharebundle($event)" [nBundleid]="nBundleid ? nBundleid : null" [changeF]="changeF">
        </sharedfolder>
        </ng-container>
        </ng-container>
        </ng-container>
      </div>
      </ng-container>
    </div>
    <div class="flex  gap-2.5">
      <ng-container *ngFor="let item of fileList">
      <button type="button" (click)="viewFileDB(item)"
        class="w-full h-10 min-w-40 rounded-base bg-white flex px-2.5 text-xs items-center gap-2.5 ps-12 font-semibold cursor-pointer text-left border-0">
        <img width="16" class="object-contain" [attr.alt]="item?.cFiletype ? (item.cFiletype + ' file type') : 'file type'" src="../../../../../assets/img/doctype/{{item.cFiletype}}.png">
        <app-tabletrunc class="block w-full h-4 relative" [value]="item.cName"></app-tabletrunc>
      </button>
      </ng-container>
    </div>

    <div *cdkVirtualFor="let node of dataSource  | async;" (click)="viewSection = null" (keydown.enter)="viewSection = null" (keydown.space)="viewSection = null"
      class="relative flex flex-col items-center min-w-full overflow-visible bg-white cursor-pointer mat-tree-node group min-h-10 text-grey w-fit first:mt-0"
      style="flex-grow: 1;"
      [ngClass]="{'mt-2': !node.level,'rounded-b-none':!node.level&&node.isExpanded,'rounded-base':!node.level,'!w-[450px]':node.level>3&&node.level<12 ,'!w-[650px]':node.level>12}">
      <div class="w-full h-full "
        [ngClass]="{'!bg-blue-deactivate':node?.nBundleid==activeBundle?.nBundleid,'my-1':node.level}"
        [ngStyle]="{'padding-left':(node.level > 0 ? (node.level*24) : 0) + 'px'}">
        <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10">
          <ng-container *ngIf="!isIndividual; else isIndividualPlaceholder">
            <ng-container *ngIf="this.cutCopyType=='Private Bundle Quick Assign'; else normalFolderCheckbox">
              <mat-checkbox [disabled]="node?.isNew || isCopy"
                [ngClass]="{'!opacity-100': node.cIstempcheck,'!opacity-0':node.isedit}"
                class="opacity-0 group-hover:opacity-100 [.mat-mdc-checkbox-checked]:!opacity-100"
                [(ngModel)]="node.cIstempcheck" (change)="openfolderuncheck(node,$event)"></mat-checkbox>
            </ng-container>
            <ng-template #normalFolderCheckbox>
              <mat-checkbox [disabled]="node?.isNew || isCopy"
                [ngClass]="{'!opacity-100': node.cIscheck,'!opacity-0 pointer-events-none':node.isedit || presentDocType == 'C' || cFoldertype === FOLDER_TYPES.ALL }"
                class="opacity-0 group-hover:opacity-100 [.mat-mdc-checkbox-checked]:!opacity-100"
                (change)="checkFolder(node,$event)" [checked]="node.cIscheck"></mat-checkbox>
            </ng-template>
          </ng-container>
          <ng-template #isIndividualPlaceholder>
            <div></div>
          </ng-template>
          <button type="button" class="flex items-center gap-5 w-[calc(100%_-_30px)] h-full bg-transparent text-left border-0"
            (click)="!node?.isedit ? loadChildren(node,true):null" [draggable]="!node?.isedit"
            (dragstart)="onDragStart($event,node)" (dragend)="onDragEnd()"
            [ngClass]="{'text-blue-on':node?.nBundleid==activeBundle?.nBundleid}">
            <svg style="min-width: 6px;" [class.!rotate-90]="node.isExpanded"
              [ngClass]="{'rotate-90 !text-blue-on': node?.nBundleid==activeBundle?.nBundleid}"
              xmlns="http://www.w3.org/2000/svg" width="6" height="10" fill="none" viewBox="0 0 6 10">
              <path fill="currentColor" stroke="currentColor"
                d="M.57.84.55.83a.2.2 0 0 1 0-.28.18.18 0 0 1 .25 0l3.83 3.91a.2.2 0 0 1 0 .28L.81 8.64a.18.18 0 0 1-.25 0 .2.2 0 0 1 0-.27v-.01l3.15-3.42.31-.34-.31-.34L.57.84Z" />
            </svg>
            <div class="flex items-center gap-2 h-full  w-[calc(100%_-_30px)]">
              <svg class="text-grey" style="min-width: 18px;"
                [ngClass]="{'!text-blue-on': node?.nBundleid==activeBundle?.nBundleid}"
                xmlns="http://www.w3.org/2000/svg" width="18" height="14" fill="none" viewBox="0 0 18 14">
                <path fill="currentColor" fill-rule="evenodd"
                  d="M6.41 1.878h7.268c.836 0 1.516.68 1.516 1.516.008 3.554-.003 5.546.005 9.1l-.38 1.04a.45.45 0 0 1-.05.101c-.261.38-.57.365-1.091.365H1.548C.71 14 .03 13.32.03 12.485V1.878C.03 1.043.71.363 1.547.363H4.58a.756.756 0 0 1 .536.222L6.41 1.878ZM1.736 12.312V3.69h11.61v8.622H1.736Z"
                  clip-rule="evenodd" />
                <path class="foldersvg"
                  [ngClass]="{'close': node?.nBundleid!=activeBundle?.nBundleid && !node?.isExpanded}"
                  fill="currentColor"
                  d="M3.619 6.558A.91.91 0 0 1 4.459 6h12.163a.91.91 0 0 1 .838 1.267l-2.555 6.017H2.167a.91.91 0 0 1-.84-1.263l2.292-5.463Z" />
              </svg>
              <span *ngIf="!node['isedit'] " truncateTooltip [tooltipText]="node.cBundlename"
                class="block text-xs font-semibold truncate whitespace-nowrap foldername"
                [ngClass]="{'group-hover:!pe-14': (isadmin && !node.isedit && !isSepcomponent) || cFoldertype === FOLDER_TYPES.CORE_BUNDLE || cFoldertype === FOLDER_TYPES.USER_FILES}">{{node.cBundlename}}
              </span>
              <ng-container *ngIf="(isadmin || cFoldertype === FOLDER_TYPES.CORE_BUNDLE || cFoldertype === FOLDER_TYPES.USER_FILES) && node.isedit">
                <inpt [placeholder]="'MYFILES.FOLDERS.PLACEHOLDER_NEW_FOLDER' | translate" [focus]="true" [showlabel]="false" class="block w-full" [inlinemode]="true"
                  [value]="node['cBundlename']" (keyup.enter)="createNewFolder(node,$event.target)"
                  (focusout)="createNewFolder(node,$event.target)">
                </inpt>
              </ng-container>
            </div>
          </button>
          <ng-container *ngIf="(isadmin && !node.isedit && !isSepcomponent) || ((cFoldertype === FOLDER_TYPES.CORE_BUNDLE || cFoldertype === FOLDER_TYPES.USER_FILES) && !node.isedit)">
          <div class=" ms-auto gap-3 mx-2.5 absolute right-1 hidden group-hover:flex items-center">
            <span class="px-2 py-0 rotate-90 cursor-pointer group/icon">
              <icon name="menu" [matMenuTriggerFor]="menu" #o="matMenuTrigger"
                (menuOpened)="handleMenuOpened(node,true)" class="text-xs group-hover/icon:text-blue-on" />
            </span>
            <mat-menu #menu="matMenu" class="flex px-4 !rounded-base !w-fit -mt-6 !bg-dark-blue h-[50px] items-center">
              <div class="flex items-center gap-5 py-1 min-w-fit">
                <icon name="edit" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_RENAME' | translate" (click)="addBundleEdit(node,$event)" (keydown.enter)="addBundleEdit(node,$event)" (keydown.space)="addBundleEdit(node,$event)" type="comnicn"
                  class="text-xs text-white cursor-pointer hover:text-blue-on" />
                <ng-container *ngIf="cFoldertype === FOLDER_TYPES.CORE_BUNDLE">
                  <ng-container *ngIf="o.menuOpen">
                    <share-with-team (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()" (checkevent)="checkdusers($event)"
                      (shareEvent)="shareEvent($event,node.nBundleid)" [activeuser]="true" [nCaseid]="nCaseid"
                      [nSectionid]="nSectionid" [nBundleid]="node.nBundleid"></share-with-team>
                  </ng-container>
                </ng-container>

                <icon name="addfolder" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_ADD_FOLDER' | translate" (click)="addNewBundle(node)" (keydown.enter)="addNewBundle(node)" (keydown.space)="addNewBundle(node)" type="adminicn"
                  class="text-white cursor-pointer hover:text-blue-on" />

                <ng-container *ngIf="isadmin">
                <icon name="userfill" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_PERMISSION' | translate" (click)="getPermission(node.nBundleid)" (keydown.enter)="getPermission(node.nBundleid)" (keydown.space)="getPermission(node.nBundleid)"
                  class="text-white cursor-pointer hover:text-blue-on" />
                <icon name="bundle" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_BUNDLE_REFERANCE' | translate" (click)="edittag(node)" (keydown.enter)="edittag(node)" (keydown.space)="edittag(node)"
                  class="text-xs text-white cursor-pointer hover:text-blue-on" />

                <icon name="hyperlink" type="adminicn" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_HYPERLINK' | translate" (click)="hyperlink(node)" (keydown.enter)="hyperlink(node)" (keydown.space)="hyperlink(node)"
                  class="text-xs text-white cursor-pointer hover:text-blue-on" />

                <svg class="text-xs text-white cursor-pointer hover:text-blue-on" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_PAGINATION' | translate"
                  (click)="pagination(node)" (keydown.enter)="pagination(node)" (keydown.space)="pagination(node)" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4" />
                  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                  <rect width="4" height="6" x="2" y="12" rx="2" />
                  <path d="M10 12h2v6" />
                  <path d="M10 18h4" />
                </svg>
                <icon name="convert" [matTooltip]="'MYFILES.FOLDERS.TOOLTIP_CONVERT' | translate" (click)="convert(node)" (keydown.enter)="convert(node)" (keydown.space)="convert(node)" type="extra"
                  class="text-white cursor-pointer hover:text-blue-on" />
                </ng-container>
              </div>
            </mat-menu>

          </div>
          </ng-container>

        </div>


      </div>
      <ng-container *ngIf="node.islodingchildren">
      <div class="z-20 flex flex-col w-full bg-white"
        [ngStyle]="{'padding-left':(node.level > 0 ? (node.level*24) : 0) + 'px'}">
        <div class="flex items-center gap-3 bg-white rounded-base ps-11" style="height:40px;" *ngFor="let x of [1]">
          <icon name="chvy" class="text-gray-300 rotate-180 text-xxs" />
          <icon name="folder" class="text-gray-300" />
          <sklton bg="base" height="12px" width="130px" />
        </div>
      </div>
      </ng-container>
    </div>
  </cdk-virtual-scroll-viewport>
</div>
<div class="px-3 my-3">
  <ng-container *ngIf="isSepcomponent">
    <btn class="ms-auto w-fit" [disabled]="!getcheckedFolder().length" (click)="closeMenu()" (keydown.enter)="closeMenu()" (keydown.space)="closeMenu()">{{ 'MYFILES.FOLDERS.CHOOSE_SELECTED' | translate }}</btn>
  </ng-container>
</div>

<div class="h-[calc(100%_-_50px)] w-full folderscroll overflow-auto"
  *ngIf="Allsectionlist?.length && cFoldertype === FOLDER_TYPES.ALL">
  <ng-container *ngIf="loading">
    <div>
      <div class="flex items-center gap-3 mb-2 bg-white rounded-base ps-10" *ngFor="let x of loadingSkeletonRows"
        style="height:40px;">
        <icon name="chvy" class="text-gray-300 rotate-180 text-xxs" />
        <icon name="folder" class="text-gray-300" />
        <sklton bg="base" height="12px" width="130px" />
      </div>
    </div>
  </ng-container>
  <div *ngFor="let x of Allsectionlist"
    class="relative flex flex-col items-center min-w-full mb-2 overflow-visible bg-white cursor-pointer mat-tree-node group min-h-10 text-grey w-fit first:mt-0 rounded-base"
    style="flex-grow: 1;" [ngClass]="{'bg-reply': x.isActive}">
    <div class="w-full h-full " [ngClass]="{'!bg-blue-deactivate':x.nSectionid==nSectionid && x.isActive !=false}">
      <div class="relative z-20 flex items-center w-full h-full gap-5 px-2 min-w-44 min-h-10">
        <button type="button" class="flex items-center w-full h-full gap-5 bg-transparent text-left border-0"
          [ngClass]="{'text-blue-on':x?.nSectionid==nSectionid  && x.isActive !=false}" (click)="changeSection(x)">

          <div class="flex items-center w-full h-full gap-2">

            <div class="flex items-center gap-2.5 px-3 w-full py-1.5 ">
              <ng-container *ngIf="!folderTypeGroups.ADD_SECTION_TYPES.includes(x.cFoldertype)">
                <icon name="bundle"> </icon>
              </ng-container>
              <ng-container *ngIf="x.cFoldertype === FOLDER_TYPES.CORE_BUNDLE">
                <icon name="custombundle" type="myfileicn"> </icon>
              </ng-container>
              <ng-container *ngIf="x.cFoldertype === FOLDER_TYPES.TRANSCRIPT">
                <icon name="transcript" type="myfileicn"></icon>
              </ng-container>
              <ng-container *ngIf="x.cFoldertype === FOLDER_TYPES.USER_FILES">
                <icon name="userfiles" type="myfileicn"></icon>
              </ng-container>
              <span class="text-xs" [ngClass]="{'opacity-50':x.isActive == false}">{{x.cFolder}}</span>
            </div>
            <ng-container *ngIf="folderTypeGroups.ADD_SECTION_TYPES.includes(x.cFoldertype)">
              <btn mode="outlined" [square]="true" (click)="addSection(x)" (keydown.enter)="addSection(x)" (keydown.space)="addSection(x)" *ngIf="!x.isActive">
                <icon name="addcircle" class="text-base"></icon>
              </btn>
            </ng-container>
            <div class="d-flex button onhover end-0 me-1 position-absolute" *ngIf="x.cFoldertype === FOLDER_TYPES.USER_FILES && x.isActive">
              <btn style="min-width: 16px;" [square]="true" mode="outlined" (click)="addSection(x)" (keydown.enter)="addSection(x)" (keydown.space)="addSection(x)">
                <icon name="edit"></icon>
              </btn>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
