<!-- </mat-menu> -->


<div class="bg-gray-100 h-full flex flex-col">
    <div class="text-base py-2.5 px-5 flex items-center justify-between font-semibold">
        Permission
        <icon class="text-xxs hover:text-blue-on " name="close" (click)="close()" />
    </div>
    <div class="h-full overflow-auto">
        <div *ngFor="let tm of teamlist">
            <div class="flex items-center mb-2 py-2.5 bg-white px-5 border-b ">
                <h6 class="text-xs font-semibold ">
                    {{tm.cTeamname}}
                </h6>
                <mat-slide-toggle [disabled]="!userDetail.isAdmin && tm.nTeamid !== nTeamid" hideIcon
                    [(ngModel)]="tm.isCheck" (change)="checkall(tm)" class="ms-auto permission"></mat-slide-toggle>
            </div>

            <div class="px-5">
                <div class="flex gap-2.5 mb-2.5" (click)="$event.stopPropagation();" *ngFor="let usr of tm.users">
                    <avtr [detail]="usr"></avtr>

                    <div>
                        <span class="text-xs ">
                            {{usr.cFname}}&nbsp;{{usr.cLname}}
                        </span>
                        <span class="text-xxs">{{usr.cRole}}
                        </span>
                    </div>
                    <!-- <button
                                                                                            class="edtcontct button ms-auto white shadow showonhover">
                                                                                            Change
                                                                                        </button> -->
                    <mat-slide-toggle hideIcon [(ngModel)]="usr.isCheck" (change)="checkuser(usr)"
                        [disabled]="!userDetail.isAdmin && tm.nTeamid !== nTeamid"
                        class="ms-auto permission"></mat-slide-toggle>
                </div>
            </div>

        </div>
    </div>
</div>
