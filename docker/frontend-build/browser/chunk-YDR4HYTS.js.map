<div class="p-10">
    <!-- <h6 class="text-base flex justify-between font-semibold mb-7">{{permission == 'N' ? 'Create' : 'Update'}} Section
        <icon name="close" class="text-xs ms-auto cursor-pointer hover:text-blue-500" (click)="close()" />
    </h6> -->
    <h6 class="text-lg font-semibold mb-2">Bundle Name</h6>
    <div class="flex items-end gap-2 mb-6">
        <inpt [isrequired]="true" placeholder="Enter Section Name" class="block  w-full"  [showlabel]="false"  [value]="cFolder"
            (valueChange)="cFolder = $event;"></inpt>
    </div>
    <div class="flex gap-2">
        <btn [attr.isdisabled]="!cFolder || cFolder?.trim() == ''" (click)="onSubmit()"> {{permission == 'N' ? 'Create'
            :
            'Update'}}</btn>
        <btn [mode]="'white'" (click)="close()">Cancel</btn>
    </div>
</div>
