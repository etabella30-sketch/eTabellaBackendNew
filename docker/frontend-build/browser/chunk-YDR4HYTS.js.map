<div class="p-5">
  <h6 class="text-base flex justify-between font-semibold mb-7">Update Bundle tab
    <icon name="close" class="text-xs ms-auto cursor-pointer hover:text-blue-500" (click)="close()" />
  </h6>
  <div class="flex items-end">
    <inpt [isrequired]="true" placeholder="Enter Section Name" [showlabel]="true" class="block  w-full"
      [value]="cBundletag" (valueChange)="cBundletag = $event;">{{cName && cName !='' ? cName : 'Bundle'}} </inpt>
  </div>
  <div class="gap-2 mb-6">
    <mat-radio-group [(ngModel)]="isAuto">
      <div class="flex gap-2 self-start mt-5">
        <mat-radio-button [value]="1">Auto</mat-radio-button>
        <mat-radio-button [value]="0">Manuel</mat-radio-button>
      </div>
    </mat-radio-group>
  </div>

  <btn [attr.isdisabled]="!cBundletag || cBundletag?.trim() == ''" (click)="onSubmit()"> Update</btn>
</div>
