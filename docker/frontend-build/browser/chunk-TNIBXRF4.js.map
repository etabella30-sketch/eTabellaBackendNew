<div class="bg-white p-10">
        <div class="[&>img]:w-5">
                <!-- instruction -->
                @if(data?.type=='I'){
                <img src="../../../../assets/icons/tip.svg">
                }

                <!-- Error -->
                @if(data?.type=='E'){
                <img src="../../../../assets/icons/warningred.svg">
                }
                <!-- stop -->
                @if(data?.type=='S'){
                <img src="../../../../assets/icons/warningred.svg">
                }


        </div>
        <h6 class="text-lg font-semibold my-2.5 leading-snug"
                [ngClass]="{'text-sred': data?.type=='E','text-sgreen': data?.type=='I'}">
                {{data?.heading}}</h6>
        @if (data?.desc) {
        <h6 class="text-xs ">{{data?.desc}}</h6>
        }
        @if (data?.html) {
        <div [innerHTML]="data?.html"></div>
        }

        <div class="flex gap-3 mt-6 items-center">
                <btn (click)="close(data?.bt1res)">{{data?.button1}}</btn>
                <btn mode="white" *ngIf="data?.button2" (click)="close(data?.bt2res)">{{data?.button2}}</btn>
                @if (data?.checkbox) {
                <mat-checkbox>{{data?.checkbox}}</mat-checkbox>
                }
        </div>
</div>
