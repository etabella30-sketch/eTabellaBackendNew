events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # MIME types — keeps PDFs, fonts, etc. served with right Content-Type.
    # ------------------------------------------------------------------
    types {
        text/html                                                                   html htm shtml;
        text/css                                                                    css;
        text/xml                                                                    xml;
        text/plain                                                                  txt;
        application/javascript                                                      js mjs;
        application/json                                                            json;
        application/pdf                                                             pdf;
        application/zip                                                             zip;
        application/octet-stream                                                    bin exe dll deb dmg iso img msi msp msm;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document     docx;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet           xlsx;
        application/vnd.openxmlformats-officedocument.presentationml.presentation   pptx;
        application/msword                                                          doc;
        application/vnd.ms-excel                                                    xls;
        application/vnd.ms-powerpoint                                               ppt;
        application/rtf                                                             rtf;
        font/woff                                                                   woff;
        font/woff2                                                                  woff2;
        application/vnd.ms-fontobject                                               eot;
        image/png                                                                   png;
        image/jpeg                                                                  jpeg jpg;
        image/gif                                                                   gif;
        image/svg+xml                                                               svg svgz;
        image/webp                                                                  webp;
        image/x-icon                                                                ico;
        image/tiff                                                                  tif tiff;
        audio/mpeg                                                                  mp3;
        audio/ogg                                                                   ogg;
        video/mp4                                                                   mp4;
        video/webm                                                                  webm;
        video/quicktime                                                             mov;
    }

    # 100 MB upload limit (matches old stack).
    client_max_body_size 100M;

    # Resolver for Docker DNS — lets nginx start even if a backend service is
    # briefly down, instead of refusing to start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------
    # Reusable proxy headers, defined once.
    # ------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------
    # Upstreams — Docker DNS resolves these to container IPs.
    # ------------------------------------------------------------------
    # Each microservice listens on its own port inside the etabella-local_default
    # network. Only nginx is exposed to the host (ports 80, 443).

    # =================================================================
    # HTTP :80 — redirects to HTTPS
    # =================================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # =================================================================
    # HTTPS :443 — primary entry point
    # =================================================================
    server {
        listen 443 ssl;
        server_name _;
        http2 on;

        # Self-signed dev certs.
        ssl_certificate     /etc/nginx/ssl/public.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ============= Static frontend (Angular) =============
        # Built by `ng build --configuration localdocker`, output mounted at
        # /usr/share/nginx/html. Falls back to /index.html for SPA routes.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Second Angular app (realtime local UI), if used.
        location /localrealtime/ {
            alias /usr/share/nginx/realtimehtml/;
            index index.html;
            try_files $uri $uri/ /localrealtime/index.html;
        }

        # ============= Microservice routes =============
        # Pattern: strip the route prefix, proxy to <service>:<port> inside
        # the Docker network. No host.docker.internal — Docker DNS only.

        location /authapi/ {
            rewrite ^/authapi/(.*)$ /$1 break;
            proxy_pass http://authapi:5001;
        }

        location /coreapi/ {
            rewrite ^/coreapi/(.*)$ /$1 break;
            proxy_pass http://coreapi:5002;
        }

        location /uploadapi/ {
            rewrite ^/uploadapi/(.*)$ /$1 break;
            proxy_pass http://upload:5004;
        }

        location /indexapi/ {
            rewrite ^/indexapi/(.*)$ /$1 break;
            proxy_pass http://indexapi:5006;
        }

        location /pagination/ {
            rewrite ^/pagination/(.*)$ /$1 break;
            proxy_pass http://pagination:5007;
        }

        location /batchfile/ {
            rewrite ^/batchfile/(.*)$ /$1 break;
            proxy_pass http://batchfile:5008;
        }

        location /export/ {
            rewrite ^/export/(.*)$ /$1 break;
            proxy_pass http://export:5009;
        }

        # Two services share the /download/ prefix:
        #   - `download` service (port 5011): @Controller('download'), so its
        #     routes look like /download/<X>. Frontend calls reach nginx as
        #     /download/download/<X> (gateway prefix + controller prefix).
        #   - `downloadapi` service (port 5010): @Controller() at root, so its
        #     routes look like /<X>. Frontend calls reach nginx as /download/<X>.
        # Both rewrites strip exactly ONE leading /download/.

        location ~ ^/download/download/ {
            rewrite ^/download/(.*)$ /$1 break;
            proxy_pass http://download:5011;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /download/ {
            rewrite ^/download/(.*)$ /$1 break;
            proxy_pass http://downloadapi:5010;
        }

        location /hyperlink/ {
            rewrite ^/hyperlink/(.*)$ /$1 break;
            proxy_pass http://hyperlink:5012;
        }

        location /presentation/ {
            rewrite ^/presentation/(.*)$ /$1 break;
            proxy_pass http://presentation:5013;
        }

        location /sfu/ {
            rewrite ^/sfu/(.*)$ /$1 break;
            proxy_pass http://sfu:5016;
        }

        # ============= WebSocket / Socket.IO =============
        # socket-app uses /socketservice/ and the realtime-server handles
        # /socket.io/ — both need WebSocket upgrade headers.

        location /socketservice/ {
            proxy_pass http://socket-app:5003;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /socket.io/ {
            proxy_pass http://realtime-server:5005;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /realtimeapi {
            rewrite ^/realtimeapi(.*)$ $1 break;
            proxy_pass http://realtime-server:5005;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Socket.IO for the realtime service. The backend gateway
        # (apps/realtime/src/events/events.gateway.ts) mounts Socket.IO at
        # path '/realtimelocalsocket/' and the frontend connects with the
        # same path — so we must proxy WITHOUT rewriting it away, otherwise
        # the handshake hits the wrong URL and returns 400.
        location /realtimelocalsocket/ {
            proxy_pass http://realtime:5000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
        }

        location /realtimelocal {
            rewrite ^/realtimelocal(.*)$ $1 break;
            proxy_pass http://realtime:5000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # ============= MinIO (PDFs / documents) =============
        # /pdfdocs/<key> -> minio:9000/etabella/<key>
        location /pdfdocs/ {
            rewrite ^/pdfdocs/(.*)$ /etabella/$1 break;
            proxy_pass http://minio:9000;
            proxy_buffering off;
        }

        # ============= Static assets served from a shared volume =============
        # The host's etabella_backend-tech/assets folder is bind-mounted at
        # /usr/src/app/assets (same path microservices see, for consistency).
        location /docs/ {
            alias /usr/src/app/assets/;
            autoindex on;
            add_header Cache-Control "public, max-age=31536000";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
            add_header Access-Control-Allow-Credentials 'true';
            add_header Accept-Ranges 'bytes';
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
